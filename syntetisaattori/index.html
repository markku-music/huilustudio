<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef1f5">
  <title>iOS Äänitesti</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:system-ui,-apple-system,sans-serif;color:#18202a;background:#eef1f5}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;-webkit-user-select:none;user-select:none}
    main{width:min(760px,100%);text-align:center}
    h1{margin:0 0 8px;font-size:clamp(24px,5vw,40px)}
    p{margin:0 0 16px;color:#586474}
    .unlock{margin:0 0 20px;border:0;border-radius:999px;padding:13px 24px;background:#176fd1;color:#fff;font:750 16px system-ui;box-shadow:0 8px 20px #176fd140}
    .unlock:disabled{background:#27824e;opacity:1}
    .piano{position:relative;display:flex;height:clamp(190px,42vw,320px);border:5px solid #20242a;border-radius:12px;overflow:hidden;background:#20242a;box-shadow:0 16px 40px #1c27352e;touch-action:none;-webkit-touch-callout:none}
    .key{border:0;touch-action:none;cursor:pointer}
    .white{flex:1;background:linear-gradient(#fff 82%,#e7e7e7);border-right:1px solid #aeb4bc;color:#303844;font:600 15px system-ui;padding:0 0 14px;display:flex;align-items:end;justify-content:center}
    .white:last-of-type{border:0}
    .black{position:absolute;z-index:2;top:0;width:8%;height:62%;margin-left:-4%;background:linear-gradient(90deg,#101216,#30343a 45%,#090a0c);border-radius:0 0 7px 7px;box-shadow:0 5px 7px #0008}
    .key.active{background:#62a7ff}
    .black.active{background:#2869b8}
    .piano.locked{opacity:.48}
    .b1{left:14.2857%}.b2{left:28.5714%}.b3{left:57.1429%}.b4{left:71.4286%}.b5{left:85.7143%}
    #status{margin-top:18px;min-height:24px;font-weight:650;color:#2365aa}
  </style>
</head>
<body>
  <main>
    <h1>iOS Äänitesti</h1>
    <p>Avaa ääni kerran. Sen jälkeen koskettimet soivat heti.</p>
    <button class="unlock" id="unlock" type="button">AVAA ÄÄNI</button>
    <div class="piano locked" id="piano" aria-label="Yhden oktaavin pianokoskettimisto">
      <button class="key white" data-midi="60" aria-label="C">C</button>
      <button class="key white" data-midi="62" aria-label="D">D</button>
      <button class="key white" data-midi="64" aria-label="E">E</button>
      <button class="key white" data-midi="65" aria-label="F">F</button>
      <button class="key white" data-midi="67" aria-label="G">G</button>
      <button class="key white" data-midi="69" aria-label="A">A</button>
      <button class="key white" data-midi="71" aria-label="H">H</button>
      <button class="key black b1" data-midi="61" aria-label="Cis"></button>
      <button class="key black b2" data-midi="63" aria-label="Dis"></button>
      <button class="key black b3" data-midi="66" aria-label="Fis"></button>
      <button class="key black b4" data-midi="68" aria-label="Gis"></button>
      <button class="key black b5" data-midi="70" aria-label="Ais"></button>
    </div>
    <div id="status">Audio: ei avattu</div>
  </main>
  <script>
    const piano=document.querySelector('#piano'),status=document.querySelector('#status'),unlock=document.querySelector('#unlock'),AC=window.AudioContext||window.webkitAudioContext;
    let audio,osc,gain,started=false,activeId=null,activeKey=null;
    function build(){
      try{audio=new AC({latencyHint:'interactive'})}catch{audio=new AC()}
      osc=audio.createOscillator();gain=audio.createGain();osc.type='triangle';gain.gain.value=.0001;osc.connect(gain).connect(audio.destination);started=false;
      audio.onstatechange=()=>status.textContent='Audio: '+audio.state;
      status.textContent='Audio: '+audio.state;
    }
    function openAudio(){
      if(!audio||audio.state==='closed')build();
      if(!started){osc.start();started=true}
      const done=()=>{
        if(audio.state!=='running')return;
        piano.classList.remove('locked');unlock.disabled=true;unlock.textContent='ÄÄNI AVATTU';status.textContent='Audio: running';
        const t=audio.currentTime;osc.frequency.setValueAtTime(261.63,t);gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.12,t+.01);
        setTimeout(()=>{const n=audio.currentTime;gain.gain.cancelScheduledValues(n);gain.gain.setValueAtTime(.12,n);gain.gain.exponentialRampToValueAtTime(.0001,n+.06)},120);
      };
      if(audio.state==='running')done();else audio.resume().then(done).catch(()=>status.textContent='Audio: avaaminen epäonnistui');
    }
    function start(e){
      const key=e.target.closest('.key');
      if(!key||(e.pointerType==='mouse'&&e.button!==0))return;
      e.preventDefault();
      if(!audio||audio.state!=='running'){status.textContent='Paina ensin AVAA ÄÄNI';return}
      piano.setPointerCapture(e.pointerId);
      if(activeKey)activeKey.classList.remove('active');
      activeId=e.pointerId;activeKey=key;key.classList.add('active');
      const t=audio.currentTime;osc.frequency.setValueAtTime(440*Math.pow(2,(+key.dataset.midi-69)/12),t);gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.16,t+.012);
      status.textContent='Audio: '+audio.state;
    }
    function stop(e){
      if(e.pointerId!==activeId)return;
      const t=audio.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.16,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.06);
      activeKey.classList.remove('active');activeId=null;activeKey=null;
    }
    piano.addEventListener('pointerdown',start);
    piano.addEventListener('pointerup',stop);
    piano.addEventListener('pointercancel',stop);
    piano.addEventListener('lostpointercapture',stop);
    unlock.addEventListener('click',openAudio);
  </script>
</body>
</html>
