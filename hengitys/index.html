<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7898ad">
  <title>Puhallus / hengitys · ResonatorEngine</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: #17344a;
      background: #8faabd;
    }

    body {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(245,249,252,.12), rgba(245,249,252,.12)),
        url("tausta.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .app {
      min-height: 100vh;
      padding:
        max(24px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .reset {
      appearance: none;
      border: 1px solid rgba(255,255,255,.60);
      background: rgba(255,255,255,.38);
      color: #17344a;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 10px 17px;
      border-radius: 999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 5px 22px rgba(25,50,65,.10);
      cursor: pointer;
    }

    .reset:active { transform: translateY(1px); }

    .center {
      display: grid;
      place-items: center;
      width: 100%;
    }

    .panel {
      width: min(88vw, 1280px);
      padding: clamp(22px, 3vw, 44px);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 38px;
      background: rgba(244,249,252,.28);
      box-shadow: 0 22px 70px rgba(28,57,72,.13);
      backdrop-filter: blur(18px) saturate(.9);
      -webkit-backdrop-filter: blur(18px) saturate(.9);
    }

    .pitch-panel {
      margin-bottom: clamp(16px, 2vw, 24px);
      padding: clamp(14px, 1.6vw, 20px);
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 25px;
      background: rgba(248,251,253,.46);
      box-shadow: 0 10px 30px rgba(28,57,72,.09);
    }

    .pitch-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 8px;
    }

    .pitch-kicker {
      color: rgba(23,52,74,.70);
      font-size: clamp(11px, 1vw, 14px);
      font-weight: 850;
      letter-spacing: .10em;
    }

    .pitch-status {
      min-height: 1.35em;
      margin-top: 4px;
      color: rgba(23,52,74,.78);
      font-size: clamp(12px, 1.05vw, 15px);
      font-weight: 650;
    }

    .mic-button {
      appearance: none;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.74);
      border-radius: 999px;
      padding: 10px 17px;
      background: #477e9d;
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37,83,110,.18);
    }

    .mic-button[data-running="true"] { background: #8b4550; }
    .mic-button:disabled { opacity: .55; cursor: wait; }
    .mic-button:active:not(:disabled) { transform: translateY(1px); }

    .pitch-display {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(120px, 16vw, 205px);
      align-items: center;
      gap: clamp(10px, 1.8vw, 24px);
    }

    .score-canvas {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: clamp(105px, 11.5vw, 145px);
      overflow: hidden;
      border-radius: 18px;
      background: rgba(255,255,255,.54);
      color: rgba(23,52,74,.58);
      font-size: 13px;
      font-weight: 650;
    }

    .score-canvas svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 690px;
    }

    .pitch-readout {
      text-align: center;
      color: rgba(23,52,74,.62);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .11em;
    }

    .pitch-name {
      display: block;
      min-height: 1.1em;
      margin-top: 4px;
      color: #245f7f;
      font-size: clamp(39px, 5.2vw, 72px);
      font-weight: 850;
      line-height: 1;
      letter-spacing: -.05em;
      text-transform: lowercase;
    }

    .pitch-scale {
      margin-top: 5px;
      color: rgba(23,52,74,.54);
      font-size: clamp(10px, .92vw, 13px);
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .osmd-staging {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 640px;
      visibility: hidden;
      pointer-events: none;
    }

    .instruction {
      text-align: center;
      margin-bottom: clamp(18px, 2.5vw, 30px);
      font-size: clamp(17px, 1.7vw, 26px);
      font-weight: 650;
      letter-spacing: .01em;
      color: rgba(18,50,69,.83);
      text-shadow: 0 1px 8px rgba(255,255,255,.35);
    }

    .pad {
      appearance: none;
      border: 0;
      background: transparent;
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      cursor: pointer;
      touch-action: none;
      outline: none;
    }

    .bar {
      position: relative;
      width: 100%;
      height: clamp(96px, 10.5vw, 145px);
      overflow: hidden;
      border-radius: 999px;
      background: rgba(239,245,248,.76);
      border: 3px solid rgba(255,255,255,.82);
      box-shadow:
        0 14px 40px rgba(34,65,80,.16),
        inset 0 1px 0 rgba(255,255,255,.85);
    }

    .blue, .green {
      position: absolute;
      top: 0;
      bottom: 0;
      transition: width .035s linear;
    }

    .blue {
      left: 0;
      width: 0%;
      background: linear-gradient(90deg, #3a9de8 0%, #57b3ed 100%);
    }

    .green {
      right: 0;
      width: 0%;
      background: linear-gradient(90deg, #68c979 0%, #39ad67 100%);
    }

    .target {
      position: absolute;
      z-index: 10;
      top: 0;
      bottom: 0;
      left: 75%;
      width: 4px;
      transform: translateX(-50%);
      background: rgba(21,49,67,.88);
      box-shadow: 0 0 0 1px rgba(255,255,255,.35);
    }

    .target-label {
      position: absolute;
      z-index: 15;
      top: 9px;
      left: 75%;
      transform: translateX(-50%);
      padding: 5px 9px;
      border-radius: 9px;
      background: rgba(255,255,255,.86);
      color: #19384d;
      font-size: clamp(12px, 1.2vw, 18px);
      font-weight: 850;
      letter-spacing: .02em;
      box-shadow: 0 2px 10px rgba(20,42,57,.12);
    }

    .time {
      position: absolute;
      z-index: 20;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-weight: 800;
      font-size: clamp(28px, 4vw, 58px);
      letter-spacing: -.025em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(18,53,75,.20);
      white-space: nowrap;
    }

    .blow-time { left: clamp(26px, 3vw, 44px); }
    .inhale-time { right: clamp(26px, 3vw, 44px); }

    .hidden { display: none; }

    .labels {
      display: grid;
      grid-template-columns: 3fr 1fr;
      margin-top: 10px;
      font-size: clamp(12px, 1.15vw, 17px);
      font-weight: 800;
      letter-spacing: .14em;
      color: rgba(24,54,72,.68);
    }

    .labels span:last-child { text-align: right; }

    .feedback {
      margin-top: clamp(20px, 2vw, 28px);
      min-height: 1.4em;
      text-align: center;
      font-size: clamp(17px, 1.8vw, 27px);
      font-weight: 720;
      color: #17384e;
      text-shadow: 0 1px 8px rgba(255,255,255,.5);
    }

    .footer {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: rgba(23,52,74,.58);
      padding-top: 10px;
    }


    .metro {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: max(28px, env(safe-area-inset-left));
      z-index: 40;
      width: min(360px, calc(100vw - 190px));
      padding: 11px 14px 12px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 22px;
      background: rgba(246,250,252,.40);
      box-shadow: 0 8px 30px rgba(25,50,65,.11);
      backdrop-filter: blur(16px) saturate(.9);
      -webkit-backdrop-filter: blur(16px) saturate(.9);
    }

    .metro-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .metro-play {
      appearance: none;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 50%;
      background: rgba(255,255,255,.58);
      color: #17344a;
      font: inherit;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(24,52,70,.09);
    }

    .metro-play:active { transform: scale(.97); }
    .metro-play { transition: none; }

    .metro-name {
      min-width: 0;
      color: rgba(23,52,74,.78);
      font-size: 13px;
      font-weight: 780;
      letter-spacing: .03em;
    }

    .metro-bpm {
      color: #17344a;
      font-size: 18px;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .metro-slider {
      display: block;
      width: 100%;
      margin: 8px 0 0;
      accent-color: #477e9d;
      cursor: pointer;
    }

    .metro-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 1px;
      color: rgba(23,52,74,.48);
      font-size: 10px;
      font-weight: 650;
    }

    .metro.pulse .metro-play {
      background: rgba(255,255,255,.96);
      box-shadow: 0 0 0 7px rgba(255,255,255,.28);
      transform: scale(.91);
    }

    @media (max-width: 800px), (max-height: 620px) {
      .app { padding: 15px; }
      .panel {
        width: min(94vw, 980px);
        padding: 18px;
        border-radius: 26px;
      }
      .instruction { margin-bottom: 14px; }
      .feedback { margin-top: 14px; }
      .bar { height: 92px; }
      .pitch-panel { padding: 10px 12px; margin-bottom: 12px; }
      .pitch-head { margin-bottom: 5px; }
      .score-canvas { height: 90px; }
      .pitch-name { font-size: 40px; }
      .metro {
        top: 15px;
        left: 15px;
        width: min(320px, calc(100vw - 125px));
        padding: 8px 10px 9px;
      }
      .metro-play { width: 40px; height: 40px; }
      .metro-bpm { font-size: 16px; }
    }

    @media (max-width: 560px) {
      .pitch-head { align-items: flex-start; }
      .pitch-display { grid-template-columns: minmax(0, 1fr) 92px; }
      .pitch-scale { white-space: normal; }
      .mic-button { padding: 9px 12px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blue, .green { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">

    <section id="metro" class="metro" aria-label="Metronomi">
      <div class="metro-head">
        <button id="metroPlay" class="metro-play" type="button" aria-label="Käynnistä metronomi" aria-pressed="false">▶</button>
        <div class="metro-name">METRONOMI</div>
        <div class="metro-bpm"><span id="bpmValue">75</span> BPM</div>
      </div>
      <input id="bpmSlider" class="metro-slider" type="range" min="40" max="180" step="1" value="75" aria-label="Metronomin tempo">
      <div class="metro-scale"><span>40</span><span>180</span></div>
    </section>

    <header class="top">
      <button id="resetBtn" class="reset" type="button">Nollaa</button>
    </header>

    <section class="center">
      <div class="panel">
        <section class="pitch-panel" aria-labelledby="pitchHeading">
          <div class="pitch-head">
            <div>
              <div id="pitchHeading" class="pitch-kicker">RESONATORENGINE · G-DUURI g1–g2</div>
              <div id="pitchStatus" class="pitch-status" aria-live="polite">Valmistellaan nuottinäyttöä…</div>
            </div>
            <button id="micBtn" class="mic-button" type="button" data-running="false" disabled>Avaa mikrofoni</button>
          </div>
          <div class="pitch-display">
            <div id="scoreCanvas" class="score-canvas" role="img" aria-label="Nuottinäyttö latautuu">Valmistellaan nuottiviivastoa…</div>
            <div class="pitch-readout">
              TUNNISTETTU SÄVEL
              <strong id="pitchName" class="pitch-name">–</strong>
              <div class="pitch-scale">g1 · a1 · h1 · c2 · d2 · e2 · fis2 · g2</div>
            </div>
          </div>
        </section>

        <div id="instruction" class="instruction">Pidä painettuna puhalluksen ajan.</div>

        <button id="pad" class="pad" type="button" aria-label="Pidä painettuna puhalluksen ajan">
          <div class="bar">
            <div id="bluePart" class="blue"></div>
            <div id="greenPart" class="green"></div>

            <div class="target"></div>
            <div class="target-label">3:1</div>

            <div id="blowTime" class="time blow-time">0,00 s</div>
            <div id="inhaleTime" class="time inhale-time hidden">0,00 s</div>
          </div>

          <div class="labels">
            <span>PUHALLUS</span>
            <span>SISÄÄNHENGITYS</span>
          </div>
        </button>

        <div id="feedback" class="feedback" aria-live="polite">Paina ja aloita puhallus.</div>
      </div>
    </section>

    <footer class="footer">Puhallus / hengitys</footer>
  </main>
<script src="vendor/osmd/opensheetmusicdisplay.min.js"></script>
<script src="score-display.js"></script>
<script src="note-stability.js"></script>
<script src="resonator-engine.js"></script>
<script>
  (() => {
    const pad = document.getElementById('pad');
    const resetBtn = document.getElementById('resetBtn');
    const instruction = document.getElementById('instruction');
    const bluePart = document.getElementById('bluePart');
    const greenPart = document.getElementById('greenPart');
    const blowTime = document.getElementById('blowTime');
    const inhaleTime = document.getElementById('inhaleTime');
    const feedback = document.getElementById('feedback');

    const micBtn = document.getElementById('micBtn');
    const pitchStatus = document.getElementById('pitchStatus');
    const pitchName = document.getElementById('pitchName');
    const scoreCanvas = document.getElementById('scoreCanvas');

    const NOTE_DEFS = [
      { id: 'G4', label: 'G', oct: '4', display: 'g1', hz: 391.9954 },
      { id: 'A4', label: 'A', oct: '4', display: 'a1', hz: 440.0000 },
      { id: 'H4', label: 'H', oct: '4', display: 'h1', hz: 493.8833 },
      { id: 'C5', label: 'C', oct: '5', display: 'c2', hz: 523.2511 },
      { id: 'D5', label: 'D', oct: '5', display: 'd2', hz: 587.3295 },
      { id: 'E5', label: 'E', oct: '5', display: 'e2', hz: 659.2551 },
      { id: 'Fis5', label: 'F♯', oct: '5', display: 'fis2', hz: 739.9888 },
      { id: 'G5', label: 'G', oct: '5', display: 'g2', hz: 783.9909 }
    ];
    const PITCH_IDS = NOTE_DEFS.map(note => note.id);
    const PITCH_TARGETS = Object.fromEntries(NOTE_DEFS.map(note => [note.id, note.hz]));
    const PITCH_BY_ID = Object.fromEntries(NOTE_DEFS.map(note => [note.id, note]));
    const pitchStability = new ResonatorNoteStability({ targets: PITCH_TARGETS });
    const score = new ResonatorScoreDisplay(scoreCanvas);
    const pitchAudio = new ResonatorStringEngine({
      targets: PITCH_TARGETS,
      blockSize: 256,
      calibrationMs: 280,
      responseMs: 1.8,
      toleranceCents: 40,
      centerMatch: 0.955,
      edgeMatch: 0.998,
      minHalfPeriodEnergy: 0.32
    });
    let scoreReady = false;
    let activePitch = '';
    let micOpening = false;
    let micStartRequest = 0;

    const metro = document.getElementById('metro');
    const metroPlay = document.getElementById('metroPlay');
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmValue = document.getElementById('bpmValue');
    let phase = 'idle';
    let phaseStart = 0;
    let blow = 0;
    let inhale = 0;
    let raf = 0;

    let metroRunning = false;
    let audioCtx = null;
    let metroBuffer = null;
    let metroSchedulerTimer = 0;
    let nextBeatTime = 0;
    let visualBeatQueue = [];
    let visualRaf = 0;

    const pitchPretty = id => PITCH_BY_ID[id]?.display || '';

    function setPitchStatus(text) {
      pitchStatus.textContent = text;
    }

    function showPitch(id) {
      if (!PITCH_IDS.includes(id)) return;
      activePitch = id;
      score.show(id);
      pitchName.textContent = pitchPretty(id);
    }

    function clearPitch() {
      pitchStability.reset();
      activePitch = '';
      score.show('');
      pitchName.textContent = '–';
    }

    function updateMicButton() {
      micBtn.disabled = !scoreReady;
      if (micOpening) {
        micBtn.textContent = 'Peru avaus';
        micBtn.dataset.running = 'false';
        return;
      }
      micBtn.textContent = pitchAudio.running ? 'Sulje mikrofoni' : 'Avaa mikrofoni';
      micBtn.dataset.running = pitchAudio.running ? 'true' : 'false';
    }

    async function startPitchAudio() {
      const request = ++micStartRequest;
      micOpening = true;
      clearPitch();
      setPitchStatus('Avataan mikrofonia…');
      updateMicButton();
      try {
        await pitchAudio.start();
      } catch (error) {
        if (request !== micStartRequest) return;
        if (error?.name !== 'AbortError') {
          setPitchStatus(error?.message || 'Mikrofonin avaus epäonnistui.');
        }
      } finally {
        if (request === micStartRequest) {
          micOpening = false;
          updateMicButton();
        }
      }
    }

    function acceptPitch(detail) {
      if (!PITCH_IDS.includes(detail.action)) return;
      showPitch(detail.action);
      const cents = Number(detail.offsetCents);
      const centsText = Number.isFinite(cents)
        ? ` · ${cents > 0 ? '+' : ''}${cents.toFixed(0)} c`
        : '';
      setPitchStatus(`${pitchPretty(detail.action)} tunnistettu${centsText}`);
    }

    function bindPitchEngine() {
      pitchAudio.addEventListener('input', event => {
        const detail = event.detail || {};
        if (detail.accepted === true) {
          const stable = pitchStability.accept(detail);
          if (stable) acceptPitch(stable);
        } else if (detail.accepted === false) {
          pitchStability.reject();
          setPitchStatus('Ääntä ei hyväksytty · käytä G-duuriasteikon säveliä g1–g2');
        }
      });

      pitchAudio.addEventListener('silence', () => {
        pitchStability.silence();
        if (pitchAudio.running) {
          setPitchStatus(activePitch
            ? `${pitchPretty(activePitch)} · kuuntelu päällä`
            : 'Kuuntelu päällä · soita G-duuriasteikkoa g1–g2');
        }
      });

      pitchAudio.addEventListener('state', event => {
        const state = event.detail?.state;
        if (state === 'requesting-microphone') {
          setPitchStatus('Pyydetään mikrofonilupaa…');
        } else if (state === 'calibrating') {
          setPitchStatus('Kalibroidaan taustakohinaa · ole hetki hiljaa…');
        } else if (state === 'running') {
          setPitchStatus('Kuuntelu päällä · soita G-duuriasteikkoa g1–g2');
        } else if (state === 'stopped') {
          clearPitch();
          setPitchStatus('Mikrofoni suljettu.');
        }
        updateMicButton();
      });

      pitchAudio.addEventListener('calibrationprogress', event => {
        const progress = Number(event.detail?.progress);
        if (Number.isFinite(progress)) {
          setPitchStatus(`Kalibroidaan taustakohinaa… ${Math.round(progress * 100)} %`);
        }
      });

      pitchAudio.addEventListener('error', event => {
        setPitchStatus(event.detail?.error?.message || event.detail?.message || 'Äänimoottorin virhe.');

    const fmt = s =>
      Math.max(0, s || 0).toFixed(2).replace('.', ',') + ' s';


    function bpm() {
      return Math.max(40, Math.min(180, Number(bpmSlider.value) || 75));
    }

    function metroIntervalSec() {
      return 60 / bpm();
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    async function ensureAudioReady() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx({ latencyHint: 'interactive' });
      }

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (!metroBuffer) {
        const raw = base64ToArrayBuffer(METRO_WAV_BASE64);
        metroBuffer = await audioCtx.decodeAudioData(raw.slice(0));
      }
    }

    function pulseMetroButton() {
      metro.classList.remove('pulse');
      void metro.offsetWidth;
      metro.classList.add('pulse');
      window.setTimeout(() => metro.classList.remove('pulse'), 80);
    }

    function scheduleBeat(when) {
      const source = audioCtx.createBufferSource();
      source.buffer = metroBuffer;
      source.connect(audioCtx.destination);
      source.start(when, 0);

      // Keep the exact scheduled AudioContext time for the visual beat.
      // It will be mapped to performance.now() with getOutputTimestamp().
      visualBeatQueue.push(when);
    }

    function schedulerTick() {
      if (!metroRunning || !audioCtx || !metroBuffer) return;

      const scheduleAhead = 0.12;

      while (nextBeatTime < audioCtx.currentTime + scheduleAhead) {
        scheduleBeat(nextBeatTime);
        nextBeatTime += metroIntervalSec();
      }

      metroSchedulerTimer = window.setTimeout(schedulerTick, 25);
    }

    function audioTimeToPerformanceTime(audioTime) {
      // Best path: the browser reports the relationship between
      // AudioContext time and the performance timeline at the actual output.
      if (audioCtx && typeof audioCtx.getOutputTimestamp === 'function') {
        const ts = audioCtx.getOutputTimestamp();

        if (
          ts &&
          Number.isFinite(ts.contextTime) &&
          Number.isFinite(ts.performanceTime)
        ) {
          return ts.performanceTime + (audioTime - ts.contextTime) * 1000;
        }
      }

      // Standards-based fallback with no hand-tuned offset.
      // This does not compensate output latency, but it also does not guess.
      return performance.now() + (audioTime - audioCtx.currentTime) * 1000;
    }

    function visualTick() {
      if (!metroRunning || !audioCtx) return;

      const nowPerf = performance.now();

      // Store beats in AudioContext time. On every animation frame,
      // map the next beat to the UI performance timeline using the
      // browser's current output timestamp. This prevents accumulated drift
      // and avoids a manually chosen millisecond correction.
      while (visualBeatQueue.length) {
        const beatAudioTime = visualBeatQueue[0];
        const beatPerfTime = audioTimeToPerformanceTime(beatAudioTime);

        if (nowPerf < beatPerfTime) break;

        visualBeatQueue.shift();
        pulseMetroButton();
      }

      visualRaf = requestAnimationFrame(visualTick);
    }

    async function startMetro() {
      if (metroRunning) return;

      try {
        await ensureAudioReady();
      } catch (err) {
        console.error('Metronomin äänen alustus epäonnistui', err);
        return;
      }

      metroRunning = true;
      visualBeatQueue.length = 0;

      // Small lead time lets audio scheduling start cleanly.
      nextBeatTime = audioCtx.currentTime + 0.06;

      metroPlay.textContent = '■';
      metroPlay.setAttribute('aria-label', 'Pysäytä metronomi');
      metroPlay.setAttribute('aria-pressed', 'true');

      schedulerTick();
      cancelAnimationFrame(visualRaf);
      visualRaf = requestAnimationFrame(visualTick);
    }

    function stopMetro() {
      metroRunning = false;

      window.clearTimeout(metroSchedulerTimer);
      metroSchedulerTimer = 0;

      cancelAnimationFrame(visualRaf);
      visualRaf = 0;

      visualBeatQueue.length = 0;
      nextBeatTime = 0;

      metroPlay.textContent = '▶';
      metroPlay.setAttribute('aria-label', 'Käynnistä metronomi');
      metroPlay.setAttribute('aria-pressed', 'false');
      metro.classList.remove('pulse');
    }

    function toggleMetro() {
      if (metroRunning) stopMetro();
      else startMetro();
    }

    function updateBar() {
      if (phase === 'idle') {
        bluePart.style.width = '0%';
        greenPart.style.width = '0%';
        blowTime.textContent = '0,00 s';
        inhaleTime.textContent = '0,00 s';
        inhaleTime.classList.add('hidden');
        return;
      }

      if (phase === 'blow') {
        bluePart.style.width = '100%';
        greenPart.style.width = '0%';
        blowTime.textContent = fmt(blow);
        blowTime.style.opacity = '1';
        inhaleTime.classList.add('hidden');
        feedback.textContent = 'Puhalla…';
        return;
      }

      const total = blow + inhale;
      const bluePct = total > 0 ? (blow / total) * 100 : 100;
      const greenPct = 100 - bluePct;

      bluePart.style.width = bluePct + '%';
      greenPart.style.width = greenPct + '%';

      blowTime.textContent = fmt(blow);
      blowTime.style.opacity = '.62';
      inhaleTime.textContent = fmt(inhale);
      inhaleTime.classList.remove('hidden');

      const diff = bluePct - 75;

      if (Math.abs(diff) <= 1.5) {
        feedback.textContent = '3:1';
      } else if (diff > 0) {
        feedback.textContent = 'Jatka hengitystä…';
      } else {
        feedback.textContent = 'Hengitys meni tavoitteen yli';
      }
    }

    function render() {
      const now = performance.now();

      if (phase === 'blow') {
        blow = (now - phaseStart) / 1000;
      } else if (phase === 'inhale') {
        inhale = (now - phaseStart) / 1000;
      }

      updateBar();

      if (phase !== 'idle') {
        raf = requestAnimationFrame(render);
      }
    }

    function beginBlow(ev) {
      if (ev && typeof ev.button === 'number' && ev.button !== 0) return;
      if (phase === 'blow') return;

      phase = 'blow';
      phaseStart = performance.now();
      blow = 0;
      inhale = 0;

      instruction.textContent = 'Puhallusta mitataan.';
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(render);
    }

    function beginInhale() {
      if (phase !== 'blow') return;

      blow = Math.max(.05, (performance.now() - phaseStart) / 1000);
      phase = 'inhale';
      phaseStart = performance.now();
      inhale = 0;

      instruction.textContent = 'Sisäänhengitystä mitataan.';
    }

    function reset() {
      cancelAnimationFrame(raf);
      phase = 'idle';
      phaseStart = 0;
      blow = 0;
      inhale = 0;
      instruction.textContent = 'Pidä painettuna puhalluksen ajan.';
      feedback.textContent = 'Paina ja aloita puhallus.';
      blowTime.style.opacity = '1';
      updateBar();
    }

    pad.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (pad.setPointerCapture && ev.pointerId != null) {
        try { pad.setPointerCapture(ev.pointerId); } catch (_) {}
      }
      beginBlow(ev);
    });

    pad.addEventListener('pointerup', ev => {
      ev.preventDefault();
      beginInhale();
    });

    pad.addEventListener('pointercancel', beginInhale);

    pad.addEventListener('keydown', ev => {
      if ((ev.code === 'Space' || ev.code === 'Enter') && !ev.repeat) {
        ev.preventDefault();
        beginBlow();
      }
    });

    pad.addEventListener('keyup', ev => {
      if (ev.code === 'Space' || ev.code === 'Enter') {
        ev.preventDefault();
        beginInhale();
      }
    });

    metroPlay.addEventListener('click', toggleMetro);

    bpmSlider.addEventListener('input', () => {
      bpmValue.textContent = String(bpm());

      if (metroRunning && audioCtx) {
        // Keep the current beat intact and apply the new tempo from the next beat.
        visualBeatQueue = visualBeatQueue.filter(t => t >= audioCtx.currentTime - 0.02);

        const lastScheduled = visualBeatQueue.length
          ? visualBeatQueue[visualBeatQueue.length - 1]
          : audioCtx.currentTime;

        nextBeatTime = Math.max(
          audioCtx.currentTime + 0.04,
          lastScheduled + metroIntervalSec()
        );
      }
    });

    bindPitchEngine();

    micBtn.addEventListener('click', async () => {
      if (micOpening) {
        ++micStartRequest;
        micOpening = false;
        pitchAudio.stop();
        clearPitch();
        setPitchStatus('Mikrofonin avaus peruttu.');
        updateMicButton();
        return;
      }
      if (pitchAudio.running) {
        pitchAudio.stop();
        return;
      }
      await startPitchAudio();
    });

    score.init(NOTE_DEFS).then(() => {
      scoreReady = true;
      setPitchStatus('Avaa mikrofoni ja ole kalibroinnin ajan hetki hiljaa.');
      updateMicButton();
    }).catch(error => {
      console.error('OSMD-nuottinäyttö:', error);
      scoreCanvas.textContent = 'Nuottinäyttöä ei voitu avata. Tarkista, että koko ZIP-paketti on purettu.';
      setPitchStatus('Nuottinäytön lataus epäonnistui.');
    });

    window.addEventListener('pagehide', () => {
      ++micStartRequest;
      micOpening = false;
      pitchAudio.stop();
      stopMetro();
    });

    resetBtn.addEventListener('click', reset);
    updateMicButton();
    updateBar();
  })();
  </script>
