function fallbackStaffSvg(info,clef){

  let note='';
  if(info){
    const bottomIndex=clef==='bass'?(2*7+4):(4*7+2);
    const noteIndex=info.scientificOctave*7+info.letterIndex;
    const y=bottomY-(noteIndex-bottomIndex)*(lineGap/2);

    if(y>bottomY+1){
      for(let ly=bottomY+lineGap;ly<=y+1;ly+=lineGap)ledger.push(`<line x1="226" y1="${ly}" x2="270" y2="${ly}" stroke="#15384f" stroke-width="1.8"/>`);
    }else if(y<bottomY-4*lineGap-1){
      for(let ly=bottomY-5*lineGap;ly>=y-1;ly-=lineGap)ledger.push(`<line x1="226" y1="${ly}" x2="270" y2="${ly}" stroke="#15384f" stroke-width="1.8"/>`);
    }
    const acc=info.accidental===1?'♯':info.accidental===-1?'♭':'';

  if(!window.opensheetmusicdisplay?.OpenSheetMusicDisplay){
    osmdContainer.innerHTML=fallbackStaffSvg(info,clef);
  }

  notationRenderQueue=notationRenderQueue.then(async()=>{
    if(token!==notationRenderToken)return;

function renderTuner(){

  const note=live.f0?freqToNote(live.f0):null;
  if(note&&Number.isFinite(note.cents)){
    const target=clamp(note.cents,-50,50);
    if(tunerLastMidi!==note.midi||!Number.isFinite(tunerCentsSmooth)){
      tunerCentsSmooth=target;
      tunerLastMidi=note.midi;
    }else tunerCentsSmooth+=0.28*(target-tunerCentsSmooth);
    const shown=clamp(tunerCentsSmooth,-50,50);
    tunerNeedle.style.left=`${(50+shown).toFixed(2)}%`;
    tunerScale.classList.remove('inactive');
    const inTune=Math.abs(target)<=5;
    tunerScale.classList.toggle('in-tune',inTune);
    const rounded=Math.round(target);
    tunerReadout.textContent=`${rounded>0?'+':rounded<0?'−':''}${Math.abs(rounded)} cent`;
    tunerStatus.textContent=inTune?'VIREESSÄ':target<0?'MATALA':'KORKEA';
    tunerStatus.classList.toggle('ok',inTune);
  }else{
    tunerLastMidi=null;
    tunerCentsSmooth+=0.18*(0-tunerCentsSmooth);
    if(Math.abs(tunerCentsSmooth)<0.05)tunerCentsSmooth=0;
    tunerNeedle.style.left=`${(50+clamp(tunerCentsSmooth,-50,50)).toFixed(2)}%`;
    tunerScale.classList.add('inactive');
    tunerScale.classList.remove('in-tune');
    tunerReadout.textContent='–';
    tunerStatus.textContent='KUUNTELEE';
    tunerStatus.classList.remove('ok');
  }
}

function fpSimilarity(a,b){
  if(!a||!b)return 0;let sum=0;for(let i=0;i<8;i++){const da=20*Math.log10((a[i]||0)+1e-5),dbb=20*Math.log10((b[i]||0)+1e-5);const d=(da-dbb)/18;sum+=d*d}return clamp(100*Math.exp(-.78*Math.sqrt(sum/8)),0,100)
}
function evaluateSampleConsistency(s){
  const sid=sampleProfileId(s);
  const labels=[...new Set(samples.filter(x=>sampleProfileId(x)===sid).map(x=>x.note))];
  const profiles=labels.map(label=>aggregateProfile(sid,label)).filter(Boolean);
  const own=profiles.find(p=>p.label===s.note)||null;
  if(!own||own.count<REVIEW_MIN_OWN_SAMPLES){
    return {warning:false,status:'learning',pitchLabel:s.note,ownCount:own?.count||0,sameSimilarity:null,bestHarmonicLabel:null,bestHarmonicSimilarity:null,margin:null};
  }
  const sameSimilarity=fpSimilarity(s.harmonics,own.harmonics);
  const others=profiles.filter(p=>p.label!==s.note&&p.count>=REVIEW_MIN_OTHER_SAMPLES).map(p=>({label:p.label,count:p.count,similarity:fpSimilarity(s.harmonics,p.harmonics)})).sort((a,b)=>b.similarity-a.similarity);
  const bestOther=others[0]||null;
  const mismatch=!!bestOther&&bestOther.similarity>=REVIEW_MISMATCH_MIN_SIM&&bestOther.similarity>=sameSimilarity+REVIEW_MISMATCH_MARGIN;
  const ownOutlier=sameSimilarity<REVIEW_OWN_LOW_SIM;
  if(mismatch){
    return {warning:true,status:'harmonic_mismatch',pitchLabel:s.note,ownCount:own.count,sameSimilarity,bestHarmonicLabel:bestOther.label,bestHarmonicSimilarity:bestOther.similarity,margin:bestOther.similarity-sameSimilarity};
  }
  if(ownOutlier){
    return {warning:true,status:'harmonic_outlier',pitchLabel:s.note,ownCount:own.count,sameSimilarity,bestHarmonicLabel:bestOther?.label||null,bestHarmonicSimilarity:bestOther?.similarity??null,margin:bestOther?bestOther.similarity-sameSimilarity:null};
  }
  return {warning:false,status:'ok',pitchLabel:s.note,ownCount:own.count,sameSimilarity,bestHarmonicLabel:bestOther?.label||null,bestHarmonicSimilarity:bestOther?.similarity??null,margin:bestOther?bestOther.similarity-sameSimilarity:null};
}
function qualityCheckForExport(check,acceptedDespiteWarning=false){
  return {status:check.status,warning:!!check.warning,acceptedDespiteWarning:!!acceptedDespiteWarning,pitchLabel:check.pitchLabel,ownReferenceSamples:check.ownCount,sameNoteHarmonicSimilarity:check.sameSimilarity,bestOtherHarmonicLabel:check.bestHarmonicLabel,bestOtherHarmonicSimilarity:check.bestHarmonicSimilarity,otherVsSameMargin:check.margin,thresholds:{minOwnSamples:REVIEW_MIN_OWN_SAMPLES,minOtherSamples:REVIEW_MIN_OTHER_SAMPLES,mismatchMinSimilarity:REVIEW_MISMATCH_MIN_SIM,mismatchMargin:REVIEW_MISMATCH_MARGIN,ownLowSimilarity:REVIEW_OWN_LOW_SIM}};
}

async function openDb(){
  return new Promise((resolve,reject)=>{
    let settled=false;
    const r=indexedDB.open('aaninaeyte-dev-01',2);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('samples'))d.createObjectStore('samples',{keyPath:'id'});if(!d.objectStoreNames.contains('profiles'))d.createObjectStore('profiles',{keyPath:'id'})};
    r.onsuccess=()=>{if(settled){try{r.result.close()}catch(_){ }return}settled=true;const d=r.result;d.onversionchange=()=>{try{d.close()}catch(_){ }};resolve(d)};
    r.onerror=()=>{if(!settled){settled=true;reject(r.error)}};
    r.onblocked=()=>{if(!settled){settled=true;reject(new Error('Tietokannan päivitys on estynyt toisessa avoimessa välilehdessä.'))}};
  })
}
async function readStore(name){return new Promise((resolve,reject)=>{const r=db.transaction(name,'readonly').objectStore(name).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function rewriteSingleProfileData(keepProfile,keepSamples){
  if(!db)try{db=await openDb()}catch(_){return}
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(['profiles','samples'],'readwrite');
    const profileStore=tx.objectStore('profiles');
    const sampleStore=tx.objectStore('samples');
    profileStore.clear();
    sampleStore.clear();
    if(keepProfile)profileStore.put(keepProfile);
    for(const s of keepSamples||[])sampleStore.put(s);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error('Tietokannan päivitys keskeytyi.'));
  })
}

    }
  }catch(e){console.warn('Raaka-audion tallennus ei käynnistynyt, analyysidata tallennetaan silti.',e);recorder=null}
  setState('TALLENNUS • soita sävel','recording');updateButtons();
}
function stopRecording(){
  if(!isCaptureRecording())return;
  const sessionId=activeRecordingSessionId;
  captureState='finalizing';updateButtons();
  let recorderWasStopped=false;
  if(recorder&&recorder.state!=='inactive'){
    try{recorder.stop();recorderWasStopped=true}catch(e){console.warn('MediaRecorderin pysäytys epäonnistui',e)}
  }
  // Analyysinäytteen tallennus ei saa riippua MediaRecorder.onstop-tapahtumasta.
  // onstop saa edelleen viimeistellä heti, mutta tämä fallback varmistaa tallennuksen selaimesta riippumatta.
  if(recorderWasStopped)setTimeout(()=>finalizeRecording(sessionId),60);
  else finalizeRecording(sessionId);
}
async function finalizeRecording(sessionId=activeRecordingSessionId){
  if(!sessionId||sessionId!==activeRecordingSessionId||finalizedRecordingSessionId===sessionId)return;
  finalizedRecordingSessionId=sessionId;
  captureState='finalizing';updateButtons();
  const dur=Math.round(performance.now()-sampleStartedAt);
  if(dur<MIN_SAMPLE_MS||sampleFrames.length<3){captureState='idle';setState('Näyte oli liian lyhyt. Paina ALOITA NÄYTE uudelleen.');flashSampleFeedback('⚠ LIIAN LYHYT');updateButtons();return}
  const f0s=sampleFrames.map(f=>f.f0).filter(Boolean),dbs=sampleFrames.map(f=>f.db).filter(Number.isFinite);if(!f0s.length){captureState='idle';setState('Sävelkorkeutta ei saatu näytteestä.');flashSampleFeedback('⚠ EI SÄVELTÄ');updateButtons();return}
  const f0=median(f0s),note=freqToNote(f0);const fp=Array(8).fill(0);let fpCount=0;
  for(const fr of sampleFrames){if(!fr.fp)continue;for(let i=0;i<8;i++)fp[i]+=fr.fp[i]||0;fpCount++}if(fpCount)for(let i=0;i<8;i++)fp[i]/=fpCount;
  const blob=recordedChunks.length?new Blob(recordedChunks,{type:recorder?.mimeType||'audio/webm'}):null;
  const p=currentProfile();if(!p){captureState='idle';setState('Valitse ensin oppilasprofiili.');updateButtons();return}const s={id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,profileId:p.id,studentId:p.id,studentName:p.name,instrument:p.instrument,note:note?.label||'?',midi:note?.midi??null,frequencyHz:f0,durationMs:dur,medianDb:median(dbs),harmonics:fp,frames:sampleFrames.length,createdAt:new Date().toISOString(),audioType:blob?.type||null,audioBlob:blob};
  const check=evaluateSampleConsistency(s);
  if(check.warning){setState('Näyte odottaa tarkistusta.','armed');showSampleReview(s,check);return}
  await commitSample(s,check,false);captureState='idle';updateButtons();
}
function armSample(){
  if(isCaptureRecording()||isCaptureFinalizing()||pendingSample)return;silenceSince=null;setCaptureState('armed');
  setState(Number.isFinite(live.midi)?`Valmis. ${displayNoteFromMidi(live.midi)} näkyy nyt • seuraava puhallus tallentuu.`:'Valmis. Seuraava puhallus tallentuu.','armed')
}

function analyzeLiveFrame(){
  analyser.getFloatTimeDomainData(timeData);
  const dbNow=rmsDb(timeData),loud=dbNow>dbThreshold;
  let f0=null,fp=null,n=null;
  if(loud){
    analyser.getFloatFrequencyData(freqData);
    f0=yin(timeData,ctx.sampleRate);
    fp=f0?harmonicH1H8(f0):null;
    n=freqToNote(f0);
  }
  live=loud?{f0,db:dbNow,fp,label:n?.label||null,midi:n?.midi??null}:{f0:null,db:dbNow,fp:null,label:null,midi:null};
  renderLive();
  return {dbNow,loud,f0,fp,validTone:!!(loud&&f0&&fp)};
}
function handleCaptureFrame(frame){
  const {dbNow,f0,fp,validTone}=frame;
  // Näytteenotto on vain live-analyysin päällä oleva tallennuskerros.
  // Live-näyttö toimii koko ajan riippumatta captureState-tilasta.
  if(isCaptureArmed()&&validTone)beginRecording();
  if(!isCaptureRecording())return;
  if(validTone){
    sampleFrames.push({t:Math.round(performance.now()-sampleStartedAt),f0,db:dbNow,fp:[...fp]});
    silenceSince=null;
  }else if(silenceSince===null)silenceSince=performance.now();
  const elapsed=performance.now()-sampleStartedAt;
  if((silenceSince!==null&&performance.now()-silenceSince>END_SILENCE_MS)||elapsed>MAX_SAMPLE_MS)stopRecording();
}
function processFrame(){
  if(!analyser)return;
  const frame=analyzeLiveFrame();
  handleCaptureFrame(frame);
}

function updateCalibrationVisual(dbv,progress){const shown=Number.isFinite(dbv)?clamp(dbv,-90,-30):-90,ratio=(shown+90)/60,angle=-90+ratio*180;calNeedleGroup.setAttribute('transform',`rotate(${angle.toFixed(2)} 559 365)`);calDbValue.textContent=Number.isFinite(dbv)?`${Math.round(dbv)} dB`:'– dB';calProgressFill.setAttribute('width',(414*clamp(progress,0,1)).toFixed(1))}
async function calibrateMicrophoneNoiseFloor(){
  if(!analyser||!timeData)return false;if(timer){clearInterval(timer);timer=null}
  cancelCapture();pendingSample=null;pendingCheck=null;closeSampleReview();setBars(null);noteName.textContent='–';hzValue.textContent='';resetTuner();updateButtons();
  calOverlay.classList.add('show');updateCalibrationVisual(-90,0);
  const total=MIC_CAL_WARMUP_MS+MIC_CAL_MEASURE_MS,start=performance.now();
  while(performance.now()-start<MIC_CAL_WARMUP_MS){analyser.getFloatTimeDomainData(timeData);const l=rmsDb(timeData);updateCalibrationVisual(l,(performance.now()-start)/total);await sleepMs(33)}
  const vals=[],mstart=performance.now();
  while(performance.now()-mstart<MIC_CAL_MEASURE_MS){analyser.getFloatTimeDomainData(timeData);const l=rmsDb(timeData);if(Number.isFinite(l))vals.push(l);updateCalibrationVisual(l,(MIC_CAL_WARMUP_MS+performance.now()-mstart)/total);await sleepMs(33)}
  if(!vals.length)dbThreshold=-70;else{vals.sort((a,b)=>a-b);const nf=median(vals);dbThreshold=clamp(Math.round(nf+MIC_CAL_MARGIN_DB),DB_MIN,DB_MAX)}
  updateCalibrationVisual(median(vals),1);await sleepMs(180);timer=setInterval(processFrame,FRAME_MS);calOverlay.classList.remove('show');setState('');return true;
}
async function startMic(){
  if(stream)return true;if(!navigator.mediaDevices?.getUserMedia)throw new Error('Selain ei tue mikrofonikäyttöä.');
  ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')await ctx.resume();
  const supported=navigator.mediaDevices.getSupportedConstraints?navigator.mediaDevices.getSupportedConstraints():{};const c={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(supported.voiceIsolation)c.voiceIsolation=false;
  stream=await navigator.mediaDevices.getUserMedia({audio:c});const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.08;analyser.minDecibels=-110;analyser.maxDecibels=-10;src.connect(analyser);timeData=new Float32Array(analyser.fftSize);freqData=new Float32Array(analyser.frequencyBinCount);await calibrateMicrophoneNoiseFloor();return true;
}
function exportJson(){
  const p=currentProfile();if(!p)return;const selected=samples.filter(s=>sampleProfileId(s)===p.id);const clean=selected.map(cleanSampleForJson);
  const payload={format:'aaninaeyte-dev-0.3.46-tuner',exportedAt:new Date().toISOString(),activeProfileId:p.id,profiles:[{...p}],calibration:{thresholdDb:dbThreshold,warmupMs:MIC_CAL_WARMUP_MS,measureMs:MIC_CAL_MEASURE_MS,marginDb:MIC_CAL_MARGIN_DB},samples:clean};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);const safe=String(p.name||'profiili').replace(/[^a-z0-9åäö_-]+/gi,'_');a.download=`aaninaeyte_${safe}_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)
}

function normalizeImportedProfilePayload(raw){
  if(!raw||typeof raw!=='object')throw new Error('Virheellinen JSON-tiedosto.');
  let p=null;
  if(Array.isArray(raw.profiles)&&raw.profiles.length){
    const wanted=raw.activeProfileId?raw.profiles.find(x=>x?.id===raw.activeProfileId):null;p=wanted||raw.profiles[0];
  }else if(raw.profile&&typeof raw.profile==='object')p=raw.profile;
  if(!p||!p.id||!p.name)throw new Error('Tiedostossa ei ole kelvollista oppilasprofiilia.');
  const profile={...p,id:String(p.id),name:String(p.name).trim(),instrument:String(p.instrument||'').trim(),updatedAt:new Date().toISOString()};
  if(!profile.createdAt)profile.createdAt=profile.updatedAt;
  const sourceSamples=Array.isArray(raw.samples)?raw.samples:[];
  const importedSamples=sourceSamples.filter(Boolean).filter(s=>{const sid=sampleProfileId(s);return !sid||sid===String(p.id)}).map(s=>({...s,profileId:profile.id,studentId:profile.id,studentName:profile.name,instrument:profile.instrument,audioBlob:undefined}));
  return {profile,samples:importedSamples};
}
async function replaceProfileData(profile,importedSamples){
  if(!db)try{db=await openDb()}catch(_){db=null}
  if(db){
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(['profiles','samples'],'readwrite'),ps=tx.objectStore('profiles'),ss=tx.objectStore('samples');
      ps.put(profile);
      const req=ss.getAll();
      req.onsuccess=()=>{for(const old of req.result||[])if(sampleProfileId(old)===profile.id)ss.delete(old.id);for(const s of importedSamples)ss.put(s)};
      req.onerror=()=>reject(req.error);
      tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Tuonti keskeytyi.'));
    });
  }
  profiles=profiles.filter(x=>x.id!==profile.id);profiles.push(profile);
  samples=samples.filter(s=>sampleProfileId(s)!==profile.id);samples.push(...importedSamples);writeFallbackSnapshot();renderProfileSelects();
}
async function openProfileFromFile(file){
  const raw=JSON.parse(await file.text());const imported=normalizeImportedProfilePayload(raw);const existing=profiles.find(p=>p.id===imported.profile.id);
  if(existing&&!confirm(`Profiili ${existing.name} on jo tallennettu. Korvataanko se tiedoston versiolla?`))return;
  await replaceProfileData(imported.profile,imported.samples);await activateProfile(imported.profile.id);setState(`Profiili ladattu tiedostosta: ${imported.profile.name}`,'ok');
}
async function handleProfileFileInput(){
  const file=profileFileInput.files&&profileFileInput.files[0];profileFileInput.value='';if(!file)return;
  try{startError.textContent='';await openProfileFromFile(file)}catch(err){console.error(err);const msg=err?.message||'Profiilitiedostoa ei voitu avata.';startError.textContent=msg;setState(msg)}
}
