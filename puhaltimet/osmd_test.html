<!doctype html><html><body><div id='stage' style='width:220px;height:280px'></div><script src='./opensheetmusicdisplay.min.js'></script><script>
(async()=>{
const stage=document.getElementById('stage');
const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(stage,{autoResize:false,backend:'svg',drawTitle:false,drawingParameters:'compacttight'});
osmd.EngravingRules.RenderMeasureNumbers=false;osmd.EngravingRules.RenderPartNames=false;osmd.EngravingRules.RenderPartAbbreviations=false;osmd.EngravingRules.SnapStafflinesToCrispPixels=true;osmd.EngravingRules.StaffLineWidth=.10;osmd.EngravingRules.FixedMeasureWidth=true;osmd.EngravingRules.FixedMeasureWidthFixedValue=24;osmd.EngravingRules.FixedMeasureWidthUseForPickupMeasures=true;osmd.Zoom=2.55;
const xml=`<?xml version="1.0" encoding="UTF-8"?><score-partwise version="4.0"><part-list><score-part id="P1"><part-name></part-name></score-part></part-list><part id="P1"><measure number="1" implicit="yes"><attributes><divisions>1</divisions><key><fifths>0</fifths></key><clef><sign>G</sign><line>2</line></clef></attributes><note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note><barline location="right"><bar-style>none</bar-style></barline></measure></part></score-partwise>`;
await osmd.load(xml);osmd.Zoom=2.55;osmd.render();window.ready=true;
})();
</script></body></html>
