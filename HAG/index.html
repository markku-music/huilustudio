<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H–A–G-korttipeli 2.4.1</title>
<style>
:root{
  font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
  color:#19304a; background:#dceff5;
  --ink:#19304a; --paper:#fffaf0; --blue:#4ca8c8; --green:#69b98b;
  --yellow:#f4c85d; --red:#e66f66; --shadow:0 18px 50px rgba(35,74,92,.18);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;overflow-x:hidden;background:#d8e2e8;}
#seasonBackground{position:fixed;inset:0;z-index:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#seasonBackground.is-visible{opacity:1}
#seasonShade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(19,31,38,.14));pointer-events:none}
.app{position:relative;z-index:2;min-height:100vh}
button{font:inherit}
.app{width:min(920px,100%);min-height:100vh;margin:auto;padding:0 clamp(16px,4vw,40px) 30px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:18px;background:var(--paper);box-shadow:0 8px 22px rgba(35,74,92,.14);display:grid;place-items:center;font-size:28px;transform:rotate(-3deg)}
h1{font-size:clamp(23px,4vw,34px);line-height:1;margin:0}.subtitle{margin:5px 0 0;color:#547184;font-weight:650}
.status-pill{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.72);font-weight:800;font-size:14px;white-space:nowrap}
.status-pill.live{background:#d9f4df;color:#257147}.status-pill.error{background:#ffe0dc;color:#9b3028}
.game{flex:1;display:grid;place-items:center;padding:20px 0 12px}
.stage{width:min(820px,100%);display:grid;justify-items:center;gap:18px}
.card-wrap{perspective:900px;width:min(126mm,88vw);aspect-ratio:63/88}
.card{--hold-progress:0%;width:100%;height:100%;position:relative;border-radius:48px;background:var(--paper);box-shadow:var(--shadow),inset 0 0 0 7px #fff,inset 0 0 0 10px #e4b75c;display:grid;place-items:center;overflow:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
.card-progress{position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;background:conic-gradient(from -90deg,var(--green) 0 var(--hold-progress),transparent var(--hold-progress) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:12px;opacity:.98;transition:background .045s linear,filter .12s ease}
.card-progress.complete{filter:brightness(1.18)}
.card.gold-flash .card-progress{background:conic-gradient(from -90deg,#f4c85d 0 100%);filter:brightness(1.2)}
.card:before{content:"";position:absolute;inset:38px;border:2px dashed rgba(76,168,200,.42);border-radius:24px}
.card:after{content:"♪";position:absolute;right:44px;bottom:34px;font-size:76px;color:rgba(76,168,200,.25);transform:rotate(-12deg)}
.card.flip{animation:flip .42s ease}.card.correct{animation:success .5s ease}
.note{font-size:clamp(230px,42vw,410px);font-weight:950;letter-spacing:-.08em;color:var(--ink);text-shadow:0 7px 0 rgba(76,168,200,.18);transform:translateX(-.04em);z-index:1}
.card-corner{position:absolute;top:38px;left:44px;font-weight:950;font-size:44px;color:var(--blue)}

.progress{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 2px rgba(25,48,74,.18);transition:.25s transform,.25s background}.dot.done{background:var(--green);box-shadow:none;transform:scale(1.13)}.dot.current{background:var(--yellow);box-shadow:none;transform:scale(1.28)}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:13px 20px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(35,74,92,.15);transition:.15s transform,.15s filter}.btn:hover{filter:brightness(1.03)}.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--blue);color:white}.btn.secondary{background:rgba(255,255,255,.86);color:var(--ink)}
.finish{display:none;text-align:center;background:rgba(255,250,240,.96);border-radius:28px;padding:30px;box-shadow:var(--shadow);width:min(520px,92vw)}
.finish.show{display:block}.finish h2{font-size:clamp(34px,7vw,54px);margin:0 0 8px}.finish p{font-size:20px;margin:0 0 22px;color:#547184;font-weight:700}
.spark{position:fixed;pointer-events:none;font-size:30px;animation:spark .9s ease-out forwards;z-index:20}
@keyframes flip{0%{transform:rotateY(0) scale(1)}48%{transform:rotateY(88deg) scale(.96)}52%{transform:rotateY(-88deg) scale(.96)}100%{transform:rotateY(0) scale(1)}}
@keyframes success{0%,100%{transform:scale(1)}40%{transform:scale(1.045) rotate(-1deg);box-shadow:0 22px 58px rgba(50,144,94,.28)}}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.25) rotate(220deg)}}

.school-year-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.school-year-controls label{font-size:13px;font-weight:800;color:#547184}
.school-year-select{border:1px solid #bfd4df;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:850;padding:7px 30px 7px 10px}
.leaderboard-summary{display:none}

@media(max-width:620px){.app{padding-top:0}.subtitle{display:none}.logo{width:46px;height:46px}.status-pill{font-size:12px;padding:7px 10px}.game{padding-top:12px}.stage{gap:13px}.card-wrap{width:min(126mm,90vw)}}

.start-screen{width:min(620px,94vw);background:rgba(255,250,240,.97);border-radius:30px;padding:30px;box-shadow:var(--shadow);text-align:center}
.start-screen h2{font-size:clamp(30px,6vw,48px);margin:0 0 8px}.start-screen p{margin:0 0 20px;color:#547184;font-weight:700}
.name-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:nowrap}.name-row .btn{margin:0;white-space:nowrap}.name-input{width:min(330px,100%);min-width:0;border:3px solid rgba(76,168,200,.35);border-radius:16px;padding:13px 16px;font:inherit;font-weight:850;font-size:18px;color:var(--ink);background:white;outline:none}.name-input:focus{border-color:var(--blue)}
.name-help{min-height:24px;margin:12px 0 16px!important;font-size:14px}.name-help.error{color:#9b3028}.name-help.live{color:#257147}
.score-card{margin:18px auto 0;padding:16px;border-radius:20px;background:#eef8fb;max-width:420px}.score-big{font-size:40px;font-weight:950;color:var(--ink);font-variant-numeric:tabular-nums}.score-meta{font-weight:800;color:#547184}
.leaderboard{margin-top:22px;text-align:left;background:white;border-radius:20px;padding:16px;box-shadow:inset 0 0 0 2px rgba(76,168,200,.12)}.period-tabs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:0 0 12px}.period-tab{border:0;border-radius:999px;padding:8px 12px;background:#e8f2f5;color:var(--ink);font-weight:850;cursor:pointer}.period-tab.active{background:var(--blue);color:white}.period-info{text-align:center;color:#648090;font-size:12px;font-weight:750;margin:-4px 0 10px}.leaderboard h3{margin:0 0 10px;text-align:center}.leaderboard ol{margin:0;padding-left:30px}.leaderboard li{padding:5px 4px;font-weight:800}.leaderboard .row{display:flex;justify-content:space-between;gap:16px}.leaderboard .time-value{font-variant-numeric:tabular-nums;white-space:nowrap}.leaderboard-status{text-align:center;color:#648090;font-size:14px;font-weight:700}
.player-pill{display:none;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.82);font-weight:850;font-size:14px}.player-pill.show{display:block}
.result-celebration{display:none;margin:18px auto 4px;max-width:360px}.result-celebration.show{display:block}.result-celebration img{display:block;width:100%;max-height:430px;object-fit:contain;border-radius:22px;background:white}.result-banner{font-size:38px;font-weight:950;color:var(--ink);margin:8px 0 10px;line-height:1.04;white-space:nowrap;width:100%;max-width:100%;overflow:visible}.medal-note{margin-top:8px;font-size:13px;font-weight:800;color:#7a6330}.profile-card{display:none;background:#f7fbfc;border-radius:16px;padding:14px}.profile-card.show{display:block}.profile-card h4{margin:0 0 10px;text-align:center}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.profile-stat{background:white;border-radius:13px;padding:10px;text-align:center}.profile-stat strong{display:block;font-size:22px}.profile-stat span{font-size:12px;color:#648090;font-weight:750}.leaderboard .medal{margin-left:6px}.leaderboard .own-row{background:#fff3c4;border-radius:8px;padding-left:5px;padding-right:5px}

.school-year-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.school-year-controls label{font-size:13px;font-weight:800;color:#547184}
.school-year-select{border:1px solid #bfd4df;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:850;padding:7px 30px 7px 10px}
.leaderboard-summary{display:none}

@media(max-width:620px){.start-screen{padding:23px 18px}.name-row{align-items:stretch;gap:7px}.name-input{width:auto;flex:1}.name-row .btn{flex:0 0 auto;padding-left:16px;padding-right:16px}.leaderboard{padding:14px}.player-pill{font-size:12px;padding:7px 10px}.period-tab{padding:7px 9px;font-size:12px}}

.admin-entry{
  position:fixed;right:14px;bottom:14px;z-index:30;
  width:40px;height:40px;border:0;border-radius:50%;
  background:rgba(255,255,255,.78);color:var(--ink);
  font-size:19px;cursor:pointer;box-shadow:0 6px 18px rgba(25,48,74,.18);
  backdrop-filter:blur(8px)
}
.admin-entry:active{transform:translateY(1px)}
.admin-modal{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;
  padding:18px;background:rgba(17,29,39,.52);backdrop-filter:blur(6px)
}
.admin-modal.show{display:grid}
.admin-panel{
  width:min(560px,96vw);max-height:90vh;overflow:auto;
  background:rgba(255,250,240,.99);border-radius:25px;padding:24px;
  box-shadow:0 24px 70px rgba(9,24,34,.35);text-align:left
}
.admin-panel h2{margin:0 0 14px;text-align:center}
.admin-panel h3{margin:22px 0 10px}
.admin-grid{display:grid;gap:10px}
.admin-row{display:flex;gap:9px;align-items:center}
.admin-row>*{min-width:0}
.admin-input,.admin-select{
  width:100%;border:2px solid #bfd4df;border-radius:13px;
  background:#fff;color:var(--ink);font:inherit;font-weight:750;
  padding:11px 13px
}
.admin-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.admin-danger{background:#bd423a;color:white}
.admin-muted{font-size:13px;color:#648090;font-weight:700}
.admin-status{min-height:22px;margin-top:10px;font-size:14px;font-weight:800}
.admin-status.error{color:#9b3028}
.admin-status.ok{color:#257147}
.admin-divider{height:1px;background:#d8e4e9;margin:20px 0}
.admin-player-card{
  background:#fff;border-radius:15px;padding:13px;
  box-shadow:inset 0 0 0 1px #d7e5ea
}
.admin-player-card strong{display:block;font-size:18px}
.admin-hidden{display:none!important}
@media(max-width:620px){
  .admin-panel{padding:19px}
  .admin-row{align-items:stretch;flex-direction:column}
  .admin-actions .btn{flex:1}
}

</style>
</head>
<body>
<div id="seasonBackground" aria-hidden="true"></div>
<div id="seasonShade" aria-hidden="true"></div>

<button id="adminEntry" class="admin-entry" type="button" aria-label="Avaa ylläpito">⚙</button>

<div id="adminModal" class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <section class="admin-panel">
    <h2 id="adminTitle">Ylläpito</h2>

    <div id="adminLoginView">
      <div class="admin-grid">
        <label>
          <span class="admin-muted">Sähköposti</span>
          <input id="adminEmail" class="admin-input" type="email" autocomplete="username">
        </label>
        <label>
          <span class="admin-muted">Salasana</span>
          <input id="adminPassword" class="admin-input" type="password" autocomplete="current-password">
        </label>
      </div>
      <div class="admin-actions">
        <button id="adminCloseLogin" class="btn secondary" type="button">Sulje</button>
        <button id="adminLogin" class="btn primary" type="button">Kirjaudu</button>
      </div>
    </div>

    <div id="adminToolsView" class="admin-hidden">
      <div class="admin-muted">Kirjautuneena: <span id="adminSignedInEmail"></span></div>

      <h3>Poista pelaaja</h3>
      <div class="admin-row">
        <select id="adminPlayerSelect" class="admin-select" aria-label="Valitse pelaaja"></select>
        <button id="adminRefreshPlayers" class="btn secondary" type="button">Päivitä</button>
      </div>
      <div id="adminPlayerInfo" class="admin-player-card admin-hidden"></div>

      <div class="admin-actions">
        <button id="adminDeletePlayerYear" class="btn admin-danger" type="button">Poista lukuvuodelta</button>
        <button id="adminDeletePlayerAll" class="btn admin-danger" type="button">Poista kaikki pelaajalta</button>
      </div>

      <div class="admin-divider"></div>

      <h3>Nollaa lukuvuosi</h3>
      <p class="admin-muted">
        Poistaa kaikki nykyisen lukuvuoden HAG-aikatulokset. Vanhemmat lukuvuodet säilyvät.
      </p>
      <button id="adminResetYear" class="btn admin-danger" type="button">Nollaa <span id="adminCurrentYear"></span></button>

      <div id="adminStatus" class="admin-status" aria-live="polite"></div>

      <div class="admin-actions">
        <button id="adminLogout" class="btn secondary" type="button">Kirjaudu ulos</button>
        <button id="adminCloseTools" class="btn primary" type="button">Sulje</button>
      </div>
    </div>
  </section>
</div>

<div class="app">
<div id="playerPill" hidden></div>
<div id="status" hidden>Mikrofoni ei ole päällä</div>

<main class="game">

  <section id="startView" class="start-screen">
    <h2>Soita H, A tai G</h2>
    <div class="name-row">
      <input id="playerName" class="name-input" type="text" maxlength="20" autocomplete="off" placeholder="Nimi" aria-label="Nimi">
      <button id="startButton" class="btn primary">Aloita</button>
    </div>
    <div class="leaderboard">
      <h3>Lukuvuoden TOP 10</h3>
      <div class="school-year-controls">
        <select id="startSchoolYear" class="school-year-select" aria-label="Valitse lukuvuosi"></select>
      </div>
      <div id="startLeaderboardSummary" class="leaderboard-summary"></div>
      <div id="startLeaderboardStatus" class="leaderboard-status">Haetaan tuloksia…</div>
      <ol id="startLeaderboard"></ol>
    </div>
  </section>
  <section id="playView" class="stage" style="display:none">
    <div class="card-wrap"><div id="card" class="card" role="progressbar" aria-label="Sävelen tarvittava pituus" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="cardProgress" class="card-progress"></div><div id="corner" class="card-corner">1/4</div><div id="note" class="note">H</div></div></div>
    <div id="progress" class="progress" aria-label="Edistyminen"></div>
  </section>

  <section id="finishView" class="finish">
    <div id="resultCelebration" class="result-celebration">
      <div id="resultBanner" class="result-banner"></div>
      <img id="resultImage" alt="Pelin tuloskuva">
    </div>
    <div class="score-card">
      <div id="scoreValue" class="score-big">0,00 s</div>
      <div id="scoreMeta" class="score-meta"></div>
      <div id="saveStatus" class="leaderboard-status"></div>
    </div>
    <div class="leaderboard">
      <h3>Lukuvuoden TOP 10</h3>
      <div class="school-year-controls">
        <select id="finishSchoolYear" class="school-year-select" aria-label="Valitse lukuvuosi"></select>
      </div>
      <div id="finishLeaderboardSummary" class="leaderboard-summary"></div>
      <div id="finishLeaderboardStatus" class="leaderboard-status">Haetaan tuloksia…</div>
      <ol id="finishLeaderboard"></ol>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
      <button id="againButton" class="btn primary">Pelaa uusi kierros</button>
      <button id="changePlayerButton" class="btn secondary">Vaihda pelaajaa</button>
    </div>
  </section>
</main>
</div>

  getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp,
  getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.0/firebase-auth.js";

const firebaseConfig = {

const GAME_ID = "hag-korttipeli-aika-v1";
const listeners = new Set();
let rawScores = [];
function storageGet(key){try{return window.localStorage.getItem(key)}catch(_){return null}}
function storageSet(key,value){try{window.localStorage.setItem(key,value);return true}catch(_){return false}}
let db = null;
let auth = null;
let firebaseApp = null;

function dateFromValue(value){
  if(!value) return null;
  if(typeof value.toDate === 'function') return value.toDate();
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}
function normalizeRows(rows){
  return rows.map(row=>({
    name:String(row.playerName || '').trim(),
    score:Number(row.score || 0),
    perfect:row.perfect === true,
    createdAt:dateFromValue(row.createdAt)
  })).filter(row=>row.name && Number.isFinite(row.score));
}
function broadcast(){ for(const fn of listeners) fn(rawScores); }
function subscribe(fn){ listeners.add(fn); fn(rawScores); return ()=>listeners.delete(fn); }
function pendingKey(){ return 'hag-pending-times-v1'; }
function getPending(){ try{return JSON.parse(storageGet(pendingKey())||'[]')}catch{return []} }
function setPending(items){ storageSet(pendingKey(),JSON.stringify(items)); }
async function flushPending(){
  if(!db) return;
  const pending=getPending(); if(!pending.length) return;
  const remaining=[];
  for(const item of pending){
    try{await addDoc(collection(db,'scores'),{...item,createdAt:serverTimestamp()});}
    catch{remaining.push(item)}
  }
  setPending(remaining);
}
async function saveScore(playerName,score,durationSeconds,perfect){
  const payload={playerName:String(playerName).trim().slice(0,20),score:Math.round(score),gameId:GAME_ID,durationSeconds:Math.round(durationSeconds),perfect:perfect===true};
  const firestorePayload={playerName:payload.playerName,score:payload.score,gameId:GAME_ID,perfect:payload.perfect,createdAt:serverTimestamp()};
  if(!db){setPending([...getPending(),{playerName:payload.playerName,score:payload.score,gameId:GAME_ID,perfect:payload.perfect}]);throw new Error('offline');}
  try{await addDoc(collection(db,'scores'),firestorePayload);return true;}
  catch(err){setPending([...getPending(),{playerName:payload.playerName,score:payload.score,gameId:GAME_ID,perfect:payload.perfect}]);throw err;}
}
try{
  firebaseApp=initializeApp(firebaseConfig);
  db=getFirestore(firebaseApp);
  auth=getAuth(firebaseApp);
  const q=query(collection(db,'scores'),where('gameId','==',GAME_ID));
  onSnapshot(q,snap=>{rawScores=normalizeRows(snap.docs.map(d=>d.data()));broadcast();flushPending();},()=>{broadcast();});
  flushPending();
}catch(err){console.warn('Firebase ei käynnistynyt:',err);}

function schoolYearForDate(date=new Date()){
  const year=date.getFullYear();
  return date.getMonth()>=7 ? `${year}-${year+1}` : `${year-1}-${year}`;
}
function isInSchoolYear(date,schoolYear){
  if(!(date instanceof Date)||Number.isNaN(date.getTime())) return false;
  const startYear=Number(String(schoolYear).split('-')[0]);
  if(!Number.isFinite(startYear)) return false;
  const start=new Date(startYear,7,1,0,0,0,0);
  const end=new Date(startYear+1,7,1,0,0,0,0);
  return date>=start&&date<end;
}
async function fetchGameDocuments(){
  if(!db) throw new Error('Firebase ei ole valmis.');
  const snap=await getDocs(query(collection(db,'scores'),where('gameId','==',GAME_ID)));
  return snap.docs.map(item=>({
    ref:item.ref,
    id:item.id,
    data:item.data(),
    createdAt:dateFromValue(item.data().createdAt)
  }));
}
async function deleteReferences(refs){
  const chunks=[];
  for(let i=0;i<refs.length;i+=450) chunks.push(refs.slice(i,i+450));
  for(const chunk of chunks){
    const batch=writeBatch(db);
    chunk.forEach(ref=>batch.delete(ref));
    await batch.commit();
  }
  return refs.length;
}
async function deletePlayer(playerName,{schoolYear=null}={}){
  const target=String(playerName||'').trim().toLocaleLowerCase('fi-FI');
  if(!target) throw new Error('Valitse pelaaja.');
  const docs=await fetchGameDocuments();
  const refs=docs.filter(item=>{
    const sameName=String(item.data.playerName||'').trim().toLocaleLowerCase('fi-FI')===target;
    return sameName&&(!schoolYear||isInSchoolYear(item.createdAt,schoolYear));
  }).map(item=>item.ref);
  return deleteReferences(refs);
}
async function resetSchoolYear(schoolYear){
  const docs=await fetchGameDocuments();
  const refs=docs.filter(item=>isInSchoolYear(item.createdAt,schoolYear)).map(item=>item.ref);
  return deleteReferences(refs);
}
async function getAdminPlayers(){
  const docs=await fetchGameDocuments();
  const map=new Map();
  for(const item of docs){
    const name=String(item.data.playerName||'').trim();
    if(!name) continue;
    const key=name.toLocaleLowerCase('fi-FI');
    const current=map.get(key)||{name,count:0,best:null,years:new Set()};
    current.count++;
    const score=Number(item.data.score);
    if(Number.isFinite(score)&&(current.best===null||score<current.best)) current.best=score;
    if(item.createdAt) current.years.add(schoolYearForDate(item.createdAt));
    map.set(key,current);
  }
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'fi-FI'));
}
async function adminLogin(email,password){
  if(!auth) throw new Error('Firebase Authentication ei ole valmis.');
  return signInWithEmailAndPassword(auth,String(email||'').trim(),String(password||''));
}
async function adminLogout(){
  if(auth) await signOut(auth);
}
function subscribeAdminAuth(callback){
  if(!auth){ callback(null); return ()=>{}; }
  return onAuthStateChanged(auth,callback);
}

window.HAGFirebase={saveScore,subscribe,getScores:()=>rawScores};
window.HAGAdmin={
  login:adminLogin,
  logout:adminLogout,
  subscribeAuth:subscribeAdminAuth,
  getPlayers:getAdminPlayers,
  deletePlayer,
  resetSchoolYear,
  currentSchoolYear:()=>schoolYearForDate(new Date())
};
window.dispatchEvent(new Event('hag-firebase-ready'));
</script>
<script>
(() => {
  'use strict';
  const safeStorage = {
    get(key){ try { return window.localStorage.getItem(key); } catch (_) { return null; } },
    set(key,value){ try { window.localStorage.setItem(key,value); return true; } catch (_) { return false; } }
  };
  const M = window.NuottikompassiMicrophoneEngine;
  const $ = id => document.getElementById(id);
  const NOTES = ['H','A','G'];
  const PITCH_CLASS = {11:'H', 9:'A', 7:'G'};
  const HOLD_MS = 230;
  const RELEASE_MS = 150;
  const HISTORY_KEY = 'hag-korttipeli-edellinen-kierros';

  let sequence = [];
  let index = 0;
  let holdStart = 0;
  let heldTarget = null;
  let accepting = true;
  let releaseStart = 0;
  let perfectRun = true;
  let completed = false;
  let playerName = '';
  let roundStartedAt = 0;
  let lastScore = 0;
  let allScores = [];
  let selectedSchoolYear = '';

  const settings = {...M.DEFAULTS, referenceEnabled:false, liveReferenceEnabled:false};
  const engine = new M.MicrophoneEngine(settings, onEngineUpdate);

  function makeSequence(){
    // Edellinen kierros säilyy selaimen localStoragessa myös sivun latauksen yli.
    const previousSequence = window.RandomEngine.HistoryStore.load(HISTORY_KEY);
    const result = window.RandomEngine.generate({
      items: NOTES,
      length: 8,
      maxConsecutive: 2,
      maxDifferentRepeatedRuns: 1,
      requireAll: true,
      previousSequence,
      avoidSameSequence: true,
      rotateDistribution: true
    });
    window.RandomEngine.HistoryStore.save(HISTORY_KEY, result.sequence);
    return result.sequence;
  }

  function newRound(){
    sequence = makeSequence(); index = 0; completed = false; perfectRun = true;
    // Ajanotto käynnistyy vasta ensimmäisen oikean sävelen vastaanotosta.
    roundStartedAt = 0;
    holdStart = 0; heldTarget = null; accepting = true; releaseStart = 0;
    setHoldProgress(0);
    $('finishView').classList.remove('show'); $('resultCelebration').classList.remove('show'); $('startView').style.display='none'; $('playView').style.display='grid';
    renderProgress(); showCard(false);
  }

  function setHoldProgress(percent, state=''){
    const value=Math.max(0,Math.min(100,Number(percent)||0));
    const card=$('card');
    const ring=$('cardProgress');
    card.style.setProperty('--hold-progress',value+'%');
    card.setAttribute('aria-valuenow',String(Math.round(value)));
    ring.className='card-progress'+(state?' '+state:'');
  }

  function renderProgress(){
    $('progress').innerHTML='';
    sequence.forEach((_,i)=>{const d=document.createElement('span');d.className='dot '+(i<index?'done':i===index?'current':'');$('progress').appendChild(d);});
  }

  function showCard(animate=true){
    $('note').textContent=sequence[index]; $('corner').textContent=`${index+1}/${sequence.length}`;
    if(animate){$('card').classList.remove('flip');void $('card').offsetWidth;$('card').classList.add('flip');}
    renderProgress();
  }

  function currentTarget(){return sequence[index];}

  function statusLabel(output){
    if(output.status==='error') return output.error || 'Mikrofonivirhe';
    if(!output.running) return 'Mikrofoni ei ole päällä';
    if(output.status==='opening') return 'Avataan mikrofonia…';
    if(output.status==='waiting'||output.status==='holding') return 'Mikrofoni kuuntelee';
    if(output.status==='unstable'||String(output.status).startsWith('confirming')) return 'Kuunnellaan tarkasti…';
    return 'Mikrofoni päällä';
  }

  function onEngineUpdate(output){
    $('status').textContent=statusLabel(output);
    $('status').className='status-pill'+(output.status==='error'?' error':output.running?' live':'');
    if(completed) return;


    if(output.status==='signal'){
      releaseStart=0;
      if(!accepting){ return; }
      const played=PITCH_CLASS[output.pitchClass];
      if(played===currentTarget()){
        const now=performance.now();
        if(!roundStartedAt) roundStartedAt=now;
        if(heldTarget!==played){heldTarget=played;holdStart=now;}
        const elapsed=now-holdStart;
        const progress=Math.min(100,(elapsed/HOLD_MS)*100);
        setHoldProgress(progress,progress>=100?'complete':'');
        if(elapsed>=HOLD_MS) acceptCorrect();
      }else{
        heldTarget=null;holdStart=0;
        setHoldProgress(0);
        if(played) perfectRun=false;
      }
    }else{
      heldTarget=null;holdStart=0;
      setHoldProgress(0);
      if(!accepting){
        if(!releaseStart) releaseStart=performance.now();
        if(performance.now()-releaseStart>=RELEASE_MS){accepting=true;releaseStart=0;}
      }
    }
  }

  function acceptCorrect(){
    accepting=false; holdStart=0; heldTarget=null;
    setHoldProgress(100,'complete');
    $('card').classList.remove('correct','gold-flash');void $('card').offsetWidth;$('card').classList.add('correct','gold-flash');
    sparks();
    setTimeout(()=>{
      $('card').classList.remove('gold-flash');
      index++;
      setHoldProgress(0);
      if(index>=sequence.length) finish(); else showCard(true);
    },140);
  }

  async function finish(){
    completed=true; renderProgress();
    const effectiveStart=roundStartedAt||performance.now();
    const durationMilliseconds=Math.max(0,performance.now()-effectiveStart);
    const duration=durationMilliseconds/1000;
    lastScore=Math.max(1,Math.round(durationMilliseconds/10));
    const achievement=achievementForScore(lastScore,allScores);
    $('playView').style.display='none'; $('finishView').classList.add('show');
    $('scoreValue').textContent=formatTimeFromCentiseconds(lastScore,true)+(perfectRun?'  🏅':'');
    $('scoreMeta').textContent='';
    showResultImage(achievement);
    $('saveStatus').textContent='';
    try{await waitForFirebase();await window.HAGFirebase.saveScore(playerName,lastScore,duration,perfectRun);$('saveStatus').textContent='';}
    catch(_){$('saveStatus').textContent='Verkko ei vastannut. Tulos jonotettiin seuraavaa yhteyttä varten.';}
    for(let i=0;i<18;i++) setTimeout(sparks,i*55);
  }

  function sparks(){
    const r=$('card').getBoundingClientRect();
    for(let i=0;i<7;i++){
      const s=document.createElement('span');s.className='spark';s.textContent=['★','♪','●'][Math.floor(Math.random()*3)];
      s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';
      s.style.setProperty('--x',`${(Math.random()-.5)*260}px`);s.style.setProperty('--y',`${(Math.random()-.7)*230}px`);
      document.body.appendChild(s);setTimeout(()=>s.remove(),950);
    }
  }

  function waitForFirebase(){
    if(window.HAGFirebase)return Promise.resolve();
    return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('Firebase timeout')),5000);window.addEventListener('hag-firebase-ready',()=>{clearTimeout(t);resolve();},{once:true});});
  }
  function formatTimeFromCentiseconds(value, includeSecondsUnit=false){
    const totalCentiseconds=Math.max(0,Math.round(Number(value)||0));
    const minutes=Math.floor(totalCentiseconds/6000);
    const seconds=Math.floor((totalCentiseconds%6000)/100);
    const centiseconds=totalCentiseconds%100;
    if(minutes>0){
      return `${minutes}:${String(seconds).padStart(2,'0')},${String(centiseconds).padStart(2,'0')}`;
    }
    return `${seconds},${String(centiseconds).padStart(2,'0')}${includeSecondsUnit?' s':''}`;
  }

  function startOfWeek(date=new Date()){
    const d=new Date(date); d.setHours(0,0,0,0);
    const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d;
  }
  function schoolYearKey(date=new Date()){
    const year=date.getFullYear();
    const startYear=date.getMonth()>=7?year:year-1;
    return `${startYear}-${startYear+1}`;
  }
  function schoolYearRange(key){
    const match=String(key||'').match(/^(\d{4})-(\d{4})$/);
    const startYear=match?Number(match[1]):Number(schoolYearKey().slice(0,4));
    return {start:new Date(startYear,7,1),end:new Date(startYear+1,7,1)};
  }
  function scoresInSchoolYear(scores,key){
    const {start,end}=schoolYearRange(key);
    return scores.filter(item=>item.createdAt&&item.createdAt>=start&&item.createdAt<end);
  }
  function availableSchoolYears(scores){
    const years=new Set([schoolYearKey()]);
    scores.forEach(item=>{if(item.createdAt)years.add(schoolYearKey(item.createdAt));});
    return [...years].sort((a,b)=>Number(b.slice(0,4))-Number(a.slice(0,4)));
  }
  function periodItems(scores,period){
    const now=new Date();
    if(period==='week'){
      const start=startOfWeek(now),end=new Date(start);end.setDate(end.getDate()+7);
      return scores.filter(item=>item.createdAt&&item.createdAt>=start&&item.createdAt<end);
    }
    if(period==='schoolYear') return scoresInSchoolYear(scores,schoolYearKey(now));
    return scores;
  }
  function bestPerPlayerFromItems(items){
    const best=new Map();
    items.forEach(item=>{
      const key=item.name.toLocaleLowerCase('fi-FI');
      if(!best.has(key)||item.score<best.get(key).score) best.set(key,item);
    });
    return [...best.values()].sort((a,b)=>a.score-b.score||a.name.localeCompare(b.name,'fi-FI'));
  }
  function bestPerPlayer(scores,period){return bestPerPlayerFromItems(periodItems(scores,period));}
  function bestForSchoolYear(scores,key){return bestPerPlayerFromItems(scoresInSchoolYear(scores,key));}
  function playerRankForSchoolYear(scores,key,name){
    const list=bestForSchoolYear(scores,key),needle=String(name||'').toLocaleLowerCase('fi-FI');
    const index=list.findIndex(item=>item.name.toLocaleLowerCase('fi-FI')===needle);
    return index<0?null:{rank:index+1,total:list.length,score:list[index].score};
  }
  function topScore(scores,period){const list=bestPerPlayer(scores,period);return list.length?list[0].score:null;}
  function achievementForScore(score,scores){
    const all=topScore(scores,'all'),schoolYear=topScore(scores,'schoolYear'),week=topScore(scores,'week');
    if(all===null||score<all) return 'all';
    if(schoolYear===null||score<schoolYear) return 'schoolYear';
    if(week===null||score<week) return 'week';
    return 'encourage';
  }
  function fitResultBanner(){
    const banner=$('resultBanner');
    if(!banner||!banner.textContent)return;
    const maxSize=38,minSize=15;
    banner.style.fontSize=maxSize+'px';
    let size=maxSize;
    while(size>minSize&&banner.scrollWidth>banner.clientWidth){
      size-=0.5;
      banner.style.fontSize=size+'px';
    }
  }
  function showResultImage(type){
    const box=$('resultCelebration'),image=$('resultImage'),banner=$('resultBanner');
    box.classList.add('show');
    if(type==='all'){
      image.src='tytto_7v_hyva_tulos.png';banner.textContent='UUSI KAIKKIEN AIKOJEN ENNÄTYS!';
    }else if(type==='schoolYear'){
      image.src='tytto_7v_hyva_tulos.png';banner.textContent='LUKUVUODEN PARAS TULOS!';
    }else if(type==='week'){
      image.src='tytto_7v_hyva_tulos.png';banner.textContent='VIIKON PARAS TULOS!';
    }else{
      image.src='tytto_7v_kannustava.png';banner.textContent=perfectRun?'VIRHEETÖN KIERROS!':'HIENO SUORITUS!';
    }
    requestAnimationFrame(fitResultBanner);
  }
  window.addEventListener('resize',()=>requestAnimationFrame(fitResultBanner));
  function populateSchoolYearSelect(selectId,years){
    const select=$(selectId);
    const previous=selectedSchoolYear;
    select.innerHTML='';
    years.forEach(year=>{const option=document.createElement('option');option.value=year;option.textContent=year;select.appendChild(option);});
    selectedSchoolYear=years.includes(previous)?previous:years[0];
    select.value=selectedSchoolYear;
  }
  function renderLeaderboard(listId,statusId,summaryId,scores){
    const list=$(listId),status=$(statusId),summary=$(summaryId);
    list.innerHTML='';
    const yearScores=scoresInSchoolYear(scores,selectedSchoolYear);
    const ranking=bestForSchoolYear(scores,selectedSchoolYear);
    const visible=ranking.slice(0,10);
    const players=ranking.length;
    const games=yearScores.length;
    summary.textContent=`${players} ${players===1?'pelaaja':'pelaajaa'} • ${games} ${games===1?'peli':'peliä'}`;
    if(!visible.length){status.textContent='Tällä lukuvuodella ei ole vielä tuloksia.';return;}
    status.textContent='';
    const ownName=cleanName(playerName||$('playerName').value);
    const ownKey=ownName.toLocaleLowerCase('fi-FI');
    visible.forEach(item=>{
      const li=document.createElement('li');
      if(ownKey&&item.name.toLocaleLowerCase('fi-FI')===ownKey)li.classList.add('own-row');
      const row=document.createElement('span');row.className='row';
      const name=document.createElement('span');name.textContent=item.name+(item.perfect?' 🏅':'');
      const score=document.createElement('span');score.className='time-value';score.textContent=formatTimeFromCentiseconds(item.score,false);
      row.append(name,score);li.appendChild(row);list.appendChild(li);
    });
    const rank=ownKey?playerRankForSchoolYear(scores,selectedSchoolYear,ownName):null;
    if(rank&&rank.rank>10)status.textContent=`Oma sijoituksesi: #${rank.rank} / ${rank.total} • ${formatTimeFromCentiseconds(rank.score,false)}`;
  }
  function renderAllLeaderboards(){
    const years=availableSchoolYears(allScores);
    populateSchoolYearSelect('startSchoolYear',years);
    populateSchoolYearSelect('finishSchoolYear',years);
    renderLeaderboard('startLeaderboard','startLeaderboardStatus','startLeaderboardSummary',allScores);
    renderLeaderboard('finishLeaderboard','finishLeaderboardStatus','finishLeaderboardSummary',allScores);
  }
  function connectLeaderboards(){
    const connect=()=>window.HAGFirebase.subscribe(scores=>{allScores=scores;renderAllLeaderboards();});
    if(window.HAGFirebase)connect();else window.addEventListener('hag-firebase-ready',connect,{once:true});
  }
  function cleanName(value){return String(value||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,20);}
  async function startGame(){
    const name=cleanName($('playerName').value);
    if(!name){$('nameHelp').textContent='Kirjoita ensin nimi.';$('nameHelp').className='name-help error';$('playerName').focus();return;}
    playerName=name;
    safeStorage.set('hag-player-name',playerName);
    $('playerPill').textContent='Pelaaja: '+playerName;
    await engine.start();
    newRound();
  }
  function changePlayer(){engine.stop();completed=true;$('finishView').classList.remove('show');$('playView').style.display='none';$('startView').style.display='block';$('playerName').focus();}


  const seasonBackgrounds=Object.freeze({
    winter:'talvi.png',
    spring:'kevat.png',
    summer:'kesa.png',
    autumn:'syksy.png',
    christmas:'joulu.png'
  });
  let activeBackgroundPath='';
  let backgroundChangeToken=0;
  function automaticBackgroundPath(date=new Date()){
    const month=date.getMonth()+1;
    if(month===12)return seasonBackgrounds.christmas;
    if(month<=2)return seasonBackgrounds.winter;
    if(month<=5)return seasonBackgrounds.spring;
    if(month<=8)return seasonBackgrounds.summer;
    return seasonBackgrounds.autumn;
  }
  function applySeasonBackground(path,{testValue='auto',instant=false}={}){
    const layer=$('seasonBackground');
    if(!layer)return;
    const token=++backgroundChangeToken;
    const chosen=path||automaticBackgroundPath();
    if(chosen===activeBackgroundPath&&layer.classList.contains('is-visible'))return;
    const image=new Image();
    image.onload=()=>{
      if(token!==backgroundChangeToken)return;
      const show=()=>{
        if(token!==backgroundChangeToken)return;
        layer.style.backgroundImage=`url("${chosen}")`;
        activeBackgroundPath=chosen;
        requestAnimationFrame(()=>layer.classList.add('is-visible'));
      };
      if(instant||!activeBackgroundPath){show();return;}
      layer.classList.remove('is-visible');
      setTimeout(show,320);
    };
    image.onerror=()=>console.warn('Taustakuvaa ei voitu ladata:',chosen);
    image.src=chosen;
  }
  applySeasonBackground(automaticBackgroundPath(),{instant:true});

  $('againButton').addEventListener('click',newRound);
  $('changePlayerButton').addEventListener('click',changePlayer);
  $('startButton').addEventListener('click',startGame);
  $('playerName').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});
  $('playerName').addEventListener('input',renderAllLeaderboards);
  ['startSchoolYear','finishSchoolYear'].forEach(id=>$(id).addEventListener('change',e=>{selectedSchoolYear=e.target.value;safeStorage.set('hag-school-year',selectedSchoolYear);renderAllLeaderboards();}));
  window.addEventListener('beforeunload',()=>engine.stop());
  $('playerName').value=safeStorage.get('hag-player-name')||'';
  selectedSchoolYear=safeStorage.get('hag-school-year')||schoolYearKey();
  connectLeaderboards();
})();
</script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let currentPlayers = [];

  function setStatus(message,type=''){
    const node=$('adminStatus');
    node.textContent=message||'';
    node.className='admin-status'+(type?' '+type:'');
  }
  function openAdmin(){
    $('adminModal').classList.add('show');
  }
  function closeAdmin(){
    $('adminModal').classList.remove('show');
    setStatus('');
  }
  function showLogin(){
    $('adminLoginView').classList.remove('admin-hidden');
    $('adminToolsView').classList.add('admin-hidden');
  }
  function showTools(user){
    $('adminLoginView').classList.add('admin-hidden');
    $('adminToolsView').classList.remove('admin-hidden');
    $('adminSignedInEmail').textContent=user?.email||'ylläpitäjä';
    const year=window.HAGAdmin?.currentSchoolYear?.()||'';
    $('adminCurrentYear').textContent=year;
    refreshPlayers();
  }
  function formatAdminTime(value){
    const total=Math.max(0,Math.round(Number(value)||0));
    const minutes=Math.floor(total/6000);
    const seconds=Math.floor((total%6000)/100);
    const centiseconds=total%100;
    return minutes>0
      ? `${minutes}:${String(seconds).padStart(2,'0')},${String(centiseconds).padStart(2,'0')}`
      : `${seconds},${String(centiseconds).padStart(2,'0')} s`;
  }
  async function refreshPlayers(){
    if(!window.HAGAdmin) return;
    setStatus('Haetaan pelaajia…');
    try{
      currentPlayers=await window.HAGAdmin.getPlayers();
      const select=$('adminPlayerSelect');
      select.innerHTML='';
      const empty=document.createElement('option');
      empty.value='';
      empty.textContent=currentPlayers.length?'Valitse pelaaja':'Ei pelaajia';
      select.appendChild(empty);
      currentPlayers.forEach(player=>{
        const option=document.createElement('option');
        option.value=player.name;
        option.textContent=player.name;
        select.appendChild(option);
      });
      updatePlayerInfo();
      setStatus('');
    }catch(error){
      setStatus(error?.message||'Pelaajien haku epäonnistui.','error');
    }
  }
  function updatePlayerInfo(){
    const selected=$('adminPlayerSelect').value;
    const player=currentPlayers.find(item=>item.name===selected);
    const box=$('adminPlayerInfo');
    if(!player){
      box.classList.add('admin-hidden');
      box.textContent='';
      return;
    }
    box.classList.remove('admin-hidden');
    box.innerHTML='';
    const strong=document.createElement('strong');
    strong.textContent=player.name;
    const info=document.createElement('div');
    info.className='admin-muted';
    info.textContent=`Tuloksia ${player.count} • paras aika ${formatAdminTime(player.best)}`;
    box.append(strong,info);
  }
  async function login(){
    const email=$('adminEmail').value.trim();
    const password=$('adminPassword').value;
    if(!email||!password){
      setStatus('Kirjoita sähköposti ja salasana.','error');
      return;
    }
    $('adminLogin').disabled=true;
    setStatus('Kirjaudutaan…');
    try{
      await window.HAGAdmin.login(email,password);
      $('adminPassword').value='';
      setStatus('');
    }catch(error){
      setStatus('Kirjautuminen epäonnistui. Tarkista tunnukset.','error');
    }finally{
      $('adminLogin').disabled=false;
    }
  }
  async function removePlayer(allYears){
    const name=$('adminPlayerSelect').value;
    if(!name){setStatus('Valitse ensin pelaaja.','error');return;}
    const year=window.HAGAdmin.currentSchoolYear();
    const scopeText=allYears?'kaikki HAG-aikatulokset':`lukuvuoden ${year} tulokset`;
    const typed=prompt(`Poistetaan pelaajalta ${name} ${scopeText}.\n\nKirjoita vahvistukseksi pelaajan nimi:`);
    if(typed!==name){setStatus('Poisto peruutettu.','error');return;}
    setStatus('Poistetaan…');
    try{
      const count=await window.HAGAdmin.deletePlayer(name,{schoolYear:allYears?null:year});
      setStatus(count?`Poistettu ${count} tulosta.`:'Poistettavia tuloksia ei löytynyt.','ok');
      await refreshPlayers();
    }catch(error){
      setStatus(error?.message||'Poisto epäonnistui.','error');
    }
  }
  async function resetYear(){
    const year=window.HAGAdmin.currentSchoolYear();
    const typed=prompt(`Tämä poistaa kaikki lukuvuoden ${year} HAG-aikatulokset.\n\nKirjoita vahvistukseksi NOLLAA:`);
    if(typed!=='NOLLAA'){setStatus('Nollaus peruutettu.','error');return;}
    setStatus('Nollataan lukuvuotta…');
    try{
      const count=await window.HAGAdmin.resetSchoolYear(year);
      setStatus(count?`Lukuvuodelta poistettiin ${count} tulosta.`:'Lukuvuodella ei ollut poistettavia tuloksia.','ok');
      await refreshPlayers();
    }catch(error){
      setStatus(error?.message||'Nollaus epäonnistui.','error');
    }
  }
  function connectAuth(){
    const connect=()=>{
      window.HAGAdmin.subscribeAuth(user=>{
        if(user) showTools(user);
        else showLogin();
      });
    };
    if(window.HAGAdmin) connect();
    else window.addEventListener('hag-firebase-ready',connect,{once:true});
  }

  $('adminEntry').addEventListener('click',openAdmin);
  $('adminCloseLogin').addEventListener('click',closeAdmin);
  $('adminCloseTools').addEventListener('click',closeAdmin);
  $('adminModal').addEventListener('click',event=>{if(event.target===$('adminModal'))closeAdmin();});
  $('adminLogin').addEventListener('click',login);
  $('adminPassword').addEventListener('keydown',event=>{if(event.key==='Enter')login();});
  $('adminLogout').addEventListener('click',()=>window.HAGAdmin.logout());
  $('adminRefreshPlayers').addEventListener('click',refreshPlayers);
  $('adminPlayerSelect').addEventListener('change',updatePlayerInfo);
  $('adminDeletePlayerYear').addEventListener('click',()=>removePlayer(false));
  $('adminDeletePlayerAll').addEventListener('click',()=>removePlayer(true));
  $('adminResetYear').addEventListener('click',resetYear);
  connectAuth();
})();
</script>

</body>
</html>
