<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F0 ENGINE BASE 2.0 · PROFILE FAST 1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f3f5f7}
*{box-sizing:border-box}body{margin:0}main{width:min(900px,94vw);margin:auto;padding:24px 0 40px}
h1{margin:0;font-size:clamp(25px,4vw,38px)}.sub{color:#68727d;margin:7px 0 18px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
button,select{font:inherit;border-radius:11px;padding:10px 13px;border:1px solid #d5dbe0;background:white}
button{background:#17202a;color:white;border:0;font-weight:750;cursor:pointer}button.alt{background:#e7ebef;color:#17202a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dfe4e8;border-radius:18px;padding:15px}
.label{font-size:12px;color:#727b84}.big{font-size:34px;font-weight:800;margin-top:3px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#allowed{font-weight:700}.good{color:#087b45}.wait{color:#995d00}.muted{color:#68727d}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>PROFILE FAST 1</h1>
<div class="sub">BASE 2.0 + vapaaehtoinen nopea peliprofiili. YIN ja 6 arvon mediaani ovat ennallaan.</div>
<div class="toolbar">
  <select id="profileSelect">
    <option value="off">Ei profiilia · BASE 2.0</option>
    <option value="fluteBeginner5" selected>Huilu · g¹ a¹ h¹ c² d² · 2 framea</option>
  </select>
  <button id="start">Käynnistä</button>
  <button id="stop" class="alt" disabled>Lopeta</button>
  <span id="status" class="muted">Valmiina.</span>
</div>
<div class="card" style="margin-bottom:12px">
  <div class="label">Sallitut nopeat sävelet</div>
  <div id="allowed">g¹ · a¹ · h¹ · c² · d²</div>
</div>
<div class="grid">
  <div class="card"><div class="label">ULOSTULO</div><div class="big" id="outNote">–</div><div id="outHz" class="mono">– Hz</div></div>
  <div class="card"><div class="label">HETKELLINEN MEDIAANI</div><div class="big" id="detNote">–</div><div id="medianHz" class="mono">– Hz</div></div>
  <div class="card"><div class="label">RAAKA YIN</div><div class="big mono" id="rawHz">–</div></div>
  <div class="card"><div class="label">PROFILE FAST</div><div class="big" id="fastState">–</div><div id="fastDetail" class="mono muted">–</div></div>
</div>
</main>
<script src="profiles.js"></script>
<script src="f0-engine.js"></script>
<script>
'use strict';
const engine = new F0Engine({ profile: F0_PROFILES.fluteBeginner5 });
const $ = id => document.getElementById(id);
const noteName = midi => {
  if (!Number.isFinite(midi)) return '–';
  const hz = 440*Math.pow(2,(midi-69)/12);
  return F0Engine.noteFromFrequency(hz).display;
};
function setProfile(){
  const key=$('profileSelect').value;
  engine.setProfile(key==='off'?null:F0_PROFILES[key]);
  $('allowed').textContent = key==='off' ? 'Ei rajausta' : 'g¹ · a¹ · h¹ · c² · d²';
  $('fastState').textContent = key==='off' ? 'POIS' : 'VALMIS';
  $('fastDetail').textContent = key==='off' ? 'BASE 2.0 -käyttäytyminen' : '2 peräkkäistä framea · ±30 cent';
}
$('profileSelect').addEventListener('change',setProfile);
engine.addEventListener('calibrationprogress',e=>{$('status').textContent=`Kalibroidaan ${Math.round((e.detail.progress||0)*100)} %`;});
engine.addEventListener('calibrated',()=>{$('status').textContent='Soita.';});
engine.addEventListener('pitch',e=>{
  const d=e.detail;
  $('outNote').textContent=d.note?.display??'–';
  $('outHz').textContent=Number.isFinite(d.outputF0)?`${d.outputF0.toFixed(1)} Hz`:'– Hz';
  $('detNote').textContent=d.detectedNote?.display??'–';
  $('medianHz').textContent=Number.isFinite(d.f0)?`${d.f0.toFixed(1)} Hz`:'– Hz';
  $('rawHz').textContent=Number.isFinite(d.rawF0)?`${d.rawF0.toFixed(1)} Hz`:'–';
  if(d.profileFastCandidateFrames>0){
    $('fastState').textContent=`${d.profileFastCandidateFrames}/2`;
    $('fastDetail').textContent=`ehdokas ${noteName(d.profileFastCandidateMidi)}`;
  }else if(d.transitionActive){
    $('fastState').textContent='SIIRTYMÄ';
    $('fastDetail').textContent='BASE-portti odottaa';
  }else if(engine.getProfile()){
    $('fastState').textContent='VALMIS';
    $('fastDetail').textContent='2 framea · ±30 cent';
  }
});
engine.addEventListener('profilefastaccept',e=>{
  $('fastState').textContent='FAST ✓';
  $('fastDetail').textContent=`${noteName(e.detail.fromMidi)} → ${noteName(e.detail.toMidi)}`;
});
engine.addEventListener('silence',()=>{$('status').textContent='Hiljaisuus';});
engine.addEventListener('error',e=>{console.error(e.detail);$('status').textContent='Virhe';});
$('start').addEventListener('click',async()=>{try{$('start').disabled=true;$('profileSelect').disabled=true;await engine.start();$('stop').disabled=false;}catch(e){$('start').disabled=false;$('profileSelect').disabled=false;}});
$('stop').addEventListener('click',()=>{engine.stop();$('start').disabled=false;$('stop').disabled=true;$('profileSelect').disabled=false;$('status').textContent='Pysäytetty.';});
setProfile();
</script></body></html>
