<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>F0 Engine</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17202a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="F0 Engine">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  --bg:#f4f6f8; --card:#fff; --text:#17202a; --muted:#6b7480;
  --line:#dde3e8; --accent:#17202a; --select:#2f7ef7; --select-dark:#195bbf;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
main{width:min(1220px,96vw);margin:0 auto;padding:16px 0 30px}
h1{margin:0;font-size:clamp(22px,3.4vw,34px);letter-spacing:-.03em}
.sub{margin:5px 0 12px;color:var(--muted);font-size:14px}

.card,.toolbar{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:14px;margin-bottom:12px;
}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit}
button{
  border:0;border-radius:12px;padding:10px 15px;font-weight:750;cursor:pointer;
  background:var(--accent);color:#fff;
}
button.secondary{background:#e7ebef;color:var(--text)}
button:disabled{opacity:.45;cursor:default}
select{
  border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--text)
}
#status{font-size:14px;color:var(--muted)}
.micGuardDisplay{
  display:inline-flex;align-items:center;gap:7px;
  min-height:36px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;
  background:#f3f5f7;color:var(--muted);font-size:12px;font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap
}
.micGuardDot{width:9px;height:9px;border-radius:50%;background:#6f7b86;flex:0 0 auto}
.micGuardDisplay.listening{background:#edf7f0;color:#24643a;border-color:#cde6d3}
.micGuardDisplay.listening .micGuardDot{background:#35a85a}
.micGuardDisplay.guarding{background:#eaf2ff;color:#195bbf;border-color:#bfd3f4}
.micGuardDisplay.guarding .micGuardDot{background:var(--select)}
.micGuardDisplay.tail{background:#fff4df;color:#8a5a00;border-color:#efd6a7}
.micGuardDisplay.tail .micGuardDot{background:#d69215}

/* SOITINVALINTA: kaksi viiden soittimen riviä */
.instrumentSelector{padding:14px}
.instrumentRows{display:grid;gap:10px}
.instrumentRow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.instrumentBtn{
  min-width:0;min-height:142px;padding:8px 7px 7px;
  border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--text);
  display:grid;grid-template-rows:92px auto auto;align-items:center;justify-items:center;
  gap:2px;overflow:hidden;
  transition:border-color .1s ease,background .1s ease,transform .08s ease,box-shadow .1s ease
}
.instrumentBtn:hover{background:#f8fafc}
.instrumentBtn:active{transform:translateY(1px)}
.instrumentBtn.selected{
  border-color:var(--select);background:#eef5ff;
  box-shadow:0 0 0 1px rgba(47,126,247,.12)
}
.instrumentImg{
  width:100%;height:92px;object-fit:contain;display:block;pointer-events:none
}
.instrumentName{
  max-width:100%;font-size:12px;font-weight:800;line-height:1.08;text-align:center;
  overflow-wrap:anywhere;pointer-events:none
}
.instrumentPitch{
  font-size:11px;line-height:1;color:var(--muted);font-weight:800;pointer-events:none
}
.instrumentBtn.selected .instrumentPitch{color:var(--select-dark)}

/* OSMD YLÄREUNASSA */
.scoreTop{padding:12px 14px 14px}
.scoreTopHead{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  margin-bottom:8px;
}
.scoreTopHead strong{font-size:17px}
.scoreViewport{
  width:100%;
  min-height:440px;
  max-height:760px;
  overflow-x:hidden;
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}
#score{
  width:100%;
  min-width:0;
  min-height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}
#score [id^="osmdCanvasPage"]{
  width:100%!important;
  max-width:100%!important;
  margin-left:auto!important;
  margin-right:auto!important;
}
#score svg{
  display:block;
  width:100%!important;
  max-width:100%!important;
  height:auto!important;
  margin:0 auto!important;
  transform:none!important;
  transform-origin:center center;
}

.setupGrid{
  display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:stretch
}
.scoreAndTuner{
  display:grid;
  grid-template-columns:minmax(0,1fr) 112px;
  gap:12px;
  align-items:stretch;
}
.verticalTuner{
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  padding:10px 8px 9px;
  min-height:440px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.verticalMeter{
  position:relative;
  width:90px;
  flex:1;
  min-height:320px;
  margin:4px 0 8px;
}
.vRail{
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:10px;
  transform:translateX(-50%);
  border-radius:999px;
  background:linear-gradient(
    to bottom,
    #dd6a6a 0%,
    #efc86a 20%,
    #dbe4ec 40%,
    #bdd6c4 50%,
    #dbe4ec 60%,
    #efc86a 80%,
    #dd6a6a 100%
  );
}
.vTick{
  position:absolute;
  left:50%;
  width:28px;
  height:1px;
  background:#9aa6b2;
  transform:translate(-50%,-50%);
}
.vTick.major{width:36px}
.vTick.center{width:46px;height:2px;background:#17202a}
.vLabel{
  position:absolute;
  right:1px;
  transform:translateY(-50%);
  font-size:10px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.vLabel.centerLabel{font-weight:750;color:var(--text)}
.vNeedle{
  position:absolute;
  left:3px;
  top:50%;
  width:46px;
  height:0;
  transform:translateY(-50%);
  transition:top .055s linear;
}
.vNeedle span{
  display:block;
  width:46px;
  height:3px;
  border-radius:999px;
  background:#17202a;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.vNeedle::after{
  content:"";
  position:absolute;
  right:-2px;
  top:-5px;
  border-left:8px solid #17202a;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
}

/* 3 OKTAAVIN KOSKETTIMISTO ALAREUNASSA: c – c³ */
.keyboardCard{margin-bottom:0}
.keyboardHead{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-bottom:9px
}
.keyboardHead strong{font-size:17px}
.keyboardHead span{font-size:12px;color:var(--muted)}
.pianoWrap{overflow:hidden;padding:2px 0 8px;width:100%}
.piano{
  position:relative;
  width:100%;
  height:clamp(112px,13.64vw,180px);
  user-select:none;
}
.white-keys{
  display:grid;
  grid-template-columns:repeat(22,minmax(0,1fr));
  position:absolute;inset:0;
  width:100%;height:100%;
}
.key{
  border:1px solid #cfd7df;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;
  padding:clamp(4px,.65vw,8px) 2px;
  font-size:clamp(7px,1vw,12px);font-weight:650;position:relative;
  transition:background .08s ease,border-color .08s ease,transform .08s ease
}
.white.key{width:100%;height:100%;background:#fff;color:#1d2730;border-radius:0 0 9px 9px}
.black.key{
  position:absolute;width:calc((100% / 22) * .6);height:62.222%;
  background:#232b33;color:#fff;
  border:1px solid #12171c;border-radius:0 0 8px 8px;z-index:3;
  align-items:flex-end;padding:0 1px clamp(4px,.55vw,8px);font-size:clamp(6px,.82vw,10px)
}
.key.selected,.key.pressed{background:var(--select)!important;color:#fff!important;border-color:var(--select-dark)!important}
.key:active{transform:translateY(1px)}
.keyLabel{pointer-events:none;text-align:center;line-height:1.05}
.concertDot{
  position:absolute;top:8px;left:50%;width:10px;height:10px;margin-left:-5px;
  border-radius:50%;background:#000;border:2px solid #fff;display:none;z-index:5
}
.key.concert-mark .concertDot{display:block}

@media(max-width:760px){
  .instrumentRow{gap:6px}
  .instrumentBtn{min-height:120px;padding:6px 4px;grid-template-rows:74px auto auto;border-radius:13px}
  .instrumentImg{height:74px}
  .instrumentName{font-size:10px}
  .instrumentPitch{font-size:10px}
  .setupGrid{grid-template-columns:1fr}
  .readout{grid-template-columns:1fr 1fr}
  .scoreAndTuner{grid-template-columns:minmax(0,1fr) 96px}
  .verticalTuner{min-height:440px}
  .verticalMeter{width:76px}
}
@media(max-width:460px){
  .readout{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>
  <!-- 2. KÄYNNISTYS -->
  <div class="toolbar">
    <button id="startBtn">Käynnistä</button>
    <button id="stopBtn" class="secondary" disabled>Lopeta</button>
    <span id="status">Valmiina.</span>
    <div id="micGuardDisplay" class="micGuardDisplay listening" role="status" aria-live="polite">
      <span class="micGuardDot" aria-hidden="true"></span>
      <span id="micGuardText">MIC GUARD · KUUNTELEE</span>
    </div>
  </div>

  <!-- SOITINVALINTA: puupuhaltimet + vasket -->
  <section class="card instrumentSelector" aria-label="Soitinvalinta">
    <div class="instrumentRows">
      <div class="instrumentRow" aria-label="Puupuhaltimet">
        <button class="instrumentBtn selected" type="button" data-instrument="C" data-name="Huilu" data-clef="G" aria-pressed="true">
          <img class="instrumentImg" src="instruments/huilu.png" alt="Huilu">
          <span class="instrumentName">Huilu</span><span class="instrumentPitch">C</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="C" data-name="Oboe" data-clef="G" aria-pressed="false">
          <img class="instrumentImg" src="instruments/oboe.png" alt="Oboe">
          <span class="instrumentName">Oboe</span><span class="instrumentPitch">C</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="Bb" data-name="Klarinetti" data-clef="G" aria-pressed="false">
          <img class="instrumentImg" src="instruments/klarinetti.png" alt="Klarinetti">
          <span class="instrumentName">Klarinetti</span><span class="instrumentPitch">B♭</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="Eb" data-name="Alttosaksofoni" data-clef="G" aria-pressed="false">
          <img class="instrumentImg" src="instruments/alttosaksofoni.png" alt="Alttosaksofoni">
          <span class="instrumentName">Alttosaksofoni</span><span class="instrumentPitch">E♭</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="C" data-name="Fagotti" data-clef="F" aria-pressed="false">
          <img class="instrumentImg" src="instruments/fagotti.png" alt="Fagotti">
          <span class="instrumentName">Fagotti</span><span class="instrumentPitch">C</span>
        </button>
      </div>

      <div class="instrumentRow" aria-label="Vaskipuhaltimet">
        <button class="instrumentBtn" type="button" data-instrument="F" data-name="Käyrätorvi" data-clef="G" aria-pressed="false">
          <img class="instrumentImg" src="instruments/kayratorvi.png" alt="Käyrätorvi">
          <span class="instrumentName">Käyrätorvi</span><span class="instrumentPitch">F</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="Bb" data-name="Trumpetti" data-clef="G" aria-pressed="false">
          <img class="instrumentImg" src="instruments/trumpetti.png" alt="Trumpetti">
          <span class="instrumentName">Trumpetti</span><span class="instrumentPitch">B♭</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="Eb" data-name="Alttotorvi" data-clef="G" aria-pressed="false">
          <img class="instrumentImg" src="instruments/alttotorvi.png" alt="Alttotorvi">
          <span class="instrumentName">Alttotorvi</span><span class="instrumentPitch">E♭</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="C" data-name="Pasuuna" data-clef="F" aria-pressed="false">
          <img class="instrumentImg" src="instruments/pasuuna.png" alt="Pasuuna">
          <span class="instrumentName">Pasuuna</span><span class="instrumentPitch">C</span>
        </button>
        <button class="instrumentBtn" type="button" data-instrument="C" data-name="Tuuba" data-clef="F" aria-pressed="false">
          <img class="instrumentImg" src="instruments/tuuba.png" alt="Tuuba">
          <span class="instrumentName">Tuuba</span><span class="instrumentPitch">C</span>
        </button>
      </div>
    </div>

  </section>

  <!-- 1. OSMD + PYSTYSUUNTAINEN VIRITYSMITTARI YLÄOSASSA -->
  <section class="card scoreTop">
    <div class="scoreTopHead">
      <strong>Nuottinäyttö</strong>
    </div>

    <div class="scoreAndTuner">
      <div class="scoreViewport">
        <div id="score"></div>
      </div>

      <aside class="verticalTuner" aria-label="Viritysmittari">
        <div class="verticalMeter">
          <div class="vRail"></div>

          <div class="vTick major" style="top:0%"></div>
          <div class="vTick" style="top:25%"></div>
          <div class="vTick center" style="top:50%"></div>
          <div class="vTick" style="top:75%"></div>
          <div class="vTick major" style="top:100%"></div>

          <div class="vLabel" style="top:0%">+50</div>
          <div class="vLabel" style="top:25%">+25</div>
          <div class="vLabel centerLabel" style="top:50%">0</div>
          <div class="vLabel" style="top:75%">−25</div>
          <div class="vLabel" style="top:100%">−50</div>

          <div id="needle" class="vNeedle">
            <span></span>
          </div>
        </div>
      </aside>
    </div>
  </section>

  <!-- 5. KOSKETTIMISTO AIVAN ALAREUNASSA -->
  <section class="card keyboardCard">
    <div class="keyboardHead">
      <strong>Sävelvalinta · 3 oktaavia</strong>
      <span>c – c³</span>
    </div>
    <div class="pianoWrap">
      <div id="piano" class="piano"></div>
    </div>
  </section>
</main>

<script src="opensheetmusicdisplay.min.js"></script>
<script src="f0-engine.js"></script>
<script src="instrument-controller.js"></script>
<script src="audio-engine.js"></script>
<script>
'use strict';

const engine = new F0Engine();
const controller = new InstrumentController(engine, {
  instrumentId: 'C',
  fastAcceptFrames: 1,
  fastAcceptToleranceCents: 49
});

let keyboardAudio = new window.PikakirjoitinAudio.AudioEngine();
let pianoResumeTimer = null;
let pianoPreviewActive = false;
let pianoGuardUntil = 0;
let micGuardFrame = 0;

function updateMicGuardDisplay(mode, remainingMs = 0) {
  const display = document.getElementById('micGuardDisplay');
  const text = document.getElementById('micGuardText');
  if (!display || !text) return;

  display.classList.remove('listening', 'guarding', 'tail');
  if (mode === 'guarding') {
    display.classList.add('guarding');
    text.textContent = 'MIC GUARD · SUOJAA';
  } else if (mode === 'tail') {
    display.classList.add('tail');
    text.textContent = `MIC GUARD · JÄLKISUOJA ${Math.max(0, Math.ceil(remainingMs))} ms`;
  } else {
    display.classList.add('listening');
    text.textContent = 'MIC GUARD · KUUNTELEE';
  }
}

function animateMicGuardTail() {
  if (micGuardFrame) cancelAnimationFrame(micGuardFrame);
  const tick = () => {
    if (pianoPreviewActive) {
      updateMicGuardDisplay('guarding');
      micGuardFrame = 0;
      return;
    }
    const left = pianoGuardUntil - performance.now();
    if (left > 0) {
      updateMicGuardDisplay('tail', left);
      micGuardFrame = requestAnimationFrame(tick);
    } else {
      updateMicGuardDisplay('listening');
      micGuardFrame = 0;
    }
  };
  tick();
}

function bindKeyboardAudioToMicContext() {
  try { keyboardAudio.dispose(); } catch {}
  keyboardAudio = new window.PikakirjoitinAudio.AudioEngine({
    audioContext: engine.audioContext
  });
}

function beginPianoPreview() {
  pianoPreviewActive = true;
  pianoGuardUntil = Number.POSITIVE_INFINITY;
  if (micGuardFrame) {
    cancelAnimationFrame(micGuardFrame);
    micGuardFrame = 0;
  }
  updateMicGuardDisplay('guarding');
  if (pianoResumeTimer) {
    clearTimeout(pianoResumeTimer);
    pianoResumeTimer = null;
  }
  engine.pauseInput();
  engine.ensureAudioRunning();
}

function endPianoPreview() {
  pianoEl?.querySelectorAll('.key.pressed').forEach(el => el.classList.remove('pressed'));
  if (!pianoPreviewActive) return;
  pianoPreviewActive = false;
  keyboardAudio.noteOff();
  if (pianoResumeTimer) clearTimeout(pianoResumeTimer);
  // Kovempi jälkivartio: myös lyhyt napautus, kaiuttimen release ja huonekaiku
  // pysyvät poissa F0-analyysistä.
  pianoGuardUntil = performance.now() + 450;
  animateMicGuardTail();
  pianoResumeTimer = setTimeout(() => {
    pianoResumeTimer = null;
    engine.resumeInput();
    if (!pianoPreviewActive && performance.now() >= pianoGuardUntil) {
      updateMicGuardDisplay('listening');
    }
  }, 450);
}

/* Oikea kolmen oktaavin alue suomalaisessa merkinnässä:
   c = MIDI 48, c³ = MIDI 84. */
const WRITTEN_START_MIDI = 48;
const WRITTEN_END_MIDI = 84;

const PIANO_NOTES = [];
for (let midi = WRITTEN_START_MIDI; midi <= WRITTEN_END_MIDI; midi++) {
  PIANO_NOTES.push(midi);
}

const BLACK_PCS = new Set([1,3,6,8,10]);
const WHITE_ORDER = [0,2,4,5,7,9,11];

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const instrumentButtons = [...document.querySelectorAll('.instrumentBtn')];
let currentClef = 'G';
const pianoEl = document.getElementById('piano');

const needleEl = document.getElementById('needle');

const scoreEl = document.getElementById('score');

const OSMD = opensheetmusicdisplay.OpenSheetMusicDisplay;
const osmd = new OSMD(scoreEl, {
  autoResize: false,
  drawTitle: false,
  drawSubtitle: false,
  drawComposer: false,
  drawLyricist: false,
  drawPartNames: false,
  drawingParameters: "compacttight"
});

let currentDrawnMidi = null;
const osmdZoomPercent = 600;
const staffLengthPercent = 250;
osmd.Zoom = osmdZoomPercent / 100;
osmd.EngravingRules.LastSystemMaxScalingFactor = 1.4 * (staffLengthPercent / 100);

function digitsTo(value, table) {
  return String(value).split('').map(ch => table[ch] || ch).join('');
}
const SUPER = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const SUB   = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};

function formatFinnishMidi(midi) {
  const names = ['c','cis','d','dis','e','f','fis','g','gis','a','ais','h'];
  const pc = ((midi % 12) + 12) % 12;
  const scientificOctave = Math.floor(midi / 12) - 1;
  const lower = names[pc];

  if (scientificOctave >= 4) {
    return lower + digitsTo(scientificOctave - 3, SUPER);
  }
  if (scientificOctave === 3) {
    return lower;
  }
  if (scientificOctave === 2) {
    return lower.toUpperCase();
  }
  return lower.toUpperCase() + digitsTo(2 - scientificOctave, SUB);
}

function midiToMusicXMLPitch(midi) {
  const pcs = [
    ['C',0], ['C',1], ['D',0], ['D',1], ['E',0], ['F',0],
    ['F',1], ['G',0], ['G',1], ['A',0], ['A',1], ['B',0]
  ];
  const pc = ((midi % 12) + 12) % 12;
  const octave = Math.floor(midi / 12) - 1;
  const [step, alter] = pcs[pc];
  return { step, alter, octave };
}

function clefMusicXML() {
  return currentClef === 'F'
    ? '<clef><sign>F</sign><line>4</line></clef>'
    : '<clef><sign>G</sign><line>2</line></clef>';
}

function musicXMLForQuarterNote(midi) {
  const p = midiToMusicXMLPitch(midi);
  const alter = p.alter ? `<alter>${p.alter}</alter>` : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
  <!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
  <score-partwise version="3.1">
    <part-list><score-part id="P1"><part-name>Nuotti</part-name></score-part></part-list>
    <part id="P1"><measure number="1">
      <attributes>
        <divisions>1</divisions>
        <key><fifths>0</fifths></key>
        ${clefMusicXML()}
      </attributes>
      <note>
        <pitch><step>${p.step}</step>${alter}<octave>${p.octave}</octave></pitch>
        <duration>1</duration><type>quarter</type>
      </note>
      <barline location="right"><bar-style>none</bar-style></barline>
    </measure></part>
  </score-partwise>`;
}


function getStaffScreenBounds(svg) {
  if (!svg) return null;

  const candidates = [...svg.querySelectorAll('path, line, rect')]
    .map(el => ({ el, rect: el.getBoundingClientRect() }))
    .filter(({ rect }) =>
      Number.isFinite(rect.width) &&
      Number.isFinite(rect.height) &&
      rect.width > 50 &&
      rect.height <= 8
    );

  if (!candidates.length) return null;

  const maxWidth = Math.max(...candidates.map(({ rect }) => rect.width));
  const staffLines = candidates
    .filter(({ rect }) => rect.width >= maxWidth * 0.88)
    .sort((a, b) => a.rect.top - b.rect.top)
    .slice(0, 12);

  if (!staffLines.length) return null;

  return {
    left: Math.min(...staffLines.map(({ rect }) => rect.left)),
    right: Math.max(...staffLines.map(({ rect }) => rect.right))
  };
}

function clientXToSvgX(svg, clientX) {
  const matrix = svg.getScreenCTM();
  if (!matrix) return null;

  const point = svg.createSVGPoint();
  point.x = clientX;
  point.y = svg.getBoundingClientRect().top;

  const converted = point.matrixTransform(matrix.inverse());
  return Number.isFinite(converted.x) ? converted.x : null;
}

function makeScoreResponsive() {
  const viewport = document.querySelector('.scoreViewport');
  const svg = scoreEl.querySelector('svg');
  if (!viewport || !svg) return;

  // CSS hoitaa tästä eteenpäin koon muutokset ilman uutta OSMD-renderöintiä.
  svg.style.transform = 'none';
  svg.style.width = '100%';
  svg.style.maxWidth = '100%';
  svg.style.height = 'auto';
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const bounds = getStaffScreenBounds(svg);
  const viewBoxAttr = svg.getAttribute('viewBox');
  if (!bounds || !viewBoxAttr) return;

  const vb = viewBoxAttr.trim().split(/\s+/).map(Number);
  if (vb.length !== 4 || !vb.every(Number.isFinite)) return;

  const staffLeft = clientXToSvgX(svg, bounds.left);
  const staffRight = clientXToSvgX(svg, bounds.right);
  if (!Number.isFinite(staffLeft) || !Number.isFinite(staffRight)) return;

  const staffWidth = staffRight - staffLeft;
  if (!(staffWidth > 0)) return;

  // Pieni hengitystila molemmille sivuille. Itse viivasto jää täsmälleen keskelle.
  const horizontalPadding = staffWidth * 0.08;
  const newX = staffLeft - horizontalPadding;
  const newWidth = staffWidth + horizontalPadding * 2;

  svg.setAttribute(
    'viewBox',
    `${newX} ${vb[1]} ${newWidth} ${vb[3]}`
  );

  // Scrollaus ei enää osallistu vaakakeskitykseen.
  viewport.scrollLeft = 0;
}
function addOsmdVerticalHeadroom() {
  const svg = scoreEl.querySelector('svg');
  if (!svg) return;

  svg.style.overflow = 'visible';

  const viewBox = svg.getAttribute('viewBox');
  if (viewBox) {
    const parts = viewBox.trim().split(/\s+/).map(Number);
    if (parts.length === 4 && parts.every(Number.isFinite)) {
      const extraTop = 12;
      const extraBottom = 28;
      svg.setAttribute(
        'viewBox',
        `${parts[0]} ${parts[1] - extraTop} ${parts[2]} ${parts[3] + extraTop + extraBottom}`
      );
    }
  }

  const rawHeight = parseFloat(svg.getAttribute('height'));
  if (Number.isFinite(rawHeight)) {
    svg.setAttribute('height', String(rawHeight + 40));
  }
}

async function drawMidi(midi) {
  if (!Number.isFinite(midi) || midi === currentDrawnMidi) return;
  currentDrawnMidi = midi;
  await osmd.load(musicXMLForQuarterNote(midi));
  osmd.Zoom = osmdZoomPercent / 100;
  osmd.render();
  addOsmdVerticalHeadroom();
  makeScoreResponsive();
}



window.addEventListener('pointerup', endPianoPreview);
window.addEventListener('pointercancel', endPianoPreview);

function isBlack(midi) {
  return BLACK_PCS.has(((midi % 12) + 12) % 12);
}

function whiteIndexFromMidi(midi) {
  let whiteCount = 0;
  for (let m = WRITTEN_START_MIDI; m < midi; m++) {
    if (!isBlack(m)) whiteCount++;
  }
  return whiteCount;
}

function buildPiano() {
  pianoEl.innerHTML = '';
  const whiteKeys = document.createElement('div');
  whiteKeys.className = 'white-keys';
  pianoEl.appendChild(whiteKeys);

  for (const midi of PIANO_NOTES) {
    const key = document.createElement('button');
    key.type = 'button';
    key.className = `key ${isBlack(midi) ? 'black' : 'white'}`;
    key.dataset.midi = String(midi);

    const label = document.createElement('div');
    label.className = 'keyLabel';
    label.textContent = formatFinnishMidi(midi);

    const dot = document.createElement('div');
    dot.className = 'concertDot';

    key.appendChild(label);
    key.appendChild(dot);

    key.addEventListener('pointerdown', async event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      key.classList.add('pressed');
      beginPianoPreview();
      // Anna MIC GUARDin astua varmasti voimaan ennen kaiutinäänen attackia.
      await new Promise(requestAnimationFrame);
      if (!pianoPreviewActive) return;
      const ok = await keyboardAudio.unlock();
      if (!ok) return;
      keyboardAudio.noteOn(controller.writtenToConcert(midi));
    });

    key.addEventListener('pointerup', endPianoPreview);
    key.addEventListener('pointercancel', endPianoPreview);
    key.addEventListener('pointerleave', event => {
      if (event.buttons) endPianoPreview();
    });

    key.addEventListener('click', () => toggleMidi(midi));

    if (isBlack(midi)) {
      const previousWhiteIndex = whiteIndexFromMidi(midi);
      const leftPercent = ((previousWhiteIndex - 0.3) / 22) * 100;
      key.style.left = `${leftPercent}%`;
      pianoEl.appendChild(key);
    } else {
      whiteKeys.appendChild(key);
    }
  }

  refreshKeyboardSelection();
}

function refreshKeyboardSelection() {
  const concertSet = new Set(controller.getSelectedConcertMidi());

  pianoEl.querySelectorAll('.key').forEach(el => {
    const midi = Number(el.dataset.midi);
    el.classList.toggle('selected', controller.isWrittenSelected(midi));
    el.classList.toggle('concert-mark', concertSet.has(midi));
  });

  updateSelectionInfo();
}

function toggleMidi(midi) {
  controller.toggleWrittenMidi(midi);
  refreshKeyboardSelection();
}

function getSelectedWrittenMidiSorted() {
  return controller.getSelectedWrittenMidi();
}

function updateSelectionInfo() {
  // Sävelvalinta näkyy suoraan koskettimistossa. Erillistä infokorttia ei tarvita.
}

function updateTuner(cents) {
  if (!Number.isFinite(cents)) {
    needleEl.style.top = '50%';
    return;
  }

  const clamped = Math.max(-50, Math.min(50, cents));
  const topPercent = 50 - clamped;
  needleEl.style.top = `${topPercent}%`;
}

function clearDisplay() {
  updateTuner(null);
}

engine.addEventListener('calibrationprogress', e => {
  statusEl.textContent = `Kalibroidaan… ${Math.round((e.detail.progress || 0) * 100)} %`;
});

engine.addEventListener('calibrated', () => {
  statusEl.textContent = 'Kalibroitu. Soita.';
});

engine.addEventListener('pitch', async e => {
  // Varmistus UI-tasolla: pianon oma ääni ei saa koskaan päivittää tunnistusta.
  if (pianoPreviewActive || performance.now() < pianoGuardUntil) return;
  const d = e.detail;
  const concertMidi = d.note?.midi;
  const writtenMidi = Number.isFinite(concertMidi)
    ? controller.concertToWritten(concertMidi)
    : null;

  if (!Number.isFinite(writtenMidi) || !controller.isWrittenSelected(writtenMidi)) {
    return;
  }


  const f0 = Number.isFinite(d.outputF0) ? d.outputF0 : d.f0;
  updateTuner(Number.isFinite(d.note?.cents) ? d.note.cents : null);

  try {
    await drawMidi(writtenMidi);
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Nuottia ei saatu piirrettyä.';
  }

  statusEl.textContent = d.transitionActive
    ? 'Siirtymä · pidetään edellinen valittu sävel'
    : 'Vakaa';
});

engine.addEventListener('silence', () => {
  if (pianoPreviewActive || performance.now() < pianoGuardUntil) return;
  statusEl.textContent = 'Hiljaisuus';
});

engine.addEventListener('error', e => {
  console.error(e.detail);
  statusEl.textContent = 'Virhe mikrofonissa.';
});

startBtn.addEventListener('click', async () => {
  controller.applyProfile();
  startBtn.disabled = true;
  stopBtn.disabled = true;
  statusEl.textContent = 'Käynnistetään…';

  try {
    await engine.start();
    // Kun mikrofoni on käynnissä, piano käyttää samaa AudioContextia.
    // Tämä on erityisen tärkeää iOS/iPadOS:ssa.
    bindKeyboardAudioToMicContext();
    stopBtn.disabled = false;
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Mikrofonia ei saatu käyntiin.';
    startBtn.disabled = false;
  }
});

stopBtn.addEventListener('click', () => {
  pianoPreviewActive = false;
  pianoGuardUntil = 0;
  if (pianoResumeTimer) {
    clearTimeout(pianoResumeTimer);
    pianoResumeTimer = null;
  }
  keyboardAudio.noteOff();
  engine.stop();
  statusEl.textContent = 'Pysäytetty.';
  startBtn.disabled = false;
  stopBtn.disabled = true;
});

function selectInstrumentButton(button) {
  const instrumentId = button.dataset.instrument;
  const clef = button.dataset.clef === 'F' ? 'F' : 'G';
  if (!controller.setInstrument(instrumentId)) return;

  currentClef = clef;
  instrumentButtons.forEach(btn => {
    const selected = btn === button;
    btn.classList.toggle('selected', selected);
    btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
  });

  refreshKeyboardSelection();
  clearDisplay();

  // Nuottiavain seuraa soitinvalintaa heti, myös ennen seuraavaa soitettua ääntä.
  const midiToRedraw = Number.isFinite(currentDrawnMidi) ? currentDrawnMidi : 60;
  currentDrawnMidi = null;
  drawMidi(midiToRedraw);
}

instrumentButtons.forEach(button => {
  button.addEventListener('click', () => selectInstrumentButton(button));
});

buildPiano();
controller.applyProfile();
drawMidi(60);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(error => {
      console.warn('Service workerin rekisteröinti epäonnistui:', error);
    });
  });
}
