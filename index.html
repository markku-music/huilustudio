<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#bde4ea">
  <title>Huilupelimaailma | Laitevalinta</title>
  <style>
    :root {
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #16394e;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      min-height: 100svh;
      background: #c9e5e6;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      user-select: none;
    }
    .backdrop {
      position: fixed; inset: 0; z-index: -3;
      background: center center / cover no-repeat url('assets/musiikkiluokka.webp');
      transform: scale(1.03);
    }
    .tint {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(240,248,250,.14), rgba(233,245,246,.24) 48%, rgba(220,235,236,.18)),
        radial-gradient(ellipse 65% 42% at 50% 52%, rgba(255,255,255,.18), transparent 78%);
    }
    .page {
      position: relative;
      width: 100%; height: 100%;
      padding: calc(10px + var(--safe-top)) calc(12px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(12px + var(--safe-left));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .device-row {
      width: min(100%, 920px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      gap: clamp(8px, 1.8vw, 22px);
    }
    .device {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      width: 100%;
      display: block;
      cursor: pointer;
      position: relative;
      border-radius: 28px;
      transition: transform .22s ease, filter .22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .device::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 22%;
      background: rgba(255,255,255,.14);
      filter: blur(18px);
      z-index: -1;
      opacity: .9;
    }
    .device img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 24px;
      filter: drop-shadow(0 12px 16px rgba(16, 55, 93, .24));
      pointer-events: none;
    }
    .device:hover,
    .device:focus-visible,
    .device[aria-pressed="true"] {
      transform: translateY(-4px) scale(1.025);
    }
    .device[aria-pressed="true"] img {
      filter: drop-shadow(0 0 12px rgba(255,255,255,.65)) drop-shadow(0 16px 18px rgba(16, 55, 93, .34));
    }
    .device:focus-visible {
      outline: 4px solid rgba(255, 212, 77, .96);
      outline-offset: 2px;
    }
    .rotate-lock {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(193,228,232,.96), rgba(214,238,241,.97));
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    .rotate-box {
      max-width: 320px;
      color: #17425c;
    }
    .phone-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      position: relative;
      transform: rotate(90deg);
    }
    .phone-icon::before {
      content: "";
      position: absolute;
      inset: 10px 22px;
      border: 5px solid #2a78a0;
      border-radius: 18px;
      background: rgba(255,255,255,.45);
      box-shadow: 0 10px 24px rgba(23,66,92,.14);
    }
    .phone-icon::after {
      content: "";
      position: absolute;
      right: -8px;
      top: 50%;
      width: 0; height: 0;
      border-left: 16px solid #2a78a0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      transform: translateY(-50%);
    }
    .rotate-text {
      font-size: clamp(1.05rem, 5vw, 1.25rem);
      font-weight: 800;
      line-height: 1.25;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    /* iPhone landscape first */
    @media (max-height: 430px) and (orientation: landscape) {
      .page {
        padding: calc(6px + var(--safe-top)) calc(8px + var(--safe-right)) calc(6px + var(--safe-bottom)) calc(8px + var(--safe-left));
      }
      .device-row {
        width: min(100%, 760px);
        gap: 8px;
      }
      .device img {
        max-height: min(28.5svh, 176px);
        width: auto;
        margin: 0 auto;
      }
    }

    @media (min-height: 431px) and (orientation: landscape) {
      .device-row { width: min(100%, 980px); }
      .device img { max-height: min(42svh, 320px); width: auto; margin: 0 auto; }
    }

    @media (orientation: portrait) {
      .page { visibility: hidden; pointer-events: none; }
      .rotate-lock { display: flex; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="tint" aria-hidden="true"></div>

  <main class="page" aria-label="Laitevalinta">
    <div class="device-row" aria-label="Valitse laite">
      <button class="device" type="button" data-device="puhelin" aria-label="Puhelin" aria-pressed="false">
        <img src="assets/puhelin.webp" alt="Puhelin" draggable="false">
      </button>
      <button class="device" type="button" data-device="tabletti" aria-label="Tabletti" aria-pressed="false">
        <img src="assets/tabletti.webp" alt="Tabletti" draggable="false">
      </button>
      <button class="device" type="button" data-device="tietokone" aria-label="Tietokone" aria-pressed="false">
        <img src="assets/tietokone.webp" alt="Tietokone, Chromebook" draggable="false">
      </button>
    </div>
  </main>

  <div class="rotate-lock" aria-live="polite">
    <div class="rotate-box">
      <div class="phone-icon" aria-hidden="true"></div>
      <div class="rotate-text">Käännä puhelin vaakaan</div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.device').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.device').forEach(other => other.setAttribute('aria-pressed', 'false'));
        button.setAttribute('aria-pressed', 'true');
        // Tulevan portaalin pelikirjastoon siirtyminen lisätään myöhemmin.
      });
    });
  </script>
</body>
</html>
