<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>F0 ENGINE BASE 2.0 · OSMD nuottinäyttö</title>
<style>
  :root{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:light;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#17202a;
    --muted:#6b7480;
    --line:#dde3e8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100svh;
    background:var(--bg);
    color:var(--text);
  }
  main{
    width:min(780px,94vw);
    margin:0 auto;
    padding:24px 0 40px;
  }
  h1{
    margin:0;
    font-size:clamp(24px,4vw,38px);
    letter-spacing:-.03em;
  }
  .sub{
    margin:8px 0 18px;
    color:var(--muted);
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  button{
    border:0;
    border-radius:12px;
    padding:11px 16px;
    font:inherit;
    font-weight:750;
    cursor:pointer;
    background:#17202a;
    color:#fff;
  }
  button.secondary{
    background:#e7ebef;
    color:#17202a;
  }
  button:disabled{
    opacity:.45;
    cursor:default;
  }
  #status{
    color:var(--muted);
    font-size:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px;
  }
  #score{
    width:100%;
    min-height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #score svg{
    width:100% !important;
    height:auto !important;
    display:block;
  }
  .readout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .metric{
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
  }
  .metric span{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:3px;
  }
  .metric strong{
    font-size:22px;
  }
  .foot{
    margin-top:12px;
    color:var(--muted);
    font-size:13px;
  }
  @media(max-width:560px){
    .readout{grid-template-columns:1fr}
    #score{min-height:210px}
  }
</style>
</head>
<body>
<main>
  <h1>F0 ENGINE BASE 2.0 · OSMD</h1>
  <div class="sub">Moottori on omassa tiedostossaan. OSMD piirtää hyväksytyn sävelen 1/4-nuottina.</div>

  <div class="toolbar">
    <button id="startBtn">Käynnistä</button>
    <button id="stopBtn" class="secondary" disabled>Lopeta</button>
    <span id="status">Valmiina.</span>
  </div>

  <section class="card">
    <div id="score"></div>

    <div class="readout">
      <div class="metric">
        <span>Sävel</span>
        <strong id="noteName">–</strong>
      </div>
      <div class="metric">
        <span>F0</span>
        <strong id="freq">– Hz</strong>
      </div>
    </div>

    <div class="foot">
      Näyttö käyttää <code>detail.note.midi</code>-arvoa. F0-moottorin logiikkaa ei ole upotettu HTML:ään.
    </div>
  </section>
</main>

<script src="opensheetmusicdisplay.min.js"></script>
<script src="f0-engine.js"></script>
<script>
'use strict';

const engine = new F0Engine();

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const noteNameEl = document.getElementById('noteName');
const freqEl = document.getElementById('freq');
const scoreEl = document.getElementById('score');

const OSMD = opensheetmusicdisplay.OpenSheetMusicDisplay;
const osmd = new OSMD(scoreEl, {
  autoResize: true,
  drawTitle: false,
  drawSubtitle: false,
  drawComposer: false,
  drawLyricist: false,
  drawPartNames: false,
  drawingParameters: "compacttight"
});

let currentMidi = null;

function midiToMusicXMLPitch(midi){
  const pcs = [
    ['C',0], ['C',1], ['D',0], ['D',1], ['E',0], ['F',0],
    ['F',1], ['G',0], ['G',1], ['A',0], ['A',1], ['B',0]
  ];
  const pc = ((midi % 12) + 12) % 12;
  const octave = Math.floor(midi / 12) - 1;
  const [step, alter] = pcs[pc];
  return {step, alter, octave};
}

function musicXMLForQuarterNote(midi){
  const p = midiToMusicXMLPitch(midi);
  const alter = p.alter ? `<alter>${p.alter}</alter>` : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
  <!DOCTYPE score-partwise PUBLIC
    "-//Recordare//DTD MusicXML 3.1 Partwise//EN"
    "http://www.musicxml.org/dtds/partwise.dtd">
  <score-partwise version="3.1">
    <part-list>
      <score-part id="P1"><part-name>Nuotti</part-name></score-part>
    </part-list>
    <part id="P1">
      <measure number="1">
        <attributes>
          <divisions>1</divisions>
          <key><fifths>0</fifths></key>
          <time><beats>4</beats><beat-type>4</beat-type></time>
          <clef><sign>G</sign><line>2</line></clef>
        </attributes>
        <note>
          <pitch>
            <step>${p.step}</step>
            ${alter}
            <octave>${p.octave}</octave>
          </pitch>
          <duration>1</duration>
          <type>quarter</type>
        </note>
      </measure>
    </part>
  </score-partwise>`;
}

async function drawMidi(midi){
  if(!Number.isFinite(midi) || midi === currentMidi) return;
  currentMidi = midi;

  try{
    await osmd.load(musicXMLForQuarterNote(midi));
    osmd.render();
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Nuottia ei saatu piirrettyä.';
  }
}

engine.addEventListener('calibrationprogress', e => {
  const p = Math.round((e.detail.progress || 0) * 100);
  statusEl.textContent = `Kalibroidaan… ${p} %`;
});

engine.addEventListener('calibrated', () => {
  statusEl.textContent = 'Kalibroitu. Soita.';
});

engine.addEventListener('pitch', e => {
  const d = e.detail;
  noteNameEl.textContent = d.note?.display ?? '–';
  freqEl.textContent = Number.isFinite(d.outputF0)
    ? `${d.outputF0.toFixed(1)} Hz`
    : (Number.isFinite(d.f0) ? `${d.f0.toFixed(1)} Hz` : '– Hz');

  if(Number.isFinite(d.note?.midi)){
    drawMidi(d.note.midi);
  }

  statusEl.textContent = d.transitionActive
    ? 'Siirtymä · pidetään edellinen sävel'
    : 'Vakaa';
});

engine.addEventListener('silence', () => {
  statusEl.textContent = 'Hiljaisuus';
});

engine.addEventListener('error', e => {
  console.error(e.detail);
  statusEl.textContent = 'Virhe mikrofonissa.';
});

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  stopBtn.disabled = true;
  statusEl.textContent = 'Käynnistetään…';

  try{
    await engine.start();
    stopBtn.disabled = false;
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Mikrofonia ei saatu käyntiin.';
    startBtn.disabled = false;
  }
});

stopBtn.addEventListener('click', () => {
  engine.stop();
  statusEl.textContent = 'Pysäytetty.';
  startBtn.disabled = false;
  stopBtn.disabled = true;
});

// Aloitusnuotti vain sen varmistamiseksi, että OSMD näkyy heti.
drawMidi(60);
</script>
</body>
</html>
