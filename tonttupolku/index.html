<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a241f">
  <title>Tonttupolku</title>
  <link rel="stylesheet" href="reitti.css">
  <script defer src="asetukset.js"></script>
  <script defer src="nosto.js"></script>
  <script defer src="tonde.js"></script>
  <script defer src="retki.js"></script>
  <script defer src="maisema.js"></script>
  <script defer src="aanet.js"></script>
  <script defer src="pitch-engine.js"></script>
  <script defer src="huilu.js"></script>
  <script defer src="reitti.js"></script>
</head>
<body>
<main>
  <section id="cabin" aria-labelledby="title">
    <img class="cabin-art" src="kuvat/joulupukin-tupa.webp" width="1846" height="852" alt="Joulupukki näyttää Ylermille, kuinka kivilaatat ladotaan vierekkäin.">
    <small class="game-version">v1.0</small>
    <form id="setup">
      <h1 id="title">Tonttupolku</h1>
      <fieldset><legend>Sävelet</legend>
        <div class="choices pitches">
          <label><input type="radio" name="pitches" value="3"><span>3 säveltä<small>HAG</small></span></label>
          <label><input type="radio" name="pitches" value="4"><span>4 säveltä<small>CHAD</small></span></label>
          <label><input type="radio" name="pitches" value="5" checked><span>5 säveltä<small>G A H C D</small></span></label>
        </div>
      </fieldset>
      <fieldset><legend>Vaikeustaso</legend>
        <div class="choices"><label><input type="radio" name="difficulty" value="easy" checked><span>Helppo</span></label>
        <label><input type="radio" name="difficulty" value="hard"><span>Vaikea</span></label></div>
      </fieldset>
      <fieldset><legend>Ohjaus</legend>
        <div class="choices"><label><input type="radio" name="controller" value="flute" checked><span>Huilu</span></label>
        <label><input type="radio" name="controller" value="manual"><span>Näppäimet ja kosketus</span></label></div>
      </fieldset>
      <div class="launch"><button id="start" disabled>Korjaa tonttupolku</button>
        <button type="button" id="sound" aria-label="Peliäänet" aria-pressed="true" title="Peliäänet">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9h4l5-4v14l-5-4H3z"/><path class="waves" d="M15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/><path class="mute" d="m16 9 6 6m0-6-6 6"/>
          </svg>
        </button>
      </div>
      <p id="mic-info" role="status" aria-live="polite">Salli mikrofoni ja ole aluksi hiljaa 1,5 sekuntia.</p>
      <p id="load-error" role="alert" hidden>Pelikuvien lataus epäonnistui. Lataa sivu uudelleen.</p>
    </form>
  </section>
  <section id="play" aria-label="Tonttupolun pelimaisema" hidden>
    <div class="stage">
      <img id="panorama" src="Tonttupolku_panoraama.webp" width="3376" height="390" alt="Kolme kivityömaata joulupukin tuvan ja lelupajan välillä." draggable="false">
      <div class="viewport" id="viewport" tabindex="0" aria-label="Vieritettävä maisema">
        <div class="world">
          <div id="pad" role="group" aria-label="Nosturin ohjaus" hidden>
            <button type="button" data-key="G"></button><button type="button" data-key="A"></button>
            <button type="button" data-key="H"></button><button type="button" data-key="C"></button>
            <button type="button" data-key="D"></button>
          </div>
        </div>
      </div>
      <canvas id="lumisade" width="844" height="390" aria-hidden="true"></canvas><canvas id="scene" aria-hidden="true"></canvas>
    </div>
    <nav aria-label="Polun kohteet">
      <button type="button" aria-label="Joulupukin tupa">Tupa</button><button type="button" aria-label="Työmaa 1">1</button>
      <button type="button" aria-label="Työmaa 2">2</button><button type="button" aria-label="Työmaa 3">3</button>
      <button type="button" aria-label="Lelupaja">Paja</button>
    </nav>
  </section>
  <p id="status" class="sr" role="status" aria-live="polite"></p>
</main>
</body>
</html>
