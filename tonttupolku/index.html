<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a241f">
  <title>Tonttupolku</title>
  <link rel="stylesheet" href="reitti.css?v=1.2.8">
  <script defer src="asetukset.js"></script>
  <script defer src="nosto.js?v=1.2.3"></script>
  <script defer src="ajoasennot.js"></script>
  <script defer src="tonde.js?v=1.2.2"></script>
  <script defer src="retki.js"></script>
  <script defer src="maisema.js?v=1.2.2"></script>
  <script defer src="aanet.js"></script>
  <script defer src="resonator-engine.js?v=1.2.12"></script>
  <script defer src="reitti.js?v=1.2.13"></script>
</head>
<body>
<main>
  <section id="cabin" aria-labelledby="title">
    <img class="cabin-art" src="kuvat/joulupukin-tupa.webp" width="1846" height="852" alt="Joulupukki näyttää Tondelle, kuinka kivilaatat ladotaan vierekkäin.">
    <aside id="resonator-dev" aria-label="Resonator Huilu 1.10"></aside>
    <form id="setup">
      <small class="version">Tonttupolku 1.2.13 · Resonator Huilu 1.10</small>
      <h1 id="title">Tonttupolku</h1>
      <fieldset><legend>Ohjaus</legend>
        <div class="choices"><label><input type="radio" name="controller" value="flute" checked><span>Soitin</span></label>
        <label><input type="radio" name="controller" value="manual"><span>Näppäimet / kosketus</span></label></div>
      </fieldset>
      <label id="instrument-row" for="instrument">Soittimen vire
        <select id="instrument" name="instrument">
          <option value="0">C · huilu, oboe</option>
          <option value="-2">B♭ · klarinetti, trumpetti</option>
          <option value="-9">E♭ · alttosaksofoni</option>
          <option value="-7">F · käyrätorvi</option>
          <option value="12">C · piccolo, sopraanonokkahuilu</option>
          <option value="trombone">C · pasuuna</option>
        </select>
      </label>
      <fieldset><legend>Sävelet</legend>
        <div class="choices pitches">
          <label><input type="radio" name="pitches" value="3"><span>3 säveltä</span></label>
          <label><input type="radio" name="pitches" value="4"><span>4 säveltä</span></label>
          <label><input type="radio" name="pitches" value="5" checked><span>5 säveltä</span></label>
        </div>
      </fieldset>
      <fieldset><legend>Vaikeustaso</legend>
        <div class="choices"><label><input type="radio" name="difficulty" value="easy" checked><span>Helppo</span></label>
        <label><input type="radio" name="difficulty" value="hard"><span>Vaikea</span></label></div>
      </fieldset>
      <div class="launch"><button id="start" disabled>Korjaa tonttupolku</button>
        <button type="button" id="sound" aria-label="Peliäänet" aria-pressed="true" title="Peliäänet">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9h4l5-4v14l-5-4H3z"/><path class="waves" d="M15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/><path class="mute" d="m16 9 6 6m0-6-6 6"/>
          </svg>
        </button>
      </div>
      <div id="tuning-row">
        <label id="retune-row" hidden><input type="checkbox" id="retune"> Kalibroi uudelleen pelin alussa</label>
        <output id="reference-a" aria-label="Viritystaso" aria-live="off">A = 440 Hz</output>
        <button type="button" id="reset-a" hidden>Palauta 440 Hz</button>
      </div>
      <progress id="tuning-progress" aria-label="A-kalibroinnin eteneminen" max="1" value="0" hidden></progress>
      <p id="mic-status" role="status">Ole aluksi hiljaa 1,5 sekuntia. Soita nostosävel ja vaihda koloon legatolla.</p>
      <p id="load-error" role="alert" hidden>Pelikuvien lataus epäonnistui. Lataa sivu uudelleen.</p>
    </form>
  </section>
  <section id="play" aria-label="Tonttupolun pelimaisema" hidden>
    <div class="stage">
      <img id="panorama" src="Tonttupolku_panoraama.webp" width="3376" height="390" alt="Kolme kivityömaata joulupukin tuvan ja lelupajan välillä." draggable="false">
      <div class="viewport" id="viewport" tabindex="0" aria-label="Vieritettävä maisema">
        <div class="world">
          <div id="pad" role="group" aria-label="Nosturin ohjaus" hidden>
            <button type="button" data-key="G"></button><button type="button" data-key="A"></button>
            <button type="button" data-key="H"></button><button type="button" data-key="C"></button>
            <button type="button" data-key="D"></button>
          </div>
        </div>
      </div>
      <canvas id="lumisade" width="844" height="390" aria-hidden="true"></canvas><canvas id="scene" aria-hidden="true"></canvas>
      <div id="tuner" hidden role="meter" aria-label="Vire, senttiä" aria-valuemin="-50" aria-valuemax="50" aria-valuetext="Ei ääntä">
        <div class="tuner-scale"><i class="tuner-center"></i><i id="tuner-needle" hidden></i></div>
      </div>
    </div>
    <nav aria-label="Polun kohteet">
      <button type="button" aria-label="Joulupukin tupa">Tupa</button><button type="button" aria-label="Työmaa 1">1</button>
      <button type="button" aria-label="Työmaa 2">2</button><button type="button" aria-label="Työmaa 3">3</button>
      <button type="button" aria-label="Lelupaja">Paja</button>
    </nav>
  </section>
  <p id="status" class="sr" role="status" aria-live="polite"></p>
</main>
</body>
</html>
