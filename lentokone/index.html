<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#92d8ff">
<meta name="application-name" content="Lentokone">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lentokone">
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="app/assets/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="app/assets/icons/apple-touch-icon.png">
<title>Lentokone</title>
<link rel="stylesheet" href="app/css/app.css">
</head>
<body>
<div id="game">
  <div id="loadingOverlay" role="status" aria-live="polite" aria-label="Peli latautuu">
    <div class="loading-card">
      <p class="loading-title">Ladataan peliä</p>
      <p id="loadingPercent" class="loading-percent">0 %</p>
      <div class="loading-track" aria-hidden="true"><div id="loadingFill" class="loading-fill"></div></div>
      <p id="loadingStatus" class="loading-status">Valmistellaan lentoonlähtöä…</p>
    </div>
  </div>
  <div id="cloudLayer"></div>

  <div id="plane" class="idle">
    <img class="plane-img" src="app/assets/images/lentokone_sivu.webp" alt="Lentokone">
    <div id="propeller" aria-hidden="true">
      <svg viewBox="0 0 100 100" role="presentation">
        <g class="prop-plane">
          <circle class="prop-blur" cx="50" cy="50" r="36" fill="rgba(28,42,56,.18)"/>
          <g class="prop-blades">
            <path d="M48 9 C56 11, 60 17, 58 28 C55 43, 46 46, 42 34 C39 24, 41 13, 48 9Z" fill="#2e3943"/>
            <path d="M52 91 C44 89, 40 83, 42 72 C45 57, 54 54, 58 66 C61 76, 59 87, 52 91Z" fill="#2e3943"/>
            <rect x="46" y="8" width="8" height="10" rx="3" fill="#efd25c"/>
            <rect x="46" y="82" width="8" height="10" rx="3" fill="#efd25c"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
  <div id="score"><span id="scoreNum">0</span><span id="gameTimer">1:30</span><span id="bonus">NOPEUS ×2 · PISTEET ×2 · 10 s</span></div>
  <div id="flash">+1</div>

  <button id="recalBtn" aria-label="Kalibroi mikrofoni" title="Kalibroi mikrofoni">Kalibroi</button>
  <button id="refreshBtn" aria-label="Päivitä peli" title="Päivitä peli">↻</button>

  <div id="startOverlay">
    <div class="overlay-card start-minimal">
      <p class="instrument-title">Valitse soitin</p>
      <div class="instrument-picker" role="group" aria-label="Soitin">
        <div class="instrument-choice">
          <button id="instrumentFluteBtn" class="instrument-btn" type="button" aria-pressed="false" aria-label="Huilu – aloita peli">
            <img src="app/assets/images/soitin_huilu.webp" alt="Huilu">
            <span class="instrument-label">Huilu</span>
          </button>
          <button id="instrumentFluteInfoBtn" class="instrument-info-btn" type="button" aria-label="Näytä huilun peliohje">i</button>
        </div>
        <div class="instrument-choice">
          <button id="instrumentTromboneBtn" class="instrument-btn" type="button" aria-pressed="false" aria-label="Pasuuna – aloita peli">
            <img src="app/assets/images/soitin_pasuuna.webp" alt="Pasuuna">
            <span class="instrument-label">Pasuuna</span>
          </button>
          <button id="instrumentTromboneInfoBtn" class="instrument-info-btn" type="button" aria-label="Näytä pasuunan peliohje">i</button>
        </div>
      </div>
      <p id="startError"></p>
    </div>
  </div>

  <div id="helpOverlay" role="dialog" aria-modal="true" aria-label="Peliohje">
    <img id="helpImage" src="" alt="">
  </div>

  <div id="finishOverlay" aria-live="polite">
    <div class="overlay-card finish-card">
      <p class="finish-title">Aika!</p>
      <p class="finish-score-label">PISTEET</p>
      <div id="finishScore" class="finish-score">0</div>
      <div class="finish-actions">
        <button id="replayBtn" class="primary" type="button">Uudestaan</button>
        <button id="finishBtn" class="secondary" type="button">Valmis</button>
      </div>
    </div>
  </div>

  <div id="calOverlay" aria-live="polite">
    <div class="cal-ring-stage" role="status" aria-label="Mikrofonin kalibrointi">
      <div class="cal-ring-wrap">
        <svg class="cal-ring-svg" viewBox="0 0 180 180" aria-hidden="true">
          <circle class="cal-ring-track" cx="90" cy="90" r="66"></circle>
          <circle id="calRingProgress" class="cal-ring-progress" cx="90" cy="90" r="66"></circle>
        </svg>
        <div id="calPulse" class="cal-pulse"></div>
        <div id="calDbValue" class="cal-db-readout">–</div>
      </div>
    </div>
  </div>

  <div id="rotateOverlay">
    <div class="overlay-card">
      <div id="rotateIcon">↻</div>
      <h1>Käännä vaakatasoon</h1>
    </div>
  </div>
</div>

<script src="app/js/audio-data.js"></script>
<script src="app/js/app.js"></script>

</body>
</html>
