<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuottipajan käyttöönotto</title><link rel="stylesheet" href="styles.css"><main class="page"><h1>Nuottipaja 0.3.0</h1><p>Lataa tämän paketin sisältö GitHub-repositorion juureen ja julkaise alla olevat säännöt Firebase Console → Cloud Firestore → Rules.</p><p>Oma Firebase-projekti: nuottipaja-502d3. Anonyymi kirjautuminen on oltava käytössä. Uusi kokoelma: nuottipajaRoomsV2.</p><button class="button" id="copy">Kopioi Firestore-säännöt</button><p id="status"></p><pre id="rules" style="white-space:pre-wrap"></pre><a href="index.html">Avaa peli</a></main><script>fetch('firestore.rules').then(r=>r.text()).then(t=>{document.getElementById('rules').textContent=t;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(t);document.getElementById('status').textContent='Kopioitu. Liitä Cloud Firestore → Rules ja paina Publish.';}catch{document.getElementById('status').textContent='Valitse ja kopioi sääntöteksti käsin.'}}})</script></html>
