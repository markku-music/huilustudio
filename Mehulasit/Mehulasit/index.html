<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d8f2ff">
<meta name="application-name" content="Juomalasipeli">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mehulasit">
<link rel="manifest" href="manifest.webmanifest?v=juomalasipeli-mehulasit-v1">
<link rel="icon" type="image/png" sizes="192x192" href="icons/juomalasipeli-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/juomalasipeli-apple-180.png">
<title>Viiden mehulasin peli – 1.9</title>
<link rel="stylesheet" href="pelihalli.css">
<link rel="stylesheet" href="scoreboard.css">
<style>
:root{
  --sky1:#8dd7ff;--sky2:#e9f8ff;--ink:#173f61;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfefff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 80%,#f7fbff)}
#designViewport{
  position:absolute;
  left:50%;top:50%;
  width:1366px;height:768px;
  transform-origin:center center;
  --glass-scale:2.5;
  --label-scale:.5;
}
.controls{position:absolute;top:14px;right:18px;z-index:25;display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 4px 14px rgba(24,77,113,.12);font-size:20px;font-weight:900}
.stage{position:absolute;left:16px;right:16px;top:24px;bottom:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;align-items:end;justify-items:center}
.note-column{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.glass-wrap{position:relative;width:182px;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center}
.glass-scene{position:relative;width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(35,100,139,.16));border-radius:14% 14% 17% 17%;transition:transform .08s ease,filter .08s ease;transform:scale(var(--glass-scale));transform-origin:50% 100%}
.glass-scene>img,.glass-scene>svg,.glass-sticker-wrap{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass-back{z-index:1;object-fit:contain}
.glass-juice{z-index:2;pointer-events:none;overflow:visible}
.glass-sticker-wrap{z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:30% 15% 24%}
.glass-sticker{width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.10));transform:scale(var(--label-scale));transform-origin:center center}
.glass-front{z-index:4;object-fit:contain;pointer-events:none}
.run-clock{position:absolute;top:14px;left:50%;z-index:24;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:7px 16px;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(24,77,113,.12);color:var(--ink);font-weight:950;font-size:20px;font-variant-numeric:tabular-nums}
.run-clock.show{display:flex}
#scoreOverlay{position:fixed;left:0;top:0;width:100%;height:100%;z-index:70;display:none;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(59,137,188,.52);backdrop-filter:blur(8px)}
#scoreOverlay.show{display:flex}
.score-card{position:relative;width:560px;max-width:100%;max-height:100%;overflow:auto;overscroll-behavior:contain;padding:16px 22px;border-radius:22px;background:rgba(255,255,255,.98);box-shadow:0 20px 55px rgba(23,63,97,.25);color:var(--ink);text-align:center}
.score-summary{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:10px}
.score-points{margin:0;line-height:1;font-size:40px;font-weight:950;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.score-total{display:inline-flex;align-items:center;gap:8px;margin:0;padding:8px 12px;border-radius:12px;background:#eef5f9;font-size:12px;font-weight:750}
.score-total strong{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-glasses{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 14px}
.score-glass-item{min-width:0;text-align:center}
.score-mini-glass{position:relative;width:54px;height:81px;margin:0 auto 2px}
.score-mini-glass>img,.score-mini-glass>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.score-note{display:block;font-size:18px;line-height:1.2;font-weight:950}
.score-breath-count{display:block;margin-top:2px;font-size:22px;line-height:1.1;font-weight:950;font-variant-numeric:tabular-nums}
.score-breath-label{display:block;margin-top:1px;font-size:11px;line-height:1.2;font-weight:750;color:#526d80}
.score-actions{display:flex;justify-content:center;gap:10px}
.score-action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:12px;padding:10px 18px;font-family:inherit;font-weight:850;font-size:15px;line-height:1.2;text-decoration:none;white-space:nowrap}
.score-action:focus-visible{outline:3px solid #2879ad;outline-offset:3px}
.score-action.primary-action{background:#173f61;color:#fff}
#scoreOverlay.compact .score-card{padding:8px 18px;border-radius:18px}
#scoreOverlay.compact .score-summary{margin-bottom:4px}
#scoreOverlay.compact .score-points{font-size:36px}
#scoreOverlay.compact .score-total{padding:6px 10px}
#scoreOverlay.compact .score-glasses{margin-bottom:8px}
#scoreOverlay.compact .score-mini-glass{width:38px;height:57px}
#scoreOverlay.compact .score-note{font-size:16px}
#scoreOverlay.compact .score-breath-count{margin-top:0;font-size:19px}
#scoreOverlay.compact .score-breath-label{margin-top:0;font-size:10px}

#startOverlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(92,177,227,.48);backdrop-filter:blur(7px)}
.overlay-card{width:420px;border-radius:24px;padding:22px;background:rgba(255,255,255,.96);text-align:center;box-shadow:0 18px 55px rgba(27,81,116,.2)}
.primary{border:0;border-radius:15px;padding:14px 26px;background:#173f61;color:white;font-weight:950;font-size:20px}
.error{color:#a13c3c;font-size:13px;font-weight:800;min-height:18px;margin:10px 0 0}
#calOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:51;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(18,28,38,.22);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
}

#calOverlay.show{
  display:flex;
  animation:calOverlayIn 180ms ease-out forwards;
}

#calOverlay.show.closing{
  animation:calOverlayOut 150ms ease-in forwards;
}

.cal-ring-stage{
  position:relative;
  width:180px !important;
  height:180px !important;
  display:grid;
  place-items:center;
  overflow:visible;
  background:transparent !important;
  border:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
  filter:none !important;
  transform:scale(.965);
  animation:calRingIn 220ms cubic-bezier(.2,.8,.2,1) forwards;
}

.cal-ring-wrap{
  position:relative;
  width:180px;
  height:180px;
  display:grid;
  place-items:center;
}

.cal-ring-svg{
  position:absolute;
  inset:0;
  width:180px;
  height:180px;
  overflow:visible;
  transform:rotate(-90deg);
}

.cal-ring-track,
.cal-ring-progress{
  fill:none;
  stroke-width:10;
  stroke-linecap:round;
}

.cal-ring-track{
  stroke:#e5edf2;
}

.cal-ring-progress{
  stroke:#254f6b;
  stroke-dasharray:414.69;
  stroke-dashoffset:414.69;
  transition:stroke-dashoffset 70ms linear,stroke 180ms ease;
}

.cal-pulse{
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(37,79,107,.20);
  box-shadow:0 0 0 8px rgba(37,79,107,.045);
  transform:scale(.72);
  opacity:.22;
  transition:transform 80ms ease-out,opacity 80ms ease-out,background 180ms ease,box-shadow 180ms ease;
}

.cal-db-readout{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:18px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.01em;
  color:#173f61;
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}

#calOverlay.complete .cal-ring-progress{
  stroke:#22c55e;
}

#calOverlay.complete .cal-pulse{
  background:rgba(34,197,94,.40);
  box-shadow:0 0 0 10px rgba(34,197,94,.08);
}

@keyframes calOverlayIn{from{opacity:0}to{opacity:1}}

@keyframes calOverlayOut{from{opacity:1}to{opacity:0}}

@keyframes calRingIn{from{transform:scale(.955);opacity:.72}to{transform:scale(1);opacity:1}}

@media(max-width:560px){.cal-ring-stage{
  width:156px !important;
  height:156px !important;
}

.cal-ring-wrap,
.cal-ring-svg{
  width:156px;
  height:156px;
}

.cal-db-readout{
  font-size:16px;
}
}

#rotateOverlay{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:#87cff8}
#rotateOverlay .overlay-card{width:min(360px,88vw)}
#rotateIcon{font-size:48px}
@media(orientation:portrait){#rotateOverlay{display:flex}}
</style>
</head>
<body>
<div id="app">
  <nav class="pelihalli-nav" aria-label="Pelihalli"><a id="playGameHallLink" class="pelihalli-button" href="https://markku-music.github.io/huilustudio/" target="_self"><img class="pelihalli-button__icon" src="pelihalli-icon.svg" width="24" height="24" alt=""><span>Pelihalli</span></a></nav>
  <div id="designViewport">
    <div class="controls">
      <button id="recalBtn" class="iconbtn" type="button" aria-label="Kalibroi" title="Kalibroi">🎙</button>
      <button id="resetFills" class="iconbtn" type="button" aria-label="Tyhjennä" title="Tyhjennä">↺</button>
    </div>

    <div id="runClock" class="run-clock" aria-live="off">⏱ <span id="runClockValue">0,0 s</span></div>

    <main class="stage" id="stage" aria-label="Viisi täytettävää lasia"></main>

  <div id="startOverlay">
    <div class="overlay-card">
      <button id="startBtn" class="primary" type="button">Aloita</button>
      <button class="board-button" type="button" data-open-board>Tulostaulu</button>
      <p id="startError" class="error"></p>
    </div>
  </div>

  </div>
    <div id="scoreOverlay" aria-live="polite">
      <section class="score-card" role="dialog" aria-modal="true" aria-label="Tulokset">
        <div class="score-summary">
          <div class="score-points" id="scorePoints" aria-label="0 pistettä">0</div>
          <div class="score-total">Kokonaisaika <strong id="scoreTotal">0,0 s</strong></div>
          <button id="saveScoreBtn" class="board-button" type="button" disabled>Tallenna</button>
        </div>
        <div id="scoreGlasses" class="score-glasses" role="list" aria-label="Puhallukset laseittain"></div>
        <div class="score-actions">
          <button id="playAgainBtn" class="score-action primary-action" type="button">Pelaa uudestaan</button>
          <button class="board-button" type="button" data-open-board>Tulostaulu</button>
          <a id="gameHallLink" class="pelihalli-button" href="https://markku-music.github.io/huilustudio/" target="_self"><img class="pelihalli-button__icon" src="pelihalli-icon.svg" width="24" height="24" alt=""><span>Pelihalli</span></a>
        </div>
      </section>
    </div>

  <div id="calOverlay" aria-live="polite">
    <div class="cal-ring-stage" role="status" aria-label="Mikrofonin kalibrointi">
      <div class="cal-ring-wrap">
        <svg class="cal-ring-svg" viewBox="0 0 180 180" aria-hidden="true">
          <circle class="cal-ring-track" cx="90" cy="90" r="66"></circle>
          <circle id="calRingProgress" class="cal-ring-progress" cx="90" cy="90" r="66"></circle>
        </svg>
        <div id="calPulse" class="cal-pulse"></div>
        <div id="calDbValue" class="cal-db-readout">–</div>
      </div>
    </div>
  </div>
  <div id="rotateOverlay"><div class="overlay-card"><div id="rotateIcon">↻</div></div></div>
</div>


<dialog id="saveScoreDialog" class="board-dialog" aria-labelledby="saveScoreTitle">
  <form id="saveScoreForm">
    <div class="board-heading"><h2 id="saveScoreTitle">Tallenna tulos</h2><button class="board-close" type="button" data-close-dialog aria-label="Sulje">×</button></div>
    <p class="board-help">Nimimerkki ja tulos näkyvät kaikille.</p>
    <div class="board-fields">
      <label>Nimimerkki<input id="scorePlayerName" name="nickname" maxlength="20" required autocomplete="off" autocapitalize="words"></label>
      <label>Soitin<select id="scoreInstrument" name="instrument"></select></label>
    </div>
    <p id="saveScoreStatus" class="board-status" role="status" aria-live="polite"></p>
    <div class="board-footer"><button class="board-button" type="button" data-close-dialog>Peruuta</button><button id="submitScoreBtn" class="board-button board-button--primary" type="submit">Tallenna tulostauluun</button></div>
  </form>
</dialog>
<dialog id="leaderboardDialog" class="board-dialog board-dialog--wide" aria-labelledby="leaderboardTitle">
  <div class="board-heading"><h2 id="leaderboardTitle">Mehulasit · Tulostaulu</h2><button class="board-close" type="button" data-close-dialog aria-label="Sulje">×</button></div>
  <p class="board-help">50 parasta tulosta · viisi lasia</p>
  <p id="leaderboardStatus" class="board-status" role="status" aria-live="polite"></p>
  <div class="board-table-wrap"><table class="board-table"><thead><tr><th scope="col">#</th><th scope="col">Pelaaja</th><th scope="col">Pisteet</th><th scope="col">Aika</th><th scope="col"><abbr title="Lasikohtaisten puhallusten summa">Puh.</abbr></th></tr></thead><tbody id="leaderboardRows"></tbody></table></div>
  <div class="board-footer"><a class="board-button" href="../tulokset/">Kaikkien pelien tulokset</a><button id="refreshBoardBtn" class="board-button" type="button">Päivitä</button><button class="board-button board-button--primary" type="button" data-close-dialog>Takaisin</button></div>
</dialog>

<script src="engine.js"></script>
<script src="score.js"></script>
<script src="audio-data.js"></script>
<script src="../yhteiset/firebase-config.js"></script>
<script src="../yhteiset/pelimaailma-client.js"></script>
<script src="scoreboard.js"></script>
<script src="scoreboard-ui.js"></script>
<script>
(()=>{
'use strict';
const DESIGN_W=1366;
const DESIGN_H=768;
// Fixed rules for comparable runs; legacy browser settings are not loaded.
const GAME_VERSION='1.9';
const FILL_RATE=20;
const FRAME_MS=16;
const BREATH_GAP_SECONDS=.160;
const MIC_CAL_WARMUP_MS=250,MIC_CAL_MEASURE_MS=1500,MIC_CAL_MARGIN_DB=10;
const NOTES=Object.entries(MehulasitEngine.TARGETS).map(([key,target])=>({
  key,target,sticker:`stickers/${key.toLowerCase()}.webp`
}));
const FLAVORS={
  G:{juice:'#DD2C4A',surface:'#EF6179',accent:'#ef6179'},
  A:{juice:'#96DD2C',surface:'#B7EF61',accent:'#96dd2c'},
  H:{juice:'#DD852C',surface:'#EFA861',accent:'#efa861'},
  C:{juice:'#2C3BDD',surface:'#616DEF',accent:'#616def'},
  D:{juice:'#DD2C85',surface:'#EF61A8',accent:'#ef61a8'}
};
const SVG_NS='http://www.w3.org/2000/svg';
const BUBBLE_SCALE=2;
const GLASS_TOP=154,GLASS_BOTTOM=1330,GLASS_VISUAL_MAX=98;
const GLASS_INNER_LEFT=286,GLASS_INNER_RIGHT=738,GLASS_CENTER_X=512;
const SURFACE_RY_KEYFRAMES=[[0,30],[1,36],[3,20],[4,20],[6,23],[98,30],[100,30]];
const glassFx={};
let bubbleAnimationLast=performance.now();
const $=s=>document.querySelector(s);
const stage=$('#stage');
const designViewport=$('#designViewport');
const startOverlay=$('#startOverlay'),startError=$('#startError');
const runClock=$('#runClock'),runClockValue=$('#runClockValue');
const scoreOverlay=$('#scoreOverlay'),scorePoints=$('#scorePoints'),scoreTotal=$('#scoreTotal'),scoreGlasses=$('#scoreGlasses');
const calOverlay=$('#calOverlay'),calProgressRing=$('#calRingProgress'),calPulse=$('#calPulse'),calDbValue=$('#calDbValue');
let engine=null,recognitionTimer=null,lastRecognitionAt=0,ready=false;
let ctx=null,stream=null,micSource=null,analyser=null,timeData=null;
let micLifecycleId=0,micStartPromise=null,calibrationBusy=false,dbThreshold=-70;
let breathNotes=new Set(),quietSince=null;
let breathCounts={G:0,A:0,H:0,C:0,D:0};
let effectBuffer=null;
const effectSources=new Set();
let visualDirty=true;
let fills={G:0,A:0,H:0,C:0,D:0};
let runStartedAt=null,runEndedAt=null,activeAttemptKey=null,activeAttemptStartedAt=null;
let noteTimes={G:0,A:0,H:0,C:0,D:0};
let completedNotes={G:false,A:false,H:false,C:false,D:false};
let lastResult=null;

function formatSeconds(v){return `${Math.max(0,Number(v)||0).toFixed(1).replace('.',',')} s`}
function resetPerformanceTracking(){
  window.MehulasitBoardUI?.setResult(null);
  runStartedAt=null;runEndedAt=null;activeAttemptKey=null;activeAttemptStartedAt=null;
  noteTimes={G:0,A:0,H:0,C:0,D:0};completedNotes={G:false,A:false,H:false,C:false,D:false};
  lastResult=null;scorePoints.textContent='0';scorePoints.setAttribute('aria-label','0 pistettä');scoreTotal.textContent='0,0 s';scoreGlasses.replaceChildren();
  runClock.classList.remove('show');runClockValue.textContent='0,0 s';scoreOverlay.classList.remove('show');
}
function startRunIfNeeded(key,now){
  if(runStartedAt!==null)return;
  runStartedAt=now;
  runClockValue.textContent='0,0 s';runClock.classList.add('show');
  activeAttemptKey=key;activeAttemptStartedAt=now;
}
function commitActiveAttempt(now){
  if(!activeAttemptKey||activeAttemptStartedAt===null)return;
  if(!completedNotes[activeAttemptKey])noteTimes[activeAttemptKey]+=Math.max(0,(now-activeAttemptStartedAt)/1000);
  activeAttemptStartedAt=now;
}
function switchActiveAttempt(key,now){
  if(!key||completedNotes[key])return;
  if(activeAttemptKey===key){if(activeAttemptStartedAt===null)activeAttemptStartedAt=now;return}
  if(activeAttemptKey)commitActiveAttempt(now);
  activeAttemptKey=key;activeAttemptStartedAt=now;
}
function completeAttempt(key,now){
  if(completedNotes[key])return;
  if(activeAttemptKey===key){commitActiveAttempt(now);activeAttemptKey=null;activeAttemptStartedAt=null}
  completedNotes[key]=true;
  // Freeze the result at the last fill, before its cue or the next animation frame.
  if(NOTES.every(note=>completedNotes[note.key]))finishRun(now);
  playFullSound();
}
function updateRunClock(now=performance.now()){
  if(runStartedAt===null||runEndedAt!==null)return;
  runClockValue.textContent=formatSeconds((now-runStartedAt)/1000);
}
function buildScoreboard(){
  if(!lastResult)return;
  scorePoints.textContent=String(lastResult.points);
  scorePoints.setAttribute('aria-label',`${lastResult.points} ${lastResult.points===1?'piste':'pistettä'}`);
  scoreTotal.textContent=formatSeconds(lastResult.durationMs/1000);
  scoreGlasses.replaceChildren();
  for(const n of NOTES){
    const flavor=FLAVORS[n.key],count=lastResult.breaths[n.key];
    const el=document.createElement('div');el.className='score-glass-item';
    el.setAttribute('role','listitem');
    el.setAttribute('aria-label',`${n.key}: ${count} ${count===1?'puhallus':'puhallusta'}`);
    el.innerHTML=`<div class="score-mini-glass" aria-hidden="true"><img src="glass-empty.webp" alt=""><svg viewBox="0 0 1024 1536"><path d="M 269 178 L 755 178 L 755 1110 C 755 1200 740 1255 693 1293 C 650 1328 374 1328 331 1293 C 284 1255 269 1200 269 1110 Z" fill="${flavor.juice}"/><ellipse cx="512" cy="178" rx="243" ry="30" fill="${flavor.surface}"/></svg><img src="glass-front.png" alt=""></div><span class="score-note">${n.key}</span><span class="score-breath-count">${count}</span><span class="score-breath-label">${count===1?'puhallus':'puhallusta'}</span>`;
    scoreGlasses.appendChild(el);
  }
}
function finishRun(now=performance.now()){
  if(runStartedAt===null||runEndedAt!==null)return;
  if(activeAttemptKey)commitActiveAttempt(now);
  runEndedAt=now;activeAttemptKey=null;activeAttemptStartedAt=null;
  const score=MehulasitScore.calculate(runEndedAt-runStartedAt,breathCounts);
  if(!score)return;
  // A frozen round is offered to the scoreboard; saving requires the player’s button press.
  lastResult={...score,gameVersion:GAME_VERSION,engineVersion:'yin-bench-1.2',playMode:'continuous-v1',
    finishedAt:new Date().toISOString(),noteSeconds:{...noteTimes},
    sampleRate:ctx?.sampleRate??null,engineSettings:{...engine?.settings},targets:{...MehulasitEngine.TARGETS}};
  runClockValue.textContent=formatSeconds(score.durationMs/1000);runClock.classList.remove('show');
  buildScoreboard();scoreOverlay.classList.add('show');
  window.MehulasitBoardUI?.setResult(lastResult);
}
function resetGame(){
  for(const n of NOTES)fills[n.key]=0;
  stopFullSound();
  breathNotes.clear();quietSince=null;
  breathCounts={G:0,A:0,H:0,C:0,D:0};engine?.reset();
  resetPerformanceTracking();renderAll();
}

function fitDesignToViewport(){
  const vv=window.visualViewport;
  const w=vv?.width||window.innerWidth||DESIGN_W;
  const h=vv?.height||window.innerHeight||DESIGN_H;
  const scale=Math.min(w/DESIGN_W,h/DESIGN_H);
  designViewport.style.transform=`translate(-50%,-50%) scale(${scale.toFixed(5)})`;
  // Keep results outside the scaled game, within the visible browser area.
  scoreOverlay.style.width=w+'px';scoreOverlay.style.height=h+'px';

      const p=b.life/b.ttl,depth=b.depth*(1-p),half=Math.max(18,innerHalfWidthAtY(fx.currentSurfaceY+depth)-b.r-6),wave=Math.sin(b.life*10+b.phase)*b.wobble,x=GLASS_CENTER_X+(b.xNorm*2-1)*half+wave+b.drift*p*.35,y=fx.currentSurfaceY+Math.max(1,depth),fade=Math.sin(p*Math.PI),op=b.baseOpacity*fade*fx.surfaceFizz;

function renderAll(){

function resetBreathTracking(){breathNotes.clear();quietSince=null;engine?.reset()}
function audioTime(){return ctx?.currentTime||0}

// An unrecognized pitch is not a new breath. Only actual silence rearms it.
// Each glass is counted once per continuous breath, including legato returns.
function observeVoice(){
  if(quietSince!==null&&audioTime()-quietSince>=BREATH_GAP_SECONDS)breathNotes.clear();
  quietSince=null;
}
function receiveInput(detail){
  if(!ready||document.hidden)return;
  observeVoice();
  if(!detail.accepted)return;
  const key=detail.note;
  if(!(key in fills))return;
  if(completedNotes[key]||runEndedAt!==null)return;
  const dt=Math.max(0,Math.min(.08,detail.dtMs/1000));
  if(!dt)return;
  const now=performance.now(),activityAt=now-dt*1000;
  startRunIfNeeded(key,activityAt);switchActiveAttempt(key,activityAt);
  if(!breathNotes.has(key)){breathNotes.add(key);breathCounts[key]++}
  fills[key]=clamp(fills[key]+FILL_RATE*detail.speed*dt,0,100);
  visualDirty=true;
  if(fills[key]>=100)completeAttempt(key,now);
}
function receiveSilence(){
  if(!ready)return;
  if(quietSince===null)quietSince=audioTime();
}
async function loadFullSound(context=ctx){
  const bytes=Uint8Array.from(atob(window.MEHULASIT_SOUND_BASE64),c=>c.charCodeAt(0));
  effectBuffer=await context.decodeAudioData(bytes.buffer);
}
function playFullSound(){
  if(!effectBuffer||!ctx||document.hidden)return;
  const context=ctx;
  const source=context.createBufferSource(),gain=context.createGain();
  source.buffer=effectBuffer;gain.gain.value=.55;
  source.connect(gain);gain.connect(context.destination);
  source.onended=()=>{source.disconnect();gain.disconnect();effectSources.delete(source)};
  effectSources.add(source);
  // The cue plays while recognition, filling and the run clock continue.
  source.start();
}
function stopFullSound(){
  for(const source of effectSources){try{source.stop()}catch(_){}}
  effectSources.clear();
}
function rmsDb(buf){
  let s=0;
  for(let i=0;i<buf.length;i++){const v=buf[i];s+=v*v}
  const rms=Math.sqrt(s/buf.length)||1e-12;
  return {rms,db:20*Math.log10(rms)};
}
function sleepMs(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function updateCalibrationVisual(db,progress){
  const p=clamp(progress,0,1);
  if(calProgressRing)calProgressRing.style.strokeDashoffset=(414.69-p*414.69).toFixed(2);
  const shown=Number.isFinite(db)?clamp(db,-90,-30):-90;
  const level=clamp((shown+90)/60,0,1);
  const eased=Math.pow(level,.62);
  if(calPulse){
    calPulse.style.transform=`scale(${(0.72+0.34*eased).toFixed(3)})`;
    calPulse.style.opacity=(0.24+0.62*eased).toFixed(3);
  }
  if(calDbValue)calDbValue.textContent=Number.isFinite(db)?`${Math.round(shown)} dB`:'–';
  calOverlay.classList.toggle('complete',p>=.999);
}
async function calibrateMicrophoneNoiseFloor(lifecycleId=micLifecycleId){
  if(!analyser||!timeData)return false;
  pauseRecognition();
  calOverlay.classList.remove('complete','closing');
  calOverlay.classList.add('show');
  updateCalibrationVisual(-90,0);

  const totalMs=MIC_CAL_WARMUP_MS+MIC_CAL_MEASURE_MS;
  const overallStart=performance.now();

  // Lämmittely: näytetään live-taso, mutta näitä näytteitä ei käytetä kynnyksen laskentaan.
  while(performance.now()-overallStart<MIC_CAL_WARMUP_MS){
    if(lifecycleId!==micLifecycleId)return false;
    analyser.getFloatTimeDomainData(timeData);
    const level=rmsDb(timeData);
    const elapsed=performance.now()-overallStart;
    updateCalibrationVisual(level.db,elapsed/totalMs);
    await sleepMs(33);
  }

  const samples=[];
  const measureStart=performance.now();
  while(performance.now()-measureStart<MIC_CAL_MEASURE_MS){
    if(lifecycleId!==micLifecycleId)return false;
    analyser.getFloatTimeDomainData(timeData);
    const level=rmsDb(timeData);
    if(Number.isFinite(level.db))samples.push(level.db);
    const elapsed=MIC_CAL_WARMUP_MS+(performance.now()-measureStart);
    updateCalibrationVisual(level.db,elapsed/totalMs);
    await sleepMs(33);
  }

  if(lifecycleId!==micLifecycleId)return false;
  if(!samples.length){dbThreshold=-70}
  else{
    samples.sort((a,b)=>a-b);
    const mid=Math.floor(samples.length/2);
    const noiseFloor=samples.length%2?samples[mid]:(samples[mid-1]+samples[mid])/2;
    dbThreshold=Math.max(-70,Math.min(-20,Math.round(noiseFloor+MIC_CAL_MARGIN_DB)));
  }
  updateCalibrationVisual(samples.length?samples[Math.floor(samples.length/2)]:-90,1);
  await sleepMs(300);
  if(lifecycleId!==micLifecycleId)return false;
  calOverlay.classList.add('closing');
  await sleepMs(150);
  if(lifecycleId!==micLifecycleId)return false;
  resumeRecognition();
  calOverlay.classList.remove('show','complete','closing');
  return true;
}
// Game-specific connection points only. The calibration UI/measurement above
// comes from lentokone3; no extra animation waits or sound decoding precede it.
function pauseRecognition(){
  ready=false;calibrationBusy=true;
  if(recognitionTimer!==null){clearInterval(recognitionTimer);recognitionTimer=null}
  stopFullSound();resetBreathTracking();
}
function resumeRecognition(){
  calibrationBusy=false;
  if(!engine)return; // First start attaches YIN after effect preloading.
  engine.configure({gateDb:dbThreshold});
  resetBreathTracking();lastRecognitionAt=performance.now();ready=true;
  if(recognitionTimer===null)recognitionTimer=setInterval(processFrame,FRAME_MS);
}
function startRecognition(){
  // Exact, unmodified engine and defaults from the working testbench 1.2.
  engine=new MehulasitEngine.BenchEngine();
  resumeRecognition();
}
function processFrame(){
  const now=performance.now(),dtMs=Math.max(0,Math.min(80,now-lastRecognitionAt));
  lastRecognitionAt=now;
  if(!ready||document.hidden||!analyser||ctx?.state!=='running')return;
  analyser.getFloatTimeDomainData(timeData);
  const result=engine.process(timeData,ctx.sampleRate);
  if(!result.loud){receiveSilence();return}
  receiveInput({...result.experiment,dtMs});
}
function stopMic(){
  ++micLifecycleId;micStartPromise=null;ready=false;calibrationBusy=false;
  if(recognitionTimer!==null){clearInterval(recognitionTimer);recognitionTimer=null}
  stopFullSound();resetBreathTracking();
  try{micSource?.disconnect()}catch{}
  try{analyser?.disconnect()}catch{}
  if(stream)for(const track of stream.getTracks())track.stop();
  const previousContext=ctx;
  engine=null;ctx=null;stream=null;micSource=null;analyser=null;timeData=null;
  calOverlay.classList.remove('show','complete','closing');
  if(previousContext&&previousContext.state!=='closed'){
    void previousContext.close().catch(err=>console.warn('Äänikontekstin sulkeminen epäonnistui:',err));
  }
}

function startMic(){
  if(micStartPromise)return micStartPromise;
  if(stream&&ctx?.state!=='closed'&&stream.getAudioTracks().some(track=>track.readyState==='live'))return Promise.resolve(true);
  stopMic();
  const lifecycleId=micLifecycleId;
  const pending=(async()=>{
    try{
      if(!navigator.mediaDevices?.getUserMedia)throw new Error('Selain ei tue mikrofonikäyttöä.');
      const AudioContextClass=window.AudioContext||window.webkitAudioContext;
      if(!AudioContextClass)throw new Error('Selain ei tue äänen käsittelyä.');
      const context=new AudioContextClass();
      ctx=context;
      const resumed=context.state==='running'?Promise.resolve():context.resume();
      const supported=navigator.mediaDevices.getSupportedConstraints?navigator.mediaDevices.getSupportedConstraints():{};
      const constraints={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
      if(supported.voiceIsolation)constraints.voiceIsolation=false;
      const captured=navigator.mediaDevices.getUserMedia({audio:constraints}).then(capturedStream=>{
        if(lifecycleId!==micLifecycleId){
          capturedStream.getTracks().forEach(track=>track.stop());
          throw new Error('Mikrofonin avaus peruttiin.');
        }
        stream=capturedStream;
        return capturedStream;
      });
      const [,capturedStream]=await Promise.all([resumed,captured]);
      if(lifecycleId!==micLifecycleId)throw new Error('Mikrofonin avaus peruttiin.');
      micSource=context.createMediaStreamSource(capturedStream);
      analyser=context.createAnalyser();
      analyser.fftSize=8192;
      analyser.smoothingTimeConstant=.08;
      analyser.minDecibels=-110;
      analyser.maxDecibels=-10;
      micSource.connect(analyser);
      timeData=new Float32Array(analyser.fftSize);
      await calibrateMicrophoneNoiseFloor(lifecycleId);
      if(lifecycleId!==micLifecycleId)throw new Error('Mikrofonin avaus peruttiin.');
      return true;
    }catch(err){
      if(lifecycleId===micLifecycleId)stopMic();
      throw err;
    }
  })();
  micStartPromise=pending;
  const release=()=>{if(micStartPromise===pending)micStartPromise=null;};
  pending.then(release,release);
  return pending;
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopFullSound();resetBreathTracking()}
});
window.addEventListener('pagehide',stopMic);
window.addEventListener('pageshow',event=>{if(event.persisted&&!stream){calOverlay.classList.remove('show','complete','closing');startOverlay.style.display='flex';$('#startBtn').disabled=false}});

}

$('#startBtn').addEventListener('click',async()=>{
