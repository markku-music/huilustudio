<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d8f2ff">
<meta name="application-name" content="Juomalasipeli">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mehulasit">
<link rel="manifest" href="manifest.webmanifest?v=juomalasipeli-mehulasit-v1">
<link rel="icon" type="image/png" sizes="192x192" href="icons/juomalasipeli-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/juomalasipeli-apple-180.png">
<title>Viiden mehulasin peli – Resonator 1.5</title>
<style>
:root{
  --sky1:#8dd7ff;--sky2:#e9f8ff;--ink:#173f61;--panel:rgba(255,255,255,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfefff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 80%,#f7fbff)}
#designViewport{
  position:absolute;
  left:50%;top:50%;
  width:1366px;height:768px;
  transform-origin:center center;
  --glass-user-scale:1;
  --label-user-scale:1;
  --score-width:620px;
  --score-chart-height:240px;
  --score-bar-width:42px;
  --score-gap:14px;
}
.controls{position:absolute;top:14px;right:18px;z-index:25;display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 4px 14px rgba(24,77,113,.12);font-size:20px;font-weight:900}
.stage{position:absolute;left:16px;right:16px;top:24px;bottom:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;align-items:end;justify-items:center}
.note-column{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0;--accent:#ffffff}
.glass-wrap{position:relative;width:182px;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center}
.glass-scene{position:relative;width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(35,100,139,.16));border-radius:14% 14% 17% 17%;transition:transform .08s ease,filter .08s ease;transform:scale(var(--glass-user-scale));transform-origin:50% 100%}
.glass-scene>img,.glass-scene>svg,.glass-sticker-wrap{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass-back{z-index:1;object-fit:contain}
.glass-juice{z-index:2;pointer-events:none;overflow:visible}
.glass-sticker-wrap{z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:30% 15% 24%}
.glass-sticker{width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.10));transform:scale(var(--label-user-scale));transform-origin:center center}
.glass-front{z-index:4;object-fit:contain;pointer-events:none}
.live-ring{display:none}
.note-column.active .glass-scene{transform:scale(var(--glass-user-scale))}
.settings-panel{position:absolute;top:66px;right:18px;z-index:95;width:330px;max-height:680px;overflow:auto;padding:16px;border-radius:18px;background:var(--panel);box-shadow:0 14px 34px rgba(24,77,113,.19);display:none;color:var(--ink)}
.settings-panel.open{display:block}
.setting{display:grid;gap:6px;margin-bottom:15px}
.setting:last-of-type{margin-bottom:10px}
.setting-head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:850}
.setting-value{font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.settings-panel input[type=range]{width:100%;accent-color:#2879ad}
.settings-reset{width:100%;border:0;border-radius:11px;padding:9px 10px;background:#e8f2f8;color:var(--ink);font-weight:850}
.settings-section-title{margin:4px 0 10px;padding-top:10px;border-top:1px solid rgba(23,63,97,.13);font-size:13px;font-weight:950;letter-spacing:.04em;text-transform:uppercase;color:rgba(23,63,97,.72)}
.settings-json{width:100%;height:92px;margin:8px 0 7px;padding:8px 9px;resize:vertical;border:1px solid rgba(23,63,97,.18);border-radius:10px;background:#f7fbfe;color:var(--ink);font:700 11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
.settings-json-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.settings-json-btn{border:0;border-radius:10px;padding:8px 8px;background:#e8f2f8;color:var(--ink);font-weight:900}
.settings-json-status{min-height:16px;margin:0 0 8px;font-size:11px;font-weight:800;color:rgba(23,63,97,.72)}
.run-clock{position:absolute;top:14px;left:50%;z-index:24;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:7px 16px;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(24,77,113,.12);color:var(--ink);font-weight:950;font-size:20px;font-variant-numeric:tabular-nums}
.run-clock.show{display:flex}
#scoreOverlay{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(59,137,188,.52);backdrop-filter:blur(8px)}
#scoreOverlay.show{display:flex}
.score-card{position:relative;width:var(--score-width);max-width:92vw;padding:12px 18px 14px;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 20px 55px rgba(23,63,97,.25);color:var(--ink);text-align:center}
.score-settings-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(232,242,248,.96);color:var(--ink);font-size:15px;font-weight:950;z-index:2}
.score-title,.score-ideal-label,.score-feedback,.score-sub{display:none}
.score-total{margin:0 32px 2px;font-size:22px;font-weight:1000;font-variant-numeric:tabular-nums}
.score-chart{position:relative;height:var(--score-chart-height);margin:0 4px 2px;padding:8px 16px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--score-gap);align-items:end;border-bottom:3px solid rgba(23,63,97,.18)}
.score-ideal-line{position:absolute;left:10px;right:10px;height:0;border-top:3px dashed rgba(23,63,97,.44);pointer-events:none}
.score-bar-item{height:100%;display:grid;grid-template-rows:24px 1fr 52px;align-items:end;justify-items:center;min-width:0}
.score-bar-time{font-size:15px;font-weight:950;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-bar-area{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.score-bar-shell{width:var(--score-bar-width);max-width:88%;min-height:8px;border-radius:13px 13px 6px 6px;background:var(--bar-color);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),0 6px 14px rgba(23,63,97,.13);transition:height .35s ease}
.score-bar-item.practice .score-bar-shell{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 0 0 4px rgba(23,63,97,.14),0 7px 18px rgba(23,63,97,.2)}
.score-bar-note{margin-top:5px;font-size:21px;font-weight:1000}
.score-breaths{display:block;font-size:12px;font-weight:800;white-space:nowrap;margin-top:2px}
.score-feedback{margin:12px 0 4px;font-size:20px;font-weight:950}
.score-sub{margin:0;color:rgba(23,63,97,.72);font-size:13px;font-weight:750}
.score-actions{display:flex;justify-content:center;gap:8px;margin-top:8px}
.score-action{border:0;border-radius:11px;padding:8px 15px;font-weight:950;font-size:14px}
.score-action.primary-action{background:#173f61;color:#fff}
.score-action.secondary-action{background:#e8f2f8;color:#173f61}
#startOverlay,#calOverlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(92,177,227,.48);backdrop-filter:blur(7px)}
.overlay-card{width:420px;border-radius:24px;padding:22px;background:rgba(255,255,255,.96);text-align:center;box-shadow:0 18px 55px rgba(27,81,116,.2)}
.primary{border:0;border-radius:15px;padding:14px 26px;background:#173f61;color:white;font-weight:950;font-size:20px}
.error{color:#a13c3c;font-size:13px;font-weight:800;min-height:18px;margin:10px 0 0}
#calOverlay{
  display:none;
  position:absolute;
  inset:0;
  z-index:80;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(18,28,38,.22);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
}

#calOverlay.show{
  display:flex;
  animation:calOverlayIn 180ms ease-out forwards;
}

#calOverlay.show.closing{
  animation:calOverlayOut 150ms ease-in forwards;
}

.cal-ring-stage{
  position:relative;
  width:180px !important;
  height:180px !important;
  display:grid;
  place-items:center;
  overflow:visible;
  background:transparent !important;
  border:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
  filter:none !important;
  transform:scale(.965);
  animation:calRingIn 220ms cubic-bezier(.2,.8,.2,1) forwards;
}

.cal-ring-wrap{
  position:relative;
  width:180px;
  height:180px;
  display:grid;
  place-items:center;
}

.cal-ring-svg{
  position:absolute;
  inset:0;
  width:180px;
  height:180px;
  overflow:visible;
  transform:rotate(-90deg);
}

.cal-ring-track,
.cal-ring-progress{
  fill:none;
  stroke-width:10;
  stroke-linecap:round;
}

.cal-ring-track{
  stroke:#e5edf2;
}

.cal-ring-progress{
  stroke:#254f6b;
  stroke-dasharray:414.69;
  stroke-dashoffset:414.69;
  transition:stroke-dashoffset 70ms linear,stroke 180ms ease;
}

.cal-pulse{
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(37,79,107,.20);
  box-shadow:0 0 0 8px rgba(37,79,107,.045);
  transform:scale(.72);
  opacity:.22;
  transition:transform 80ms ease-out,opacity 80ms ease-out,background 180ms ease,box-shadow 180ms ease;
}

.cal-db-readout{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:18px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.01em;
  color:#173f61;
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}

#calOverlay.complete .cal-ring-progress{
  stroke:#22c55e;
}

#calOverlay.complete .cal-pulse{
  background:rgba(34,197,94,.40);
  box-shadow:0 0 0 10px rgba(34,197,94,.08);
}

@keyframes calOverlayIn{from{opacity:0}to{opacity:1}}

@keyframes calOverlayOut{from{opacity:1}to{opacity:0}}

@keyframes calRingIn{from{transform:scale(.955);opacity:.72}to{transform:scale(1);opacity:1}}

@media(max-width:560px){.cal-ring-stage{
  width:156px !important;
  height:156px !important;
}

.cal-ring-wrap,
.cal-ring-svg{
  width:156px;
  height:156px;
}

.cal-db-readout{
  font-size:16px;
}
}

#rotateOverlay{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:#87cff8}
#rotateOverlay .overlay-card{width:min(360px,88vw)}
#rotateIcon{font-size:48px}
@media(orientation:portrait){#rotateOverlay{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="designViewport">
    <div class="controls">
      <button id="recalBtn" class="iconbtn" type="button" aria-label="Kalibroi" title="Kalibroi">🎙</button>
      <button id="resetFills" class="iconbtn" type="button" aria-label="Tyhjennä" title="Tyhjennä">↺</button>
      <button id="settingsBtn" class="iconbtn" type="button" aria-label="Asetukset" title="Asetukset">⚙</button>
    </div>

    <div id="runClock" class="run-clock" aria-live="off">⏱ <span id="runClockValue">0,0 s</span></div>

    <div id="settingsPanel" class="settings-panel">
      <div style="font-size:12px;font-weight:900;opacity:.62;margin-bottom:8px">VERSIO 1.5 • RESONATOR</div>
      <div class="setting">
        <div class="setting-head"><label for="glassScaleSlider">Lasien koko</label><span id="glassScaleValue" class="setting-value">250 %</span></div>
        <input id="glassScaleSlider" type="range" min="70" max="250" step="1" value="250">
      </div>
      <div class="setting">
        <div class="setting-head"><label for="labelScaleSlider">Etikettien koko</label><span id="labelScaleValue" class="setting-value">50 %</span></div>
        <input id="labelScaleSlider" type="range" min="50" max="150" step="1" value="50">
      </div>
      <div class="setting">
        <div class="setting-head"><label for="fillRateSlider">Täyttönopeus</label><span id="fillRateValue" class="setting-value">20.0 %/s</span></div>
        <input id="fillRateSlider" type="range" min="1" max="20" step="0.5" value="20">
      </div>
      <div class="settings-section-title">Scoreboard</div>
      <div class="setting">
        <div class="setting-head"><label for="scoreWidthSlider">Taulun leveys</label><span id="scoreWidthValue" class="setting-value">620 px</span></div>
        <input id="scoreWidthSlider" type="range" min="440" max="820" step="10" value="620">
      </div>
      <div class="setting">
        <div class="setting-head"><label for="scoreHeightSlider">Palkkialueen korkeus</label><span id="scoreHeightValue" class="setting-value">240 px</span></div>
        <input id="scoreHeightSlider" type="range" min="160" max="360" step="10" value="240">
      </div>
      <div class="setting">
        <div class="setting-head"><label for="scoreBarWidthSlider">Palkkien leveys</label><span id="scoreBarWidthValue" class="setting-value">42 px</span></div>
        <input id="scoreBarWidthSlider" type="range" min="24" max="80" step="2" value="42">
      </div>
      <div class="setting">
        <div class="setting-head"><label for="scoreGapSlider">Palkkien väli</label><span id="scoreGapValue" class="setting-value">14 px</span></div>
        <input id="scoreGapSlider" type="range" min="4" max="40" step="2" value="14">
      </div>
      <div class="settings-section-title">JSON</div>
      <textarea id="settingsJson" class="settings-json" spellcheck="false" aria-label="Asetusten JSON"></textarea>
      <div class="settings-json-actions">
        <button id="exportJsonBtn" class="settings-json-btn" type="button">Vie JSON</button>
        <button id="importJsonBtn" class="settings-json-btn" type="button">Tuo JSON</button>
      </div>
      <p id="settingsJsonStatus" class="settings-json-status"></p>
      <button id="resetUiSettings" class="settings-reset" type="button">Palauta asetukset</button>
    </div>

    <main class="stage" id="stage" aria-label="Viisi täytettävää lasia"></main>

    <div id="scoreOverlay" aria-live="polite">
      <section class="score-card" role="dialog" aria-modal="true" aria-label="Tulokset">
        <button id="scoreSettingsBtn" class="score-settings-btn" type="button" aria-label="Scoreboardin asetukset" title="Scoreboardin asetukset">⚙</button>
        <div class="score-total">Kokonaisaika <span id="scoreTotal">0,0 s</span></div>
        <div id="scoreChart" class="score-chart">
          <div id="scoreIdealLine" class="score-ideal-line"></div>
        </div>
        <div class="score-actions">
          <button id="playAgainBtn" class="score-action primary-action" type="button">Pelaa uudestaan</button>
          <button id="closeScoreBtn" class="score-action secondary-action" type="button">Sulje tulokset</button>
        </div>
      </section>
    </div>

  <div id="startOverlay">
    <div class="overlay-card">
      <button id="startBtn" class="primary" type="button">Aloita</button>
      <p id="startError" class="error"></p>
    </div>
  </div>

  <div id="calOverlay" aria-live="polite">
    <div class="cal-ring-stage" role="status" aria-label="Mikrofonin kalibrointi">
      <div class="cal-ring-wrap">
        <svg class="cal-ring-svg" viewBox="0 0 180 180" aria-hidden="true">
          <circle class="cal-ring-track" cx="90" cy="90" r="66"></circle>
          <circle id="calRingProgress" class="cal-ring-progress" cx="90" cy="90" r="66"></circle>
        </svg>
        <div id="calPulse" class="cal-pulse"></div>
        <div id="calDbValue" class="cal-db-readout">–</div>
      </div>
    </div>
  </div>


  </div>
  <div id="rotateOverlay"><div class="overlay-card"><div id="rotateIcon">↻</div></div></div>
</div>

<script src="resonator-engine.js"></script>
<script src="audio-data.js"></script>
<script>
(()=>{
'use strict';
const DESIGN_W=1366;
const DESIGN_H=768;
const UI_SETTINGS_KEY='juomalasipeli-ui-scoreboard-1-4-3-isolated';
const SETTINGS_VERSION='mehulasit-1.5';
const BREATH_GAP_SECONDS=.160;
const NOTES=[
  {key:'G',target:440*2**(-2/12),sticker:'stickers/g.webp'},
  {key:'A',target:440,sticker:'stickers/a.webp'},
  {key:'H',target:440*2**(2/12),sticker:'stickers/h.webp'},
  {key:'C',target:440*2**(3/12),sticker:'stickers/c.webp'},
  {key:'D',target:440*2**(5/12),sticker:'stickers/d.webp'}
];
const TARGETS=Object.fromEntries(NOTES.map(n=>[n.key,n.target]));
const FLAVORS={
  G:{juice:'#DD2C4A',surface:'#EF6179',accent:'#ef6179'},
  A:{juice:'#96DD2C',surface:'#B7EF61',accent:'#96dd2c'},
  H:{juice:'#DD852C',surface:'#EFA861',accent:'#efa861'},
  C:{juice:'#2C3BDD',surface:'#616DEF',accent:'#616def'},
  D:{juice:'#DD2C85',surface:'#EF61A8',accent:'#ef61a8'}
};
const SVG_NS='http://www.w3.org/2000/svg';
const BUBBLE_SCALE=2;
const GLASS_TOP=154,GLASS_BOTTOM=1330,GLASS_VISUAL_MAX=98;
const GLASS_INNER_LEFT=286,GLASS_INNER_RIGHT=738,GLASS_CENTER_X=512;
const SURFACE_RY_KEYFRAMES=[[0,30],[1,36],[3,20],[4,20],[6,23],[98,30],[100,30]];
const glassFx={};
let bubbleAnimationLast=performance.now();
const $=s=>document.querySelector(s);
const stage=$('#stage');
const designViewport=$('#designViewport');
const settingsPanel=$('#settingsPanel');
const glassScaleSlider=$('#glassScaleSlider'),labelScaleSlider=$('#labelScaleSlider'),fillRateSlider=$('#fillRateSlider');
const glassScaleValue=$('#glassScaleValue'),labelScaleValue=$('#labelScaleValue'),fillRateValue=$('#fillRateValue');
const scoreWidthSlider=$('#scoreWidthSlider'),scoreHeightSlider=$('#scoreHeightSlider'),scoreBarWidthSlider=$('#scoreBarWidthSlider'),scoreGapSlider=$('#scoreGapSlider');
const scoreWidthValue=$('#scoreWidthValue'),scoreHeightValue=$('#scoreHeightValue'),scoreBarWidthValue=$('#scoreBarWidthValue'),scoreGapValue=$('#scoreGapValue');
const settingsJson=$('#settingsJson'),settingsJsonStatus=$('#settingsJsonStatus');
const startOverlay=$('#startOverlay'),startError=$('#startError');
const runClock=$('#runClock'),runClockValue=$('#runClockValue');
const scoreOverlay=$('#scoreOverlay'),scoreChart=$('#scoreChart'),scoreTotal=$('#scoreTotal'),scoreIdealLine=$('#scoreIdealLine'),scoreIdealLabel=$('#scoreIdealLabel'),scoreFeedback=$('#scoreFeedback');
const calOverlay=$('#calOverlay'),calProgressRing=$('#calRingProgress'),calPulse=$('#calPulse'),calDbValue=$('#calDbValue');
let engine=null,stability=null,ready=false,calibrationToken=0;
let breathNotes=new Set(),quietSince=null;
let breathCounts={G:0,A:0,H:0,C:0,D:0};
let effectBuffer=null,effectSource=null,effectUntil=0,effectPauseAt=null;
let visualDirty=true;
let fills={G:0,A:0,H:0,C:0,D:0};
let currentActiveKey=null,currentActiveMatch=0;
let uiSettings={glassScale:250,labelScale:50,fillRate:20,scoreWidth:620,scoreChartHeight:240,scoreBarWidth:42,scoreGap:14};
let runStartedAt=null,runEndedAt=null,activeAttemptKey=null,activeAttemptStartedAt=null;
let noteTimes={G:0,A:0,H:0,C:0,D:0};
let completedNotes={G:false,A:false,H:false,C:false,D:false};
let runIdealSeconds=5,scoreShown=false;

function formatSeconds(v){return `${Math.max(0,Number(v)||0).toFixed(1).replace('.',',')} s`}
function resetPerformanceTracking(){
  runStartedAt=null;runEndedAt=null;activeAttemptKey=null;activeAttemptStartedAt=null;
  noteTimes={G:0,A:0,H:0,C:0,D:0};completedNotes={G:false,A:false,H:false,C:false,D:false};
  runIdealSeconds=100/Math.max(1,uiSettings.fillRate);scoreShown=false;
  runClock.classList.remove('show');runClockValue.textContent='0,0 s';scoreOverlay.classList.remove('show');
}
function startRunIfNeeded(key,now){
  if(runStartedAt!==null)return;
  runStartedAt=now;runIdealSeconds=100/Math.max(1,uiSettings.fillRate);
  runClockValue.textContent='0,0 s';runClock.classList.add('show');
  activeAttemptKey=key;activeAttemptStartedAt=now;
}
function commitActiveAttempt(now){
  if(!activeAttemptKey||activeAttemptStartedAt===null)return;
  if(!completedNotes[activeAttemptKey])noteTimes[activeAttemptKey]+=Math.max(0,(now-activeAttemptStartedAt)/1000);
  activeAttemptStartedAt=now;
}
function switchActiveAttempt(key,now){
  if(!key||completedNotes[key])return;
  if(activeAttemptKey===key){if(activeAttemptStartedAt===null)activeAttemptStartedAt=now;return}
  if(activeAttemptKey)commitActiveAttempt(now);
  activeAttemptKey=key;activeAttemptStartedAt=now;
}
function completeAttempt(key,now){
  if(completedNotes[key])return;
  if(activeAttemptKey===key){commitActiveAttempt(now);activeAttemptKey=null;activeAttemptStartedAt=null}
  completedNotes[key]=true;
  playFullSound();
}
function liveNoteTime(key,now){
  let t=noteTimes[key]||0;
  if(activeAttemptKey===key&&activeAttemptStartedAt!==null&&!completedNotes[key])t+=Math.max(0,(now-activeAttemptStartedAt)/1000);
  return t;
}
function updateRunClock(now=performance.now()){
  if(runStartedAt===null||runEndedAt!==null)return;
  runClockValue.textContent=formatSeconds(((effectPauseAt??now)-runStartedAt)/1000);
}
function buildScoreboard(){
  const times=NOTES.map(n=>({key:n.key,time:noteTimes[n.key]||0,flavor:FLAVORS[n.key]}));

    pitchMeterIntervalMs:22,pitchMeterWindowMs:16,pitchMeterSearchCents:140});
  stability=new ResonatorNoteStability({targets:TARGETS,dynamicsCompression:true});
  engine.addEventListener('input',e=>receiveInput(e.detail));
  engine.addEventListener('silence',receiveSilence);
  engine.addEventListener('calibrationprogress',e=>{
    updateCalibrationVisual(20*Math.log10(Math.max(1e-12,e.detail.noiseRms)),e.detail.progress);
  });
  engine.addEventListener('state',e=>{
    if(e.detail.state==='calibrating')beginCalibration();
    if(e.detail.state==='running')void endCalibration(e.detail.noiseRms);
  });
  try{await engine.start();await loadFullSound();return true}
  catch(error){++calibrationToken;ready=false;engine.stop();throw error}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopFullSound();resetBreathTracking();clearLiveUi()}
});
window.addEventListener('pagehide',()=>{++calibrationToken;ready=false;stopFullSound();engine?.stop()});
window.addEventListener('pageshow',event=>{if(event.persisted&&!engine?.running){calOverlay.classList.remove('show','complete','closing');startOverlay.style.display='flex';$('#startBtn').disabled=false}});

$('#settingsBtn').addEventListener('click',()=>settingsPanel.classList.toggle('open'));
glassScaleSlider.addEventListener('input',()=>{uiSettings.glassScale=Number(glassScaleSlider.value);applyUiSettings();saveUiSettings()});
labelScaleSlider.addEventListener('input',()=>{uiSettings.labelScale=Number(labelScaleSlider.value);applyUiSettings();saveUiSettings()});
fillRateSlider.addEventListener('input',()=>{uiSettings.fillRate=Number(fillRateSlider.value);applyUiSettings();saveUiSettings()});
scoreWidthSlider.addEventListener('input',()=>{uiSettings.scoreWidth=Number(scoreWidthSlider.value);applyUiSettings();saveUiSettings()});
scoreHeightSlider.addEventListener('input',()=>{uiSettings.scoreChartHeight=Number(scoreHeightSlider.value);applyUiSettings();saveUiSettings()});
scoreBarWidthSlider.addEventListener('input',()=>{uiSettings.scoreBarWidth=Number(scoreBarWidthSlider.value);applyUiSettings();saveUiSettings()});
scoreGapSlider.addEventListener('input',()=>{uiSettings.scoreGap=Number(scoreGapSlider.value);applyUiSettings();saveUiSettings()});
$('#exportJsonBtn').addEventListener('click',exportSettingsJson);
$('#importJsonBtn').addEventListener('click',importSettingsJson);
$('#scoreSettingsBtn').addEventListener('click',()=>settingsPanel.classList.toggle('open'));
$('#resetUiSettings').addEventListener('click',()=>{uiSettings={glassScale:250,labelScale:50,fillRate:20,scoreWidth:620,scoreChartHeight:240,scoreBarWidth:42,scoreGap:14};applyUiSettings();saveUiSettings();exportSettingsJson()});
window.addEventListener('resize',fitDesignToViewport,{passive:true});
window.addEventListener('orientationchange',fitDesignToViewport,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitDesignToViewport,{passive:true});

$('#startBtn').addEventListener('click',async()=>{startError.textContent='';$('#startBtn').disabled=true;startOverlay.style.display='none';try{await startMic()}catch(err){startOverlay.style.display='flex';startError.textContent=err?.message||'Mikrofonia ei saatu käyttöön.';$('#startBtn').disabled=false;calOverlay.classList.remove('show')}});
$('#recalBtn').addEventListener('click',()=>{if(ready&&engine?.running)engine.calibrateNoise()});
$('#resetFills').addEventListener('click',resetGame);
$('#playAgainBtn').addEventListener('click',resetGame);
$('#closeScoreBtn').addEventListener('click',()=>scoreOverlay.classList.remove('show'));

clearLegacySettings();loadUiSettings();applyUiSettings();exportSettingsJson();fitDesignToViewport();resetPerformanceTracking();
buildGlasses();requestAnimationFrame(animateGlassEffects);
})();
</script>
