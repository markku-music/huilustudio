<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18232d" stop-opacity="0.28"/>
      <stop offset="0.38" stop-color="#405463" stop-opacity="0.88"/>
      <stop offset="0.62" stop-color="#17222c" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0d141b" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="hub">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#d9e0e5"/>
      <stop offset="0.68" stop-color="#788894"/>
      <stop offset="1" stop-color="#28343d"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-25%" width="180%" height="150%">
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
  </defs>

  <!-- visible translucent propeller disc -->
  <circle cx="50" cy="50" r="42" fill="#dce7ef" opacity="0.12"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#c7d5df" stroke-opacity="0.20" stroke-width="2"/>

  <!-- opposing blades -->
  <g filter="url(#soft)">
    <path d="M46 47
             C40 36, 30 21, 17 8
             C12 3, 8 5, 8 11
             C8 19, 19 34, 43 53 Z"
          fill="url(#blade)"/>
    <path d="M54 53
             C60 64, 70 79, 83 92
             C88 97, 92 95, 92 89
             C92 81, 81 66, 57 47 Z"
          fill="url(#blade)"/>
  </g>

  <circle cx="50" cy="50" r="8.5" fill="url(#hub)"/>
  <circle cx="50" cy="50" r="2.5" fill="#f4f7f9"/>
</svg>
