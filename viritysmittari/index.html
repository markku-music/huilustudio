<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>Viritysmittari – LED pysty B</title>
<style>
  :root {
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#111; color:#fff; }
  button { font:inherit; }

  .app {
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:center/cover no-repeat;
  }
  .app::before {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.22));
    pointer-events:none;
  }

  .topbar {
    position:relative;
    z-index:5;
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:14px;
  }

  .glass {
    border:1px solid rgba(255,255,255,.35);
    background:rgba(12,18,28,.75);
    color:#fff;
    border-radius:16px;
    padding:12px 16px;
    min-height:48px;
    font-weight:750;
    backdrop-filter:blur(12px);
    cursor:pointer;
  }

  .world-picker {
    display:none;
    position:absolute;
    z-index:12;
    top:72px;
    left:14px;
    width:min(650px, calc(100% - 28px));
    padding:12px;
    background:rgba(10,15,24,.92);
    border:1px solid rgba(255,255,255,.25);
    border-radius:18px;
    backdrop-filter:blur(15px);
  }
  .world-picker.open { display:block; }
  .world-grid {
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:10px;
  }
  .world {
    padding:0;
    border:2px solid transparent;
    border-radius:14px;
    overflow:hidden;
    background:#222;
    cursor:pointer;
    position:relative;
  }
  .world.active { border-color:#fff; }
  .world img {
    width:100%;
    height:90px;
    display:block;
    object-fit:cover;
  }
  .world span {
    position:absolute;
    left:6px; right:6px; bottom:6px;
    background:rgba(0,0,0,.58);
    color:#fff;
    padding:5px;
    border-radius:8px;
    font-size:12px;
    font-weight:750;
    text-align:center;
  }

  .stage {
    position:relative;
    z-index:2;
    width:min(940px, calc(100% - 24px));
    margin:0 auto;
    padding-bottom:26px;
    display:grid;
    gap:14px;
    justify-items:center;
  }

  .meter-card {
    width:100%;
    border-radius:30px;
    padding:16px;
    background:linear-gradient(#f6f8fa, #d9dee4);
    color:#111;
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 18px 50px rgba(0,0,0,.3);
  }

  .meter-shell {
    border-radius:24px;
    background:linear-gradient(#222b34, #11171d);
    padding:16px;
    min-height:420px;
    display:grid;
    grid-template-columns: 1fr 240px 1fr;
    align-items:center;
    gap:18px;
  }

  .side-readout {
    display:grid;
    align-content:center;
    justify-items:center;
    gap:10px;
    color:#fff;
  }

  #targetNote {
    font-size:clamp(44px, 8vw, 82px);
    font-weight:850;
    line-height:1;
    letter-spacing:-.03em;
  }
  #targetHz {
    font-size:clamp(15px, 2.5vw, 22px);
    font-weight:700;
    opacity:.76;
  }

  .live-readout {
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:.18em;
    font-variant-numeric:tabular-nums;
    min-height:1.2em;
  }
  #hz {
    font-size:clamp(48px, 8vw, 86px);
    font-weight:800;
    line-height:1;
    letter-spacing:-.04em;
  }
  .unit {
    font-size:clamp(22px, 4vw, 36px);
    font-weight:700;
    opacity:.5;
  }

  .cent-row {
    display:flex;
    align-items:baseline;
    gap:8px;
    font-variant-numeric:tabular-nums;
  }
  #centValue {
    font-size:clamp(22px, 4vw, 34px);
    font-weight:800;
  }
  #centLabel {
    font-size:clamp(14px, 2.3vw, 20px);
    font-weight:700;
    opacity:.62;
  }

  .meter-center {
    display:grid;
    justify-items:center;
    align-items:center;
  }

  .led-meter-wrap {
    position:relative;
    width:220px;
    height:360px;
    display:grid;
    grid-template-columns:52px 1fr 52px;
    align-items:stretch;
    gap:12px;
  }

  .scale {
    position:relative;
    height:100%;
    font-variant-numeric:tabular-nums;
    color:#fff;
    opacity:.95;
    font-weight:750;
    font-size:18px;
  }
  .scale span {
    position:absolute;
    right:0;
    transform:translateY(-50%);
    white-space:nowrap;
  }
  .scale .zero {
    color:#56da79;
    font-size:20px;
  }

  .led-frame {
    position:relative;
    height:100%;
    border-radius:28px;
    padding:18px 20px;
    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.10),
      inset 0 10px 26px rgba(255,255,255,.03);
  }

  .led-column {
    position:relative;
    height:100%;
    display:grid;
    gap:6px;
    align-content:center;
  }

  .led-seg {
    height:10px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    transition:background-color 80ms linear, box-shadow 80ms linear, opacity 80ms linear, transform 80ms linear;
    opacity:.42;
  }

  .led-seg.on {
    opacity:1;
    transform:scaleX(1.02);
  }

  .led-seg.good.on {
    background:#56da79;
    box-shadow:0 0 10px rgba(86,218,121,.55), inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .led-seg.warn.on {
    background:#f1c34f;
    box-shadow:0 0 10px rgba(241,195,79,.5), inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .led-seg.bad.on {
    background:#f06a5f;
    box-shadow:0 0 10px rgba(240,106,95,.52), inset 0 0 0 1px rgba(255,255,255,.22);
  }

  .led-center-line {
    position:absolute;
    left:12px;
    right:12px;
    top:50%;
    height:2px;
    transform:translateY(-50%);
    background:rgba(255,255,255,.18);
    pointer-events:none;
  }

  .zero-badge {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    min-width:60px;
    text-align:center;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(12,18,28,.88);
    color:#56da79;
    border:1px solid rgba(255,255,255,.15);
    font-weight:800;
    font-size:14px;
    letter-spacing:.02em;
    box-shadow:0 4px 18px rgba(0,0,0,.22);
    pointer-events:none;
  }

  .controls {
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:12px;
    align-items:center;
  }
  .note-control {
    grid-column:2;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px;
    background:rgba(12,18,28,.8);
    border:1px solid rgba(255,255,255,.35);
    border-radius:20px;
    backdrop-filter:blur(12px);
  }
  .note-btn {
    width:52px;
    height:52px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:28px;
    cursor:pointer;
  }
  .note-label {
    min-width:96px;
    text-align:center;
    color:#fff;
  }
  #noteName {
    font-size:30px;
    font-weight:850;
    line-height:1;
  }
  #noteFreq {
    font-size:12px;
    opacity:.62;
    margin-top:4px;
  }

  #toggle {
    grid-column:3;
    justify-self:end;
    border:1px solid rgba(255,255,255,.45);
    border-radius:18px;
    min-height:56px;
    padding:0 20px;
    background:rgba(12,18,28,.82);
    color:#fff;
    font-weight:800;
    cursor:pointer;
    backdrop-filter:blur(12px);
  }

  .statusbox {
    width:100%;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    padding:10px 14px;
    border-radius:16px;
    background:rgba(12,18,28,.75);
    border:1px solid rgba(255,255,255,.24);
    backdrop-filter:blur(10px);
  }
  #status {
    font-size:15px;
    font-weight:650;
    color:#fff;
  }
  #lockInfo {
    font-size:13px;
    color:rgba(255,255,255,.65);
    font-variant-numeric:tabular-nums;
  }

  .level {
    width:100%;
    height:6px;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.2);
  }
  #levelBar {
    width:0%;
    height:100%;
    background:#fff;
    transition:width 60ms linear;
  }

  @media(max-width:760px) {
    .world-grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .world img { height:74px; }
    .stage { width:calc(100% - 16px); }
    .meter-card { padding:10px; border-radius:22px; }
    .meter-shell {
      grid-template-columns:1fr;
      min-height:auto;
      gap:14px;
      padding:14px;
    }
    .side-readout:first-child { order:1; }
    .meter-center { order:2; }
    .side-readout:last-child { order:3; }
    .led-meter-wrap {
      width:100%;
      max-width:260px;
      height:320px;
    }
    .controls { grid-template-columns:1fr auto; }
    .note-control { grid-column:1; }
    #toggle { grid-column:2; padding:0 14px; }
    .note-btn { width:46px; height:46px; }
    .note-label { min-width:74px; }
    #noteName { font-size:26px; }
    .statusbox { grid-template-columns:1fr; }
  }

  .analog-meter-wrap {
    position:relative;
    width:300px;
    height:230px;
    display:grid;
    place-items:center;
  }

  .analog-dial {
    position:relative;
    width:290px;
    height:210px;
    overflow:hidden;
    border-radius:150px 150px 26px 26px;
    background:
      radial-gradient(circle at 50% 100%, rgba(255,255,255,.12) 0 2px, transparent 3px),
      linear-gradient(180deg, #f8f5e9 0%, #ded7c6 100%);
    border:2px solid rgba(255,255,255,.72);
    box-shadow:
      inset 0 0 0 2px rgba(30,35,40,.18),
      inset 0 -20px 35px rgba(70,55,30,.12),
      0 10px 26px rgba(0,0,0,.24);
  }

  .analog-tick {
    position:absolute;
    left:50%;
    bottom:18px;
    width:2px;
    height:150px;
    transform-origin:50% 100%;
    pointer-events:none;
  }

  .analog-tick::before {
    content:"";
    position:absolute;
    top:0;
    left:50%;
    width:2px;
    height:12px;
    background:#272c31;
    transform:translateX(-50%);
    border-radius:2px;
  }

  .analog-tick.major::before {
    width:3px;
    height:18px;
  }

  .analog-tick.zero::before {
    background:#2f9f55;
    height:22px;
    width:4px;
  }

  .analog-needle {
    position:absolute;
    left:50%;
    bottom:18px;
    width:6px;
    height:138px;
    transform:translateX(-50%) rotate(0deg);
    transform-origin:50% 100%;
    transition:transform 90ms linear;
    z-index:3;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.28));
  }

  .analog-needle::before {
    content:"";
    position:absolute;
    inset:0;
    clip-path:polygon(50% 0, 100% 88%, 65% 100%, 35% 100%, 0 88%);
    background:linear-gradient(90deg, #a82727 0 46%, #e35b49 47% 100%);
  }

  .analog-pivot {
    position:absolute;
    left:50%;
    bottom:7px;
    width:30px;
    height:30px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #f5f7f8 0 16%, #8d969d 18% 52%, #353b40 54% 100%);
    border:2px solid rgba(20,25,30,.45);
    box-shadow:0 3px 8px rgba(0,0,0,.35);
    z-index:4;
  }

  .analog-cent-readout {
    position:absolute;
    left:50%;
    bottom:48px;
    transform:translateX(-50%);
    min-width:78px;
    text-align:center;
    padding:5px 10px;
    border-radius:999px;
    background:rgba(248,245,233,.92);
    border:1px solid rgba(30,35,40,.2);
    color:#20252a;
    font-size:14px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    z-index:2;
  }

  @media(max-width:760px) {
    .analog-meter-wrap { width:100%; max-width:300px; height:220px; }
    .analog-dial { width:280px; height:200px; }
  }


  /* Pelkistetty mittarinäkymä: sivulukemat piilossa, mutta DOM säilyy logiikkaa varten. */
  .meter-shell { grid-template-columns: 1fr; }
  .side-readout { display: none !important; }

  /* LED- ja analogimittari näkyvät aina rinnakkain. */
  .meter-center {
    width:100%;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:44px;
    flex-wrap:nowrap;
  }
  .led-meter-wrap,
  .analog-meter-wrap {
    flex:0 0 auto;
  }

  @media(max-width:760px) {
    .meter-center {
      flex-direction:column;
      gap:20px;
    }
  }

  /* Analogimittarin centtiarvo mittarin alle. */
  .analog-meter-wrap {
    height:260px;
    grid-template-rows:210px auto;
    align-content:center;
    row-gap:8px;
  }
  .analog-cent-readout {
    position:static;
    left:auto;
    bottom:auto;
    transform:none;
    justify-self:center;
    min-width:78px;
  }
  @media(max-width:760px) {
    .analog-meter-wrap { height:250px; grid-template-rows:200px auto; }
  }
  /* LED-asteikon numerot pienemmiksi, jotta ne mahtuvat siististi palkkien kohdalle. */
  .led-meter-wrap .scale.left { font-size:12px; line-height:1; }
  .led-meter-wrap .scale.left .zero { font-size:13px; }

  /* LED-asteikko kohdistetaan LED-palkkien keskikohtiin.
     21 palkkia: 10 px korkeus + 6 px väli => ylimmän ja alimman palkin
     keskikohtien väli on täsmälleen 320 px. */
  .led-meter-wrap .scale.left {
    height:320px;
    align-self:center;
  }


  /* Edellisen äänen tulosalue. Rajat seuraavat analogiviisarin ruudulla
     näkyneen liikkeen pienintä ja suurinta centtiasentoa. */
  .analog-range-overlay {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2;
    overflow:visible;
  }
  .analog-range-sector {
    fill:rgba(53, 116, 171, .20);
    stroke:rgba(39, 91, 139, .72);
    stroke-width:2;
    pointer-events:visiblePainted;
    cursor:pointer;
  }
  .analog-range-line {
    stroke:rgba(39, 91, 139, .85);
    stroke-width:4;
    stroke-linecap:round;
    pointer-events:visibleStroke;
    cursor:pointer;
  }
  .analog-range-hit-line {
    stroke:transparent;
    stroke-width:20;
    stroke-linecap:round;
    pointer-events:stroke;
    cursor:pointer;
  }

  .led-result-band {
    position:absolute;
    display:none;
    pointer-events:auto;
    cursor:pointer;
    border:2px solid rgba(95, 190, 255, .82);
    background:rgba(95, 190, 255, .18);
    border-radius:8px;
    box-shadow:0 0 10px rgba(95, 190, 255, .42);
    z-index:2;
  }
  .led-column { z-index:3; }



  /* KOKEILU: vaakasuora teal/orange-aikajakaumamittari.
     Vanha LED- ja analoginäkymä jää näkymättömäksi moottorikerrokseksi,
     jotta hyväksi havaittu asettumis-/lukituslogiikka säilyy ennallaan. */
  .meter-center {
    position:relative;
    min-height:190px;
  }
  .pitch-heatmap {
    width:min(920px, 94vw);
    display:grid;
    grid-template-rows:auto auto;
    gap:12px;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .pitch-heatmap-track {
    position:relative;
    height:104px;
    display:flex;
    overflow:hidden;
    border-radius:22px;
    background:#184F52;
    border:2px solid rgba(255,255,255,.64);
    box-shadow:
      inset 0 0 0 2px rgba(7,35,38,.25),
      inset 0 -14px 24px rgba(3,31,33,.22),
      0 12px 28px rgba(0,0,0,.22);
  }
  .pitch-heatmap-track::after {
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.13), transparent 35%, rgba(0,0,0,.10));
  }
  .pitch-heatmap-bins {
    position:absolute;
    inset:0;
    background:transparent;
  }
  .pitch-heatmap-zero {
    position:absolute;
    z-index:3;
    left:50%;
    top:0;
    bottom:0;
    width:2px;
    transform:translateX(-1px);
    background:rgba(236,246,244,.88);
    box-shadow:0 0 7px rgba(236,246,244,.25);
    pointer-events:none;
  }
  .pitch-heatmap-tick {
    position:absolute;
    z-index:2;
    top:0;
    bottom:0;
    width:1px;
    background:rgba(238,246,245,.20);
    pointer-events:none;
  }
  .pitch-heatmap-scale {
    position:relative;
    height:28px;
    color:rgba(255,255,255,.88);
    font-size:13px;
    font-weight:650;
    font-variant-numeric:tabular-nums;
  }
  .pitch-heatmap-scale span {
    position:absolute;
    top:0;
    transform:translateX(-50%);
  }
  .pitch-heatmap-scale .edge-left { transform:none; }
  .pitch-heatmap-scale .edge-right { transform:translateX(-100%); }
  .pitch-heatmap-hint {
    position:absolute;
    z-index:4;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    padding:3px 8px;
    border-radius:999px;
    background:rgba(8,32,34,.38);
    color:rgba(255,255,255,.62);
    font-size:11px;
    letter-spacing:.02em;
    pointer-events:none;
    opacity:.82;
  }

  /* Moottorikerrokset pidetään renderöityvinä, mutta pois näkyvästä layoutista.
     Analogiviisarin CSS-transition tarvitaan edelleen taustalla. */
  .meter-center > .led-meter-wrap,
  .meter-center > .analog-meter-wrap {
    position:absolute !important;
    left:-10000px !important;
    top:0 !important;
    opacity:0 !important;
    pointer-events:none !important;
  }

  @media(max-width:760px) {
    .meter-center { min-height:165px; }
    .pitch-heatmap { width:min(94vw, 680px); }
    .pitch-heatmap-track { height:88px; border-radius:18px; }
  }

</style>
</head>
<body>
<main class="app" id="app">
  <div class="topbar">
    <button id="worldButton" class="glass" type="button" aria-expanded="false">Maailma: Karkkimaa</button>
  </div>

  <section id="worldPicker" class="world-picker">
    <div class="world-grid">
      <button class="world active" data-world="0" type="button"><img src="assets/karkkimaa.png" alt=""><span>Karkkimaa</span></button>
      <button class="world" data-world="1" type="button"><img src="assets/robottipaja.png" alt=""><span>Robottipaja</span></button>
      <button class="world" data-world="2" type="button"><img src="assets/yokaupunki.png" alt=""><span>Yökaupunki</span></button>
      <button class="world" data-world="3" type="button"><img src="assets/avaruus.png" alt=""><span>Avaruus</span></button>
      <button class="world" data-world="4" type="button"><img src="assets/dinosaurukset.png" alt=""><span>Dinosaurukset</span></button>
      <button class="world" data-world="5" type="button"><img src="assets/merirosvot.png" alt=""><span>Merirosvot</span></button>
    </div>
  </section>

  <section class="stage">
    <div class="meter-card">
      <div class="meter-shell">
        <div class="side-readout">
          <div id="targetNote">A1</div>
          <div id="targetHz">440 Hz</div>
        </div>

        <div class="meter-center">
          <div id="pitchHeatmap" class="pitch-heatmap" aria-label="Vaakasuuntainen virityksen aikajakauma, miinus 50 sentistä plus 50 senttiin" title="Klikkaa mittaria nollataksesi tuloksen">
            <div class="pitch-heatmap-track">
              <div id="pitchHeatBins" class="pitch-heatmap-bins" aria-hidden="true"></div>
              <div class="pitch-heatmap-tick" style="left:25%"></div>
              <div class="pitch-heatmap-zero"></div>
              <div class="pitch-heatmap-tick" style="left:75%"></div>
              <div class="pitch-heatmap-hint">teal = ei käyty · orange = viipymisaika</div>
            </div>
            <div class="pitch-heatmap-scale" aria-hidden="true">
              <span class="edge-left" style="left:0%">−50</span>
              <span style="left:25%">−25</span>
              <span style="left:50%">0</span>
              <span style="left:75%">+25</span>
              <span class="edge-right" style="left:100%">+50</span>
            </div>
          </div>

          <div class="led-meter-wrap">
            <div class="scale left">
              <span style="top:0%;">+50</span>
              <span style="top:10%;">+40</span>
              <span style="top:20%;">+30</span>
              <span style="top:30%;">+20</span>

<script>
(() => {
  const hzEl = document.getElementById("hz");
  const statusEl = document.getElementById("status");
  const lockInfoEl = document.getElementById("lockInfo");
  const levelBar = document.getElementById("levelBar");
  const toggleBtn = document.getElementById("toggle");

  let audioContext = null;
  let analyser = null;
  let stream = null;
  let source = null;
  let rafId = 0;
  let running = false;

  const MIN_HZ = 45;
  const MAX_HZ = 3000;
  const RMS_GATE = 0.00025;
  const YIN_THRESHOLD = 0.12;

  // Ensimmäinen lukitus
  const ACQUIRE_WINDOW = 5;
  const ACQUIRE_REQUIRED = 4;
  const ACQUIRE_TOLERANCE = 2;

  // Nykyisen lukituksen seuranta
  const LOCK_TOLERANCE = 4;
  const DISPLAY_SIZE = 5;

  // Uuden sävelen tunnistus lukituksen aikana
  const SWITCH_WINDOW = 5;
  const SWITCH_REQUIRED = 4;
  const SWITCH_TOLERANCE = 2;

  const SILENCE_RELEASE_MS = 0;

  const acquireBuffer = [];
  const displayBuffer = [];
  const switchBuffer = [];

  let locked = false;
  let lockHz = null;
  let lastSoundTime = 0;

  function rmsOf(buffer) {
    let sum = 0;
    for (let i = 0; i < buffer.length; i++) {
      const v = buffer[i];
      sum += v * v;
    }
    return Math.sqrt(sum / buffer.length);
  }

  function median(values) {
    if (!values.length) return null;
    const a = [...values].sort((x, y) => x - y);
    const mid = Math.floor(a.length / 2);
    return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
  }

  function bestCluster(values, tolerance) {
    let best = [];

    for (const candidate of values) {
      const cluster = values.filter(v =>
        Math.abs(v - candidate) <= tolerance
      );

      if (cluster.length > best.length) {
        best = cluster;
      }
    }

    return best;
  }

  function detectPitchYIN(buffer, sampleRate) {
    const n = buffer.length;
    const tauMin = Math.max(2, Math.floor(sampleRate / MAX_HZ));
    const tauMax = Math.min(Math.floor(sampleRate / MIN_HZ), Math.floor(n / 2));

    if (tauMax <= tauMin) return null;

    const yin = new Float32Array(tauMax + 1);

    for (let tau = 1; tau <= tauMax; tau++) {
      let sum = 0;
      const limit = n - tau;

      for (let i = 0; i < limit; i++) {
        const d = buffer[i] - buffer[i + tau];
        sum += d * d;
      }

      yin[tau] = sum;
    }

    yin[0] = 1;
    let runningSum = 0;

    for (let tau = 1; tau <= tauMax; tau++) {
      runningSum += yin[tau];
      yin[tau] = runningSum === 0 ? 1 : (yin[tau] * tau) / runningSum;
    }

    let tauEstimate = -1;

    for (let tau = tauMin; tau <= tauMax; tau++) {
      if (yin[tau] < YIN_THRESHOLD) {
        while (tau + 1 <= tauMax && yin[tau + 1] < yin[tau]) tau++;
        tauEstimate = tau;
        break;
      }
    }

    if (tauEstimate < 0) {
      let bestTau = tauMin;
      let bestValue = yin[tauMin];

      for (let tau = tauMin + 1; tau <= tauMax; tau++) {
        if (yin[tau] < bestValue) {
          bestValue = yin[tau];
          bestTau = tau;
        }
      }

      if (bestValue > 0.22) return null;
      tauEstimate = bestTau;
    }

    let betterTau = tauEstimate;

    if (tauEstimate > 1 && tauEstimate < tauMax) {
      const s0 = yin[tauEstimate - 1];
      const s1 = yin[tauEstimate];
      const s2 = yin[tauEstimate + 1];
      const denom = 2 * (2 * s1 - s2 - s0);

      if (Math.abs(denom) > 1e-12) {
        betterTau += (s2 - s0) / denom;
      }
    }

    const hz = sampleRate / betterTau;

    return (
      Number.isFinite(hz) &&
      hz >= MIN_HZ &&
      hz <= MAX_HZ
    ) ? hz : null;
  }

  function resetAll(keepDisplay = false) {
    locked = false;
    lockHz = null;
    acquireBuffer.length = 0;
    displayBuffer.length = 0;
    switchBuffer.length = 0;
    lockInfoEl.textContent = "";

    if (!keepDisplay) {
      hzEl.textContent = "---";
    }
  }

  function setLock(newHz) {
    lockHz = newHz;
    locked = true;

    acquireBuffer.length = 0;
    displayBuffer.length = 0;
    switchBuffer.length = 0;

    displayBuffer.push(newHz);

    hzEl.textContent = String(newHz);
    statusEl.textContent = "Lukittu";
    lockInfoEl.textContent = `Lukitus ${newHz} Hz`;
  }

  function tryAcquireLock(integerHz) {
    acquireBuffer.push(integerHz);

    if (acquireBuffer.length > ACQUIRE_WINDOW) {
      acquireBuffer.shift();
    }

    statusEl.textContent = "Etsitään vakaata säveltä…";
    lockInfoEl.textContent = `${acquireBuffer.length}/${ACQUIRE_WINDOW}`;

    if (acquireBuffer.length < ACQUIRE_WINDOW) return;

    const cluster = bestCluster(acquireBuffer, ACQUIRE_TOLERANCE);

    if (cluster.length >= ACQUIRE_REQUIRED) {
      setLock(Math.round(median(cluster)));
    }
  }

  function trySwitchLock(integerHz) {
    switchBuffer.push(integerHz);

    if (switchBuffer.length > SWITCH_WINDOW) {
      switchBuffer.shift();
    }

    statusEl.textContent = "Tarkistetaan uutta säveltä…";
    lockInfoEl.textContent = `${switchBuffer.length}/${SWITCH_WINDOW}`;

    if (switchBuffer.length < SWITCH_WINDOW) return;

    const cluster = bestCluster(switchBuffer, SWITCH_TOLERANCE);

    if (cluster.length >= SWITCH_REQUIRED) {
      const newHz = Math.round(median(cluster));

      // Estetään turha "uudelleenlukitus" lähes samaan paikkaan.
      if (Math.abs(newHz - lockHz) > LOCK_TOLERANCE) {
        setLock(newHz);
      } else {
        switchBuffer.length = 0;
      }
    }
  }

  function processLockedPitch(integerHz) {
    if (lockHz === null) return;

    // Nykyiseen säveleen kuuluva havainto.
    if (Math.abs(integerHz - lockHz) <= LOCK_TOLERANCE) {
      switchBuffer.length = 0;

      displayBuffer.push(integerHz);
      if (displayBuffer.length > DISPLAY_SIZE) {
        displayBuffer.shift();
      }

      const stable = Math.round(median(displayBuffer));

      hzEl.textContent = String(stable);
      statusEl.textContent = "Lukittu";
      lockInfoEl.textContent = `Lukitus ${lockHz} Hz`;
      return;
    }

    // Selvästi eri taajuus: älä liikuta näyttöä vielä.
    // Kerää kuitenkin uusi vakaa ehdokas, jotta seuraava nuotti voidaan hyväksyä.
    trySwitchLock(integerHz);
  }

  function tick() {
    if (!running || !analyser || !audioContext) return;

    const buffer = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buffer);

    const now = performance.now();
    const rms = rmsOf(buffer);
    const levelPct = Math.max(0, Math.min(100, (rms / 0.12) * 100));
    levelBar.style.width = levelPct.toFixed(1) + "%";

    if (rms >= RMS_GATE) {
      lastSoundTime = now;
    }

    if (rms < RMS_GATE) {
      if (locked && now - lastSoundTime > SILENCE_RELEASE_MS) {
        resetAll(true);
        statusEl.textContent = "Kuuntelen…";
      } else if (!locked) {
        acquireBuffer.length = 0;
        switchBuffer.length = 0;
        statusEl.textContent = "Kuuntelen…";
        lockInfoEl.textContent = "";
      }

      rafId = requestAnimationFrame(tick);
      return;
    }

    const rawHz = detectPitchYIN(buffer, audioContext.sampleRate);

    if (rawHz !== null) {
      // Vain analogisen lisänäkymän käyttöön: raakaa YIN-taajuutta ei käytetä
      // muuttamaan alkuperäistä lukitus- tai LED-logiikkaa.
      window.dispatchEvent(new CustomEvent("tunerrawpitch", { detail: { hz: rawHz } }));
      const integerHz = Math.round(rawHz);

      if (!locked) {
        tryAcquireLock(integerHz);
      } else {
        // Keskiarvonäyttöä varten ilmoitetaan erikseen vain sellainen raakadata,
        // jonka alkuperäinen lukituslogiikka hyväksyy nykyiseen ääneen kuuluvaksi.
        // Tämä ei muuta lukituksen toimintaa, vaan estää loppuhännän virhearvoja
        // päätymästä jälkikäteen laskettavaan keskiarvoon.
        const acceptedForCurrentLock =
          lockHz !== null && Math.abs(integerHz - lockHz) <= LOCK_TOLERANCE;

        processLockedPitch(integerHz);

        if (acceptedForCurrentLock) {
          window.dispatchEvent(new CustomEvent("tuneracceptedpitch", { detail: { hz: rawHz } }));
        }
      }
    }

    rafId = requestAnimationFrame(tick);
  }

  async function start() {
    try {
      toggleBtn.disabled = true;
      statusEl.textContent = "Avataan mikrofonia…";

      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        },
        video: false
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();

      source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;

      source.connect(analyser);

      running = true;
      resetAll(false);
      toggleBtn.textContent = "Pysäytä";
      statusEl.textContent = "Kuuntelen…";
      toggleBtn.disabled = false;

      tick();

    } catch (err) {
      console.error(err);
      toggleBtn.disabled = false;
      toggleBtn.textContent = "Käynnistä";
      resetAll(false);
      statusEl.textContent = "Mikrofonia ei voitu avata.";
    }
  }

  async function stop() {
    running = false;
    cancelAnimationFrame(rafId);

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    if (audioContext) {
      try { await audioContext.close(); } catch {}
      audioContext = null;
    }

    analyser = null;
    source = null;
    levelBar.style.width = "0%";
    toggleBtn.textContent = "Käynnistä";
    resetAll(false);
    statusEl.textContent = "Mittari pysäytetty.";
  }

  toggleBtn.addEventListener("click", async () => {
    if (running) await stop();
    else await start();
  });
})();
</script>

<script>
(() => {
  const app = document.getElementById("app");
  const worldButton = document.getElementById("worldButton");
  const worldPicker = document.getElementById("worldPicker");
  const worldEls = [...document.querySelectorAll(".world")];

  const worlds = [
    ["Karkkimaa","assets/karkkimaa.png"],
    ["Robottipaja","assets/robottipaja.png"],
    ["Yökaupunki","assets/yokaupunki.png"],
    ["Avaruus","assets/avaruus.png"],
    ["Dinosaurukset","assets/dinosaurukset.png"],
    ["Merirosvot","assets/merirosvot.png"]
  ];

  function setWorld(i) {
    const [name, file] = worlds[i];
    app.style.backgroundImage = `url("${file}")`;
    worldButton.textContent = `Maailma: ${name}`;
    worldEls.forEach((el, n) => el.classList.toggle("active", n === i));
  }

  worldButton.addEventListener("click", () => {
    const open = !worldPicker.classList.contains("open");
    worldPicker.classList.toggle("open", open);
    worldButton.setAttribute("aria-expanded", String(open));
  });

  worldEls.forEach(el => {
    el.addEventListener("click", () => {
      setWorld(Number(el.dataset.world));
      worldPicker.classList.remove("open");
      worldButton.setAttribute("aria-expanded", "false");
    });
  });

  document.addEventListener("pointerdown", (e) => {
    if (!worldPicker.contains(e.target) && e.target !== worldButton) {
      worldPicker.classList.remove("open");
      worldButton.setAttribute("aria-expanded", "false");
    }
  });

  const notes = [
    ["C1",262],["C♯1",277],["D1",294],["D♯1",311],["E1",330],["F1",349],
    ["F♯1",370],["G1",392],["G♯1",415],["A1",440],["A♯1",466],["H1",494],
    ["C2",523],["C♯2",554],["D2",587],["D♯2",622],["E2",659],["F2",698],
    ["F♯2",740],["G2",784],["G♯2",831],["A2",880],["A♯2",932],["H2",988],
    ["C3",1047]
  ];
  let noteIndex = 9;

  const noteName = document.getElementById("noteName");
  const noteFreq = document.getElementById("noteFreq");
  const targetNote = document.getElementById("targetNote");
  const targetHz = document.getElementById("targetHz");
  const hzEl = document.getElementById("hz");
  const centValue = document.getElementById("centValue");
  const ledColumn = document.getElementById("ledColumn");

  const STEP_CENTS = 5;
  const MAX_CENTS = 50;
  const LED_COUNT = 21; // 10 above + center + 10 below
  const CENTER_INDEX = 10;

  function currentTargetHz() {
    return notes[noteIndex][1];
  }

  function updateNote() {
    const [name, hz] = notes[noteIndex];
    noteName.textContent = name;
    noteFreq.textContent = `${hz} Hz`;
    targetNote.textContent = name;
    targetHz.textContent = `${hz} Hz`;
    updateMeterFromReadout();
  }

  function hzToCents(hz, targetHzValue) {
    if (!Number.isFinite(hz) || !Number.isFinite(targetHzValue) || hz <= 0 || targetHzValue <= 0) return null;
    return 1200 * Math.log2(hz / targetHzValue);
  }

  function zoneClassForDistance(stepDistance) {
    if (stepDistance <= 1) return "good";
    if (stepDistance <= 5) return "warn";
    return "bad";
  }

  function createSegments() {
    ledColumn.textContent = "";
    for (let i = 0; i < LED_COUNT; i++) {
      const seg = document.createElement("div");
      seg.className = "led-seg";
      ledColumn.appendChild(seg);
    }
  }

  function clearSegments() {
    [...ledColumn.children].forEach(seg => {
      seg.className = "led-seg";
    });
  }

  function lightSegments(cents) {
    clearSegments();
    const segs = [...ledColumn.children];
    if (!Number.isFinite(cents)) return;

    const clipped = Math.max(-MAX_CENTS, Math.min(MAX_CENTS, cents));
    const steps = Math.round(Math.abs(clipped) / STEP_CENTS);
    const direction = Math.sign(clipped);

    if (steps === 0) {
      segs[CENTER_INDEX].classList.add("on", "good");
      return;
    }

    // Vaihtoehto B: palkki kasvaa keskeltä poispäin.
    segs[CENTER_INDEX].classList.add("on", "good");

    for (let s = 1; s <= steps; s++) {
      const idx = direction > 0 ? CENTER_INDEX - s : CENTER_INDEX + s;
      if (idx < 0 || idx >= segs.length) continue;
      segs[idx].classList.add("on", zoneClassForDistance(s));
    }
  }

  function updateMeterFromReadout() {
    const value = Number(hzEl.textContent);
    if (!Number.isFinite(value)) {
      centValue.textContent = "0";
      clearSegments();
      return;
    }

    const cents = hzToCents(value, currentTargetHz());
    if (!Number.isFinite(cents)) {
      centValue.textContent = "0";
      clearSegments();
      return;
    }

    const rounded = Math.round(cents);
    centValue.textContent = rounded > 0 ? `+${rounded}` : String(rounded);
    lightSegments(cents);
  }

  document.getElementById("prevNote").addEventListener("click", () => {
    noteIndex = (noteIndex - 1 + notes.length) % notes.length;
    updateNote();
  });

  document.getElementById("nextNote").addEventListener("click", () => {
    noteIndex = (noteIndex + 1) % notes.length;
    updateNote();
  });

  const observer = new MutationObserver(updateMeterFromReadout);
  observer.observe(hzEl, { childList: true, characterData: true, subtree: true });

  createSegments();
  setWorld(0);
  updateNote();
})();
</script>
<script>
(() => {
  // Analoginen mittari ja tulosalue. Pitch- ja LED-moottoriin ei puututa.
  // Tulosalue seuraa requestAnimationFrame-silmukassa viisarin ruudulla
  // näkyvää kulmaa CSS-siirtymän jälkeen.
  const analogMeter = document.getElementById("analogMeter");
  const analogDial = analogMeter.querySelector(".analog-dial");
  const analogNeedle = document.getElementById("analogNeedle");
  const analogCentReadout = document.getElementById("analogCentReadout");
  const analogRangeOverlay = document.getElementById("analogRangeOverlay");
  const analogRangeSector = document.getElementById("analogRangeSector");
  const analogRangeLine = document.getElementById("analogRangeLine");
  const analogRangeHitLine = document.getElementById("analogRangeHitLine");
  const ledFrame = document.querySelector(".led-frame");
  const ledColumn = document.getElementById("ledColumn");
  const ledResultBand = document.getElementById("ledResultBand");
  const hzEl = document.getElementById("hz");
  const targetHzEl = document.getElementById("targetHz");
  const lockInfoEl = document.getElementById("lockInfo");
  const pitchHeatmap = document.getElementById("pitchHeatmap");
  const pitchHeatBins = document.getElementById("pitchHeatBins");
  let lastRawHz = null;

  // Yhden äänen aikana muistetaan VAIN viisarin pienin ja suurin RUUDULLA NÄKYNYT
  // centtiasento. Ensimmäinen raakapitch aloittaa keruun jo ennen lukitusta.
  let rangeActive = false;
  let rangeSawLock = false;
  let rangeLockedNow = false;
  let sampleRaf = 0;
  let toneMinCents = null;
  let toneMaxCents = null;
  let resultMinCents = null;
  let resultMaxCents = null;

  // Lukituksen jälkeen tulosalue ei ala kellon perusteella, vaan vasta kun
  // näkyvä viisari on oikeasti asettunut lähtökohtaansa.
  const INITIAL_SETTLE_MS = 50;
  const INITIAL_SETTLE_SPAN_CENTS = 0.75;
  let initialSettled = false;
  let settleStart = null;
  let settleMinCents = null;
  let settleMaxCents = null;

  // Uusi ääripiste hyväksytään vasta, kun viisari on pysynyt nykyisen
  // vahvistetun alueen ulkopuolella vähintään tämän ajan. Näin yksittäinen
  // ruutu tai hyvin lyhyt nykäisy ei venytä pysyvää tulosaluetta.
  const EXTREME_CONFIRM_MS = 50;
  const EXTREME_STABILITY_CENTS = 1.5;
  // Jos min/max-kaaren näkyvä pituus jää tämän alle, käyttäjä näkee
  // viisarin käytännössä yhtenä paikallaan olevana asentona. Näytä silloin viiva.
  const SINGLE_POSITION_ARC_PX = 4;
  let minCandidateStart = null;
  let minCandidateValue = null;
  let maxCandidateStart = null;
  let maxCandidateValue = null;

  // Uusi vaakamittari: 201 puolen centin lokeroa (-50 ... +50).
  // Arvo on aika millisekunteina, jonka HYVÄKSYTTY, asettumisen jälkeinen
  // näkyvä viisari on viettänyt kyseisessä lokerossa.
  const HEAT_MIN_CENTS = -50;
  const HEAT_MAX_CENTS = 50;
  const HEAT_BIN_STEP_CENTS = 0.5;
  const HEAT_BIN_COUNT = 201;
  const HEAT_RENDER_INTERVAL_MS = 45;
  const heatTimes = new Float64Array(HEAT_BIN_COUNT);
  // Yhden huipun visualisointi. Mittausdata pysyy sellaisenaan, mutta näkyvä
  // pinta pakotetaan unimodaaliseksi: yksi hallitseva huippu ja erikseen
  // datasta johdetut vasen/oikea häntä.
  const HEAT_MIN_SIGMA_CENTS = 0.38;
  const HEAT_TAIL_GAIN = 2.15;
  const HEAT_TAIL_CUTOFF = 0.008;
  const HEAT_EDGE_FADE_CENTS = 2.0;
  let lastHeatSampleTime = null;
  let lastHeatRenderTime = 0;

  function currentTargetHz() {
    const value = Number.parseFloat(targetHzEl.textContent);
    return Number.isFinite(value) ? value : null;
  }

  function createHeatBins() {
    // Näkyvä pinta piirretään yhtenä jatkuvana gradienttina.
    // Varsinainen viipymisdata säilyy edelleen 0,5 centin lokeroissa.
    pitchHeatBins.replaceChildren();
    pitchHeatBins.style.left = "0%";
    pitchHeatBins.style.right = "auto";
    pitchHeatBins.style.width = "100%";
    pitchHeatBins.style.background = "transparent";
  }

  function renderPitchHeatmap() {
    let totalTime = 0;
    let peakIndex = -1;
    let peakTime = 0;
    let visitedMinIndex = -1;
    let visitedMaxIndex = -1;

    for (let i = 0; i < HEAT_BIN_COUNT; i += 1) {
      const value = heatTimes[i];
      totalTime += value;
      if (value > 0) {
        if (visitedMinIndex < 0) visitedMinIndex = i;
        visitedMaxIndex = i;
      }
      if (value > peakTime) {
        peakTime = value;
        peakIndex = i;
      }
    }

    if (!(totalTime > 0) || peakIndex < 0 || visitedMinIndex < 0 || visitedMaxIndex < 0) {
      pitchHeatBins.style.left = "0%";
      pitchHeatBins.style.right = "auto";
      pitchHeatBins.style.width = "100%";
      pitchHeatBins.style.background = "transparent";
      return;
    }

    // Oranssi kerros rajataan FYYSISESTI ensimmäisen ja viimeisen oikeasti
    // käydyn 0,5 centin lokeron reunoihin. Tämän ulkopuolelle gradientti ei
    // voi vuotaa edes selaimen lineaarisen interpoloinnin vuoksi.
    const halfBin = HEAT_BIN_STEP_CENTS / 2;
    const visitedMinCenter = HEAT_MIN_CENTS + visitedMinIndex * HEAT_BIN_STEP_CENTS;
    const visitedMaxCenter = HEAT_MIN_CENTS + visitedMaxIndex * HEAT_BIN_STEP_CENTS;
    const visitedMinEdge = Math.max(HEAT_MIN_CENTS, visitedMinCenter - halfBin);
    const visitedMaxEdge = Math.min(HEAT_MAX_CENTS, visitedMaxCenter + halfBin);
    const visitedWidthCents = Math.max(HEAT_BIN_STEP_CENTS / 2, visitedMaxEdge - visitedMinEdge);
    const fullWidthCents = HEAT_MAX_CENTS - HEAT_MIN_CENTS;
    const leftPct = ((visitedMinEdge - HEAT_MIN_CENTS) / fullWidthCents) * 100;
    const widthPct = (visitedWidthCents / fullWidthCents) * 100;

    pitchHeatBins.style.left = `${leftPct.toFixed(4)}%`;
    pitchHeatBins.style.right = "auto";
    pitchHeatBins.style.width = `${widthPct.toFixed(4)}%`;

    // Yksi huippu = se sävelkorkeus, jossa ääni vietti eniten aikaa.
    // Näkyvä pinta on nyt aito väriliuku, ei oranssi alpha-halo tealin päällä:
    // teal -> orange huipun kohdalla -> teal. Koska overlay on fyysisesti
    // rajattu käytyyn alueeseen ja sen molemmat reunat ovat samaa tealia kuin
    // tausta, käydyn alueen rajat sulautuvat täysin näkymättömästi taustaan.
    const peakCenterCents = HEAT_MIN_CENTS + peakIndex * HEAT_BIN_STEP_CENTS;
    const peakPct = Math.max(
      0,
      Math.min(100, ((peakCenterCents - visitedMinEdge) / visitedWidthCents) * 100)
    );

    const TEAL = "#184F52";
    const ORANGE = "#F28C28";
    pitchHeatBins.style.background =
      `linear-gradient(90deg, ${TEAL} 0%, ${ORANGE} ${peakPct.toFixed(2)}%, ${TEAL} 100%)`;
  }

  function clearPitchHeatmap() {
    heatTimes.fill(0);
    lastHeatSampleTime = null;
    lastHeatRenderTime = 0;
    renderPitchHeatmap();
  }

  function heatBinIndex(cents) {
    const clipped = Math.max(HEAT_MIN_CENTS, Math.min(HEAT_MAX_CENTS, cents));
    return Math.max(0, Math.min(HEAT_BIN_COUNT - 1, Math.round((clipped - HEAT_MIN_CENTS) / HEAT_BIN_STEP_CENTS)));
  }

  function beginHeatSampling(cents, now) {
    lastHeatSampleTime = now;
    const index = heatBinIndex(cents);
    // Lyhyt siemen tekee jo täysin vakaasta lyhyestä äänestä näkyvän viivan.
    heatTimes[index] += 1;
    renderPitchHeatmap();
    lastHeatRenderTime = now;
  }

  function recordHeatSample(cents, now) {
    if (!Number.isFinite(cents)) return;
    if (lastHeatSampleTime === null) {
      lastHeatSampleTime = now;
      return;
    }
    // RAF voi selaimen taustalla pysähtyä pitkäksi aikaa. Älä kirjaa taukoa äänen viipymisajaksi.
    const elapsed = Math.max(0, Math.min(50, now - lastHeatSampleTime));
    lastHeatSampleTime = now;
    heatTimes[heatBinIndex(cents)] += elapsed;

    if (now - lastHeatRenderTime >= HEAT_RENDER_INTERVAL_MS) {
      renderPitchHeatmap();
      lastHeatRenderTime = now;
    }
  }

  function clearResultRange() {
    resultMinCents = null;
    resultMaxCents = null;
    analogRangeSector.setAttribute("d", "");
    analogRangeLine.setAttribute("visibility", "hidden");
    analogRangeHitLine.setAttribute("visibility", "hidden");
    ledResultBand.style.display = "none";
  }

  function renderedNeedleAngle() {
    const transform = getComputedStyle(analogNeedle).transform;
    if (!transform || transform === "none") return 0;

    if (transform.startsWith("matrix3d(")) {
      const v = transform.slice(9, -1).split(",").map(Number);
      if (v.length === 16 && v.every(Number.isFinite)) {
        return Math.atan2(v[1], v[0]) * 180 / Math.PI;
      }
    }

    if (transform.startsWith("matrix(")) {
      const v = transform.slice(7, -1).split(",").map(Number);
      if (v.length === 6 && v.every(Number.isFinite)) {
        return Math.atan2(v[1], v[0]) * 180 / Math.PI;
      }
    }
    return 0;
  }

  function renderedNeedleCents() {
    const angle = Math.max(-60, Math.min(60, renderedNeedleAngle()));
    return (angle / 60) * 50;
  }

  function isVisuallySinglePosition(minCents, maxCents) {
    if (!Number.isFinite(minCents) || !Number.isFinite(maxCents)) return false;
    const height = analogDial.clientHeight || 210;
    const radius = Math.min(138, height - 54);
    const deltaAngleDeg = (Math.abs(maxCents - minCents) / 50) * 60;
    const arcPx = radius * deltaAngleDeg * Math.PI / 180;
    return arcPx <= SINGLE_POSITION_ARC_PX;
  }

  function resetExtremeCandidates() {
    minCandidateStart = null;
    minCandidateValue = null;
    maxCandidateStart = null;
    maxCandidateValue = null;
  }

  function resetInitialSettle() {
    initialSettled = false;
    settleStart = null;
    settleMinCents = null;
    settleMaxCents = null;
  }

  function rememberVisibleNeedlePosition() {
    if (!rangeActive || !rangeLockedNow) {
      resetExtremeCandidates();
      settleStart = null;
      settleMinCents = null;
      settleMaxCents = null;
      lastHeatSampleTime = null;
      return;
    }

    const now = performance.now();
    const cents = renderedNeedleCents();
    if (!Number.isFinite(cents)) return;

    // Älä ota keskeltä varsinaiseen virekohtaan kulkevaa lähtösiirtymää mukaan.
    // Aloita min/max vasta, kun näkyvä viisari on pysynyt 50 ms sellaisessa
    // ikkunassa, jonka koko liike on enintään 0,75 c.
    if (!initialSettled) {
      if (settleStart === null) {
        settleStart = now;
        settleMinCents = cents;
        settleMaxCents = cents;
        return;
      }

      settleMinCents = Math.min(settleMinCents, cents);
      settleMaxCents = Math.max(settleMaxCents, cents);

      if (settleMaxCents - settleMinCents > INITIAL_SETTLE_SPAN_CENTS) {
        settleStart = now;
        settleMinCents = cents;
        settleMaxCents = cents;
        return;
      }

      if (now - settleStart < INITIAL_SETTLE_MS) return;

      const settledCents = (settleMinCents + settleMaxCents) / 2;
      toneMinCents = settledCents;
      toneMaxCents = settledCents;
      initialSettled = true;
      beginHeatSampling(settledCents, now);
      settleStart = null;
      settleMinCents = null;
      settleMaxCents = null;
      resetExtremeCandidates();
      return;
    }

    // Vaakajakauma käyttää täsmälleen samaa hyväksyttyä, asettunutta
    // näkyvän viisarin paikkaa, mutta tallentaa min/maxin sijasta VIIPYMISAIKAA.
    recordHeatSample(cents, now);

    // Uusi minimi hyväksytään vasta, jos viisari pysyy uuden ääripään
    // tuntumassa vähintään 50 ms. Jos se käy vain yhden ruudun kaukana ja
    // palaa yli 1,5 c takaisin, vahvistus alkaa uudestaan paluukohdasta.
    if (cents < toneMinCents) {
      if (minCandidateStart === null) {
        minCandidateStart = now;
        minCandidateValue = cents;
      } else if (cents <= minCandidateValue + EXTREME_STABILITY_CENTS) {
        minCandidateValue = Math.min(minCandidateValue, cents);
      } else {
        minCandidateStart = now;
        minCandidateValue = cents;
      }
      if (now - minCandidateStart >= EXTREME_CONFIRM_MS) {
        toneMinCents = minCandidateValue;
        minCandidateStart = null;
        minCandidateValue = null;
      }
    } else {
      minCandidateStart = null;
      minCandidateValue = null;
    }

    // Sama vahvistus uudelle maksimille.
    if (cents > toneMaxCents) {
      if (maxCandidateStart === null) {
        maxCandidateStart = now;
        maxCandidateValue = cents;
      } else if (cents >= maxCandidateValue - EXTREME_STABILITY_CENTS) {
        maxCandidateValue = Math.max(maxCandidateValue, cents);
      } else {
        maxCandidateStart = now;
        maxCandidateValue = cents;
      }
      if (now - maxCandidateStart >= EXTREME_CONFIRM_MS) {
        toneMaxCents = maxCandidateValue;
        maxCandidateStart = null;
        maxCandidateValue = null;
      }
    } else {
      maxCandidateStart = null;
      maxCandidateValue = null;
    }
  }

  function sampleVisibleNeedle() {
    if (!rangeActive) return;
    rememberVisibleNeedlePosition();
    sampleRaf = requestAnimationFrame(sampleVisibleNeedle);
  }

  function beginNeedleRange() {
    rangeActive = true;
    rangeSawLock = false;
    rangeLockedNow = false;
    toneMinCents = null;
    toneMaxCents = null;
    resetInitialSettle();
    resetExtremeCandidates();
    clearResultRange();
    clearPitchHeatmap();
    cancelAnimationFrame(sampleRaf);
    sampleVisibleNeedle();
  }

  function polarPoint(cx, cy, radius, degrees) {
    const rad = degrees * Math.PI / 180;
    return {
      x: cx + radius * Math.sin(rad),
      y: cy - radius * Math.cos(rad)
    };
  }

  function drawAnalogRange(minCents, maxCents) {
    const width = analogDial.clientWidth || 290;
    const height = analogDial.clientHeight || 210;
    analogRangeOverlay.setAttribute("viewBox", `0 0 ${width} ${height}`);

    const cx = width / 2;
    const cy = height - 18;
    const outerR = Math.min(138, height - 54);
    const innerR = Math.max(88, outerR - 24);
    const minAngle = (Math.max(-50, Math.min(50, minCents)) / 50) * 60;
    const maxAngle = (Math.max(-50, Math.min(50, maxCents)) / 50) * 60;

    if (isVisuallySinglePosition(minCents, maxCents)) {
      const angle = (minAngle + maxAngle) / 2;
      const a = polarPoint(cx, cy, innerR, angle);
      const b = polarPoint(cx, cy, outerR, angle);
      analogRangeSector.setAttribute("d", "");
      analogRangeLine.setAttribute("x1", a.x.toFixed(2));
      analogRangeLine.setAttribute("y1", a.y.toFixed(2));
      analogRangeLine.setAttribute("x2", b.x.toFixed(2));
      analogRangeLine.setAttribute("y2", b.y.toFixed(2));
      analogRangeLine.setAttribute("visibility", "visible");
      analogRangeHitLine.setAttribute("x1", a.x.toFixed(2));
      analogRangeHitLine.setAttribute("y1", a.y.toFixed(2));
      analogRangeHitLine.setAttribute("x2", b.x.toFixed(2));
      analogRangeHitLine.setAttribute("y2", b.y.toFixed(2));
      analogRangeHitLine.setAttribute("visibility", "visible");
      return;
    }

    analogRangeLine.setAttribute("visibility", "hidden");
    analogRangeHitLine.setAttribute("visibility", "hidden");
    const p1 = polarPoint(cx, cy, outerR, minAngle);
    const p2 = polarPoint(cx, cy, outerR, maxAngle);
    const p3 = polarPoint(cx, cy, innerR, maxAngle);
    const p4 = polarPoint(cx, cy, innerR, minAngle);
    analogRangeSector.setAttribute("d", [
      `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
      `A ${outerR} ${outerR} 0 0 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`,
      `L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
      `A ${innerR} ${innerR} 0 0 0 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)}`,
      "Z"
    ].join(" "));
  }

  function drawLedRange(minCents, maxCents) {
    const segs = [...ledColumn.children];
    if (segs.length < 2) return;

    const frameRect = ledFrame.getBoundingClientRect();
    const first = segs[0].getBoundingClientRect();
    const last = segs[segs.length - 1].getBoundingClientRect();
    const topCenter = first.top + first.height / 2 - frameRect.top;
    const bottomCenter = last.top + last.height / 2 - frameRect.top;
    const yForCents = cents =>
      topCenter + ((50 - Math.max(-50, Math.min(50, cents))) / 100) * (bottomCenter - topCenter);

    const y1 = yForCents(maxCents);
    const y2 = yForCents(minCents);
    const top = Math.min(y1, y2);
    const bottom = Math.max(y1, y2);
    const center = (top + bottom) / 2;
    const singlePosition = isVisuallySinglePosition(minCents, maxCents);
    const height = singlePosition ? 3 : Math.max(8, bottom - top);
    const colRect = ledColumn.getBoundingClientRect();

    ledResultBand.style.left = `${colRect.left - frameRect.left}px`;
    ledResultBand.style.width = `${colRect.width}px`;
    ledResultBand.style.top = `${center - height / 2}px`;
    ledResultBand.style.height = `${height}px`;
    ledResultBand.style.display = "block";
  }

  function drawResultRange() {
    if (!Number.isFinite(resultMinCents) || !Number.isFinite(resultMaxCents)) return;
    drawAnalogRange(resultMinCents, resultMaxCents);
    drawLedRange(resultMinCents, resultMaxCents);
  }

  function finishNeedleRange() {
    // Älä ota enää loppuhetken raakaa asentoa mukaan. Viimeinen tallennettu arvo
    // on viimeiseltä ruudulta, jolla lukitus oli vielä voimassa.
    const shouldKeep = rangeSawLock && Number.isFinite(toneMinCents) && Number.isFinite(toneMaxCents);

    rangeActive = false; // Nollaan palautumista ei kirjata alueeseen.
    rangeLockedNow = false;
    lastHeatSampleTime = null;
    renderPitchHeatmap();
    cancelAnimationFrame(sampleRaf);
    rangeSawLock = false;
    resetInitialSettle();

    if (shouldKeep) {
      resultMinCents = Math.min(toneMinCents, toneMaxCents);
      resultMaxCents = Math.max(toneMinCents, toneMaxCents);
    }

    toneMinCents = null;
    toneMaxCents = null;
    resetExtremeCandidates();

    // Äänen loputtua varsinaiset mittarit keskelle. Tulosalue jää erikseen näkyviin.
    const targetHz = currentTargetHz();
    analogNeedle.style.transform = "translateX(-50%) rotate(0deg)";
    analogCentReadout.textContent = "0";
    if (Number.isFinite(targetHz) && targetHz > 0) {
      lastRawHz = targetHz;
      hzEl.textContent = String(targetHz);
    }

    if (shouldKeep) requestAnimationFrame(drawResultRange);
  }

  function updateAnalog() {
    const displayedHz = Number(hzEl.textContent);
    const hz = Number.isFinite(lastRawHz) ? lastRawHz : displayedHz;
    const targetHz = currentTargetHz();

    if (!Number.isFinite(hz) || !Number.isFinite(targetHz) || hz <= 0 || targetHz <= 0) {
      analogNeedle.style.transform = "translateX(-50%) rotate(0deg)";
      analogCentReadout.textContent = "0";
      return;
    }

    const cents = 1200 * Math.log2(hz / targetHz);
    const clipped = Math.max(-50, Math.min(50, cents));
    const angle = (clipped / 50) * 60;
    const rounded = Math.round(cents);

    // Viisaria käsketään edelleen täsmälleen kuten ennen. Tulosalue EI tallenna
    // tätä tavoitearvoa, vaan selaimen oikeasti ruudulla näyttämää kulmaa RAF-seurannassa.
    analogNeedle.style.transform = `translateX(-50%) rotate(${angle.toFixed(2)}deg)`;
    analogCentReadout.textContent = `${rounded > 0 ? "+" : ""}${rounded}`;
  }

  window.addEventListener("tunerrawpitch", (event) => {
    const hz = Number(event.detail?.hz);
    if (!Number.isFinite(hz) || hz <= 0) return;

    // Keruu alkaa ensimmäisestä samasta raakadatasta, joka saa viisarin liikkeelle.
    if (!rangeActive) beginNeedleRange();
    lastRawHz = hz;
    updateAnalog();
  });

  const lockObserver = new MutationObserver(() => {
    const text = lockInfoEl.textContent.trim();

    if (text.startsWith("Lukitus")) {
      if (!rangeSawLock) {
        // Varsinainen min/max alkaa vasta ensimmäisestä lukituksesta.
        // Unohdetaan kaikki ennen lukitusta syntynyt liike kokonaan.
        toneMinCents = null;
        toneMaxCents = null;
        resetInitialSettle();
        resetExtremeCandidates();
      }
      rangeSawLock = true;
      rangeLockedNow = true;
      return;
    }

    // Kun lukitus ei juuri nyt vahvista havaintoa, älä kasvata tulosaluetta.
    // Viisari saa silti liikkua normaalisti raakadatansa mukaan.
    rangeLockedNow = false;

    // 0 ms -vapautuksessa lukitun äänen loppu tyhjentää lockInfo-kentän.
    // Lopetetaan keruu ennen viisarin palauttamista nollaan.
    if (text === "" && rangeActive) {
      if (rangeSawLock) {
        finishNeedleRange();
      } else {
        rangeActive = false;
        toneMinCents = null;
        toneMaxCents = null;
        clearPitchHeatmap();
        resetInitialSettle();
        resetExtremeCandidates();
      }
    }
  });
  lockObserver.observe(lockInfoEl, { childList:true, characterData:true, subtree:true });

  const hzObserver = new MutationObserver(() => {
    if (!Number.isFinite(Number(hzEl.textContent))) lastRawHz = null;
    updateAnalog();
  });
  hzObserver.observe(hzEl, { childList:true, characterData:true, subtree:true });

  const targetObserver = new MutationObserver(() => {
    clearResultRange();
    clearPitchHeatmap();
    updateAnalog();
  });
  targetObserver.observe(targetHzEl, { childList:true, characterData:true, subtree:true });

  function resetResultRangeByClick(event) {
    event.stopPropagation();
    clearResultRange();
    clearPitchHeatmap();
  }

  // Uudessa konseptissa näkyvän vaakamittarin klikkaus nollaa tuloksen.
  pitchHeatmap.addEventListener("click", resetResultRangeByClick);
  // Myös taustamoottorien vanhat pinnat säilyttävät saman toiminnon.
  analogMeter.addEventListener("click", resetResultRangeByClick);
  ledFrame.addEventListener("click", resetResultRangeByClick);

  createHeatBins();
  renderPitchHeatmap();

  window.addEventListener("resize", () => {
    if (Number.isFinite(resultMinCents) && Number.isFinite(resultMaxCents)) drawResultRange();
  });
})();
</script>

</body>
</html>
