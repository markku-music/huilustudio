<!doctype html><html><body><div id="osmd"></div><div id="status">loading</div>
<script src="./vendor/osmd/opensheetmusicdisplay.min.js"></script>
<script type="module">
import { buildMusicXml } from './js/musicxml.js';
const notes=[1,2,3].map(i=>({id:`r${i}`,kind:'rest',duration:'whole',dotted:false,measureRest:true}));
const xml=buildMusicXml(notes,{timeSignature:'4/4',clef:'treble'});
try {
 const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay('osmd',{backend:'svg',autoResize:false,drawingParameters:'compacttight'});
 await osmd.load(xml); osmd.render();
 document.querySelector('#status').textContent=`PASS svg=${document.querySelectorAll('#osmd svg').length} measures=${osmd.GraphicSheet?.MeasureList?.length||0} measureRests=${(xml.match(/measure="yes"/g)||[]).length}`;
} catch(e) { document.querySelector('#status').textContent='ERROR '+e.stack; }
</script></body></html>
