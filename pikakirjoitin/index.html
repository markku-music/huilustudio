<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef1f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Pikakirjoitin</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:system-ui,-apple-system,sans-serif;color:#18202a;background:#eef1f5}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    body{-webkit-user-select:none;user-select:none}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .app{width:100%;height:100dvh;display:flex;flex-direction:column;padding-top:max(18px,env(safe-area-inset-top));background:#eef1f5}
    .heading{flex:none;padding:0 16px 12px;text-align:center}
    h1{margin:0 0 4px;font-size:clamp(22px,5vw,34px)}
    p{margin:0;color:#586474;font-size:14px}
    .score-area{min-height:0;flex:1;display:flex;padding:0 16px 16px}
    .score{width:100%;min-height:120px;border:2px solid #9ba6b4;border-radius:12px;background:repeating-linear-gradient(#fff 0 25px,#c8ced6 26px,#fff 27px);color:#18202a;font:700 23px system-ui;box-shadow:0 10px 28px #1c273520;touch-action:manipulation;cursor:pointer}
    .score small{display:block;margin-top:34px;color:#586474;font:600 13px system-ui}
    .keyboard-viewport{width:100vw;height:clamp(250px,42dvh,430px);flex:none;overflow-x:auto;overflow-y:hidden;background:#20242a;border-top:5px solid #20242a;border-bottom:5px solid #20242a;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .keyboard-viewport[hidden]{display:none}
    .keyboard-viewport::-webkit-scrollbar{display:none}
    .piano{position:relative;width:250vw;height:100%;touch-action:pan-x;-webkit-touch-callout:none}
    .white-keys{display:flex;width:100%;height:100%}
    .key{border:0;touch-action:pan-x;cursor:pointer}
    .white{flex:0 0 calc(100% / 35);height:100%;background:linear-gradient(#fff 82%,#e7e7e7);border-right:1px solid #aeb4bc;color:#303844;font:650 clamp(12px,2vw,17px) system-ui;padding:0 0 14px;display:flex;align-items:end;justify-content:center}
    .white:last-child{border-right:0}
    .black{position:absolute;z-index:2;top:0;height:62%;background:linear-gradient(90deg,#101216,#30343a 45%,#090a0c);border-radius:0 0 7px 7px;box-shadow:0 5px 7px #0008}
    .key.active{background:#62a7ff}
    .black.active{background:#2869b8}
    #status{flex:none;min-height:30px;padding:6px 16px max(6px,env(safe-area-inset-bottom));text-align:center;font-weight:650;color:#2365aa;background:#eef1f5}
    .orientation-blocker{display:none;position:fixed;inset:0;z-index:1000;padding:28px;place-items:center;background:#eef1f5;text-align:center}
    .orientation-card{max-width:430px;padding:34px 28px;border:1px solid #ced7e2;border-radius:18px;background:#fff;box-shadow:0 16px 42px #1c273526}
    .orientation-icon{display:block;margin-bottom:14px;font-size:52px;line-height:1}
    .orientation-card h2{margin:0 0 8px;font-size:24px}
    .orientation-card p{font-size:16px;line-height:1.45}
    @media (orientation:landscape){.app{display:none}.orientation-blocker{display:grid}}
  </style>
</head>
<body>
  <div class="orientation-blocker" role="status" aria-live="polite">
    <div class="orientation-card">
      <span class="orientation-icon" aria-hidden="true">↻</span>
      <h2>Käännä tabletti pystyasentoon</h2>
      <p>Pikakirjoitin on suunniteltu käytettäväksi portrait-asennossa.</p>
    </div>
  </div>

  <main class="app">
    <header class="heading">
      <h1>Pikakirjoitin</h1>
      <p>Napauta nuotti-ikkunaa avataksesi koskettimiston.</p>
    </header>
    <section class="score-area">
      <button class="score" id="score" type="button" aria-expanded="false" aria-controls="keyboardViewport">♩ ♪ ♫<small>NUOTTI-IKKUNA · NAPAUTA</small></button>
    </section>
    <div class="keyboard-viewport" id="keyboardViewport" aria-label="Viiden oktaavin vaakasuunnassa vieritettävä koskettimisto" hidden>
      <div class="piano" id="piano">
        <div class="white-keys" id="whiteKeys"></div>
      </div>
    </div>
    <div id="status">Audio: ei avattu</div>
  </main>

  <script>
    const MIN_MIDI=36,MAX_MIDI=95,WHITE_COUNT=35,BLACK_WIDTH=.62;
    const piano=document.querySelector('#piano'),whiteKeys=document.querySelector('#whiteKeys'),keyboardViewport=document.querySelector('#keyboardViewport'),score=document.querySelector('#score'),status=document.querySelector('#status'),AC=window.AudioContext||window.webkitAudioContext;
    const whitePitchNames={0:'C',2:'D',4:'E',5:'F',7:'G',9:'A',11:'H'},blackPitchNames={1:'cis',3:'dis',6:'fis',8:'gis',10:'ais'};
    let audio,osc,gain,started=false,activeId=null,activeKey=null;

    function octaveIndex(midi){return Math.floor((midi-MIN_MIDI)/12)}
    function visibleName(midi){
      const octave=octaveIndex(midi),name=whitePitchNames[midi%12];
      if(octave===0)return name;
      if(octave===1)return name.toLowerCase();
      return name.toLowerCase()+(octave-1);
    }
    function spokenName(midi){
      const octave=octaveIndex(midi),pitch=midi%12,name=whitePitchNames[pitch]||blackPitchNames[pitch];
      if(octave===0)return 'suuri '+name;
      if(octave===1)return 'pieni '+name.toLowerCase();
      return name.toLowerCase()+(octave-1);
    }
    function buildKeyboard(){
      let whiteIndex=0;
      for(let midi=MIN_MIDI;midi<=MAX_MIDI;midi+=1){
        const pitch=midi%12,isWhite=Object.hasOwn(whitePitchNames,pitch),key=document.createElement('button');
        key.type='button';key.className='key '+(isWhite?'white':'black');key.dataset.midi=String(midi);key.setAttribute('aria-label',spokenName(midi));
        if(isWhite){
          key.textContent=visibleName(midi);whiteKeys.appendChild(key);whiteIndex+=1;
        }else{
          const whiteWidth=100/WHITE_COUNT;
          key.style.left=`${whiteIndex*whiteWidth-whiteWidth*BLACK_WIDTH/2}%`;
          key.style.width=`${whiteWidth*BLACK_WIDTH}%`;
          piano.appendChild(key);
        }
      }
    }
    function buildAudio(){
      try{audio=new AC({latencyHint:'interactive'})}catch{audio=new AC()}
      osc=audio.createOscillator();gain=audio.createGain();osc.type='triangle';gain.gain.value=.0001;osc.connect(gain).connect(audio.destination);started=false;
      audio.onstatechange=()=>status.textContent='Audio: '+audio.state;
      status.textContent='Audio: '+audio.state;
    }
    function togglePiano(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();
      if(!keyboardViewport.hidden){keyboardViewport.hidden=true;score.setAttribute('aria-expanded','false');return}
      if(!audio||audio.state==='closed')buildAudio();
      if(!started){osc.start();started=true}
      const done=()=>{
        if(audio.state!=='running')return;
        keyboardViewport.hidden=false;score.setAttribute('aria-expanded','true');status.textContent='Audio: running';
      };
      if(audio.state==='running')done();else audio.resume().then(done).catch(()=>status.textContent='Audio: avaaminen epäonnistui');
    }
    function startNote(e){
      const key=e.target.closest('.key');
      if(!key||(e.pointerType==='mouse'&&e.button!==0))return;
      if(e.pointerType==='mouse')e.preventDefault();
      if(!audio||audio.state!=='running'){status.textContent='Audio: suspended';return}
      if(activeKey)activeKey.classList.remove('active');
      activeId=e.pointerId;activeKey=key;key.classList.add('active');
      const t=audio.currentTime;osc.frequency.setValueAtTime(440*Math.pow(2,(+key.dataset.midi-69)/12),t);gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.16,t+.012);
    }
    function stopNote(e){
      if(e.pointerId!==activeId||!activeKey)return;
      const t=audio.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.16,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.06);
      activeKey.classList.remove('active');activeId=null;activeKey=null;
    }

    buildKeyboard();
    piano.addEventListener('pointerdown',startNote);
    window.addEventListener('pointerup',stopNote);
    window.addEventListener('pointercancel',stopNote);
    score.addEventListener('pointerup',togglePiano);
  </script>
</body>
</html>
