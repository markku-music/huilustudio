    .key-trigger-icon::after{inset:9px;background:#60758c;border:0}
    .key-trigger:focus-visible{outline:3px solid #62a7ff;outline-offset:2px}
    .key-wheel-popover{position:fixed;z-index:980;inset:0;display:grid;place-items:center;padding:14px;background:#17202b8f;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .key-wheel-popover[hidden]{display:none}
    .key-wheel-card{position:relative;width:min(370px,calc(100vw - 28px));aspect-ratio:1;border:1px solid #aebac8;border-radius:50%;background:radial-gradient(circle at center,#fff 0 33%,#edf3fa 33.5% 55%,#fff 55.5% 100%);box-shadow:0 24px 60px #0007;overflow:hidden;touch-action:manipulation}
    .key-wheel-card::before,.key-wheel-card::after{content:'';position:absolute;left:50%;top:50%;border:1px solid #c8d3df;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
    .key-wheel-card::before{width:55%;height:55%}
    .key-wheel-card::after{width:78%;height:78%}
    .key-wheel-close{position:absolute;z-index:7;top:50%;left:50%;width:30px;height:30px;display:grid;place-items:center;padding:0;border:1px solid #c4cfdb;border-radius:50%;background:#fff;color:#4e5c6c;font-size:19px;line-height:1;transform:translate(-50%,-50%);box-shadow:0 2px 6px #1c27351c;cursor:pointer}
    .key-wheel-slot{position:absolute;z-index:3;display:grid;place-items:center;width:50px;height:50px;padding:0;border:0;background:transparent;color:#263342;box-shadow:none;font-weight:850;line-height:1;white-space:nowrap;transform:translate(-50%,-50%);touch-action:manipulation;cursor:pointer;position:absolute;isolation:isolate}
    .key-wheel-slot::before{content:'';position:absolute;inset:7px;border:1px solid #aebbc9;border-radius:50%;background:#fff;box-shadow:0 2px 5px #1c27351f;z-index:-1}
    .key-wheel-slot.major{font-size:12px;letter-spacing:-0.01em}
    .key-wheel-slot.minor{width:46px;height:46px;color:#60458e;font-size:11px;letter-spacing:-0.01em}
    .key-wheel-slot.minor::before{inset:6px;border-color:#c5b8e7;background:#fbf9ff}
    .key-wheel-slot[aria-pressed="true"]{color:#174d83}
    .key-wheel-slot[aria-pressed="true"]::before{border-color:#2365aa;background:#dcecff;box-shadow:inset 0 0 0 1px #2365aa55,0 2px 6px #1c27352b}
    .key-wheel-slot.minor[aria-pressed="true"]{color:#5633ad}
    .key-wheel-slot.minor[aria-pressed="true"]::before{border-color:#7654ce;background:#eee7ff;box-shadow:inset 0 0 0 1px #7654ce55,0 2px 6px #1c27352b}
    .key-wheel-slot:focus-visible,.key-wheel-close:focus-visible{outline:3px solid #62a7ff;outline-offset:2px}
    .pickup-control{grid-column:1/-1;min-height:48px;display:flex;align-items:center;gap:10px;min-width:0}
    .pickup-label{flex:0 0 70px;color:#4e5c6c;font-size:13px;font-weight:800;white-space:nowrap}
    .pickup-choices{min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
    .pickup-choice{min-width:42px;height:42px;display:grid;place-items:center;padding:0 7px;border:1px solid #b9c4d1;border-radius:10px;background:#fff;color:#263342;font:750 20px/1 Georgia,"Times New Roman",serif;touch-action:manipulation;cursor:pointer}
    .pickup-choice img{display:block;width:15px;height:26px;pointer-events:none}
    .pickup-choice[aria-pressed="true"]{border-color:#2365aa;background:#dcecff;color:#174d83;box-shadow:inset 0 0 0 1px #2365aa2e}
    .pickup-choice:focus-visible{outline:3px solid #62a7ff;outline-offset:2px}
    .notation-settings{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}
    .notation-setting{display:flex;align-items:center;gap:8px;min-width:0}
    .notation-setting-label{flex:0 0 auto;color:#4e5c6c;font-size:13px;font-weight:800;white-space:nowrap}
    .tuning-setting{gap:10px}
    .tuning-setting .notation-setting-label{flex:0 0 70px}
    .notation-choice-group{display:flex;align-items:center;gap:5px;min-width:0}
    .notation-choice{min-width:42px;height:40px;padding:0 9px;border:1px solid #b9c4d1;border-radius:10px;background:#fff;color:#263342;font-size:14px;font-weight:800;line-height:1;touch-action:manipulation;cursor:pointer}
    .notation-choice[aria-pressed="true"]{border-color:#2365aa;background:#dcecff;color:#174d83;box-shadow:inset 0 0 0 1px #2365aa2e}
    .notation-choice.icon-choice{min-width:48px;width:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
    .notation-choice.icon-choice img{display:block;width:22px;height:34px;pointer-events:none;filter:none}
    .notation-choice.icon-choice[aria-pressed="true"] img{filter:brightness(0) saturate(100%) invert(25%) sepia(39%) saturate(1864%) hue-rotate(185deg) brightness(92%) contrast(90%)}
    .notation-choice:focus-visible{outline:3px solid #62a7ff;outline-offset:2px}
    .instrument-heading{margin:20px 0 10px;color:#4e5c6c;font-size:11px;font-weight:850;letter-spacing:.07em;text-align:center}
    .instrument-picker{position:relative}
    .instrument-trigger{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 13px;border:1px solid #9ba6b4;border-radius:9px;background:#fff;color:#263342;font-size:15px;font-weight:700;text-align:left;touch-action:manipulation;cursor:pointer}
    .instrument-trigger svg{width:12px;height:8px;flex:none;transition:transform .15s ease;pointer-events:none}
    .instrument-trigger[aria-expanded="true"] svg{transform:rotate(180deg)}
    .instrument-menu{position:absolute;z-index:20;left:0;right:0;bottom:calc(100% + 6px);max-height:min(220px,36svh);overflow:auto;padding:4px;border:1px solid #9ba6b4;border-radius:11px;background:#fff;box-shadow:0 12px 30px #1c273538;-webkit-overflow-scrolling:touch;touch-action:pan-y}
    .instrument-menu[hidden]{display:none}
    .instrument-choice{width:100%;min-height:42px;padding:7px 10px;border:0;border-bottom:1px solid #e0e6ed;border-radius:7px;background:#fff;color:#263342;font-size:13px;font-weight:700;text-align:left;touch-action:manipulation;cursor:pointer}
    .instrument-choice:last-child{border-bottom:0}
    .instrument-choice:active,.instrument-choice[aria-selected="true"]{background:#dcecff;color:#174d83}
    .start-button{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:10px;background:#2365aa;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
    .start-button[hidden]{display:none}
    @media (max-width:700px){.score-area{padding:0 10px 8px}.score{border-radius:0}}
    @media (max-width:520px){.project-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.project-card{padding:20px}.pickup-control{grid-column:auto;gap:8px}.pickup-choices{gap:5px}.pickup-choice{min-width:38px;height:40px;padding:0 5px}.notation-settings{grid-column:auto;grid-template-columns:1fr}.notation-setting{justify-content:space-between}.tuning-setting{justify-content:flex-start}.mode-tabs{width:calc(100% - 16px);gap:3px}.mode-tab{padding:0 4px;font-size:8px}}
    @media (orientation:landscape){.app{display:none}.orientation-blocker{display:grid}}
    @page{size:A4 portrait;margin:0}
    @media print{
      html,body{position:static;width:210mm;height:auto;overflow:visible;background:#fff}
      .orientation-blocker,.mode-tabs,.keyboard-panel,.modifier-rail,.edit-rail,.selection-toolbar,.write-note-context,.write-note-highlight,.system-break-markers,.system-break-candidate-marker,.system-break-candidate-svg,.barline-edit-markers,.barline-palette,.ending-range-preview-layer,.note-selection-layer,#status,.score-prompt{display:none!important}
      .app{position:static;display:block!important;width:210mm;height:auto;padding:0;background:#fff}
      .workspace{display:block}
      .score-area{display:block;padding:0}
      .score{width:210mm;min-height:0;overflow:visible;padding:0;border:0;border-radius:0;background:#fff;box-shadow:none}
      .score-page-shell{position:static;width:210mm!important;height:auto!important;margin:0}
      .score-page{position:relative;width:210mm;min-height:297mm;transform:none!important;box-shadow:none}
    }
  </style>
</head>
<body>
  <div class="orientation-blocker" role="status" aria-live="polite">
    <div class="orientation-card">
      <span class="orientation-icon" aria-hidden="true">↻</span>
      <h2>Käännä tabletti pystyasentoon</h2>
      <p>Pikakirjoitin on suunniteltu käytettäväksi portrait-asennossa.</p>
    </div>
  </div>

  <div class="project-modal" id="projectModal" role="dialog" aria-modal="true" aria-label="Kappaleen tiedot">
    <form class="project-card" id="projectForm">
      <div class="project-grid">
        <label class="field wide" for="titleInput">
          <input id="titleInput" type="text" autocomplete="off" placeholder="Nimi" aria-label="Nimi">
        </label>
        <label class="field" for="tempoInput">
          <input id="tempoInput" type="text" autocomplete="off" placeholder="Tempoteksti" aria-label="Tempoteksti">
        </label>
        <label class="field" for="composerInput">
          <input id="composerInput" type="text" autocomplete="off" placeholder="Säveltäjä" aria-label="Säveltäjä">
        </label>
        <div class="key-picker">
          <button class="key-trigger" id="keyTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="keyWheelPopover">
            <span class="key-trigger-value" id="keyTriggerValue">C-duuri</span>
            <span class="key-trigger-icon" aria-hidden="true"></span>
          </button>
          <select id="keySignatureSelect" aria-label="Sävellaji" hidden>
            <option value="0" data-mode="major" data-tonic="C">C-duuri</option>
            <option value="0" data-mode="minor" data-tonic="A">a-molli</option>
            <option value="1" data-mode="major" data-tonic="G">G-duuri</option>
            <option value="1" data-mode="minor" data-tonic="E">e-molli</option>
            <option value="2" data-mode="major" data-tonic="D">D-duuri</option>
            <option value="2" data-mode="minor" data-tonic="B">h-molli</option>
            <option value="3" data-mode="major" data-tonic="A">A-duuri</option>
            <option value="3" data-mode="minor" data-tonic="F#">fis-molli</option>
            <option value="4" data-mode="major" data-tonic="E">E-duuri</option>
            <option value="4" data-mode="minor" data-tonic="C#">cis-molli</option>
            <option value="5" data-mode="major" data-tonic="B">H-duuri</option>
            <option value="5" data-mode="minor" data-tonic="G#">gis-molli</option>
            <option value="-1" data-mode="major" data-tonic="F">F-duuri</option>
            <option value="-1" data-mode="minor" data-tonic="D">d-molli</option>
            <option value="-2" data-mode="major" data-tonic="Bb">B-duuri</option>
            <option value="-2" data-mode="minor" data-tonic="G">g-molli</option>
            <option value="-3" data-mode="major" data-tonic="Eb">Es-duuri</option>
            <option value="-3" data-mode="minor" data-tonic="C">c-molli</option>
            <option value="-4" data-mode="major" data-tonic="Ab">As-duuri</option>
            <option value="-4" data-mode="minor" data-tonic="F">f-molli</option>
            <option value="-5" data-mode="major" data-tonic="Db">Des-duuri</option>
            <option value="-5" data-mode="minor" data-tonic="Bb">b-molli</option>
            <option value="-6" data-mode="major" data-tonic="Gb">Ges-duuri</option>
            <option value="-6" data-mode="minor" data-tonic="Eb">es-molli</option>
          </select>
        </div>
        <label class="field" for="timeSignatureSelect">
          <select id="timeSignatureSelect" aria-label="Tahtilaji">
            <option value="2/4">2/4</option>
            <option value="3/4">3/4</option>
            <option value="4/4" selected>4/4</option>
            <option value="2/2">2/2</option>
            <option value="3/8">3/8</option>
            <option value="6/8">6/8</option>
            <option value="9/8">9/8</option>
            <option value="12/8">12/8</option>
          </select>
        </label>
        <div class="pickup-control" role="group" aria-label="Kohotahti">
          <span class="pickup-label">Kohotahti</span>
          <input id="pickupSelect" type="hidden" value="0">
          <div class="pickup-choices" id="pickupChoices"></div>
        </div>
        <div class="notation-settings">
          <div class="notation-setting tuning-setting" role="group" aria-label="Viritys">
            <span class="notation-setting-label">Viritys</span>
            <input id="tuningSelect" type="hidden" value="C">
            <div class="notation-choice-group" id="tuningChoices">
              <button class="notation-choice" type="button" data-tuning="C" aria-pressed="true">C</button>
              <button class="notation-choice" type="button" data-tuning="Bb" aria-pressed="false">B♭</button>
              <button class="notation-choice" type="button" data-tuning="Eb" aria-pressed="false">E♭</button>
              <button class="notation-choice" type="button" data-tuning="F" aria-pressed="false">F</button>
            </div>
          </div>
          <div class="notation-setting" role="group" aria-label="Nuottiavain">
            <input id="clefSelect" type="hidden" value="treble">
            <div class="notation-choice-group" id="clefChoices">
              <button class="notation-choice icon-choice" type="button" data-clef="treble" aria-label="G-avain" aria-pressed="true"><img src="assets/clef-alto.svg" alt=""></button>
              <button class="notation-choice icon-choice" type="button" data-clef="alto" aria-label="C-avain" aria-pressed="false"><img src="assets/clef-treble.svg" alt=""></button>
              <button class="notation-choice icon-choice" type="button" data-clef="bass" aria-label="F-avain" aria-pressed="false"><img src="assets/clef-bass.svg" alt=""></button>
            </div>
          </div>
        </div>
      </div>
      <button class="start-button" id="projectSaveButton" type="submit">ALOITA</button>
    </form>
  </div>

  <div class="key-wheel-popover" id="keyWheelPopover" role="dialog" aria-modal="true" aria-label="Valitse sävellaji kvinttiympyrästä" hidden>
    <div class="key-wheel-card" id="keyWheelCard">
      <button class="key-wheel-close" id="keyWheelClose" type="button" aria-label="Sulje sävellajivalinta">×</button>
      <div id="keyWheelSlots"></div>
    </div>
  </div>

  <main class="app" id="app" aria-hidden="true" inert>
    <nav class="mode-tabs" id="modeTabs" aria-label="Työskentelytila">
      <button class="mode-tab" id="writeModeButton" type="button" data-work-mode="write" aria-pressed="true">KIRJOITA</button>
      <button class="mode-tab" id="editModeButton" type="button" data-work-mode="edit" aria-pressed="false" disabled>MUOKKAA</button>
      <button class="mode-tab" id="printModeButton" type="button" data-work-mode="print" aria-pressed="false" disabled>TULOSTA</button>
    </nav>
    <div class="workspace">
      <section class="score-area">
        <div class="score" id="score" role="button" tabindex="0" aria-expanded="false" aria-controls="keyboardPanel" aria-label="Nuotti-ikkuna. Pyyhkäise pystysuunnassa vierittääksesi A4-sivua tai napauta avataksesi koskettimiston.">
          <div class="score-page-shell" id="scorePageShell">
            <div class="score-page" id="scorePage">
              <span class="score-title" id="scoreTitle" role="button" tabindex="0" aria-label="Muokkaa kappaleen tietoja">Nimetön kappale</span>
              <div class="score-info-row" aria-label="Kappaleen tempo ja säveltäjä">
                <span class="score-tempo" id="scoreTempo" hidden></span>
                <span class="score-composer" id="scoreComposer" hidden></span>
              </div>
              <div id="osmdContainer" aria-hidden="true"></div>
              <span class="score-prompt" id="scorePrompt" hidden></span>
            </div>
          </div>
          <div class="write-note-context" id="writeNoteContext" role="toolbar" aria-label="Valitun nuotin pikakorjaus" hidden>
            <button class="write-note-context-button" id="writeNoteAccidentalButton" type="button" aria-label="Vaihda enharmoninen kirjoitusasu">♯/♭</button>
            <button class="write-note-context-button" id="writeNoteDeleteButton" type="button" aria-label="Poista nuotti">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
            </button>
          </div>
        </div>
        <div class="modifier-rail" id="modifierRail" role="toolbar" aria-label="Nuotin muuntimet" aria-hidden="true">
          <button class="modifier-drag-handle" id="modifierDragHandle" type="button" aria-label="Siirrä muunninpalkkia pystysuunnassa">
            <svg viewBox="0 0 22 12" aria-hidden="true"><g fill="currentColor"><circle cx="6" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="16" cy="3" r="1.5"/><circle cx="6" cy="9" r="1.5"/><circle cx="11" cy="9" r="1.5"/><circle cx="16" cy="9" r="1.5"/></g></svg>
          </button>
          <button class="modifier-button" type="button" data-modifier="dot" aria-label="Pidä pohjassa: pisteellinen nuotti" aria-pressed="false"><img class="modifier-icon" src="assets/dotted-quarter-note.svg" alt="" aria-hidden="true" draggable="false"></button>
          <button class="modifier-button" type="button" data-modifier="sixteenth" aria-label="Pidä pohjassa: kuudestoistaosanuotti" aria-pressed="false"><img class="modifier-icon" src="assets/double-crochet.svg" alt="" aria-hidden="true" draggable="false"></button>
          <button class="modifier-button" type="button" data-modifier="rest" aria-label="Pidä pohjassa: tauko" aria-pressed="false"><img class="modifier-icon" src="assets/rest.svg" alt="" aria-hidden="true" draggable="false"></button>
          <div class="modifier-divider" aria-hidden="true"></div>
          <button class="modifier-button triplet-button" id="tripletButton" type="button" aria-label="Trioli: seuraavat kolme nuottia" aria-pressed="false">
            <svg viewBox="0 0 36 30" aria-hidden="true"><path d="M4 24v-5h9M23 19h9v5"/><text x="18" y="17" text-anchor="middle">3</text></svg>
          </button>
          <button class="modifier-button tie-button" id="tieButton" type="button" aria-label="Yhdyskaari seuraavaan saman sävelen nuottiin" aria-pressed="false">
            <img class="custom-tool-icon" src="assets/tie.svg" alt="" aria-hidden="true" draggable="false">
          </button>
        </div>
        <div class="edit-rail" id="editRail" role="toolbar" aria-label="Rivien muokkaus">
          <div class="staff-top-slider" id="staffTopSlider" role="slider" tabindex="0" aria-label="Viivastojen aloituskorkeus" aria-orientation="vertical" aria-valuemin="8" aria-valuemax="30" aria-valuenow="17" aria-valuetext="Nykyinen aloituskorkeus" title="Viivastojen aloituskorkeus">
            <div class="staff-top-track" aria-hidden="true"><div class="staff-top-fill" id="staffTopFill"></div></div>
            <div class="staff-top-thumb" id="staffTopThumb" aria-hidden="true"></div>
          </div>
          <div class="line-spacing-slider" id="lineSpacingSlider" role="slider" tabindex="0" aria-label="Riviväli" aria-orientation="vertical" aria-valuemin="1" aria-valuemax="10" aria-valuenow="5" aria-valuetext="300 %">
            <div class="line-spacing-track" aria-hidden="true"><div class="line-spacing-fill" id="lineSpacingFill"></div></div>
            <div class="line-spacing-thumb" id="lineSpacingThumb" aria-hidden="true"></div>
          </div>
          <button class="edit-rail-button" id="systemBreakButton" type="button" aria-label="Muokkaa rivinvaihtoja" aria-pressed="false">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 12h32M8 21h24M8 30h20"/><path d="M38 21v9c0 4.4-3.6 8-8 8H18"/><path d="m23 33-5 5 5 5"/></svg>
          </button>
          <button class="edit-rail-button" id="stretchLastLineButton" type="button" aria-label="Venytä viimeinen rivi koko leveyteen" aria-pressed="false">↔</button>
        </div>
        <div class="selection-toolbar" id="selectionToolbar" role="toolbar" aria-label="Valittujen nuottien muokkaus" aria-hidden="true">
          <div class="selection-toolbar-row selection-toolbar-main-row">
            <button class="selection-toolbar-drag-handle" id="selectionToolbarDragHandle" type="button" aria-label="Siirrä työkalupalkkia"><svg viewBox="0 0 18 30" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="13" cy="6" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="13" cy="15" r="2"/><circle cx="5" cy="24" r="2"/><circle cx="13" cy="24" r="2"/></svg></button>
            <button class="selection-action-button" id="selectionSlurButton" type="button" aria-label="Lisää tai poista legatokaari" aria-pressed="false" disabled><img class="custom-tool-icon" src="assets/slur.svg" alt="" aria-hidden="true" draggable="false"></button>
            <button class="selection-action-button" id="selectionSlurFlipButton" type="button" aria-label="Vaihda legatokaari ylä- tai alapuolelle" aria-pressed="false" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 17C15 7 33 7 40 17"/><path d="M8 31C15 41 33 41 40 31"/><path d="M24 20v8"/><path d="m20 23 4-4 4 4M20 25l4 4 4-4"/></svg></button>
            <button class="selection-action-button" id="selectionStemFlipButton" type="button" aria-label="Vaihda nuottivarren suunta" aria-pressed="false" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="21" cy="30" rx="6" ry="4" transform="rotate(-18 21 30)"/><path d="M26 29V11"/><path d="M33 14V34"/><path d="m29 18 4-4 4 4M29 30l4 4 4-4"/></svg></button>
            <button class="selection-action-button" id="selectionTieFlipButton" type="button" aria-label="Käännä sidekaari" aria-pressed="false" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 27C15 14 33 14 40 27"/><path d="M17 35h14"/><path d="m20 31-4 4 4 4M28 31l4 4-4 4"/></svg></button>
            <button class="selection-action-button" id="selectionStaccatoButton" type="button" aria-label="Lisää tai poista staccatopisteet" aria-pressed="false" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="5"/></svg></button>
            <button class="selection-action-button" id="selectionPortatoButton" type="button" aria-label="Lisää tai poista portatoviivat" aria-pressed="false" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 24h24"/></svg></button>

      if(workMode==='write'&&scoreMultiTouchLocked&&e.cancelable)e.preventDefault();
    }
    function startScoreGesture(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      if(!scorePointers.size){scoreGesture=0;scoreUndoneAction=null;scoreStartX=e.clientX;scoreStartY=e.clientY;scoreMoved=false}
      scorePointers.add(e.pointerId);
      try{score.setPointerCapture(e.pointerId)}catch{}
      if(scorePointers.size>=3&&scoreGesture!==3){
        if(scoreGesture===2&&scoreUndoneAction)redoChange(scoreUndoneAction);
        scoreGesture=3;scoreUndoneAction=null;clearScore();
      }else if(scorePointers.size===2&&scoreGesture===0){
        scoreGesture=2;scoreUndoneAction=undoLastChange();
      }
    }
    function moveScoreGesture(e){
      if(!scorePointers.has(e.pointerId)||scoreGesture!==0||scorePointers.size!==1||scoreMoved)return;
      if(Math.hypot(e.clientX-scoreStartX,e.clientY-scoreStartY)>=SCORE_SCROLL_SLOP)scoreMoved=true;
    }
    function endScoreGesture(e,cancelled=false){
      if(!scorePointers.has(e.pointerId))return;
      const singleTap=scorePointers.size===1&&scoreGesture===0&&!scoreMoved&&!cancelled;
      try{if(score.hasPointerCapture(e.pointerId))score.releasePointerCapture(e.pointerId)}catch{}
      scorePointers.delete(e.pointerId);
      if(singleTap&&workMode==='write'){const hit=writeNoteHitAtClient(e.clientX,e.clientY);if(hit)selectWriteNote(hit.entryIndex);else if(writeEditNoteId&&keyboardPanel.hidden)togglePiano(e);else{clearWriteNoteEdit();togglePiano(e)}}
      if(!scorePointers.size){scoreGesture=0;scoreUndoneAction=null;scoreMoved=false}
    }
    function scoreKey(e){
      if(workMode!=='write'||(e.key!=='Enter'&&e.key!==' '))return;
      e.preventDefault();togglePiano({pointerType:'keyboard',preventDefault(){}});
    }
    function activateWorkMode(e){
      const button=e.target.closest('.mode-tab');
      if(!button||button.disabled)return;
      if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
      if(e.type==='pointerup'&&e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();setWorkMode(button.dataset.workMode,e);
    }

    restoreNotationSettings();restoreModifierPosition();syncNotationChoices();syncPickupOptions();buildKeyWheel();
    buildKeyboard();
    applyNotationSettings();
    syncWorkModeUI();
    syncSelectionToolbar();
    requestAnimationFrame(()=>{positionModifierRail();updateScorePagePreview();syncStaffTopSlider();syncLineSpacingSlider()});
    modeTabs.addEventListener('pointerup',activateWorkMode);
    modeTabs.addEventListener('keydown',activateWorkMode);
    tuningChoices.addEventListener('click',chooseNotationSetting);
    clefChoices.addEventListener('click',chooseNotationSetting);
    keyTrigger.addEventListener('click',openKeyWheel);
    keyWheelSlots.addEventListener('click',chooseKeyWheelSlot);
    keyWheelClose.addEventListener('click',closeKeyWheel);
    keyWheelPopover.addEventListener('click',keyWheelBackdrop);
    document.addEventListener('keydown',keyWheelKey);
    timeSignatureSelect.addEventListener('change',syncPickupOptions);
    pickupChoices.addEventListener('click',choosePickup);
    projectForm.addEventListener('submit',saveProject);
    scoreTitle.addEventListener('pointerdown',editProjectFromTitle);
    scoreTitle.addEventListener('keydown',editProjectFromTitle);
    modifierRail.addEventListener('pointerdown',startModifier);
    modifierDragHandle.addEventListener('pointerdown',startModifierDrag);
    modifierDragHandle.addEventListener('pointermove',moveModifierDrag);
    modifierDragHandle.addEventListener('pointerup',endModifierDrag);
    modifierDragHandle.addEventListener('pointercancel',endModifierDrag);
    piano.addEventListener('pointerdown',startNote);
    piano.addEventListener('pointermove',moveNote);
    window.addEventListener('pointerup',stopNote);
    window.addEventListener('pointercancel',stopNote);
    window.addEventListener('pointerup',endModifier);
    window.addEventListener('pointercancel',endModifier);
    keyboardScrollRail.addEventListener('pointerdown',startScroll);
    keyboardScrollRail.addEventListener('pointermove',moveScroll);
    keyboardScrollRail.addEventListener('pointerup',endScroll);
    keyboardScrollRail.addEventListener('pointercancel',endScroll);
    keyboardScrollRail.addEventListener('keydown',keyboardScrollKey);
    keyboardViewport.addEventListener('scroll',syncScrollThumb,{passive:true});
    document.addEventListener('touchmove',preventOuterTouchScroll,{passive:false,capture:true});
    window.addEventListener('scroll',keepOuterViewportFixed,{passive:true});
    window.addEventListener('resize',resizeLayout);
    window.addEventListener('osmd-ready',renderScore);
    restoreSelectionToolbarPosition();
    writeNoteContext.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation()},{passive:false});
    writeNoteContext.addEventListener('pointerup',e=>e.stopPropagation());
    writeNoteAccidentalButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleWriteNoteAccidental()});
    writeNoteDeleteButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();deleteWriteNote()});
    score.addEventListener('scroll',()=>{if(writeEditNoteId)positionWriteNoteContext();if(!barlinePalette.hidden)closeBarlinePalette()},{passive:true});
    score.addEventListener('touchstart',startScoreTouchLock,{passive:false,capture:true});
    score.addEventListener('touchmove',moveScoreTouchLock,{passive:false,capture:true});
    score.addEventListener('touchend',endScoreTouchLock,{passive:false,capture:true});
    score.addEventListener('touchcancel',endScoreTouchLock,{passive:false,capture:true});
    score.addEventListener('gesturestart',preventScoreNativeGesture,{passive:false,capture:true});
    score.addEventListener('gesturechange',preventScoreNativeGesture,{passive:false,capture:true});
    score.addEventListener('pointerdown',startScoreGesture);
    score.addEventListener('pointermove',moveScoreGesture,{passive:true});
    score.addEventListener('pointerup',e=>endScoreGesture(e));
    score.addEventListener('pointercancel',e=>endScoreGesture(e,true));
    score.addEventListener('keydown',scoreKey);
    selectionSlurButton.addEventListener('click',toggleSlurForSelection);
    selectionSlurFlipButton.addEventListener('click',toggleSlurPlacement);
    selectionStemFlipButton.addEventListener('click',toggleStemDirectionForSelection);
    selectionTieFlipButton.addEventListener('click',toggleTiePlacement);
    selectionStaccatoButton.addEventListener('click',()=>toggleBooleanForSelection('staccato','Staccato'));
    selectionPortatoButton.addEventListener('click',()=>toggleBooleanForSelection('portato','Portato'));
    selectionAccentButton.addEventListener('click',()=>toggleBooleanForSelection('accent','Aksentti'));
    selectionDynamicButtons.forEach(button=>button.addEventListener('click',()=>toggleDynamicForSelection(button.dataset.dynamic)));
    selectionToolbarDragHandle.addEventListener('pointerdown',beginSelectionToolbarDrag,{passive:false});
    selectionToolbarDragHandle.addEventListener('pointermove',moveSelectionToolbarDrag,{passive:false});
    selectionToolbarDragHandle.addEventListener('pointerup',endSelectionToolbarDrag,{passive:false});
    selectionToolbarDragHandle.addEventListener('pointercancel',endSelectionToolbarDrag,{passive:false});
    selectionCrescendoButton.addEventListener('click',()=>toggleHairpinForSelection('crescendo'));
    selectionDiminuendoButton.addEventListener('click',()=>toggleHairpinForSelection('diminuendo'));
    staffTopSlider.addEventListener('pointerdown',beginStaffTopDrag,{passive:false});
    staffTopSlider.addEventListener('pointermove',moveStaffTopDrag,{passive:false});
    staffTopSlider.addEventListener('pointerup',e=>finishStaffTopDrag(e),{passive:false});
    staffTopSlider.addEventListener('pointercancel',e=>finishStaffTopDrag(e,true),{passive:false});
    staffTopSlider.addEventListener('keydown',staffTopKey);
    lineSpacingSlider.addEventListener('pointerdown',beginLineSpacingDrag,{passive:false});
    lineSpacingSlider.addEventListener('pointermove',moveLineSpacingDrag,{passive:false});
    lineSpacingSlider.addEventListener('pointerup',e=>finishLineSpacingDrag(e),{passive:false});
    lineSpacingSlider.addEventListener('pointercancel',e=>finishLineSpacingDrag(e,true),{passive:false});
    lineSpacingSlider.addEventListener('keydown',lineSpacingKey);
    systemBreakButton.addEventListener('click',toggleSystemBreakMode);
    barlineEditButton.addEventListener('click',toggleBarlineEditMode);
    endingOneButton.addEventListener('click',()=>toggleEndingMode(1));
    endingTwoButton.addEventListener('click',()=>toggleEndingMode(2));
    barlineChoiceButtons.forEach(button=>button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();applyBarlineStyle(button.dataset.barlineStyle)}));
    stretchLastLineButton.addEventListener('click',toggleStretchLastLine);
    osmdContainer.addEventListener('pointerdown',e=>{
      if(workMode!=='edit'||barlineEditModeActive||(e.pointerType==='mouse'&&e.button!==0)||e.target.closest?.('.system-break-marker,.system-break-candidate-svg,.barline-edit-marker'))return;
      if(endingModeActive){beginEndingDrag(e);return}
      e.preventDefault();e.stopPropagation();const start=contentPointFromPointer(e);selectionDrag={pointerId:e.pointerId,start,current:start,moved:false};selectedNoteIndices.clear();try{osmdContainer.setPointerCapture(e.pointerId)}catch{}renderSelectionOverlay();
    },{passive:false});
    osmdContainer.addEventListener('pointermove',e=>{
      if(workMode!=='edit')return;if(endingDrag){moveEndingDrag(e);return}if(!selectionDrag||selectionDrag.pointerId!==e.pointerId)return;e.preventDefault();e.stopPropagation();selectionDrag.current=contentPointFromPointer(e);selectionDrag.moved=selectionDrag.moved||Math.hypot(selectionDrag.current.x-selectionDrag.start.x,selectionDrag.current.y-selectionDrag.start.y)>4;if(selectionDrag.moved)selectInRectangle(normalizedRectangle(selectionDrag.start,selectionDrag.current));renderSelectionOverlay();
    },{passive:false});
    const finishSelectionGesture=(e,cancelled=false)=>{
      if(!selectionDrag||selectionDrag.pointerId!==e.pointerId)return;e.preventDefault();e.stopPropagation();if(cancelled)selectedNoteIndices.clear();else{selectionDrag.current=contentPointFromPointer(e);if(selectionDrag.moved)selectInRectangle(normalizedRectangle(selectionDrag.start,selectionDrag.current));else selectAtPoint(selectionDrag.current)}selectionDrag=null;try{osmdContainer.releasePointerCapture(e.pointerId)}catch{}renderSelectionOverlay();
    };
    osmdContainer.addEventListener('pointerup',e=>{if(endingDrag){finishEndingDrag(e);return}finishSelectionGesture(e)});
    osmdContainer.addEventListener('pointercancel',e=>{if(endingDrag){finishEndingDrag(e,true);return}finishSelectionGesture(e,true)});
  </script>
</body>
</html>
