<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pikakirjoitin 3 · BASE 0.5</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app-shell">
    <header class="test-header">
      <h1>Pikakirjoitin 3</h1>
      <p>BASE 0.5 · Pikakirjoitin 2 -koskettimisto → Score Model → MusicXML → OSMD 2.1.2</p>
    </header>

    <section class="score-card" aria-label="Nuottikuva">
      <div id="osmd-container"></div>
      <p id="status" class="status" aria-live="polite">Valitse sävel.</p>
    </section>

    <section class="keyboard-panel" aria-label="Koskettimisto">
      <div class="keyboard-scroll-rail" id="keyboardScrollRail" role="slider" tabindex="0"
           aria-label="Siirrä koskettimistoa" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="keyboard-scroll-track" id="keyboardScrollTrack">
          <div class="keyboard-scroll-thumb" id="keyboardScrollThumb">SIIRRÄ KOSKETTIMISTOA</div>
        </div>
      </div>

      <div class="keyboard-viewport" id="keyboardViewport">
        <div class="piano" id="piano">
          <div class="white-keys" id="whiteKeys"></div>
        </div>
      </div>

      <p class="input-help">
        Pikakirjoitin 2:n koskettimisto. Tässä vaiheessa jokainen kosketus kirjoittaa vielä neljäsosanuotin.
      </p>
    </section>
  </main>

  <script src="vendor/opensheetmusicdisplay.min.js"></script>
  <script src="js/score-model.js"></script>
  <script src="js/musicxml.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
