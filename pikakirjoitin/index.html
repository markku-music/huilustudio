<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pikakirjoitin Flick</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.1.2/build/opensheetmusicdisplay.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="panel left-panel">
      <div class="app-badge">🎼 Pikakirjoitin</div>
      <h2>Kappaleen tiedot</h2>

      <label>
        <span>Nimi</span>
        <input id="titleInput" type="text" value="Uusi kappale" />
      </label>

      <label>
        <span>Säveltäjä</span>
        <input id="composerInput" type="text" value="Markku" />
      </label>

      <label>
        <span>Tempo-merkintä</span>
        <input id="tempoTextInput" type="text" value="Andante" />
      </label>

      <label>
        <span>Tempo (♩ =)</span>
        <div class="stepper-row">
          <button id="tempoDown" class="stepper-btn" type="button">−</button>
          <input id="bpmInput" class="centered" type="number" min="30" max="240" value="100" />
          <button id="tempoUp" class="stepper-btn" type="button">+</button>
        </div>
      </label>

      <label>
        <span>Tahtilaji</span>
        <div class="inline-selects">
          <select id="beatsSelect">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="6">6</option>
          </select>
          <span class="slash">/</span>
          <select id="beatTypeSelect">
            <option value="4" selected>4</option>
            <option value="8">8</option>
          </select>
        </div>
      </label>

      <label>
        <span>Sävellaji</span>
        <div class="inline-selects">
          <select id="keySelect"></select>
          <select id="modeSelect">
            <option value="major" selected>duuri</option>
            <option value="minor">molli</option>
          </select>
        </div>
      </label>

      <div class="left-actions">
        <button id="undoBtn" type="button">Kumoa</button>
        <button id="clearBtn" type="button">Tyhjennä</button>
      </div>
    </aside>

    <main class="main-column">
      <section class="panel paper-panel">
        <div class="paper-toolbar">
          <div class="toolbar-chip status-chip"><span id="statusText">Valmis</span></div>
          <div class="toolbar-chip note-chip">Syöttö: <strong>Flick-koskettimisto</strong></div>
          <button id="layoutToggle" class="toolbar-button" type="button">⚙ ASETTELU</button>
        </div>
        <div id="osmdContainer"></div>
      </section>

      <section class="panel controls-panel">
        <button id="dotToggle" class="mode-btn" type="button">• piste: pois</button>
        <button id="restToggle" class="mode-btn" type="button">𝄽 tauko: pois</button>
        <button id="playScaleBtn" class="mode-btn secondary" type="button">Testiääni</button>
      </section>

      <section class="panel zone-panel">
        <div id="zoneKeyboard" class="zone-keyboard" aria-label="Flick-koskettimisto">
          <div id="keyboardSurface" class="keyboard-surface"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="flickHud" class="flick-hud" aria-hidden="true">
    <div class="flick-hud-item" data-duration="16th"><span class="symbol">𝅘𝅥𝅯</span><span>1/16</span></div>
    <div class="flick-hud-item" data-duration="eighth"><span class="symbol">♪</span><span>1/8</span></div>
    <div class="flick-hud-item" data-duration="quarter"><span class="symbol">♩</span><span>1/4</span></div>
    <div class="flick-hud-item" data-duration="half"><span class="symbol">𝅗𝅥</span><span>1/2</span></div>
    <div class="flick-hud-item" data-duration="whole"><span class="symbol">𝅝</span><span>koko</span></div>
  </div>

  <aside id="layoutPanel" class="layout-panel" aria-hidden="true">
    <div class="layout-panel-head">
      <div>
        <div class="layout-kicker">KEHITTÄJÄTYÖKALUT</div>
        <h2>Koskettimisto & Flick</h2>
      </div>
      <button id="layoutClose" class="icon-button" type="button" aria-label="Sulje">×</button>
    </div>

    <div class="layout-section">
      <h3>Valkoiset koskettimet</h3>
      <label class="slider-row">
        <span>Leveys <output id="whiteWidthOut">100 %</output></span>
        <input id="whiteWidthSlider" type="range" min="75" max="135" step="1" value="100">
      </label>
      <label class="slider-row">
        <span>Koskettimiston korkeus <output id="keyboardHeightOut">100 %</output></span>
        <input id="keyboardHeightSlider" type="range" min="70" max="125" step="1" value="100">
      </label>
    </div>

    <div class="layout-section">
      <h3>Mustat koskettimet</h3>
      <label class="slider-row">
        <span>Leveys <output id="blackWidthOut">66 %</output></span>
        <input id="blackWidthSlider" type="range" min="35" max="95" step="1" value="66">
      </label>
      <label class="slider-row">
        <span>Korkeus <output id="blackHeightOut">56 %</output></span>
        <input id="blackHeightSlider" type="range" min="30" max="85" step="1" value="56">
      </label>
    </div>

    <div class="layout-section">
      <h3>Flick-eleen rajat</h3>
      <p class="layout-hint">Napautus on 1/4. Liike ylöspäin lyhentää ja alaspäin pidentää aika-arvoa.</p>
      <label class="slider-row">
        <span>1/8 alkaa <output id="flickEighthOut">26 px</output></span>
        <input id="flickEighthSlider" type="range" min="10" max="70" step="1" value="26">
      </label>
      <label class="slider-row">
        <span>1/16 alkaa <output id="flickSixteenthOut">72 px</output></span>
        <input id="flickSixteenthSlider" type="range" min="35" max="150" step="1" value="72">
      </label>
      <label class="slider-row">
        <span>1/2 alkaa <output id="flickHalfOut">26 px</output></span>
        <input id="flickHalfSlider" type="range" min="10" max="70" step="1" value="26">
      </label>
      <label class="slider-row">
        <span>Koko alkaa <output id="flickWholeOut">72 px</output></span>
        <input id="flickWholeSlider" type="range" min="35" max="150" step="1" value="72">
      </label>
    </div>

    <div class="layout-actions">
      <button id="layoutReset" type="button">Palauta oletukset</button>
      <button id="layoutCopy" type="button">Kopioi arvot</button>
    </div>
  </aside>

  <template id="whiteKeyTemplate">
    <div class="white-key key"><span class="key-label"></span></div>
  </template>
  <template id="blackKeyTemplate">
    <div class="black-key key"></div>
  </template>

  <script src="app.js"></script>
</body>
</html>
