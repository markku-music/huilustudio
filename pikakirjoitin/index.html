<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef1f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <script async src="vendor/osmd/opensheetmusicdisplay.min.js" onload="window.dispatchEvent(new Event('osmd-ready'))"></script>
  <title>Pikakirjoitin 0.8.5 · Muokkaa</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:system-ui,-apple-system,sans-serif;color:#18202a;background:#eef1f5}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    body{position:fixed;inset:0;-webkit-user-select:none;user-select:none}
    button,input,select{font:inherit;-webkit-tap-highlight-color:transparent}
    .app{position:fixed;inset:0;width:100%;height:auto;display:flex;flex-direction:column;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom);background:#eef1f5}
    p{margin:0;color:#586474;font-size:14px}
    .mode-tabs{position:fixed;z-index:40;top:0;left:50%;width:min(380px,calc(100% - 24px));height:34px;display:flex;align-items:flex-start;gap:4px;transform:translateX(-50%);pointer-events:auto}
    .mode-tab{min-width:0;height:30px;flex:1;padding:0 8px;border:1px solid #536b82;border-top:0;border-radius:0 0 10px 10px;background:#71879c;color:#fff;box-shadow:0 3px 8px #1c27352b;font-size:9px;font-weight:850;letter-spacing:.055em;white-space:nowrap;touch-action:manipulation;-webkit-touch-callout:none;cursor:pointer}
    .mode-tab[aria-pressed="true"]{height:34px;border-color:#174d83;background:#2365aa;box-shadow:0 5px 12px #1c273540}
    .mode-tab:disabled{border-color:#8e9aa8;background:#aeb8c4;color:#eef2f6;opacity:.68;cursor:default}
    .mode-tab:focus-visible{outline:3px solid #62a7ff;outline-offset:2px}
    .workspace{min-height:0;flex:1;display:flex;flex-direction:column}
    .score-area{position:relative;min-height:0;flex:7 1 70%;display:flex;padding:0 16px 12px}
    .score{position:relative;width:100%;min-height:120px;overflow:auto;padding:8px 0;border:2px solid #9ba6b4;border-radius:12px;background:#dfe4ea;color:#18202a;box-shadow:0 10px 28px #1c273520;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;cursor:pointer}
    .score:focus-visible{outline:3px solid #62a7ff;outline-offset:2px}
    .score-page-shell{position:relative;margin:0 auto;flex:none}
    .score-page{position:absolute;top:0;left:0;width:794px;min-height:1123px;transform-origin:top left;background:#fff;box-shadow:0 4px 16px #1c273538}
    .score-title{position:absolute;z-index:2;top:28px;left:50px;right:50px;display:block;max-height:58px;overflow:hidden;text-align:center;font-size:25px;font-weight:750;line-height:1.15;touch-action:manipulation;cursor:pointer}
    .score-info-row{position:absolute;z-index:2;top:104px;left:50px;right:50px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:baseline;gap:36px;color:#263342;font-size:15px;font-weight:650;line-height:1.2;pointer-events:none}
    .score-tempo{min-width:0;text-align:left;overflow-wrap:anywhere}
    .score-composer{min-width:0;text-align:right;overflow-wrap:anywhere}
    #osmdContainer{width:100%;min-height:1123px;pointer-events:none}
    #osmdContainer svg{display:block;max-width:100%}
    .score-prompt{display:none!important}
    .modifier-rail{position:absolute;z-index:12;top:8px;left:0;width:58px;display:grid;gap:6px;padding:7px 5px 7px 6px;border:1px solid #677281;border-left:0;border-radius:0 13px 13px 0;background:#20242af2;box-shadow:5px 7px 18px #10182045;transform:translateX(-105%);opacity:0;visibility:hidden;pointer-events:none;touch-action:none;-webkit-touch-callout:none;transition:transform .16s ease-out,opacity .16s ease-out,visibility 0s linear .16s}
    .app.keyboard-open .modifier-rail{transform:translateX(0);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
    .modifier-button{width:46px;height:50px;display:grid;place-items:center;align-content:center;gap:1px;padding:2px;border:1px solid #778493;border-radius:9px;background:#f6f8fb;color:#1b2735;box-shadow:0 2px 5px #0004;font-weight:850;line-height:1;touch-action:none;cursor:pointer}
    .modifier-button[aria-pressed="true"]{border-color:#9dcbff;background:#2873c5;color:#fff;box-shadow:inset 0 2px 5px #0b3c7355,0 0 0 2px #73b4fa}
    .modifier-drag-handle{width:46px;height:24px;display:grid;place-items:center;padding:0;border:1px solid #687685;border-radius:8px;background:#343b45;color:#cbd5e0;touch-action:none;cursor:ns-resize}
    .modifier-drag-handle:active{background:#465260;color:#fff}
    .modifier-drag-handle svg{display:block;width:22px;height:12px;pointer-events:none}
    .modifier-icon{display:block;width:29px;height:38px;object-fit:contain;pointer-events:none}
    .modifier-button[aria-pressed="true"] .modifier-icon{filter:brightness(0) invert(1)}
    .modifier-divider{height:1px;margin:1px 5px;background:#697686}
    .tie-button svg{display:block;width:34px;height:26px;pointer-events:none}
    .selection-toolbar{position:absolute;z-index:32;top:42px;left:0;max-width:calc(100% - 32px);min-height:50px;display:none;align-items:center;gap:6px;overflow-x:auto;padding:5px 7px;border:1px solid #b8a1f3;border-radius:15px;background:#fffffff5;box-shadow:0 8px 24px #482d892e;touch-action:pan-x;-webkit-overflow-scrolling:touch}
    .app[data-work-mode="edit"] .selection-toolbar{display:flex}
    .selection-drag-handle{width:30px;height:38px;flex:0 0 30px;display:grid;place-items:center;padding:0;border:0;border-right:1px solid #dfd5f6;background:transparent;color:#6a50a8;cursor:move;touch-action:none}
    .selection-drag-handle svg{display:block;width:17px;height:24px;pointer-events:none}
    .selection-count{min-width:96px;color:#4e2ca8;font-size:12px;font-weight:800;white-space:nowrap}
    .selection-action-button{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;padding:0;border:1px solid #d3c5f7;border-radius:10px;background:#fff;color:#5633ad;touch-action:manipulation;cursor:pointer}
    .selection-action-button.wide{width:auto;min-width:62px;padding:0 7px;font-size:9px;font-weight:850;letter-spacing:.025em}
    .selection-action-button svg{width:28px;height:28px;overflow:visible;fill:currentColor;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
    .selection-action-button svg path:first-child{fill:none}
    .selection-action-button[aria-pressed="true"]{border-color:#8653f6;background:#eee8ff;box-shadow:inset 0 0 0 1px #8653f633}
    .selection-action-button:disabled{opacity:.35;cursor:default}
    .selection-dynamic-control{height:38px;flex:0 0 auto;display:flex;align-items:center;gap:3px;padding-left:7px;border:1px solid #d3c5f7;border-radius:10px;background:#fff;color:#6a50a8;font-size:11px;font-weight:800;white-space:nowrap}
    .selection-dynamic-select{width:60px;height:36px;padding:0 20px 0 5px;border:0;border-left:1px solid #e6ddfa;border-radius:0 9px 9px 0;background:transparent;color:#5633ad;font:italic 800 17px/1 Georgia,serif;text-align:center}
    .selection-dynamic-select:disabled{opacity:.38}
    #osmdContainer{position:relative}
    .app[data-work-mode="edit"] #osmdContainer{pointer-events:auto;cursor:crosshair;touch-action:none}
    .note-selection-layer,.system-break-layer{position:absolute;z-index:7;inset:0;pointer-events:none;overflow:visible}
    .note-selection-highlight{position:absolute;border:2px solid #6841d6e0;border-radius:8px;background:#8653f629;box-shadow:0 0 0 2px #ffffff8c}
    .note-selection-marquee{position:absolute;border:2px dashed #6841d6e8;border-radius:8px;background:#8653f61f}
    .system-break-marker{position:absolute;z-index:2;width:25px;height:25px;display:grid;place-items:center;padding:0;border:1px solid #5e86bd;border-radius:50%;background:#f5f9ffeb;color:#2365aa;box-shadow:0 2px 7px #1c273538;font-size:15px;font-weight:900;line-height:1;pointer-events:auto;touch-action:manipulation;cursor:pointer}
    .system-break-marker[aria-pressed="true"]{border-color:#174d83;background:#2365aa;color:#fff}
    .app[data-work-mode="edit"] .score-title,.app[data-work-mode="edit"] .score-tempo,.app[data-work-mode="edit"] .score-composer{pointer-events:auto;cursor:move;touch-action:none;outline-offset:3px}
    .app[data-work-mode="edit"] .score-title{cursor:ns-resize}
    .app[data-work-mode="edit"] .score-info-row{pointer-events:auto}
    .score-text-dragging{outline:2px solid #8653f6;border-radius:4px}
    .keyboard-panel{width:100vw;min-height:0;flex:3 1 30%;background:#20242a}
    .keyboard-panel[hidden]{display:none}
    .keyboard-scroll-rail{height:44px;padding:7px 12px;background:#eef1f5;touch-action:none;cursor:ew-resize;outline-offset:-3px}
    .keyboard-scroll-track{position:relative;width:100%;height:30px;overflow:hidden;border:1px solid #9ba6b4;border-radius:9px;background:#d7dde5;box-shadow:inset 0 1px 3px #1c273526}
    .keyboard-scroll-thumb{position:absolute;inset:0 auto 0 0;width:40%;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#2365aa;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap;will-change:transform}
    .keyboard-viewport{width:100vw;height:calc(100% - 44px);overflow-x:hidden;overflow-y:hidden;background:#20242a;border-top:5px solid #20242a;border-bottom:5px solid #20242a;touch-action:none;scrollbar-width:none}
    .keyboard-viewport::-webkit-scrollbar{display:none}
    .piano{position:relative;width:250vw;height:100%;touch-action:none;-webkit-touch-callout:none}
    .white-keys{display:flex;width:100%;height:100%}
    .key{position:relative;border:0;touch-action:none;cursor:pointer}
    .white{flex:0 0 calc(100% / 35);height:100%;background:linear-gradient(#fff 82%,#e7e7e7);border-right:1px solid #aeb4bc;color:#303844;font:650 clamp(12px,2vw,17px) system-ui;padding:0 0 14px;display:flex;align-items:end;justify-content:center}
    .white:last-child{border-right:0}
    .black{position:absolute;z-index:2;top:0;height:50%;background:linear-gradient(90deg,#101216,#30343a 45%,#090a0c);border-radius:0 0 7px 7px;box-shadow:0 5px 7px #0008}
    .key.out-of-range::before{content:'';position:absolute;inset:0;z-index:3;border-radius:inherit;background:#aeb8c5a8;pointer-events:none}
    .key.out-of-range.active::before{background:#aeb8c548}
    .key.active{background:#62a7ff}
    .black.active{background:#2869b8}
    .key.sounding-note::after{content:'';position:absolute;z-index:5;top:14px;left:50%;width:12px;height:12px;transform:translateX(-50%);border:2px solid #fff;border-radius:50%;background:#e2212d;box-shadow:0 1px 5px #0008;pointer-events:none;transition:opacity .16s ease}
    .key.sounding-resting::after{opacity:.48}
    #status{position:fixed;left:0;bottom:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0;pointer-events:none}
    .orientation-blocker{display:none;position:fixed;inset:0;z-index:1000;padding:28px;place-items:center;background:#eef1f5;text-align:center}
    .orientation-card{max-width:430px;padding:34px 28px;border:1px solid #ced7e2;border-radius:18px;background:#fff;box-shadow:0 16px 42px #1c273526}
    .orientation-icon{display:block;margin-bottom:14px;font-size:52px;line-height:1}
    .orientation-card h2{margin:0 0 8px;font-size:24px}
    .orientation-card p{font-size:16px;line-height:1.45}
    .project-modal{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:#17202bd9;overflow:auto}
    .project-modal[hidden]{display:none}
    .project-card{width:min(660px,100%);max-height:100%;overflow:auto;padding:clamp(20px,4vw,32px);border-radius:18px;background:#fff;box-shadow:0 24px 70px #0006;text-align:left}
    .project-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:grid}
    .field.wide{grid-column:1/-1}
    .field input,.field select{width:100%;min-height:46px;padding:9px 11px;border:1px solid #9ba6b4;border-radius:9px;background:#fff;color:#18202a;font-size:16px}
    .instrument-heading{margin:20px 0 10px;color:#4e5c6c;font-size:11px;font-weight:850;letter-spacing:.07em;text-align:center}
    .instrument-picker{position:relative}
    .instrument-trigger{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 13px;border:1px solid #9ba6b4;border-radius:9px;background:#fff;color:#263342;font-size:15px;font-weight:700;text-align:left;touch-action:manipulation;cursor:pointer}
    .instrument-trigger svg{width:12px;height:8px;flex:none;transition:transform .15s ease;pointer-events:none}
    .instrument-trigger[aria-expanded="true"] svg{transform:rotate(180deg)}
    .instrument-menu{position:absolute;z-index:20;left:0;right:0;bottom:calc(100% + 6px);max-height:min(220px,36svh);overflow:auto;padding:4px;border:1px solid #9ba6b4;border-radius:11px;background:#fff;box-shadow:0 12px 30px #1c273538;-webkit-overflow-scrolling:touch;touch-action:pan-y}
    .instrument-menu[hidden]{display:none}
    .instrument-choice{width:100%;min-height:42px;padding:7px 10px;border:0;border-bottom:1px solid #e0e6ed;border-radius:7px;background:#fff;color:#263342;font-size:13px;font-weight:700;text-align:left;touch-action:manipulation;cursor:pointer}
    .instrument-choice:last-child{border-bottom:0}
    .instrument-choice:active,.instrument-choice[aria-selected="true"]{background:#dcecff;color:#174d83}
    .start-button{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:10px;background:#2365aa;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
    .start-button[hidden]{display:none}
    @media (max-width:700px){.score-area{padding:0 10px 8px}.score{border-radius:10px}}
    @media (max-width:520px){.project-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.project-card{padding:20px}.mode-tabs{width:calc(100% - 16px);gap:3px}.mode-tab{padding:0 4px;font-size:8px}}
    @media (orientation:landscape){.app{display:none}.orientation-blocker{display:grid}}
    @page{size:A4 portrait;margin:0}
    @media print{
      html,body{position:static;width:210mm;height:auto;overflow:visible;background:#fff}
      .orientation-blocker,.mode-tabs,.keyboard-panel,.modifier-rail,.selection-toolbar,.note-selection-layer,.system-break-layer,#status,.score-prompt{display:none!important}
      .app{position:static;display:block!important;width:210mm;height:auto;padding:0;background:#fff}
      .workspace{display:block}
      .score-area{display:block;padding:0}
      .score{width:210mm;min-height:0;overflow:visible;padding:0;border:0;border-radius:0;background:#fff;box-shadow:none}
      .score-page-shell{position:static;width:210mm!important;height:auto!important;margin:0}
      .score-page{position:relative;width:210mm;min-height:297mm;transform:none!important;box-shadow:none}
    }
  </style>
</head>
<body>
  <div class="orientation-blocker" role="status" aria-live="polite">
    <div class="orientation-card">
      <span class="orientation-icon" aria-hidden="true">↻</span>
      <h2>Käännä tabletti pystyasentoon</h2>
      <p>Pikakirjoitin on suunniteltu käytettäväksi portrait-asennossa.</p>
    </div>
  </div>

  <div class="project-modal" id="projectModal" role="dialog" aria-modal="true" aria-label="Kappaleen tiedot">
    <form class="project-card" id="projectForm">
      <select id="instrumentSelect" aria-label="Soitin" hidden>
        <option value="flute-oboe">Huilu / oboe (C)</option>
        <option value="clarinet">Klarinetti (B♭)</option>
        <option value="alto-saxophone">Alttosaksofoni (E♭)</option>
        <option value="trumpet">Trumpetti (B♭)</option>
        <option value="french-horn">Käyrätorvi (F)</option>
        <option value="trombone">Pasuuna (C)</option>
        <option value="violin">Viulu (C)</option>
        <option value="viola">Alttoviulu (C)</option>
        <option value="cello">Sello (C)</option>
        <option value="double-bass">Kontrabasso (C · 8vb)</option>
      </select>
      <div class="project-grid">
        <label class="field wide" for="titleInput">
          <input id="titleInput" type="text" autocomplete="off" placeholder="Nimi" aria-label="Nimi">
        </label>
        <label class="field" for="composerInput">
          <input id="composerInput" type="text" autocomplete="off" placeholder="Säveltäjä" aria-label="Säveltäjä">
        </label>
        <label class="field" for="tempoInput">
          <input id="tempoInput" type="text" autocomplete="off" placeholder="Tempoteksti" aria-label="Tempoteksti">
        </label>
        <label class="field" for="keySignatureSelect">
          <select id="keySignatureSelect" aria-label="Sävellaji">
            <option value="0">C-duuri / a-molli</option>
            <option value="1">G-duuri / e-molli</option>
            <option value="2">D-duuri / h-molli</option>
            <option value="3">A-duuri / fis-molli</option>
            <option value="4">E-duuri / cis-molli</option>
            <option value="5">H-duuri / gis-molli</option>
            <option value="6">Fis-duuri / dis-molli</option>
            <option value="7">Cis-duuri / ais-molli</option>
            <option value="-1">F-duuri / d-molli</option>
            <option value="-2">B-duuri / g-molli</option>
            <option value="-3">Es-duuri / c-molli</option>
            <option value="-4">As-duuri / f-molli</option>
            <option value="-5">Des-duuri / b-molli</option>
            <option value="-6">Ges-duuri / es-molli</option>
            <option value="-7">Ces-duuri / as-molli</option>
          </select>
        </label>
        <label class="field" for="timeSignatureSelect">
          <select id="timeSignatureSelect" aria-label="Tahtilaji">
            <option value="2/4">2/4</option>
            <option value="3/4">3/4</option>
            <option value="4/4" selected>4/4</option>
            <option value="2/2">2/2</option>
            <option value="3/8">3/8</option>
            <option value="6/8">6/8</option>
            <option value="9/8">9/8</option>
            <option value="12/8">12/8</option>
          </select>
        </label>
      </div>
      <p class="instrument-heading" id="instrumentHeading">VALITSE SOITIN JA ALOITA</p>
      <div class="instrument-picker" id="instrumentPicker">
        <button class="instrument-trigger" id="instrumentTrigger" type="button" aria-haspopup="listbox" aria-controls="instrumentMenu" aria-expanded="false">
          <span id="instrumentTriggerLabel">Valitse soitin</span>
          <svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="instrument-menu" id="instrumentMenu" role="listbox" aria-label="Soitin" hidden>
          <button class="instrument-choice" type="button" role="option" data-instrument="flute-oboe" aria-selected="false">Huilu / oboe (C)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="clarinet" aria-selected="false">Klarinetti (B♭)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="alto-saxophone" aria-selected="false">Alttosaksofoni (E♭)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="trumpet" aria-selected="false">Trumpetti (B♭)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="french-horn" aria-selected="false">Käyrätorvi (F)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="trombone" aria-selected="false">Pasuuna (C)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="violin" aria-selected="false">Viulu (C)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="viola" aria-selected="false">Alttoviulu (C)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="cello" aria-selected="false">Sello (C)</button>
          <button class="instrument-choice" type="button" role="option" data-instrument="double-bass" aria-selected="false">Kontrabasso (C · 8vb)</button>
        </div>
      </div>
      <button class="start-button" id="projectSaveButton" type="submit" hidden>Tallenna</button>
    </form>
  </div>

  <main class="app" id="app" aria-hidden="true" inert>
    <nav class="mode-tabs" id="modeTabs" aria-label="Työskentelytila">
      <button class="mode-tab" id="writeModeButton" type="button" data-work-mode="write" aria-pressed="true">KIRJOITA</button>
      <button class="mode-tab" id="editModeButton" type="button" data-work-mode="edit" aria-pressed="false" disabled>MUOKKAA</button>
      <button class="mode-tab" id="printModeButton" type="button" data-work-mode="print" aria-pressed="false" disabled>TULOSTA</button>
    </nav>
    <div class="workspace">
      <section class="score-area">
        <div class="score" id="score" role="button" tabindex="0" aria-expanded="false" aria-controls="keyboardPanel" aria-label="Nuotti-ikkuna. Pyyhkäise pystysuunnassa vierittääksesi A4-sivua tai napauta avataksesi koskettimiston.">
          <div class="score-page-shell" id="scorePageShell">
            <div class="score-page" id="scorePage">
              <span class="score-title" id="scoreTitle" role="button" tabindex="0" aria-label="Muokkaa kappaleen tietoja">Nimetön kappale</span>
              <div class="score-info-row" aria-label="Kappaleen tempo ja säveltäjä">
                <span class="score-tempo" id="scoreTempo" hidden></span>
                <span class="score-composer" id="scoreComposer" hidden></span>
              </div>
              <div id="osmdContainer" aria-hidden="true"></div>
              <span class="score-prompt" id="scorePrompt" hidden></span>
            </div>

      if(e.type==='pointerdown'&&e.pointerType==='mouse'&&e.button!==0)return;
      if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
      e.preventDefault();e.stopPropagation();showProjectModal();
    }
    function applyProjectData(){
      saveInstrument();
      projectData={instrument:instrumentSelect.value,instrumentName:selectedText(instrumentSelect),title:titleInput.value.trim(),composer:composerInput.value.trim(),tempoText:tempoInput.value.trim(),keySignature:+keySignatureSelect.value,keySignatureName:selectedText(keySignatureSelect),timeSignature:timeSignatureSelect.value,clef:instrumentClefs[instrumentSelect.value]||'treble',transpose:profile().transpose};
      syncInstrumentChoices(true);setInstrumentMenuOpen(false);
      scoreTitle.textContent=projectData.title||'Nimetön kappale';
      scoreTempo.textContent=projectData.tempoText;scoreTempo.hidden=!projectData.tempoText;
      scoreComposer.textContent=projectData.composer;scoreComposer.hidden=!projectData.composer;
      buildKeyboard();applyInstrumentProfile();projectModal.hidden=true;app.inert=false;app.removeAttribute('aria-hidden');score.focus();
      applyScoreTextPositions();renderScore();
      requestAnimationFrame(()=>{updateScorePagePreview();if(!keyboardPanel.hidden)positionKeyboardForInstrument()});
    }
    function saveProject(e){
      e.preventDefault();if(!projectData)return;applyProjectData();
    }
    function chooseInstrument(e){
      const button=e.target.closest('.instrument-choice');
      if(!button||(e.pointerType==='mouse'&&e.button!==0))return;
      e.preventDefault();instrumentSelect.value=button.dataset.instrument;syncInstrumentChoices(true);setInstrumentMenuOpen(false);
      if(projectData)return;
      togglePiano(e);applyProjectData();
    }

    function visibleName(midi){
      const octave=Math.floor(midi/12)-1,name=whitePitchNames[mod(midi,12)];
      if(octave<=0)return 'SK-'+name;
      if(octave===1)return 'K-'+name;
      if(octave===2)return name;
      if(octave===3)return name.toLowerCase();
      return name.toLowerCase()+(octave-3);
    }
    function spokenName(midi){
      return pitchDisplay(midi,false);
    }
    function keyboardRange(){
      return instrumentSelect.value==='double-bass'?{min:DOUBLE_BASS_MIN_MIDI,max:DOUBLE_BASS_MAX_MIDI}:{min:DEFAULT_MIN_MIDI,max:DEFAULT_MAX_MIDI};
    }
    function clearSoundingMarker(){
      if(!soundingKey)return;
      soundingKey.classList.remove('sounding-note','sounding-resting');soundingKey=null;
    }
    function showSoundingMarker(midi){
      clearSoundingMarker();soundingKey=piano.querySelector(`.key[data-midi="${midi}"]`);
      if(soundingKey)soundingKey.classList.add('sounding-note');
    }
    function buildKeyboard(){
      const range=keyboardRange();
      if(whiteKeys.children.length&&range.min===keyboardMinMidi&&range.max===keyboardMaxMidi)return;
      clearSoundingMarker();whiteKeys.replaceChildren();piano.querySelectorAll('.black').forEach(key=>key.remove());
      keyboardMinMidi=range.min;keyboardMaxMidi=range.max;
      let whiteIndex=0;
      for(let midi=keyboardMinMidi;midi<=keyboardMaxMidi;midi+=1){
        const pitch=midi%12,isWhite=Object.hasOwn(whitePitchNames,pitch),key=document.createElement('button');
        key.type='button';key.className='key '+(isWhite?'white':'black');key.dataset.midi=String(midi);key.setAttribute('aria-label',spokenName(midi));
        if(isWhite){
          key.textContent=visibleName(midi);whiteKeys.appendChild(key);whiteIndex+=1;
        }else{
          const whiteWidth=100/WHITE_COUNT;
          key.style.left=`${whiteIndex*whiteWidth-whiteWidth*BLACK_WIDTH/2}%`;
          key.style.width=`${whiteWidth*BLACK_WIDTH}%`;
          piano.appendChild(key);
        }
      }
    }
    function applyInstrumentProfile(){
      const current=profile(),useFlats=+(projectData?.keySignature??keySignatureSelect.value)<0;
      clearSoundingMarker();
      piano.querySelectorAll('.key').forEach(key=>{
        const midi=+key.dataset.midi,outside=midi<current.min||midi>current.max;
        key.classList.toggle('out-of-range',outside);
        key.setAttribute('aria-label',pitchDisplay(midi,useFlats)+(outside?', alkeisäänialan ulkopuolella':''));
      });
      needsInstrumentPosition=true;
    }
    function positionKeyboardForInstrument(){
      if(keyboardPanel.hidden||!keyboardViewport.clientWidth)return;
      const startMidi=profile().start,whites=[...whiteKeys.children],startIndex=whites.findIndex(key=>+key.dataset.midi===startMidi),maxScroll=Math.max(0,keyboardViewport.scrollWidth-keyboardViewport.clientWidth);
      keyboardViewport.scrollLeft=clamp(Math.max(0,startIndex)*(piano.scrollWidth/WHITE_COUNT),0,maxScroll);
      needsInstrumentPosition=false;syncScrollThumb();
    }
    function buildAudio(){
      try{audio=new AC({latencyHint:'interactive'})}catch{audio=new AC()}
      osc=audio.createOscillator();gain=audio.createGain();osc.type='triangle';gain.gain.value=.0001;osc.connect(gain).connect(audio.destination);started=false;
      audio.onstatechange=()=>status.textContent='Audio: '+audio.state;
      status.textContent='Audio: '+audio.state;
    }
    function clearModifier(){
      const button=activeModifierButton,pointerId=modifierPointerId;
      if(button){button.classList.remove('active');button.setAttribute('aria-pressed','false');try{if(pointerId!==null&&button.hasPointerCapture(pointerId))button.releasePointerCapture(pointerId)}catch{}}
      modifierPointerId=null;activeModifier=null;activeModifierButton=null;
    }
    function startModifier(e){
      const button=e.target.closest('.modifier-button');
      if(!button||(e.pointerType==='mouse'&&e.button!==0)||modifierDragPointerId!==null)return;
      if(button===tieButton){
        if(modifierPointerId!==null)return;
        e.preventDefault();e.stopPropagation();setTieArmed(!tieArmed);return;
      }
      if(modifierPointerId!==null)return;
      e.preventDefault();e.stopPropagation();
      modifierPointerId=e.pointerId;activeModifier=button.dataset.modifier;activeModifierButton=button;button.setAttribute('aria-pressed','true');
      try{button.setPointerCapture(e.pointerId)}catch{}
    }
    function endModifier(e){
      if(e.pointerId!==modifierPointerId)return;
      clearModifier();
    }
    function modifierBounds(){
      const minTop=8,maxTop=Math.max(minTop,scoreArea.clientHeight-modifierRail.offsetHeight-18);
      return {minTop,maxTop};
    }
    function positionModifierRail(){
      const {minTop,maxTop}=modifierBounds();
      modifierRail.style.top=minTop+(maxTop-minTop)*modifierYRatio+'px';
    }
    function restoreModifierPosition(){
      try{const saved=Number.parseFloat(localStorage.getItem(MODIFIER_Y_KEY));if(Number.isFinite(saved))modifierYRatio=clamp(saved,0,1)}catch{}
    }
    function saveModifierPosition(){
      try{localStorage.setItem(MODIFIER_Y_KEY,modifierYRatio.toFixed(4))}catch{}
    }
    function startModifierDrag(e){
      if((e.pointerType==='mouse'&&e.button!==0)||modifierDragPointerId!==null||modifierPointerId!==null)return;
      e.preventDefault();e.stopPropagation();modifierDragPointerId=e.pointerId;modifierDragStartY=e.clientY;modifierDragStartTop=modifierRail.offsetTop;
      try{modifierDragHandle.setPointerCapture(e.pointerId)}catch{}
    }
    function moveModifierDrag(e){
      if(e.pointerId!==modifierDragPointerId)return;
      e.preventDefault();e.stopPropagation();
      const {minTop,maxTop}=modifierBounds(),top=clamp(modifierDragStartTop+e.clientY-modifierDragStartY,minTop,maxTop);
      modifierRail.style.top=top+'px';modifierYRatio=maxTop>minTop?(top-minTop)/(maxTop-minTop):0;
    }
    function finishModifierDrag(pointerId){
      if(pointerId!==modifierDragPointerId)return;
      modifierDragPointerId=null;try{if(modifierDragHandle.hasPointerCapture(pointerId))modifierDragHandle.releasePointerCapture(pointerId)}catch{}saveModifierPosition();
    }
    function endModifierDrag(e){
      e.preventDefault();e.stopPropagation();finishModifierDrag(e.pointerId);
    }
    function cancelModifierDrag(){
      if(modifierDragPointerId!==null)finishModifierDrag(modifierDragPointerId);
    }
    function togglePiano(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();
      if(!keyboardPanel.hidden){clearModifier();setTieArmed(false);cancelModifierDrag();app.classList.remove('keyboard-open');modifierRail.setAttribute('aria-hidden','true');keyboardPanel.hidden=true;score.setAttribute('aria-expanded','false');requestAnimationFrame(updateScorePagePreview);return}
      if(!audio||audio.state==='closed')buildAudio();
      if(!started){osc.start();started=true}
      const done=()=>{
        if(audio.state!=='running')return;
        keyboardPanel.hidden=false;app.classList.add('keyboard-open');modifierRail.setAttribute('aria-hidden','false');score.setAttribute('aria-expanded','true');status.textContent='Audio: running';requestAnimationFrame(()=>{positionModifierRail();updateScorePagePreview();needsInstrumentPosition?positionKeyboardForInstrument():syncScrollThumb()});
      };
      if(audio.state==='running')done();else audio.resume().then(done).catch(()=>status.textContent='Audio: avaaminen epäonnistui');
    }
    function startNote(e){
      const key=e.target.closest('.key');
      if(!key||(e.pointerType==='mouse'&&e.button!==0))return;
      e.preventDefault();
      if(!audio||audio.state!=='running'){status.textContent='Audio: suspended';return}
      if(activeId!==null)return;
      activeId=e.pointerId;activeKey=key;key.classList.add('active');
      const modifier=activeModifier,duration=modifier==='sixteenth'?'sixteenth':'quarter',dotted=modifier==='dot',rest=modifier==='rest';
      noteStartX=e.clientX;noteStartY=e.clientY;noteSwipeThreshold=clamp(keyboardViewport.clientHeight*.12,24,48);noteGestureLocked=duration==='sixteenth';
      try{piano.setPointerCapture(e.pointerId)}catch{}
      const writtenMidi=+key.dataset.midi,soundingMidi=writtenMidi+profile().transpose,t=audio.currentTime;
      const created=addScoreNote(writtenMidi,{duration,dotted,rest});activeNote=created.note;activeNoteAction=created.action;
      if(!noteGestureLocked)longPressTimer=setTimeout(()=>{
        longPressTimer=null;
        if(activeId!==e.pointerId||!activeNote||noteGestureLocked)return;
        noteGestureLocked=true;setActiveNoteDuration('whole');
      },LONG_PRESS_MS);
      activeNoteSounds=!rest;
      if(activeNoteSounds){
        if(profile().transpose)showSoundingMarker(soundingMidi);else clearSoundingMarker();
        osc.frequency.setValueAtTime(440*Math.pow(2,(soundingMidi-69)/12),t);gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.16,t+.012);
      }else clearSoundingMarker();
    }
    function moveNote(e){
      if(e.pointerId!==activeId||!activeNote||noteGestureLocked)return;
      e.preventDefault();
      const dx=e.clientX-noteStartX,dy=e.clientY-noteStartY;
      if(Math.hypot(dx,dy)>LONG_PRESS_MOVE)clearLongPress();
      if(Math.abs(dy)<noteSwipeThreshold)return;
      clearLongPress();noteGestureLocked=true;setActiveNoteDuration(dy>0?'eighth':'half');
    }
    function stopNote(e){
      if(e.pointerId!==activeId||!activeKey)return;
      clearLongPress();
      if(activeNoteSounds){const t=audio.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.16,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.06)}
      activeKey.classList.remove('active');if(activeNoteSounds&&soundingKey)soundingKey.classList.add('sounding-resting');
      try{if(piano.hasPointerCapture(e.pointerId))piano.releasePointerCapture(e.pointerId)}catch{}
      activeId=null;activeKey=null;activeNote=null;activeNoteAction=null;activeNoteSounds=false;noteGestureLocked=false;
    }

    function syncScrollThumb(){
      const maxScroll=Math.max(0,keyboardViewport.scrollWidth-keyboardViewport.clientWidth),travel=Math.max(0,keyboardScrollTrack.clientWidth-keyboardScrollThumb.offsetWidth),ratio=maxScroll?keyboardViewport.scrollLeft/maxScroll:0;
      keyboardScrollThumb.style.transform=`translate3d(${ratio*travel}px,0,0)`;
      keyboardScrollRail.setAttribute('aria-valuenow',String(Math.round(ratio*100)));
    }
    function setScrollFromPointer(clientX){
      const trackRect=keyboardScrollTrack.getBoundingClientRect(),travel=Math.max(0,trackRect.width-keyboardScrollThumb.offsetWidth),left=clamp(clientX-trackRect.left-scrollGrabOffset,0,travel),maxScroll=Math.max(0,keyboardViewport.scrollWidth-keyboardViewport.clientWidth);
      keyboardViewport.scrollLeft=travel?left/travel*maxScroll:0;
      syncScrollThumb();
    }
    function startScroll(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();scrollPointerId=e.pointerId;
      const thumbRect=keyboardScrollThumb.getBoundingClientRect();
      scrollGrabOffset=keyboardScrollThumb.contains(e.target)?e.clientX-thumbRect.left:thumbRect.width/2;
      keyboardScrollRail.setPointerCapture(e.pointerId);setScrollFromPointer(e.clientX);
    }
    function moveScroll(e){
      if(e.pointerId!==scrollPointerId)return;
      e.preventDefault();setScrollFromPointer(e.clientX);
    }
    function endScroll(e){
      if(e.pointerId!==scrollPointerId)return;
      if(keyboardScrollRail.hasPointerCapture(e.pointerId))keyboardScrollRail.releasePointerCapture(e.pointerId);
      scrollPointerId=null;
    }
    function keyboardScrollKey(e){
      const maxScroll=Math.max(0,keyboardViewport.scrollWidth-keyboardViewport.clientWidth),step=keyboardViewport.clientWidth/2;
      if(e.key==='Home')keyboardViewport.scrollLeft=0;
      else if(e.key==='End')keyboardViewport.scrollLeft=maxScroll;
      else if(e.key==='ArrowLeft'||e.key==='PageUp')keyboardViewport.scrollLeft=clamp(keyboardViewport.scrollLeft-step,0,maxScroll);
      else if(e.key==='ArrowRight'||e.key==='PageDown')keyboardViewport.scrollLeft=clamp(keyboardViewport.scrollLeft+step,0,maxScroll);
      else return;
      e.preventDefault();syncScrollThumb();
    }
    function resizeLayout(){
      syncScrollThumb();positionModifierRail();updateScorePagePreview();requestAnimationFrame(()=>{refreshEditOverlays();positionEditToolbar()});
    }
    function keepOuterViewportFixed(){
      if(window.scrollX||window.scrollY)window.scrollTo(0,0);
    }
    function preventOuterTouchScroll(e){
      if(e.target.closest('.score,.project-modal'))return;
      if(e.cancelable)e.preventDefault();
      keepOuterViewportFixed();
    }
    function startScoreGesture(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      if(!scorePointers.size){scoreGesture=0;scoreUndoneAction=null;scoreStartX=e.clientX;scoreStartY=e.clientY;scoreMoved=false}
      scorePointers.add(e.pointerId);
      try{score.setPointerCapture(e.pointerId)}catch{}
      if(scorePointers.size>=3&&scoreGesture!==3){
        if(scoreGesture===2&&scoreUndoneAction)redoChange(scoreUndoneAction);
        scoreGesture=3;scoreUndoneAction=null;clearScore();
      }else if(scorePointers.size===2&&scoreGesture===0){
        scoreGesture=2;scoreUndoneAction=undoLastChange();
      }
    }
    function moveScoreGesture(e){
      if(!scorePointers.has(e.pointerId)||scoreGesture!==0||scorePointers.size!==1||scoreMoved)return;
      if(Math.hypot(e.clientX-scoreStartX,e.clientY-scoreStartY)>=SCORE_SCROLL_SLOP)scoreMoved=true;
    }
    function endScoreGesture(e,cancelled=false){
      if(!scorePointers.has(e.pointerId))return;
      const singleTap=scorePointers.size===1&&scoreGesture===0&&!scoreMoved&&!cancelled;
      try{if(score.hasPointerCapture(e.pointerId))score.releasePointerCapture(e.pointerId)}catch{}
      scorePointers.delete(e.pointerId);
      if(singleTap&&workMode==='write')togglePiano(e);
      if(!scorePointers.size){scoreGesture=0;scoreUndoneAction=null;scoreMoved=false}
    }
    function scoreKey(e){
      if(workMode!=='write'||(e.key!=='Enter'&&e.key!==' '))return;
      e.preventDefault();togglePiano({pointerType:'keyboard',preventDefault(){}});
    }
    function activateWorkMode(e){
      const button=e.target.closest('.mode-tab');
      if(!button||button.disabled)return;
      if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
      if(e.type==='pointerup'&&e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();setWorkMode(button.dataset.workMode,e);
    }

    function startNoteSelection(e){
      if(workMode!=='edit'||(e.pointerType==='mouse'&&e.button!==0))return;
      if(e.target.closest?.('.system-break-marker')){e.stopPropagation();return}
      e.preventDefault();e.stopPropagation();const start=selectionPoint(e);selectionDrag={pointerId:e.pointerId,start,current:start,moved:false};selectedNoteIndices.clear();osmdContainer.setPointerCapture?.(e.pointerId);renderNoteSelectionOverlay();
    }
    function moveNoteSelection(e){
      if(!selectionDrag||selectionDrag.pointerId!==e.pointerId)return;e.preventDefault();e.stopPropagation();selectionDrag.current=selectionPoint(e);selectionDrag.moved=selectionDrag.moved||Math.hypot(selectionDrag.current.x-selectionDrag.start.x,selectionDrag.current.y-selectionDrag.start.y)>4;if(selectionDrag.moved)selectNotesInRectangle(normalizedSelectionRectangle(selectionDrag.start,selectionDrag.current));renderNoteSelectionOverlay();
    }
    function finishNoteSelection(e,cancelled=false){
      if(!selectionDrag||selectionDrag.pointerId!==e.pointerId)return;e.preventDefault();e.stopPropagation();if(cancelled)selectedNoteIndices.clear();else{selectionDrag.current=selectionPoint(e);if(selectionDrag.moved)selectNotesInRectangle(normalizedSelectionRectangle(selectionDrag.start,selectionDrag.current));else selectNoteAtPoint(selectionDrag.current)}selectionDrag=null;try{osmdContainer.releasePointerCapture?.(e.pointerId)}catch{}renderNoteSelectionOverlay();
    }
    function activateSystemBreakMarker(e){
      const marker=e.target.closest?.('.system-break-marker');if(!marker)return;e.preventDefault();e.stopPropagation();toggleSystemBreakMarker(Number(marker.dataset.breakMeasure));
    }

    restoreInstrument();restoreModifierPosition();restoreEditToolbarPosition();restoreScoreTextPositions();syncInstrumentChoices();applyScoreTextPositions();
    buildKeyboard();
    applyInstrumentProfile();
    syncWorkModeUI();
    requestAnimationFrame(()=>{positionModifierRail();updateScorePagePreview();positionEditToolbar()});
    modeTabs.addEventListener('pointerup',activateWorkMode);
    modeTabs.addEventListener('keydown',activateWorkMode);
    instrumentTrigger.addEventListener('click',()=>setInstrumentMenuOpen(instrumentMenu.hidden));
    document.addEventListener('pointerdown',e=>{if(!instrumentMenu.hidden&&!instrumentPicker.contains(e.target))setInstrumentMenuOpen(false)},{capture:true});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')setInstrumentMenuOpen(false)});
    instrumentMenu.addEventListener('pointerup',chooseInstrument);
    projectForm.addEventListener('submit',saveProject);
    scoreTitle.addEventListener('pointerdown',editProjectFromTitle);
    scoreTitle.addEventListener('keydown',editProjectFromTitle);
    modifierRail.addEventListener('pointerdown',startModifier);
    modifierDragHandle.addEventListener('pointerdown',startModifierDrag);
    modifierDragHandle.addEventListener('pointermove',moveModifierDrag);
    modifierDragHandle.addEventListener('pointerup',endModifierDrag);
    modifierDragHandle.addEventListener('pointercancel',endModifierDrag);
    piano.addEventListener('pointerdown',startNote);
    piano.addEventListener('pointermove',moveNote);
    window.addEventListener('pointerup',stopNote);
    window.addEventListener('pointercancel',stopNote);
    window.addEventListener('pointerup',endModifier);
    window.addEventListener('pointercancel',endModifier);
    keyboardScrollRail.addEventListener('pointerdown',startScroll);
    keyboardScrollRail.addEventListener('pointermove',moveScroll);
    keyboardScrollRail.addEventListener('pointerup',endScroll);
    keyboardScrollRail.addEventListener('pointercancel',endScroll);
    keyboardScrollRail.addEventListener('keydown',keyboardScrollKey);
    keyboardViewport.addEventListener('scroll',syncScrollThumb,{passive:true});
    document.addEventListener('touchmove',preventOuterTouchScroll,{passive:false,capture:true});
    window.addEventListener('scroll',keepOuterViewportFixed,{passive:true});
    window.addEventListener('resize',resizeLayout);
    window.addEventListener('osmd-ready',renderScore);
    score.addEventListener('pointerdown',startScoreGesture);
    score.addEventListener('pointermove',moveScoreGesture,{passive:true});
    score.addEventListener('pointerup',e=>endScoreGesture(e));
    score.addEventListener('pointercancel',e=>endScoreGesture(e,true));
    score.addEventListener('keydown',scoreKey);
    osmdContainer.addEventListener('pointerdown',startNoteSelection);
    osmdContainer.addEventListener('pointermove',moveNoteSelection,{passive:false});
    osmdContainer.addEventListener('pointerup',e=>finishNoteSelection(e));
    osmdContainer.addEventListener('pointercancel',e=>finishNoteSelection(e,true));
    osmdContainer.addEventListener('click',activateSystemBreakMarker);
    selectionSlurButton.addEventListener('click',toggleSlurForSelection);
    selectionSlurFlipButton.addEventListener('click',toggleSlurPlacement);
    selectionTieFlipButton.addEventListener('click',toggleTiePlacement);
    selectionStaccatoButton.addEventListener('click',()=>toggleBooleanForSelection('staccato','Staccato'));
    selectionPortatoButton.addEventListener('click',()=>toggleBooleanForSelection('portato','Portato'));
    selectionAccentButton.addEventListener('click',()=>toggleBooleanForSelection('accent','Aksentti'));
    selectionDynamicSelect.addEventListener('change',e=>applyDynamicForSelection(e.target.value));
    selectionCrescendoButton.addEventListener('click',()=>toggleHairpin('crescendo'));
    selectionDiminuendoButton.addEventListener('click',()=>toggleHairpin('diminuendo'));
    systemBreakModeButton.addEventListener('click',toggleSystemBreakMode);
    stretchLastLineButton.addEventListener('click',toggleStretchLastLine);
    measureNumbersButton.addEventListener('click',toggleMeasureNumbers);
    selectionDragHandle.addEventListener('pointerdown',startEditToolbarDrag);
    selectionDragHandle.addEventListener('pointermove',moveEditToolbarDrag);
    selectionDragHandle.addEventListener('pointerup',endEditToolbarDrag);
    selectionDragHandle.addEventListener('pointercancel',endEditToolbarDrag);
    for(const element of [scoreTitle,scoreTempo,scoreComposer]){
      element.addEventListener('pointerdown',startScoreTextDrag);
      element.addEventListener('pointermove',moveScoreTextDrag);
      element.addEventListener('pointerup',endScoreTextDrag);
      element.addEventListener('pointercancel',endScoreTextDrag);
    }
  </script>
</body>
</html>
