<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef1f5">
  <title>Pikakirjoitin</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:system-ui,-apple-system,sans-serif;color:#18202a;background:#eef1f5}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:16px;background:#eef1f5;-webkit-user-select:none;user-select:none}
    button,input,select{font:inherit;-webkit-tap-highlight-color:transparent}
    .setup{width:min(720px,100%);max-height:calc(100svh - 32px);overflow:auto;padding:clamp(20px,4vw,30px);border:1px solid #ced7e2;border-radius:18px;background:#fff;box-shadow:0 20px 55px #1c27352b}
    .setup[hidden],main[hidden]{display:none}
    .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .wide{grid-column:1/-1}
    input,select{width:100%;min-height:46px;padding:9px 11px;border:1px solid #9ba6b4;border-radius:9px;background:#fff;color:#18202a;font-size:16px}
    .instrument-heading{margin:20px 0 10px;color:#4e5c6c;font-size:11px;font-weight:850;letter-spacing:.07em;text-align:center}
    .instrument-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .instrument-button{min-height:46px;padding:7px 10px;border:1px solid #9ba6b4;border-radius:9px;background:#f6f8fb;color:#263342;font-size:13px;font-weight:750;touch-action:manipulation;cursor:pointer}
    .instrument-button:active,.instrument-button[aria-pressed="true"]{border-color:#2365aa;background:#dcecff;color:#174d83}
    main{width:min(760px,100%);text-align:center}
    h1{margin:0 0 8px;font-size:clamp(24px,5vw,40px)}
    p{margin:0 0 16px;color:#586474}
    .score{width:100%;height:138px;margin:0 0 20px;border:2px solid #9ba6b4;border-radius:12px;background:repeating-linear-gradient(#fff 0 25px,#c8ced6 26px,#fff 27px);color:#18202a;font:700 23px system-ui;box-shadow:0 10px 28px #1c273520;touch-action:manipulation;cursor:pointer}
    .score small{display:block;margin-top:34px;color:#586474;font:600 14px system-ui}
    .piano{position:relative;display:flex;height:clamp(190px,42vw,320px);border:5px solid #20242a;border-radius:12px;overflow:hidden;background:#20242a;box-shadow:0 16px 40px #1c27352e;touch-action:none;-webkit-touch-callout:none}
    .piano[hidden]{display:none}
    .key{border:0;touch-action:none;cursor:pointer}
    .white{flex:1;background:linear-gradient(#fff 82%,#e7e7e7);border-right:1px solid #aeb4bc;color:#303844;font:600 15px system-ui;padding:0 0 14px;display:flex;align-items:end;justify-content:center}
    .white:last-of-type{border:0}
    .black{position:absolute;z-index:2;top:0;width:8%;height:62%;margin-left:-4%;background:linear-gradient(90deg,#101216,#30343a 45%,#090a0c);border-radius:0 0 7px 7px;box-shadow:0 5px 7px #0008}
    .key.active{background:#62a7ff}
    .black.active{background:#2869b8}
    .b1{left:14.2857%}.b2{left:28.5714%}.b3{left:57.1429%}.b4{left:71.4286%}.b5{left:85.7143%}
    #status{position:fixed;left:50%;bottom:10px;min-height:24px;transform:translateX(-50%);font-weight:650;color:#2365aa;white-space:nowrap}
    @media(max-width:520px){.setup-grid,.instrument-grid{grid-template-columns:1fr}.wide{grid-column:auto}.setup{padding:18px}.instrument-button{min-height:42px}}
  </style>
</head>
<body>
  <section class="setup" id="setup" aria-label="Kappaleen tiedot">
    <div class="setup-grid">
      <input class="wide" id="titleInput" type="text" placeholder="Nimi" aria-label="Nimi" autocomplete="off">
      <input id="composerInput" type="text" placeholder="Säveltäjä" aria-label="Säveltäjä" autocomplete="off">
      <input id="tempoInput" type="text" placeholder="Tempoteksti" aria-label="Tempoteksti" autocomplete="off">
      <select id="keySignatureSelect" aria-label="Sävellaji">
        <option>C-duuri / a-molli</option>
        <option>G-duuri / e-molli</option><option>D-duuri / h-molli</option><option>A-duuri / fis-molli</option><option>E-duuri / cis-molli</option><option>H-duuri / gis-molli</option><option>Fis-duuri / dis-molli</option>
        <option>F-duuri / d-molli</option><option>B♭-duuri / g-molli</option><option>E♭-duuri / c-molli</option><option>A♭-duuri / f-molli</option><option>D♭-duuri / b♭-molli</option><option>G♭-duuri / e♭-molli</option>
      </select>
      <select id="timeSignatureSelect" aria-label="Tahtilaji">
        <option>2/4</option><option>3/4</option><option selected>4/4</option><option>2/2</option><option>3/8</option><option>6/8</option><option>9/8</option><option>12/8</option>
      </select>
    </div>
    <p class="instrument-heading">VALITSE SOITIN JA ALOITA</p>
    <div class="instrument-grid" id="instrumentGrid">
      <button class="instrument-button" type="button" data-instrument="Huilu / oboe (C)" aria-pressed="false">Huilu / oboe (C)</button>
      <button class="instrument-button" type="button" data-instrument="Klarinetti (B♭)" aria-pressed="false">Klarinetti (B♭)</button>
      <button class="instrument-button" type="button" data-instrument="Alttosaksofoni (E♭)" aria-pressed="false">Alttosaksofoni (E♭)</button>
      <button class="instrument-button" type="button" data-instrument="Trumpetti (B♭)" aria-pressed="false">Trumpetti (B♭)</button>
      <button class="instrument-button" type="button" data-instrument="Käyrätorvi (F)" aria-pressed="false">Käyrätorvi (F)</button>
      <button class="instrument-button" type="button" data-instrument="Pasuuna (C)" aria-pressed="false">Pasuuna (C)</button>
      <button class="instrument-button" type="button" data-instrument="Viulu (C)" aria-pressed="false">Viulu (C)</button>
      <button class="instrument-button" type="button" data-instrument="Alttoviulu (C)" aria-pressed="false">Alttoviulu (C)</button>
      <button class="instrument-button" type="button" data-instrument="Sello (C)" aria-pressed="false">Sello (C)</button>
      <button class="instrument-button" type="button" data-instrument="Kontrabasso (C · 8vb)" aria-pressed="false">Kontrabasso (C · 8vb)</button>
    </div>
  </section>

  <main id="workspace" hidden>
    <h1 id="pieceTitle">Nimetön kappale</h1>
    <p id="pieceInfo"></p>
    <button class="score" id="score" type="button" aria-expanded="false">♩ ♪ ♫<small>NUOTTI-IKKUNA · NAPAUTA</small></button>
    <div class="piano" id="piano" aria-label="Yhden oktaavin pianokoskettimisto" hidden>
      <button class="key white" data-midi="60" aria-label="C">C</button>
      <button class="key white" data-midi="62" aria-label="D">D</button>
      <button class="key white" data-midi="64" aria-label="E">E</button>
      <button class="key white" data-midi="65" aria-label="F">F</button>
      <button class="key white" data-midi="67" aria-label="G">G</button>
      <button class="key white" data-midi="69" aria-label="A">A</button>
      <button class="key white" data-midi="71" aria-label="H">H</button>
      <button class="key black b1" data-midi="61" aria-label="Cis"></button>
      <button class="key black b2" data-midi="63" aria-label="Dis"></button>
      <button class="key black b3" data-midi="66" aria-label="Fis"></button>
      <button class="key black b4" data-midi="68" aria-label="Gis"></button>
      <button class="key black b5" data-midi="70" aria-label="Ais"></button>
    </div>
  </main>
  <div id="status" role="status" aria-live="polite">Audio: ei avattu</div>
  <script>
    const setup=document.querySelector('#setup'),workspace=document.querySelector('#workspace'),instrumentGrid=document.querySelector('#instrumentGrid'),titleInput=document.querySelector('#titleInput'),composerInput=document.querySelector('#composerInput'),tempoInput=document.querySelector('#tempoInput'),keySignatureSelect=document.querySelector('#keySignatureSelect'),timeSignatureSelect=document.querySelector('#timeSignatureSelect'),pieceTitle=document.querySelector('#pieceTitle'),pieceInfo=document.querySelector('#pieceInfo'),piano=document.querySelector('#piano'),score=document.querySelector('#score'),status=document.querySelector('#status'),AC=window.AudioContext||window.webkitAudioContext;
    let audio,osc,gain,started=false,activeId=null,activeKey=null,selectedInstrument='';
    function showWorkspace(){
      pieceTitle.textContent=titleInput.value.trim()||'Nimetön kappale';
      pieceInfo.textContent=[tempoInput.value.trim(),composerInput.value.trim(),keySignatureSelect.value,timeSignatureSelect.value,selectedInstrument].filter(Boolean).join(' · ');
      setup.hidden=true;workspace.hidden=false;
    }
    function build(){
      try{audio=new AC({latencyHint:'interactive'})}catch{audio=new AC()}
      osc=audio.createOscillator();gain=audio.createGain();osc.type='triangle';gain.gain.value=.0001;osc.connect(gain).connect(audio.destination);started=false;
      audio.onstatechange=()=>status.textContent='Audio: '+audio.state;
      status.textContent='Audio: '+audio.state;
    }
    function togglePiano(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();
      if(!piano.hidden){piano.hidden=true;score.setAttribute('aria-expanded','false');return}
      if(!audio||audio.state==='closed')build();
      if(!started){osc.start();started=true}
      const done=()=>{
        if(audio.state!=='running')return;
        piano.hidden=false;score.setAttribute('aria-expanded','true');status.textContent='Audio: running';showWorkspace();
      };
      if(audio.state==='running')done();else audio.resume().then(done).catch(()=>status.textContent='Audio: avaaminen epäonnistui');
    }
    function start(e){
      const key=e.target.closest('.key');
      if(!key||(e.pointerType==='mouse'&&e.button!==0))return;
      e.preventDefault();
      if(!audio||audio.state!=='running'){status.textContent='Audio: suspended';return}
      piano.setPointerCapture(e.pointerId);
      if(activeKey)activeKey.classList.remove('active');
      activeId=e.pointerId;activeKey=key;key.classList.add('active');
      const t=audio.currentTime;osc.frequency.setValueAtTime(440*Math.pow(2,(+key.dataset.midi-69)/12),t);gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.16,t+.012);
      status.textContent='Audio: '+audio.state;
    }
    function stop(e){
      if(e.pointerId!==activeId)return;
      const t=audio.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(.16,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.06);
      activeKey.classList.remove('active');activeId=null;activeKey=null;
    }
    function chooseInstrument(e){
      const button=e.target.closest('.instrument-button');
      if(!button||(e.pointerType==='mouse'&&e.button!==0))return;
      selectedInstrument=button.dataset.instrument;
      instrumentGrid.querySelectorAll('.instrument-button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      togglePiano(e);
    }
    instrumentGrid.addEventListener('pointerup',chooseInstrument);
    piano.addEventListener('pointerdown',start);
    piano.addEventListener('pointerup',stop);
    piano.addEventListener('pointercancel',stop);
    piano.addEventListener('lostpointercapture',stop);
    score.addEventListener('pointerup',togglePiano);
  </script>
</body>
</html>
