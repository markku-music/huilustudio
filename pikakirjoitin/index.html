<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pikakirjoitin 3 · BASE 0.17.6.4</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="project-modal" id="projectModal" role="dialog" aria-modal="true" aria-label="Kappaleen tiedot">
    <form class="project-card" id="projectForm">
      <div class="language-switch project-language-switch" role="group" aria-label="Kieli">
        <button type="button" data-language="fi" aria-pressed="true">FI</button>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
      <div class="project-grid">
        <label class="field wide" for="titleInput">
          <input id="titleInput" type="text" autocomplete="off" placeholder="Nimi" aria-label="Nimi">
        </label>
        <label class="field" for="tempoInput">
          <select id="tempoInput" aria-label="Tempoteksti">
            <option value="" selected>Tempo</option>

            <optgroup label="Hyvin hitaat">
              <option>Grave</option>
              <option>Larghissimo</option>
              <option>Schwer</option>
              <option>Sehr breit</option>
              <option>slow and solemn</option>
              <option>very, very slow</option>
            
            </optgroup>

            <optgroup label="Hitaat">
              <option>Adagietto</option>
              <option>Adagio</option>
              <option>Breit</option>
              <option>broadly</option>
              <option>Etwas breit</option>
              <option>Langsam</option>
              <option>Larghetto</option>
              <option>Largo</option>
              <option>Lent</option>
              <option>Lento</option>
              <option>rather broadly</option>
              <option>rather slow</option>
              <option>Ruhig</option>
              <option>slow and stately</option>
              <option>slowly</option>
              <option>Ziemlich langsam</option>
              <option>Ziemlich ruhig</option>
            
            </optgroup>

            <optgroup label="Kävelyvauhti ja keskitempo">
              <option>Andante</option>
              <option>Andante moderato</option>
              <option>Andantino</option>
              <option>at a walking pace</option>
              <option>Gehend</option>
              <option>Maestoso</option>
              <option>moderately</option>
              <option>Moderato</option>
              <option>Modéré</option>
              <option>Mäßig</option>
              <option>Schreitend</option>
            
            </optgroup>

            <optgroup label="Nopeat">
              <option>Allegretto</option>
              <option>Allegro</option>
              <option>Allegro Assai</option>
              <option>Allegro moderato</option>
              <option>Animato</option>
              <option>fast</option>
              <option>Fröhlich</option>
              <option>Lebendig</option>
              <option>Lebhaft</option>
              <option>lively and fast</option>
              <option>Rapide</option>
              <option>Rasch</option>
              <option>Schnell</option>
              <option>Sehr lebendig</option>
              <option>Sehr lebhaft</option>
              <option>Vite</option>
              <option>Vivace</option>
              <option>Vivacissimo</option>
            
            </optgroup>

            <optgroup label="Hyvin nopeat">
              <option>Allegrissimo</option>
              <option>Geschwind</option>
              <option>Prestissimo</option>
              <option>Presto</option>
              <option>Sehr schnell</option>
              <option>very fast</option>
              <option>äußerst schnell</option>
            
            </optgroup>
          </select>
        </label>
        <label class="field" for="composerInput">
          <input id="composerInput" type="text" autocomplete="off" placeholder="Säveltäjä" aria-label="Säveltäjä">
        </label>
        <label class="field" for="instrumentInput">
          <input id="instrumentInput" type="text" autocomplete="off" placeholder="Soitin" aria-label="Soitin">
        </label>

        <div class="key-picker">
          <button class="key-trigger" id="keyTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="keyWheelPopover">
            <span class="key-trigger-value" id="keyTriggerValue">C-duuri</span>
            <span class="key-trigger-icon" aria-hidden="true"></span>
          </button>
          <select id="keySignatureSelect" aria-label="Sävellaji" hidden>
            <option value="0" data-mode="major" data-tonic="C">C-duuri</option>
            <option value="0" data-mode="minor" data-tonic="A">a-molli</option>
            <option value="1" data-mode="major" data-tonic="G">G-duuri</option>
            <option value="1" data-mode="minor" data-tonic="E">e-molli</option>
            <option value="2" data-mode="major" data-tonic="D">D-duuri</option>
            <option value="2" data-mode="minor" data-tonic="B">h-molli</option>
            <option value="3" data-mode="major" data-tonic="A">A-duuri</option>
            <option value="3" data-mode="minor" data-tonic="F#">fis-molli</option>
            <option value="4" data-mode="major" data-tonic="E">E-duuri</option>
            <option value="4" data-mode="minor" data-tonic="C#">cis-molli</option>
            <option value="5" data-mode="major" data-tonic="B">H-duuri</option>
            <option value="5" data-mode="minor" data-tonic="G#">gis-molli</option>
            <option value="-1" data-mode="major" data-tonic="F">F-duuri</option>
            <option value="-1" data-mode="minor" data-tonic="D">d-molli</option>
            <option value="-2" data-mode="major" data-tonic="Bb">B-duuri</option>
            <option value="-2" data-mode="minor" data-tonic="G">g-molli</option>
            <option value="-3" data-mode="major" data-tonic="Eb">Es-duuri</option>
            <option value="-3" data-mode="minor" data-tonic="C">c-molli</option>
            <option value="-4" data-mode="major" data-tonic="Ab">As-duuri</option>
            <option value="-4" data-mode="minor" data-tonic="F">f-molli</option>
            <option value="-5" data-mode="major" data-tonic="Db">Des-duuri</option>
            <option value="-5" data-mode="minor" data-tonic="Bb">b-molli</option>
            <option value="-6" data-mode="major" data-tonic="Gb">Ges-duuri</option>
            <option value="-6" data-mode="minor" data-tonic="Eb">es-molli</option>
          </select>
        </div>

        <div class="meter-picker">
          <button class="meter-trigger" id="meterTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="meterWheelPopover">
            <span class="meter-trigger-value" id="meterTriggerValue">4/4</span>
            <span class="meter-trigger-icon" aria-hidden="true"></span>
          </button>
          <select id="timeSignatureSelect" aria-label="Tahtilaji" hidden>
            <option value="2/4">2/4</option>
            <option value="3/4">3/4</option>
            <option value="4/4" selected>4/4</option>
            <option value="C">C</option>
            <option value="2/2">2/2</option>
            <option value="cutC">Cut C</option>
            <option value="3/8">3/8</option>
            <option value="6/8">6/8</option>
            <option value="9/8">9/8</option>
            <option value="12/8">12/8</option>
          </select>
        </div>

        <div class="pickup-control" role="group" aria-label="Kohotahti">
          <span class="pickup-label">Kohotahti</span>
          <input id="pickupSelect" type="hidden" value="0">
          <div class="pickup-choices" id="pickupChoices"></div>
        </div>

        <div class="notation-settings">
          <div class="notation-setting tuning-setting" role="group" aria-label="Viritys">
            <span class="notation-setting-label">Viritys</span>
            <input id="tuningSelect" type="hidden" value="C">
            <div class="notation-choice-group" id="tuningChoices">
              <button class="notation-choice" type="button" data-tuning="C" aria-pressed="true">C</button>
              <button class="notation-choice" type="button" data-tuning="Bb" aria-pressed="false">B♭</button>
              <button class="notation-choice" type="button" data-tuning="Eb" aria-pressed="false">E♭</button>
              <button class="notation-choice" type="button" data-tuning="F" aria-pressed="false">F</button>
            </div>
          </div>
          <div class="notation-setting" role="group" aria-label="Nuottiavain">
            <input id="clefSelect" type="hidden" value="treble">
            <div class="notation-choice-group" id="clefChoices">
              <button class="notation-choice icon-choice" type="button" data-clef="treble" aria-label="G-avain" aria-pressed="true"><img src="assets/clef-alto.svg" alt=""></button>
              <button class="notation-choice icon-choice" type="button" data-clef="alto" aria-label="C-avain" aria-pressed="false"><img src="assets/clef-treble.svg" alt=""></button>
              <button class="notation-choice icon-choice" type="button" data-clef="bass" aria-label="F-avain" aria-pressed="false"><img src="assets/clef-bass.svg" alt=""></button>
            </div>
          </div>
        </div>

        <label class="field wide" for="themeSelect">
          <span class="field-caption">Värimaailma</span>
          <select id="themeSelect" aria-label="Värimaailma">
            <option value="kupari">Kupari</option>
            <option value="salvia">Salvia</option>
            <option value="luumu">Luumu</option>
            <option value="sahko">Sähkö</option>
            <option value="koralli">Koralli</option>
            <option value="vanilja">Vanilja</option>
          </select>
        </label>
      </div>
      <button class="start-button" id="projectSaveButton" type="submit">ALOITA</button>

      <div class="recent-projects" id="recentProjects">
        <button class="recent-projects-trigger" id="recentProjectsTrigger" type="button" aria-expanded="false" aria-controls="recentProjectsPanel">
          <span id="recentProjectsTriggerText">Avaa projekti</span>
          <span class="recent-projects-caret" aria-hidden="true">▾</span>
        </button>
        <div class="recent-projects-panel" id="recentProjectsPanel" hidden>
          <div class="recent-projects-heading" id="recentProjectsHeading">Viimeisimmät</div>
          <div class="recent-projects-list" id="recentProjectsList"></div>
          <button class="recent-open-file" id="openProjectFileButton" type="button">Avaa tiedostosta…</button>
          <input id="projectFileInput" type="file" accept=".json,.pikakirjoitin.json,application/json" hidden>
        </div>
      </div>

      <div class="start-status" id="startStatus" role="status" aria-live="polite"></div>
    </form>
  </div>

  <div class="key-wheel-popover" id="keyWheelPopover" role="dialog" aria-modal="true" aria-label="Valitse sävellaji kvinttiympyrästä" hidden>
    <div class="key-wheel-card" id="keyWheelCard">
      <button class="key-wheel-close" id="keyWheelClose" type="button" aria-label="Sulje sävellajivalinta">×</button>
      <div id="keyWheelSlots"></div>
    </div>
  </div>

  <div class="meter-wheel-popover" id="meterWheelPopover" role="dialog" aria-modal="true" aria-label="Valitse tahtiosoitus" hidden>
    <div class="meter-wheel-card" id="meterWheelCard">
      <button class="meter-wheel-close" id="meterWheelClose" type="button" aria-label="Sulje tahtiosoitusvalinta">×</button>
      <div id="meterWheelSlots"></div>
    </div>
  </div>

  <main class="app-shell" id="app" aria-hidden="true" inert>
    <header class="test-header">
      <button class="header-start-over" id="startOverButton" type="button"
              aria-label="Aloita alusta ja päivitä Pikakirjoitin" title="Aloita alusta / refresh">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 11V5l-3 3.1A11 11 0 1 0 27 18"/><path d="M26 5h-6"/></svg>
      </button>
      <div class="language-switch app-language-switch" role="group" aria-label="Kieli">
        <button type="button" data-language="fi" aria-pressed="true">FI</button>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
      <h1>Pikakirjoitin 3</h1>
      <p>BASE 0.17.6.7 · Swipe-turvavyöhyke · Soitinnimen korkeus 14 · Asettelu · Artikulaatiot · Recent 50 · FI / EN · OSMD 2.1.2</p>
    </header>

    <section class="layout-settings-panel" id="layoutSettingsPanel" role="dialog"
             aria-modal="false" aria-label="Asettelu" hidden>
      <div class="layout-settings-head">
        <strong id="layoutSettingsTitle">ASETTELU</strong>
        <button class="layout-settings-close" id="layoutSettingsClose" type="button" aria-label="Sulje">×</button>
      </div>
      <label class="layout-setting-row" for="notationSizeSlider">
        <span id="notationSizeLabel">Nuottikoko</span>
        <input id="notationSizeSlider" data-layout-setting="notationScale" type="range" min="75" max="120" step="5" value="100">
        <output id="notationSizeValue" for="notationSizeSlider">100 %</output>
      </label>
      <label class="layout-setting-row" for="systemSpacingSlider">
        <span id="systemSpacingLabel">Riviväli</span>
        <input id="systemSpacingSlider" data-layout-setting="systemSpacing" type="range" min="50" max="300" step="10" value="100">
        <output id="systemSpacingValue" for="systemSpacingSlider">100 %</output>
      </label>
      <label class="layout-setting-row" for="instrumentCreditDistanceSlider">
        <span id="instrumentCreditDistanceLabel">Soitinnimen korkeus</span>
        <input id="instrumentCreditDistanceSlider" data-layout-setting="instrumentCreditDistance" type="range" min="2" max="14" step="0.5" value="14">
        <output id="instrumentCreditDistanceValue" for="instrumentCreditDistanceSlider">14</output>
      </label>
      <label class="layout-setting-row" for="topMarginSlider">
        <span id="topMarginLabel">Ylämarginaali</span>
        <input id="topMarginSlider" data-layout-setting="marginTop" type="range" min="0" max="12" step="0.5" value="5">
        <output id="topMarginValue" for="topMarginSlider">5</output>
      </label>
      <label class="layout-setting-row" for="bottomMarginSlider">
        <span id="bottomMarginLabel">Alamarginaali</span>
        <input id="bottomMarginSlider" data-layout-setting="marginBottom" type="range" min="0" max="12" step="0.5" value="5">
        <output id="bottomMarginValue" for="bottomMarginSlider">5</output>
      </label>
      <label class="layout-setting-row" for="leftMarginSlider">
        <span id="leftMarginLabel">Vasen marginaali</span>
        <input id="leftMarginSlider" data-layout-setting="marginLeft" type="range" min="0" max="12" step="0.5" value="2.5">
        <output id="leftMarginValue" for="leftMarginSlider">2.5</output>
      </label>
      <label class="layout-setting-row" for="rightMarginSlider">
        <span id="rightMarginLabel">Oikea marginaali</span>
        <input id="rightMarginSlider" data-layout-setting="marginRight" type="range" min="0" max="12" step="0.5" value="2.5">
        <output id="rightMarginValue" for="rightMarginSlider">2.5</output>
      </label>
      <button class="layout-reset-button" id="layoutResetButton" type="button">Palauta oletukset</button>
    </section>

    <section class="score-card" aria-label="Nuottikuva">
      <div class="a4-paper" id="a4Paper">
        <div id="osmd-container"></div>
        <div class="system-layout-overlay" id="systemLayoutOverlay"
             aria-hidden="true" hidden></div>
      </div>
      <p id="status" class="status" aria-live="polite">Valitse sävel.</p>
    </section>

    <aside class="thumb-rail" id="thumbRail" role="toolbar" aria-label="Peukalopalkki">
      <button class="thumb-modifier" type="button" data-modifier="rest"
              aria-label="Pidä pohjassa: tauko" aria-pressed="false">
        <img src="assets/rest.svg" alt="" aria-hidden="true" draggable="false">
      </button>

      <div class="thumb-dot-wrap">
        <button class="thumb-modifier thumb-dot-button" id="dot1Button" type="button"
                data-modifier="dot1"
                aria-label="Pidä pohjassa: yksi piste. Liu'uta oikealle kahteen pisteeseen."
                aria-pressed="false">
          <img src="assets/1_4_dot.svg" alt="" aria-hidden="true" draggable="false">
        </button>

        <button class="thumb-modifier thumb-dot-button thumb-dot-flyout" id="dot2Flyout"
                type="button" data-modifier="dot2"
                aria-label="Kaksi pistettä" aria-pressed="false" tabindex="-1"
                aria-hidden="true">
          <img src="assets/1_4_double_dot.svg" alt="" aria-hidden="true" draggable="false">
        </button>
      </div>

      <button class="thumb-modifier" type="button" data-modifier="slur"
              aria-label="Slur: kirjoittaessa kytke edelliseen, nuottia valitessa seuraavaan" aria-pressed="false">
        <img class="thumb-slur-icon" src="assets/slur.svg" alt="" aria-hidden="true" draggable="false">
      </button>

      <button class="thumb-modifier thumb-tie-button" type="button"
              data-modifier="tie"
              aria-label="Tie / sidekaari: seuraava saman sävelen nuotti sidotaan edelliseen"
              aria-pressed="false"
              title="Tie / sidekaari">
        <img class="thumb-tie-icon" src="assets/tie.svg" alt="" aria-hidden="true" draggable="false">
      </button>

      <button class="thumb-modifier thumb-layout-toggle" id="lineEditButton"
              type="button" data-modifier="layout"
              aria-label="Rivien muokkaus" aria-pressed="false"
              title="Rivien muokkaus">
        <span class="thumb-layout-symbol" aria-hidden="true">↵</span>
      </button>
    </aside>

    <section class="keyboard-panel" aria-label="Koskettimisto">
      <div class="keyboard-scroll-rail" id="keyboardScrollRail" role="slider" tabindex="0"
           aria-label="Siirrä koskettimistoa" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="keyboard-scroll-track" id="keyboardScrollTrack">
          <div class="keyboard-scroll-thumb" id="keyboardScrollThumb">SIIRRÄ KOSKETTIMISTOA</div>
        </div>
      </div>

      <div class="keyboard-viewport" id="keyboardViewport">
        <div class="piano" id="piano">
          <div class="white-keys" id="whiteKeys"></div>
        </div>
      </div>

      <aside class="keyboard-tools" aria-label="Pikatoiminnot">
        <button class="keyboard-tool-button" id="undoButton" type="button"
                aria-label="Kumoa" title="Undo" disabled>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 8 6.5 14.5 13 21"/><path d="M7.5 14.5h10.2c5.1 0 8.3 2.8 8.3 7.5"/></svg>
        </button>
        <button class="keyboard-tool-button" id="redoButton" type="button"
                aria-label="Tee uudelleen" title="Redo" disabled>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m19 8 6.5 6.5L19 21"/><path d="M24.5 14.5H14.3C9.2 14.5 6 17.3 6 22"/></svg>
        </button>
        <button class="keyboard-tool-button" id="saveProjectButton" type="button"
                aria-label="Tallenna projekti" title="Tallenna">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5h16l4 4v18H7z"/><path d="M11 5v8h11V5"/><path d="M11 27v-9h12v9"/></svg>
        </button>
        <button class="keyboard-tool-button keyboard-tool-pdf" id="savePdfButton" type="button"
                aria-label="Tallenna PDF" title="PDF">
          <span aria-hidden="true">PDF</span>
        </button>
        <button class="keyboard-tool-button" id="printButton" type="button"
                aria-label="Tulosta" title="Tulosta">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 12V5h14v7"/><path d="M9 23H6v-9h20v9h-3"/><path d="M9 19h14v8H9z"/><path d="M23 16h.01"/></svg>
        </button>
        <button class="keyboard-tool-button" id="layoutSettingsButton" type="button"
                aria-label="Asettelu" title="Asettelu" aria-expanded="false" aria-controls="layoutSettingsPanel">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4"/><path d="M16 4v4M16 24v4M4 16h4M24 16h4M7.5 7.5l2.8 2.8M21.7 21.7l2.8 2.8M24.5 7.5l-2.8 2.8M10.3 21.7l-2.8 2.8"/></svg>
        </button>
      </aside>

      <div class="gesture-guide" aria-label="Aika-arvoeleet">
        <span><strong>←</strong> 1/32</span>
        <span><strong>↓</strong> 1/8</span>
        <span><strong>Napauta</strong> 1/4</span>
        <span><strong>↑</strong> 1/2</span>
        <span><strong>→</strong> 1/16</span>
        <span><strong>Pidä</strong> 1/1</span>
      </div>
    </section>
  </main>

  <script src="vendor/opensheetmusicdisplay.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/score-model.js"></script>
  <script src="js/musicxml.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/recent-projects.js"></script>
  <script src="js/start-screen.js"></script>
  <script src="js/thumb-rail.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/score-selection.js"></script>
  <script src="js/selection-editor.js"></script>
  <script src="js/system-layout-editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
