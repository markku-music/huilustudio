<!doctype html><meta charset="utf-8"><body><div id="a"></div><div id="b"></div><div id="c"></div><pre id="status">WAIT</pre>
<script src="vendor/osmd/opensheetmusicdisplay.min.js"></script>
<script type="module">
import { buildMusicXml } from './js/musicxml.js';
const settings={timeSignature:'4/4',keySignature:0,keyMode:'major',keyTonic:'C',clef:'treble'};
function notes(size,type,count){const normal=(size===5||size===6)?4:2;const base=type==='eighth'?4:2;return Array.from({length:count},(_,i)=>({id:`${size}-${i}`,kind:'note',midi:60+i,duration:type==='eighth'?'eighth':'sixteenth',dotted:false,tupletId:`t-${size}`,tupletIndex:i,tupletSize:size,tupletNormalNotes:normal,tupletBaseUnits:base}));}
try{
 const groups=[[3,'eighth',3,'a'],[5,'sixteenth',5,'b'],[6,'sixteenth',6,'c']];
 for(const [size,type,count,id] of groups){const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(id,{backend:'svg',drawingParameters:'compacttight'});await osmd.load(buildMusicXml(notes(size,type,count),settings));await osmd.render();}
 const svgs=document.querySelectorAll('svg').length;
 const paths=document.querySelectorAll('svg path').length;
 document.querySelector('#status').textContent=`OK svg=${svgs} paths=${paths}`;
 document.body.dataset.done='yes';
}catch(e){document.querySelector('#status').textContent='ERR '+e.stack;document.body.dataset.done='error';}
</script>
