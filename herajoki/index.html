<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e8" />
  <title>Sävelkoju</title>
  <style>
    :root {
      --ink: #263642;
      --teal: #6f9298;
      --teal-dark: #4f7379;
      --gold: #b58b3a;
      --paper: #fbf7ef;
      --paper-2: #f2eadf;
      --shadow: 0 14px 38px rgba(38, 54, 66, .16);
      /* Sama sivumarginaali molemmille puolille myös iPhonen loven kohdalla. */
      --safe-x: max(18px, env(safe-area-inset-left), env(safe-area-inset-right));
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,.98) 0%, rgba(251,247,239,.96) 42%, rgba(239,232,220,.98) 100%),
        linear-gradient(180deg, #fffdf8 0%, #eee5d7 100%);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      isolation: isolate;
    }

    .frame {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,.08) 0 32%, rgba(255,255,255,.22) 64%, rgba(255,255,255,.06) 100%);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1120px;
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 1fr;
      align-items: center;
      /* Tärkeä iPhone-korjaus: vasen ja oikea padding ovat aina yhtä suuret. */
      padding-top: max(18px, env(safe-area-inset-top));
      padding-right: var(--safe-x);
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      padding-left: var(--safe-x);
    }

    .screen {
      min-height: 0;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .instrument-panel,
    .notes-panel {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .instrument-panel[hidden],
    .notes-panel[hidden] { display: none; }

    .instrument-card {
      width: min(760px, 100%);
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid rgba(181,139,58,.34);
      border-radius: 28px;
      background: rgba(255, 252, 246, .80);
      backdrop-filter: blur(9px) saturate(1.08);
      box-shadow: var(--shadow);
    }

    .instrument-card h2 {
      margin: 0 0 22px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 500;
      color: #314651;
    }

    .instrument-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .instrument-button,
    .instrument-name-button {
      appearance: none;
      border: 1px solid rgba(181,139,58,.56);
      color: #2b3c46;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(246,240,231,.96));
      box-shadow: 0 6px 16px rgba(38,54,66,.10), inset 0 1px 0 rgba(255,255,255,.9);
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
      font: inherit;
      font-weight: 650;
    }

    .instrument-button {
      min-height: 64px;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: clamp(15px, 1.5vw, 19px);
    }

    .instrument-button:hover,
    .instrument-button:focus-visible,
    .instrument-name-button:hover,
    .instrument-name-button:focus-visible {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: 0 10px 22px rgba(38,54,66,.14), 0 0 0 3px rgba(111,146,152,.12);
      outline: none;
    }

    .notes-panel {
      height: 100%;
      grid-template-rows: auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .notes-header {
      width: 100%;
      display: grid;
      place-items: center;
    }

    /* Soittimen nimi on samalla soitinvaihdon nappi. */
    .instrument-name-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin: 0;
      padding: 8px 22px;
      border-radius: 999px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2.5vw, 36px);
      font-weight: 600;
      line-height: 1.1;
      color: #314651;
      text-align: center;
      white-space: nowrap;
    }

    .targets {
      width: 100%;
      min-width: 0;
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 1.25vw, 16px);
      padding: 6px 0 12px;
    }

    .target {
      flex: 1 1 0;
      min-width: 0;
      max-width: 205px;
      aspect-ratio: 1;
      object-fit: contain;
      filter: drop-shadow(0 12px 15px rgba(38,54,66,.17));
      transform: translateZ(0);
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 760px) {
      .instrument-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .instrument-card { width: min(560px, 100%); }
    }

    @media (orientation: portrait) {
      body { overflow: auto; }
      .app { min-height: 100dvh; height: auto; }
      .frame { display: none; }
      .content { min-height: 100dvh; height: auto; }
      .notes-panel { min-height: calc(100dvh - 36px); }
      .targets {
        width: 100%;
        max-width: 720px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .target {
        flex: 0 1 calc((100% - 16px) / 3);
        max-width: 210px;
      }
    }

    /* iPhone 15 / matala vaakaruutu */
    @media (max-height: 560px) and (orientation: landscape) {
      .content {
        max-width: 1100px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-right: var(--safe-x);
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        padding-left: var(--safe-x);
      }
      .instrument-card { padding: 16px 22px; }
      .instrument-card h2 { margin-bottom: 12px; font-size: 22px; }
      .instrument-button { min-height: 46px; padding: 7px 12px; }
      .notes-panel { gap: 2px; }
      .instrument-name-button {
        min-height: 40px;
        padding: 6px 18px;
        font-size: 22px;
      }
      .targets {
        width: 100%;
        max-width: 1020px;
        padding-bottom: 2px;
        gap: clamp(3px, .9vw, 10px);
      }
      .target {
        max-width: 18.2vw;
        max-height: 47vh;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <img class="frame" src="assets/background/music-school-frame.png" alt="" aria-hidden="true" />
    <div class="veil" aria-hidden="true"></div>

    <div class="content">
      <section class="screen">
        <div class="instrument-panel" id="instrumentPanel">
          <div class="instrument-card">
            <h2>Valitse soitin</h2>
            <div class="instrument-grid" id="instrumentGrid"></div>
          </div>
        </div>

        <div class="notes-panel" id="notesPanel" hidden>
          <div class="notes-header">
            <button class="instrument-name-button" id="instrumentName" type="button" aria-label="Vaihda soitinta"></button>
          </div>
          <div class="targets" id="targets" aria-live="polite"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const instruments = [
      { name: 'Huilu', notes: ['G', 'A', 'H', 'C', 'D'] },
      { name: 'Saksofoni', notes: ['G', 'A', 'H', 'C', 'D'] },
      { name: 'Klarinetti', notes: ['C', 'D', 'E', 'F', 'G'] },
      { name: 'Trumpetti', notes: ['C', 'D', 'E', 'F', 'G'] },
      { name: 'Käyrätorvi', notes: ['C', 'D', 'E', 'F', 'G'] },
      { name: 'Pasuuna', notes: ['B', 'C', 'D', 'Es', 'F'] }
    ];

    const instrumentGrid = document.getElementById('instrumentGrid');
    const instrumentPanel = document.getElementById('instrumentPanel');
    const notesPanel = document.getElementById('notesPanel');
    const instrumentName = document.getElementById('instrumentName');
    const targets = document.getElementById('targets');

    function showInstrument(instrument) {
      instrumentName.textContent = instrument.name;
      instrumentName.setAttribute('aria-label', `Vaihda soitinta. Nykyinen soitin: ${instrument.name}`);

      targets.replaceChildren(...instrument.notes.map(note => {
        const img = document.createElement('img');
        img.className = 'target';
        img.src = `assets/notes/${note}.png`;
        img.alt = `Sävel ${note}`;
        img.draggable = false;
        return img;
      }));

      instrumentPanel.hidden = true;
      notesPanel.hidden = false;
    }

    function showInstrumentMenu() {
      notesPanel.hidden = true;
      instrumentPanel.hidden = false;
    }

    instruments.forEach(instrument => {
      const button = document.createElement('button');
      button.className = 'instrument-button';
      button.type = 'button';
      button.textContent = instrument.name;
      button.addEventListener('click', () => showInstrument(instrument));
      instrumentGrid.appendChild(button);
    });

    instrumentName.addEventListener('click', showInstrumentMenu);
  </script>
</body>
</html>
