<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6f2ac7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Puhallinstartti" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <title>Puhallinstartti</title>
  <style>
    :root {
      --ink: #314651;
      --gold: #b58b3a;
      --paper: #fbf7ef;
      --shadow: 0 14px 38px rgba(38,54,66,.16);
      --safe-x: max(18px, env(safe-area-inset-left), env(safe-area-inset-right));
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 32%, #fff 0%, #fbf7ef 46%, #e8dfd0 100%);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    .theme-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
      transition: opacity .18s ease;
    }

    .app.theme-switching .theme-background,
    .app.theme-switching .targets {
      opacity: .72;
    }

    .app.theme-switching .gear-button {
      pointer-events: none;
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(255,255,255,.06) 0 32%, rgba(255,255,255,.16) 68%, rgba(255,255,255,.04) 100%);
    }

    body.theme-kids .veil { background: rgba(255,255,255,.06); }
    body.theme-concert .veil {
      background:
        radial-gradient(ellipse at 50% 47%, rgba(255,255,255,.02) 0 38%, rgba(0,0,0,.08) 76%, rgba(0,0,0,.18) 100%);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1120px;
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 1fr;
      align-items: center;
      padding-top: max(18px, env(safe-area-inset-top));
      padding-right: var(--safe-x);
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      padding-left: var(--safe-x);
    }

    .screen {
      min-height: 0;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .instrument-panel,
    .notes-panel {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .instrument-panel[hidden],
    .notes-panel[hidden],
    .theme-menu[hidden],
    .menu-backdrop[hidden] { display: none; }

    .instrument-card {
      width: min(760px, 100%);
      padding: clamp(22px, 4vw, 42px);
      border-radius: 28px;
      border: 1px solid rgba(181,139,58,.34);
      background: rgba(255,252,246,.80);
      backdrop-filter: blur(9px) saturate(1.08);
      box-shadow: var(--shadow);
      transition: background .2s ease, border-color .2s ease;
    }

    body.theme-kids .instrument-card {
      background: rgba(255,255,255,.80);
      border-color: rgba(133,116,169,.28);
    }

    body.theme-concert .instrument-card {
      background: rgba(8,25,56,.78);
      border-color: rgba(226,179,69,.52);
      color: #fff5d7;
      box-shadow: 0 18px 42px rgba(0,0,0,.34);
    }

    .instrument-card h2 {
      margin: 0 0 22px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 500;
      color: inherit;
    }

    .instrument-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }

    .instrument-button,
    .instrument-name-button,
    .gear-button,
    .theme-button {
      appearance: none;
      font: inherit;
      cursor: pointer;
    }

    .instrument-button,
    .instrument-name-button {
      border: 1px solid rgba(181,139,58,.56);
      color: #2b3c46;
      background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(246,240,231,.97));
      box-shadow: 0 6px 16px rgba(38,54,66,.10), inset 0 1px 0 rgba(255,255,255,.9);
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
      font-weight: 650;
    }

    body.theme-kids .instrument-button,
    body.theme-kids .instrument-name-button {
      border-color: rgba(129,103,176,.38);
      background: rgba(255,255,255,.92);
      color: #59437a;
    }

    body.theme-concert .instrument-button,
    body.theme-concert .instrument-name-button {
      border-color: rgba(226,179,69,.64);
      color: #fff4cf;
      background: linear-gradient(180deg, rgba(28,62,112,.95), rgba(9,32,72,.96));
      box-shadow: 0 8px 20px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
    }

    .instrument-button {
      min-height: 64px;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: clamp(15px, 1.5vw, 19px);
    }

    .instrument-button:hover,
    .instrument-button:focus-visible,
    .instrument-name-button:hover,
    .instrument-name-button:focus-visible,
    .gear-button:hover,
    .gear-button:focus-visible,
    .theme-button:hover,
    .theme-button:focus-visible {
      transform: translateY(-2px);
      outline: none;
    }

    .notes-panel {
      height: 100%;
      grid-template-rows: auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .notes-header {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .mic-button {
      position: absolute;
      right: max(14px, var(--safe-x));
      top: max(10px, var(--safe-top));
      z-index: 12;
      min-width: 48px;
      min-height: 48px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(58,72,86,.22);
      background: rgba(255,255,255,.86);
      color: #344454;
      font: 700 15px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 8px 22px rgba(30,42,54,.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
    }
    .mic-button[data-running="true"] { box-shadow: 0 0 0 3px rgba(72,145,91,.22), 0 8px 22px rgba(30,42,54,.14); }
    .mic-button:disabled { opacity: .65; cursor: default; }
    body.theme-concert .mic-button { background: rgba(30,30,34,.78); color: #f4ead7; border-color: rgba(255,255,255,.22); }
    body.theme-kids .mic-button { background: rgba(255,255,255,.90); color: #624d7a; }
    .target.sound-hit { transform: scale(1.075) translateZ(0); }

    .instrument-name-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin: 0;
      padding: 8px 22px;
      border-radius: 999px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2.5vw, 36px);
      font-weight: 600;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .targets {
      width: 100%;
      min-width: 0;
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 1.25vw, 16px);
      padding: 6px 0 12px;
    }

    .target {
      flex: 1 1 0;
      min-width: 0;
      max-width: 205px;
      aspect-ratio: 1;
      object-fit: contain;
      filter: drop-shadow(0 12px 15px rgba(38,54,66,.17));
      transform: translateZ(0);
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity .12s ease, transform .14s ease;
    }

    body.theme-concert .target {
      filter: drop-shadow(0 16px 20px rgba(0,0,0,.40));
    }

    body.theme-kids .target {
      filter: drop-shadow(0 12px 14px rgba(82,54,118,.18));
    }

    .target-wrap {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      max-width: 205px;
      aspect-ratio: 1;
    }
    .target-wrap .target {
      width: 100%;
      height: 100%;
      max-width: none;
      flex: none;
    }



    /* Pelillisyys: kevyt tähtäin + 10 osuman kierros */
    .game-progress {
      position: fixed;
      left: 50%;
      bottom: calc(max(14px, var(--safe-bottom)) + 6px);
      transform: translateX(-50%);
      z-index: 18;
      display: flex;
      gap: 9px;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border-radius: 999px;
      pointer-events: none;
      background: rgba(255,255,255,.76);
      box-shadow: 0 5px 18px rgba(0,0,0,.24), inset 0 0 0 1px rgba(255,255,255,.78);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }
    .game-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid currentColor;
      background: rgba(255,255,255,.12);
      opacity: .78;
      box-shadow: 0 1px 3px rgba(0,0,0,.34);
    }
    .game-dot.done {
      background: currentColor;
      opacity: 1;
      box-shadow: 0 0 0 2px rgba(255,255,255,.58), 0 2px 6px rgba(0,0,0,.34);
    }
    body.theme-concert .game-progress { color: #f5d77e; background: rgba(8,28,65,.82); }
    body.theme-kids .game-progress { color: #69488f; background: rgba(255,255,255,.82); }
    body.theme-classic .game-progress { color: #354b59; background: rgba(255,252,246,.82); }
    .targets { position: relative; }
    /* Alkuperäisen Sävelkoju-pelin tähtäin, sama kaikissa teemoissa */
    .aim-reticle {
      position: absolute;
      z-index: 12;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      pointer-events: none;
      opacity: .82;
      transform: translate(-50%,-50%);
      transition: left .2s ease, top .2s ease;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.75));
    }
    .aim-reticle::before,
    .aim-reticle::after {
      content: "";
      position: absolute;
      background: #f5eee0;
      border: 2px solid #24231f;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .aim-reticle::before { left: 38px; top: -5px; width: 8px; height: 92px; }
    .aim-reticle::after  { left: -5px; top: 38px; width: 92px; height: 8px; }
    .aim-reticle i {
      position: absolute;
      inset: 7px;
      border: 3px solid rgba(247,241,229,.95);
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(36,35,31,.82), 0 0 8px rgba(0,0,0,.32);
    }
    .aim-reticle.hit { animation: reticleHit .3s ease-in forwards; }
    @keyframes reticleHit {
      0% { transform: translate(-50%,-50%) scale(1); opacity: .82; }
      100% { transform: translate(-50%,-50%) scale(.05); opacity: 0; }
    }
    .game-finish {
      position: absolute; z-index: 10; inset: 50% auto auto 50%; transform: translate(-50%,-50%) scale(.9);
      padding: 12px 20px; border-radius: 999px; background: rgba(255,255,255,.92); color: #334755;
      font: 800 clamp(18px,3vw,30px)/1.1 system-ui,sans-serif; box-shadow: 0 10px 28px rgba(0,0,0,.18);
      text-align: center; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    }
    .game-finish.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .game-finish .finish-time {
      display: block;
      margin-top: 7px;
      font-size: .58em;
      font-weight: 700;
      opacity: .88;
    }
    body.theme-concert .game-finish { background: rgba(8,28,65,.94); color: #f5d77e; }



    .calibration-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      pointer-events: none;
      background: rgba(12,18,24,.18);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
    }
    .calibration-overlay[hidden] { display: none; }
    .calibration-overlay.show {
      animation: calibrationOverlayIn 180ms ease-out forwards;
    }

    .calibration-ring-stage {
      position: relative;
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      transform: scale(.965);
      animation: calibrationRingIn 220ms cubic-bezier(.2,.8,.2,1) forwards;
    }
    .calibration-ring-svg {
      position: absolute;
      inset: 0;
      width: 150px;
      height: 150px;
      overflow: visible;
      transform: rotate(-90deg);
      filter: drop-shadow(0 6px 13px rgba(0,0,0,.24));
    }
    .calibration-ring-track,
    .calibration-ring-progress {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }
    .calibration-ring-track {
      stroke: rgba(255,255,255,.30);
    }
    .calibration-ring-progress {
      stroke: #ffffff;
      stroke-dasharray: 351.86;
      stroke-dashoffset: 351.86;
      transition: stroke-dashoffset 55ms linear;
    }
    .calibration-emoji {
      position: relative;
      z-index: 1;
      font-size: 52px;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
    }

    @keyframes calibrationOverlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes calibrationRingIn {
      from { transform: scale(.955); opacity: .72; }
      to { transform: scale(1); opacity: 1; }
    }

    .player-overlay,
    .scoreboard-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: max(18px, var(--safe-top)) max(18px, var(--safe-x)) max(18px, var(--safe-bottom));
      background: rgba(18,24,29,.48);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }
    .player-overlay[hidden],
    .scoreboard-overlay[hidden] { display: none; }

    .player-card,
    .scoreboard-card {
      width: min(520px, 100%);
      max-height: min(720px, calc(100dvh - 36px));
      overflow: auto;
      border-radius: 26px;
      border: 1px solid rgba(181,139,58,.42);
      background: rgba(255,252,246,.97);
      box-shadow: 0 18px 55px rgba(0,0,0,.30);
      padding: clamp(20px,4vw,32px);
      color: #2e414c;
    }
    body.theme-kids .player-card,
    body.theme-kids .scoreboard-card {
      border-color: rgba(129,103,176,.40);
      background: rgba(255,255,255,.97);
      color: #59437a;
    }
    body.theme-concert .player-card,
    body.theme-concert .scoreboard-card {
      border-color: rgba(226,179,69,.58);
      background: rgba(8,28,65,.97);
      color: #fff2c4;
    }
    .player-card h2,
    .scoreboard-card h2 {
      margin: 0 0 16px;
      text-align: center;
      font: 700 clamp(23px,4vw,34px)/1.1 system-ui,sans-serif;
    }
    .player-card p,
    .scoreboard-status {
      margin: 0 0 14px;
      text-align: center;
      opacity: .82;
    }
    .player-name-input {
      width: 100%;
      min-height: 52px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 2px solid currentColor;
      background: rgba(255,255,255,.86);
      color: #263843;
      font: 700 20px/1.2 system-ui,sans-serif;
      text-align: center;
      outline: none;
    }
    body.theme-concert .player-name-input {
      background: rgba(255,255,255,.94);
      color: #18304b;
    }
    .player-actions,
    .scoreboard-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }
    .mode-picker {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 8px;
    }
    .mode-button,
    .filter-button {
      appearance: none;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 13px;
      border: 1px solid rgba(181,139,58,.48);
      background: rgba(255,255,255,.88);
      color: #304651;
      font: 750 14px/1.1 system-ui,sans-serif;
      cursor: pointer;
    }
    .mode-button.active,
    .filter-button.active {
      background: #304651;
      color: #fff;
      border-color: #304651;
    }
    body.theme-kids .mode-button,
    body.theme-kids .filter-button { color:#60477e; border-color:rgba(129,103,176,.42); }
    body.theme-kids .mode-button.active,
    body.theme-kids .filter-button.active { background:#60477e; color:#fff; border-color:#60477e; }
    body.theme-concert .mode-button,
    body.theme-concert .filter-button {
      color:#fff2c4;
      background:rgba(255,255,255,.06);
      border-color:rgba(226,179,69,.35);
    }
    body.theme-concert .mode-button.active,
    body.theme-concert .filter-button.active {
      background:#f5d77e;
      color:#17304e;
      border-color:#f5d77e;
    }
    .scoreboard-filters {
      display: grid;
      gap: 8px;
      margin: 8px 0 14px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .filter-button {
      min-height: 38px;
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 999px;
    }
    .scoreboard-table-head,
    .scoreboard-row {
      display: grid;
      grid-template-columns: minmax(90px,1.35fr) minmax(86px,1.15fr) 74px 78px;
      gap: 8px;
      align-items: center;
    }
    .scoreboard-table-head {
      padding: 0 10px 6px;
      font: 800 12px/1.1 system-ui,sans-serif;
      opacity: .66;
    }
    .score-action {
      appearance: none;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(181,139,58,.55);
      background: rgba(255,255,255,.94);
      color: #304651;
      font: 700 16px/1 system-ui,sans-serif;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,.10);
    }
    body.theme-kids .score-action { color:#60477e; border-color:rgba(129,103,176,.45); }
    body.theme-concert .score-action { color:#fff2c4; background:rgba(18,42,78,.96); border-color:rgba(226,179,69,.62); }

    .score-result {
      text-align: center;
      font: 800 clamp(30px,7vw,54px)/1 system-ui,sans-serif;
      margin: 8px 0 18px;
    }
    .score-result small {
      display: block;
      margin-top: 8px;
      font-size: .36em;
      font-weight: 700;
      opacity: .72;
    }
    .scoreboard-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 7px;
    }
    .scoreboard-row {
      min-height: 42px;
      padding: 7px 10px;
      border-radius: 12px;
      background: rgba(66,79,88,.08);
      font: 700 14px/1.15 system-ui,sans-serif;
    }
    body.theme-concert .scoreboard-row { background: rgba(255,255,255,.08); }
    .scoreboard-rank { text-align: center; opacity:.66; }
    .scoreboard-time { font-variant-numeric: tabular-nums; }
    .scoreboard-row.is-current {
      outline: 2px solid currentColor;
      background: rgba(181,139,58,.14);
    }

    /* Tulostaulu: käyttäjän hyväksymät lopulliset asetukset */
    .scoreboard-card {
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    #scoreboardTitle,
    #scoreboardStatus,
    #levelFilter [data-filter-level="all"] {
      display: none !important;
    }
    .score-result {
      font-size: 36px;
    }
    .scoreboard-filters {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 14px;
    }
    #levelFilter {
      flex-wrap: nowrap;
    }
    #instrumentFilter {
      flex: 0 0 auto;
    }
    .instrument-filter-select {
      appearance: auto;
      min-height: 38px;
      max-width: 190px;
      padding: 7px 30px 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(181,139,58,.48);
      background: rgba(255,255,255,.88);
      color: #304651;
      font: 750 13px/1.1 system-ui,sans-serif;
      cursor: pointer;
    }
    body.theme-kids .instrument-filter-select {
      color: #60477e;
      border-color: rgba(129,103,176,.42);
    }
    body.theme-concert .instrument-filter-select {
      color: #fff2c4;
      background: rgba(255,255,255,.06);
      border-color: rgba(226,179,69,.35);
    }

    .gear-button {
      position: fixed;
      z-index: 20;
      right: calc(var(--safe-x) + 4px);
      bottom: calc(max(14px, var(--safe-bottom)) + 2px);
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(181,139,58,.48);
      color: #314651;
      background: rgba(255,252,246,.94);
      box-shadow: 0 10px 24px rgba(38,54,66,.17);
      transition: transform .14s ease, background .2s ease, color .2s ease;
    }

    body.theme-kids .gear-button {
      color: #664795;
      border-color: rgba(129,103,176,.42);
      background: rgba(255,255,255,.94);

    .swatch.classic { background: linear-gradient(135deg, #f7f0e4 0 42%, #7a9ca2 43% 68%, #c99b43 69%); }

    .theme-name { font-weight: 700; font-size: 15px; }

    @media (max-width: 760px) {
      .instrument-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }

    @media (orientation: portrait) {

  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="scoreboard.js"></script>
  <script src="resonator-engine.js"></script>
  <script src="audio-manager.js"></script>
  <script>
    const instruments = [
      { name: 'Huilu', notes: ['G','A','H','C','D'], hz: [391.9954,440.0000,493.8833,523.2511,587.3295] },
      { name: 'Saksofoni', notes: ['G','A','H','C','D'], hz: [233.0819,261.6256,293.6648,311.1270,349.2282] },
      { name: 'Klarinetti', notes: ['C','D','E','F','G'], hz: [233.0819,261.6256,293.6648,311.1270,349.2282] },
      { name: 'Trumpetti', notes: ['C','D','E','F','G'], hz: [233.0819,261.6256,293.6648,311.1270,349.2282] },
      { name: 'Käyrätorvi', notes: ['C','D','E','F','G'], hz: [174.6141,195.9977,220.0000,233.0819,261.6256] },
      { name: 'Pasuuna', notes: ['B','C','D','Es','F'], hz: [116.5409,130.8128,146.8324,155.5635,174.6141] }
    ];

    const themes = [
      { id: 'classic', name: 'Musiikkiopisto' },
      { id: 'kids', name: 'Lasten musiikkiluokka' },
      { id: 'concert', name: 'Konserttisali' }
    ];

    const allNotes = ['A','B','C','D','E','Es','F','G','H'];
    const app = document.querySelector('.app');
    const instrumentGrid = document.getElementById('instrumentGrid');
    const instrumentPanel = document.getElementById('instrumentPanel');
    const notesPanel = document.getElementById('notesPanel');
    const instrumentName = document.getElementById('instrumentName');
    const targets = document.getElementById('targets');
    const themeBackground = document.getElementById('themeBackground');
    const gearButton = document.getElementById('gearButton');
    const themeMenu = document.getElementById('themeMenu');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const themeList = document.getElementById('themeList');
    const sensitivityGrid = document.getElementById('sensitivityGrid');
    const gameProgress = document.getElementById('gameProgress');
    const aimReticle = document.getElementById('aimReticle');
    const gameFinish = document.getElementById('gameFinish');
    const calibrationOverlay = document.getElementById('calibrationOverlay');
    const calibrationRingProgress = document.getElementById('calibrationRingProgress');
    const playerOverlay = document.getElementById('playerOverlay');
    const playerInstrumentLabel = document.getElementById('playerInstrumentLabel');
    const playerNameInput = document.getElementById('playerNameInput');
    const playerStartButton = document.getElementById('playerStartButton');
    const modePicker = document.getElementById('modePicker');
    const levelFilter = document.getElementById('levelFilter');
    const instrumentFilter = document.getElementById('instrumentFilter');
    const instrumentFilterSelect = document.getElementById('instrumentFilterSelect');
    const scoreboardOverlay = document.getElementById('scoreboardOverlay');
    const scoreboardTitle = document.getElementById('scoreboardTitle');
    const scoreResult = document.getElementById('scoreResult');
    const scoreboardStatus = document.getElementById('scoreboardStatus');
    const scoreboardList = document.getElementById('scoreboardList');
    const playAgainButton = document.getElementById('playAgainButton');
    const changeInstrumentButton = document.getElementById('changeInstrumentButton');
    const changePlayerButton = document.getElementById('changePlayerButton');

    let currentInstrument = null;
    let currentPlayerName = '';
    let selectedNoteMode = '3';
    let activeNotes = [];
    let allScoreRows = [];
    let scoreLevelFilter = 3;
    let scoreInstrumentFilter = 'all';
    let lastSavedScoreId = null;
    const instrumentBoardIds = {
      'Huilu': 'huilu',
      'Saksofoni': 'saksofoni',
      'Klarinetti': 'klarinetti',
      'Trumpetti': 'trumpetti',
      'Käyrätorvi': 'kayratorvi',
      'Pasuuna': 'pasuuna'
    };
    let currentTheme = 'classic';
    try { currentTheme = localStorage.getItem('savelkoju-theme-v3') || 'classic'; } catch (_) {}
    let switchSerial = 0;
    let sensitivityDb = 10;
    try {
      const savedSensitivity = Number(localStorage.getItem('savelkoju-sensitivity-db'));
      if (savedSensitivity >= 4 && savedSensitivity <= 10) sensitivityDb = savedSensitivity;
    } catch (_) {}
    const themeCache = new Map();

    const engine = new ResonatorStringEngine({
      targets: {}, blockSize: 256, calibrationMs: 1500, responseMs: 1.8, rmsResponseMs: 2.0,
      toleranceCents: 40, centerMatch: 0.955, edgeMatch: 0.998, minHalfPeriodEnergy: 0.32,
      noiseMarginDb: 10, pitchMeterIntervalMs: 22, pitchMeterWindowMs: 16, pitchMeterSearchCents: 140
    });
    engine.setNoiseMarginDb(sensitivityDb);
    let micOpening = false;

    function notesForMode(instrument, mode = selectedNoteMode) {
      if (!instrument) return [];
      if (mode === '3') return instrument.notes.slice(0, 3);
      if (mode === '4') return instrument.notes.slice(0, 4);
      return instrument.notes.slice();
    }

    function targetsForInstrument(instrument) {
      if (!instrument) return {};
      const allowed = new Set(activeNotes.length ? activeNotes : notesForMode(instrument));
      const pairs = instrument.notes
        .map((note, i) => [note, instrument.hz[i]])
        .filter(([note]) => allowed.has(note));
      return Object.fromEntries(pairs);
    }

    function updateMicButton() {}

    const GAME_HITS = 10;
    let gameHits = 0;
    let gameTargetNote = null;
    let gameLocked = false;
    let lastTargetNote = null;
    let gameStartTime = 0;

    function formatGameTime(ms) {
      const totalSeconds = ms / 1000;
      if (totalSeconds < 60) return `${totalSeconds.toFixed(2).replace('.', ',')} s`;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = (totalSeconds - minutes * 60).toFixed(1).padStart(4, '0').replace('.', ',');
      return `${minutes}:${seconds}`;
    }


    function renderProgress() {
      gameProgress.replaceChildren(...Array.from({length: GAME_HITS}, (_, i) => {
        const dot = document.createElement('span');
        dot.className = 'game-dot' + (i < gameHits ? ' done' : '');
        return dot;
      }));
      gameProgress.setAttribute('aria-label', `Osumat ${gameHits} / ${GAME_HITS}`);
    }

    function positionReticle() {
      if (!gameTargetNote || notesPanel.hidden) { aimReticle.hidden = true; return; }
      const img = targets.querySelector(`.target[data-note="${CSS.escape(gameTargetNote)}"]`);
      if (!img) { aimReticle.hidden = true; return; }
      const tr = targets.getBoundingClientRect(), r = img.getBoundingClientRect();
      aimReticle.style.left = `${r.left - tr.left + r.width/2}px`;
      aimReticle.style.top = `${r.top - tr.top + r.height/2}px`;
      aimReticle.hidden = false;
    }

    function chooseNextTarget() {
      if (!currentInstrument) return;
      const choices = activeNotes.filter(n => n !== lastTargetNote);
      gameTargetNote = choices[Math.floor(Math.random() * choices.length)] || activeNotes[0];
      lastTargetNote = gameTargetNote;
      requestAnimationFrame(positionReticle);
    }

    function resetGame() {
      gameHits = 0;
      gameLocked = false;
      lastTargetNote = null;
      gameStartTime = performance.now();
      gameFinish.classList.remove('show');
      gameFinish.innerHTML = '10 / 10';
      renderProgress();
      chooseNextTarget();
    }

    // Sama äänenhallinta kuin toimivassa Sävelkojussa.
    const gameAudio = new window.SavelkojuAudioManager({
      hit: 'Lamppu.wav'
    });

    async function unlockGameAudio() {
      try {
        await gameAudio.unlock();
        await gameAudio.ready();
      } catch (error) {
        console.warn('Peliäänien avaus epäonnistui:', error);
      }
    }

    function playHitSound() {
      gameAudio.playHit();
    }

    function flashRecognizedNote(note) {
      const img = targets.querySelector(`.target[data-note="${CSS.escape(note)}"]`);
      if (!img) return;
      img.classList.remove('sound-hit'); void img.offsetWidth; img.classList.add('sound-hit');
      clearTimeout(img._soundHitTimer); img._soundHitTimer = setTimeout(() => img.classList.remove('sound-hit'), 180);
    }

    function registerGameHit(note) {
      if (gameLocked || note !== gameTargetNote) return;
      playHitSound();
      gameLocked = true;
      flashRecognizedNote(note);
      aimReticle.classList.add('hit');
      gameHits++;
      renderProgress();
      if (gameHits >= GAME_HITS) {
        const elapsed = performance.now() - gameStartTime;
        gameFinish.innerHTML = `10 / 10<span class="finish-time">Aika ${formatGameTime(elapsed)}</span>`;
        gameFinish.classList.add('show');
        setTimeout(() => {
          gameFinish.classList.remove('show');
          void showFinalScore(elapsed);
        }, 700);
        return;
      }
      setTimeout(() => { aimReticle.classList.remove('hit'); gameLocked = false; chooseNextTarget(); }, 140);
    }

    let calibrationRaf = 0;
    let calibrationVisualStart = 0;
    const CALIBRATION_RING_LENGTH = 351.86;

    function updateCalibrationRing(now) {
      if (!calibrationVisualStart) calibrationVisualStart = now;
      const progress = Math.min(1, Math.max(0, (now - calibrationVisualStart) / 1500));
      calibrationRingProgress.style.strokeDashoffset =
        (CALIBRATION_RING_LENGTH - progress * CALIBRATION_RING_LENGTH).toFixed(2);
      if (progress < 1 && !calibrationOverlay.hidden) {
        calibrationRaf = requestAnimationFrame(updateCalibrationRing);
      }
    }

    function showCalibrationFeedback() {
      if (calibrationRaf) cancelAnimationFrame(calibrationRaf);
      calibrationRaf = 0;
      calibrationVisualStart = 0;
      calibrationRingProgress.style.strokeDashoffset = String(CALIBRATION_RING_LENGTH);
      calibrationOverlay.hidden = false;
      calibrationOverlay.classList.remove('show');
      void calibrationOverlay.offsetWidth;
      calibrationOverlay.classList.add('show');
      calibrationRaf = requestAnimationFrame(updateCalibrationRing);
    }

    function hideCalibrationFeedback() {
      if (calibrationRaf) cancelAnimationFrame(calibrationRaf);
      calibrationRaf = 0;
      calibrationRingProgress.style.strokeDashoffset = '0';
      calibrationOverlay.classList.remove('show');
      calibrationOverlay.hidden = true;
      calibrationVisualStart = 0;
    }

    engine.addEventListener('trigger', event => {
      const note = event.detail?.action;
      if (note) registerGameHit(note);
    });
    window.addEventListener('resize', () => requestAnimationFrame(positionReticle));
    engine.addEventListener('state', event => {
      const state = event.detail?.state;
      if (state === 'calibrating') showCalibrationFeedback();
      if (state === 'running' || state === 'stopped') hideCalibrationFeedback();
      micOpening = false;
      updateMicButton();
    });
    engine.addEventListener('error', event => {
      hideCalibrationFeedback();
      micOpening = false; updateMicButton();
      console.warn('ResonatorEngine:', event.detail?.message || event.detail?.error || event.detail);
    });

    if (!themes.some(t => t.id === currentTheme)) currentTheme = 'classic';

    function imagePath(themeId, note) {
      return `assets/themes/${themeId}/notes/${note}.webp`;
    }

    function emptyPath(themeId) {
      return `assets/themes/${themeId}/empty.webp`;
    }

    function backgroundPath(themeId) {
      return `assets/themes/${themeId}/background.webp`;
    }

    function preloadImage(src, timeoutMs = 5000) {
      return new Promise(resolve => {
        const img = new Image();
        let settled = false;
        const finish = ok => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(ok);
        };
        const timer = setTimeout(() => finish(false), timeoutMs);
        img.onload = () => finish(img.naturalWidth > 0);
        img.onerror = () => finish(false);
        img.src = src;
        if (img.complete) finish(img.naturalWidth > 0);
      });
    }

    function preloadTheme(themeId, notes = allNotes) {
      const key = `${themeId}:${notes.slice().sort().join(',')}`;
      if (themeCache.has(key)) return themeCache.get(key);
      const promise = Promise.all([
        preloadImage(backgroundPath(themeId)),
        ...notes.map(note => preloadImage(imagePath(themeId, note)))
      ]).then(results => {
        const ok = results.every(Boolean);
        if (!ok) themeCache.delete(key);
        return ok;
      });
      themeCache.set(key, promise);
      return promise;
    }

    function renderTargets() {
      if (!currentInstrument) return;
      const active = new Set(activeNotes.length ? activeNotes : currentInstrument.notes);
      const nodes = currentInstrument.notes.map(note => {
        const wrap = document.createElement('div');
        wrap.className = 'target-wrap';
        wrap.dataset.note = note;

        const img = document.createElement('img');
        img.className = 'target';
        img.dataset.note = note;
        img.src = active.has(note) ? imagePath(currentTheme, note) : emptyPath(currentTheme);
        img.alt = active.has(note) ? `Sävel ${note}` : 'Tyhjä säveltaulu';
        img.draggable = false;
        wrap.appendChild(img);
        return wrap;
      });
      targets.replaceChildren(...nodes, aimReticle, gameFinish);
      requestAnimationFrame(positionReticle);
    }

    function updateTargetSources(themeId) {
      const active = new Set(activeNotes.length ? activeNotes : (currentInstrument ? currentInstrument.notes : []));
      targets.querySelectorAll('.target').forEach(img => {
        img.src = active.has(img.dataset.note) ? imagePath(themeId, img.dataset.note) : emptyPath(themeId);
      });
    }

    function updateThemeButtons(themeId) {
      document.querySelectorAll('.theme-button').forEach(button => {
        const active = button.dataset.theme === themeId;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function updateModeButtons() {
      modePicker.querySelectorAll('.mode-button').forEach(button => {
        button.classList.toggle('active', button.dataset.noteMode === selectedNoteMode);
      });
    }

    function openPlayerOverlay() {
      if (!currentInstrument) return;
      playerInstrumentLabel.textContent = currentInstrument.name;
      playerNameInput.value = currentPlayerName;
      updateModeButtons();
      playerOverlay.hidden = false;
      setTimeout(() => playerNameInput.focus(), 0);
    }

    function startForPlayer() {
      const clean = window.SavelkojuScoreboard
        ? window.SavelkojuScoreboard.cleanName(playerNameInput.value)
        : String(playerNameInput.value || '').trim().slice(0,20);
      if (!clean) {
        playerNameInput.focus();
        return;
      }
      currentPlayerName = clean;
      playerNameInput.value = clean;
      activeNotes = notesForMode(currentInstrument, selectedNoteMode);
      engine.setTargets(targetsForInstrument(currentInstrument));
      renderTargets();
      playerOverlay.hidden = true;
      resetGame();
    }

    function formatBoardTime(ms) {
      return formatGameTime(Number(ms));
    }

    function applyScoreFilters() {
      let rows = allScoreRows.slice();
      if (scoreLevelFilter !== 'all') {
        rows = rows.filter(row => Number(row.noteCount) === Number(scoreLevelFilter));
      }
      if (scoreInstrumentFilter !== 'all') {
        rows = rows.filter(row => row.instrumentName === scoreInstrumentFilter);
      }
      rows.sort((a,b) => Number(a.timeMs) - Number(b.timeMs));
      renderScoreboardRows(rows.slice(0, 10), lastSavedScoreId);
    }

    function updateFilterButtons() {
      levelFilter.querySelectorAll('.filter-button').forEach(button => {
        const value = button.dataset.filterLevel;
        button.classList.toggle('active',
          value === 'all' ? scoreLevelFilter === 'all' : Number(value) === Number(scoreLevelFilter));
      });
      if (instrumentFilterSelect) {
        instrumentFilterSelect.value = scoreInstrumentFilter;
      }
    }

    function renderScoreboardRows(rows, currentId) {
      scoreboardList.replaceChildren();
      rows.forEach(row => {
        const li = document.createElement('li');
        li.className = 'scoreboard-row' + (row.id === currentId ? ' is-current' : '');
        const name = document.createElement('span');
        name.textContent = row.playerName || '';
        const instrument = document.createElement('span');
        instrument.textContent = row.instrumentName || '';
        const notes = document.createElement('span');
        notes.textContent = String(row.noteCount || '');
        const time = document.createElement('span');
        time.className = 'scoreboard-time';
        time.textContent = formatBoardTime(row.timeMs);
        li.append(name, instrument, notes, time);
        scoreboardList.appendChild(li);
      });
    }

    async function showFinalScore(elapsed) {
      gameLocked = true;
      aimReticle.hidden = true;
      scoreboardOverlay.hidden = false;
      scoreboardTitle.textContent = 'Tulostaulu';
      const noteCount = activeNotes.length;
      scoreLevelFilter = noteCount;
      scoreInstrumentFilter = currentInstrument?.name || 'all';
      updateFilterButtons();
      scoreResult.innerHTML = `${formatGameTime(elapsed)}<small>${currentPlayerName} · ${currentInstrument?.name || ''} · ${noteCount} säveltä</small>`;
      scoreboardStatus.textContent = 'Tallennetaan tulosta…';
      scoreboardList.replaceChildren();
      lastSavedScoreId = null;

      if (!window.SavelkojuScoreboard) {
        scoreboardStatus.textContent = 'Tulostaulua ei saatu käyttöön.';
        return;
      }

      try {
        const saved = await window.SavelkojuScoreboard.saveScore({
          playerName: currentPlayerName,
          instrumentName: currentInstrument.name,
          noteCount,
          timeMs: elapsed
        });
        lastSavedScoreId = saved.id;
        allScoreRows = await window.SavelkojuScoreboard.loadScores(250);
        scoreLevelFilter = noteCount;
        scoreInstrumentFilter = currentInstrument?.name || 'all';
        updateFilterButtons();
        applyScoreFilters();
        const semester = window.SavelkojuScoreboard.currentSemester();
        scoreboardStatus.textContent = semester.label;
        } catch (error) {
        console.warn('Tulostaulu:', error);
        scoreboardStatus.textContent = 'Tulos näkyy tässä laitteessa, mutta Firebase-tallennus epäonnistui.';
        }
    }

    async function showInstrument(instrument) {
      currentInstrument = instrument;
      activeNotes = notesForMode(instrument, selectedNoteMode);
      engine.setTargets(targetsForInstrument(instrument));
      instrumentName.textContent = instrument.name;
      instrumentName.setAttribute('aria-label', `Vaihda soitinta. Nykyinen soitin: ${instrument.name}`);
      renderTargets();
      instrumentPanel.hidden = true;
      notesPanel.hidden = false;
      aimReticle.hidden = true;

      // Soitinvalinta on käyttäjän ele: avaa mikrofoni ja peliäänet.
      void unlockGameAudio();
      if (!engine.running && !micOpening) {
        micOpening = true;
        try {
          await engine.start();
          await unlockGameAudio();
        } catch (error) {
          if (error?.name !== 'AbortError') console.warn(error);
        } finally {
          micOpening = false;
        }
      }

      if (currentPlayerName) {
        resetGame();
        // Vain soitinvaihdon jälkeen: varmista tähtäimen paikka, kun uusi taulurivi on asettunut.
        requestAnimationFrame(() => requestAnimationFrame(positionReticle));
        setTimeout(positionReticle, 120);
      } else {
        openPlayerOverlay();
      }
    }

    function showInstrumentMenu() {
      playerOverlay.hidden = true;
      scoreboardOverlay.hidden = true;
      notesPanel.hidden = true;
      aimReticle.hidden = true;
      instrumentPanel.hidden = false;
    }

    async function applyTheme(themeId, { closeMenu = false } = {}) {
      if (!themes.some(t => t.id === themeId)) return;

      const serial = ++switchSerial;
      app.classList.add('theme-switching');
      gearButton.setAttribute('aria-busy', 'true');

      try {
        const neededNotes = currentInstrument ? currentInstrument.notes : allNotes;
        const ok = await preloadTheme(themeId, neededNotes);
        if (serial !== switchSerial) return;
        if (!ok) {
          console.warn(`Teeman ${themeId} kuvia ei saatu ladattua.`);
          return;
        }

        // Kaikki näkyvä vaihdetaan vasta kun tarvittavat kuvat ovat muistissa.
        currentTheme = themeId;
        try { localStorage.setItem('savelkoju-theme-v3', themeId); } catch (_) {}
        document.body.className = `theme-${themeId}`;
        themeBackground.src = backgroundPath(themeId);
        updateTargetSources(themeId);
        updateThemeButtons(themeId);

        // Muut taulut esiladataan taustalla, eivätkä ne pidätä näkyvää vaihtoa.
        setTimeout(() => preloadTheme(themeId), 0);

        // Anna Safari/WebKitille yksi piirtohetki ennen valikon sulkemista.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (serial !== switchSerial) return;
          if (closeMenu) closeThemeMenu();
        }));
      } finally {
        if (serial === switchSerial) {
          app.classList.remove('theme-switching');
          gearButton.removeAttribute('aria-busy');
        }
      }
    }

    function openThemeMenu() {
      themeMenu.hidden = false;
      menuBackdrop.hidden = false;
      gearButton.setAttribute('aria-expanded', 'true');
    }

    function closeThemeMenu() {
      themeMenu.hidden = true;
      menuBackdrop.hidden = true;
      gearButton.setAttribute('aria-expanded', 'false');
    }

    modePicker.addEventListener('click', event => {
      const button = event.target.closest('.mode-button');
      if (!button) return;
      selectedNoteMode = button.dataset.noteMode;
      updateModeButtons();
    });

    playerStartButton.addEventListener('click', startForPlayer);
    playerNameInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') startForPlayer();
    });
    playAgainButton.addEventListener('click', () => {
      scoreboardOverlay.hidden = true;
      resetGame();
    });
    changeInstrumentButton.addEventListener('click', showInstrumentMenu);
    changePlayerButton.addEventListener('click', () => {
      scoreboardOverlay.hidden = true;
      currentPlayerName = '';
      openPlayerOverlay();
    });

    function buildInstrumentFilter() {
      if (!instrumentFilterSelect) return;
      const options = [
        { value: 'all', label: 'Kaikki soittimet' },
        ...instruments
          .slice()
          .sort((a, b) => a.name.localeCompare(b.name, 'fi'))
          .map(instrument => ({ value: instrument.name, label: instrument.name }))
      ];
      instrumentFilterSelect.replaceChildren(...options.map(item => {
        const option = document.createElement('option');
        option.value = item.value;
        option.textContent = item.label;
        return option;
      }));
      instrumentFilterSelect.value = scoreInstrumentFilter;
    }
    buildInstrumentFilter();

    levelFilter.addEventListener('click', event => {
      const button = event.target.closest('.filter-button');
      if (!button || button.dataset.filterLevel === 'all') return;
      const value = button.dataset.filterLevel;
      scoreLevelFilter = Number(value);
      updateFilterButtons();
      applyScoreFilters();
    });

    instrumentFilterSelect.addEventListener('change', () => {
      scoreInstrumentFilter = instrumentFilterSelect.value || 'all';
      updateFilterButtons();
      applyScoreFilters();
    });

    instruments.forEach(instrument => {
      const button = document.createElement('button');
      button.className = 'instrument-button';
      button.type = 'button';
      button.textContent = instrument.name;
      button.addEventListener('click', () => showInstrument(instrument));
      instrumentGrid.appendChild(button);
    });

    for (let db = 4; db <= 10; db++) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'sensitivity-button' + (db === sensitivityDb ? ' active' : '');
      button.textContent = String(db);
      button.setAttribute('aria-label', `${db} dB`);
      button.addEventListener('click', () => {
        sensitivityDb = engine.setNoiseMarginDb(db);
        try { localStorage.setItem('savelkoju-sensitivity-db', String(sensitivityDb)); } catch (_) {}
        sensitivityGrid.querySelectorAll('.sensitivity-button').forEach((item, index) => {
          item.classList.toggle('active', index + 4 === sensitivityDb);
        });
      });
      sensitivityGrid.appendChild(button);
    }

    themes.forEach(theme => {
      const button = document.createElement('button');
      button.className = 'theme-button';
      button.type = 'button';
      button.dataset.theme = theme.id;
      button.innerHTML = `<span class="swatch ${theme.id}" aria-hidden="true"></span><span class="theme-name">${theme.name}</span><span class="check" aria-hidden="true">✓</span>`;
      button.addEventListener('click', async () => {
        if (theme.id === currentTheme) {
          ++switchSerial;
          app.classList.remove('theme-switching');
          gearButton.removeAttribute('aria-busy');
          closeThemeMenu();
          return;
        }
        await applyTheme(theme.id, { closeMenu: true });
      });
      themeList.appendChild(button);
    });

    instrumentName.addEventListener('click', showInstrumentMenu);
    gearButton.addEventListener('click', () => themeMenu.hidden ? openThemeMenu() : closeThemeMenu());
    menuBackdrop.addEventListener('click', closeThemeMenu);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeThemeMenu();
    });

    window.addEventListener('pagehide', () => engine.stop());
    updateMicButton();

    // Näytä tallennettu teema heti.
    document.body.className = `theme-${currentTheme}`;
    themeBackground.src = backgroundPath(currentTheme);
    updateThemeButtons(currentTheme);

    // Esiladataan kaikki kolme teemaa taustalla. Tämä poistaa iPhonen vaihtohetken vilkkumisen.
    preloadTheme(currentTheme).then(() => {
      const preloadOthers = () => themes
        .filter(theme => theme.id !== currentTheme)
        .forEach(theme => preloadTheme(theme.id));
      if ('requestIdleCallback' in window) requestIdleCallback(preloadOthers, { timeout: 1200 });
      else setTimeout(preloadOthers, 250);
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
